d.models.base import utcnow\nfrom backend.memory.vectors import embed, search_vectors, write_vector, delete_vector\n\n# 偏好只允许指定的图表和报告风格，不允许把用户文本写成系统指令，也不允许改变统计口径。\nPREFERENCE_VALUES = {'chart_kind': {'bar', 'line'}, 'report_style': {'concise', 'detailed'}}\n\n\ndef enqueue(reference: str):\n    \"\"\"向队列发送记忆记录的 ID。发送失败时保留待同步状态，由定时任务重试，不在消息中放密钥或向量。\"\"\"\n    from backend.services.analysis_tasks import dispatch\n    return dispatch('analytics.memory_sync', reference)\n\n\ndef serialize_memory(row, kind: str) -> dict:\n    \"\"\"整理用户可以查看的记忆内容和同步状态，不返回连接配置。\"\"\"\n    body = {'id': row.id, 'kind': kind, 'version': row.version, 'sync_status': row.sync_status, 'sync_error': row.sync_error}\n    if kind == 'preference':\n        body.update(key=row.key, value=row.value['value'], text=row.text)\n    else:\n        body.update(template=row.template, use_count=row.use_count, last_used_at=row.last_used_at.isoformat())\n    return body\n\n\nasync def set_preferences(user_id: str, updates: dict) -> list[dict]:\n    \"\"\"锁住用户记录后更新允许的偏好。null 表示删除偏好；内容改变时增加版本号，并在提交后发送同步任务。\"\"\"\n    references, result = [], []\n    async with Session.begin() as session:\n        # 同一用户的偏好修改依次执行。即使偏好记录尚不存在，也能避免并发请求创建重复记录。\n        await session.get(User, user_id, with_for_update=True)\n        for key, value in updates.items():\n            if key not in PREFERENCE_VALUES or value is not None and value not in PREFERENCE_VALUES[key]:\n                raise ValueError('偏好键或值无效')\n            row = await session.scalar(select(UserMemory).where(UserMemory.user_id == user_id, UserMemory.key == key))\n            if row is None:\n                if value is None:\n                    continue\n                row = UserMemory(user_id=user_id, key=key, value={'value': value}, text=f'用户明确偏好 {key}: {value}')\n                session.add(row)\n                await session.flush()\n            elif row.value.get('value') != value or row.deleted != (value is None):\n                row.value, row.deleted = {'value': value}, value is None\n                row.text = f'用户明确偏好 {key}: {value}'\n                row.version += 1\n                # 内容改变后先标记 pending，表示需要同步。耗时的嵌入请求和 Milvus 操作由后台处理。\n                row.sync_status, row.sync_error = 'pending', None\n            else:\n                if row.sync_status == 'indexed':\n                    result.append(serialize_memory(row, 'preference'))\n                    continue\n            row.updated_at = utcnow()\n            references.append('preference:' + row.id)\n            result.append(serialize_memory(row, 'preference'))\n    for reference in references:\n        # 先提交 PostgreSQL 记录，再发送同步任务。发送失败时 pending 状态仍在，Beat 可以再次发送任务。\n        enqueue(reference)\n    return result\n\n\nasync def explicit_preferences(user_id: str, question: str):\n    \"\"\"只从用户明确表示要长期保留的要求中提取允许的偏好，不从工具结果或助手回答中推测偏好。\"\"\"\n    if not get_settings().memory_enabled or not re.search(r'记住|以后|默认|总是', question):\n        return\n    updates = {}\n    for clause, scope in preference_clauses(question):\n        if scope == 'long' and not re.search(r'不要|不想|别用|禁止|不使用|不用|不喜欢|不需要', clause):\n            for key, values in clause_preferences(clause).items():\n                if len(values) == 1:\n                    updates[key] = next(iter(values))\n    if updates:\n        await set_preferences(user_id, updates)\n\n\ndef question_template(question: str) -> str | None:\n    \"\"\"把问题中的旧日期换成待填写的时间参数。涉及密码、令牌等敏感信息的问题不用于学习模板。\"\"\"\n    if re.search(r'密码|身份证|银行卡|api.?key|\\btoken\\b|sk-', question, re.I):\n        return None\n    # 保存的是常问问题的模板，不是旧答案。用时间占位符替换旧日期，推荐时由用户填写本次范围。\n    result = re.sub(r'\\d{4}[-年/]\\d{1,2}(?:[-月/]\\d{1,2})?月?', '[时间范围]', question)\n    result = re.sub(r'\\s+', ' ', result).strip()\n    return result[:800] if result else None\n\n\nasync def learn_task(task_id: str):\n    \"\"\"只统计成功任务的常问模式。问题频次和已学习标记一起提交，同一任务重试时不会重复计数。\"\"\"\n    if not get_settings().memory_enabled:\n        return\n    reference = None\n    async with Session.begin() as session:\n        task = await session.get(AnalysisTask, task_id, with_for_update=True)\n        # memory_recorded 表示这个任务已经学习过。恢复时再次处理同一任务，也不能再次增加问题频次。\n        if task is None or task.status != 'succeeded' or task.config_snapshot.get('memory_recorded'):\n            return\n        template = question_template(task.question)\n        if template:\n            await session.get(User, task.user_id, with_for_update=True)\n            fingerprint = hashlib.sha256(template.encode()).hexdigest()\n            row = await session.scalar(select(QuestionPattern).where(QuestionPattern.user_id == task.user_id, QuestionPattern.fingerprint == fingerprint))\n            if row is None:\n                row = QuestionPattern(user_id=task.user_id, fingerprint=fingerprint, template=template)\n                session.add(row)\n                await session.flush()\n                reference = 'pattern:' + row.id\n            elif not row.deleted:\n                row.use_count += 1\n                row.last_used_at = utcnow()\n                if row.sync_status != 'indexed':\n                    reference = 'pattern:' + row.id\n        # 问题频次和已学习标记一起保存，避免计数完成后进程崩溃，重试时又多计一次。\n        task.config_snapshot = {**task.config_snapshot, 'memory_recorded': True}\n    if reference:\n        enqueue(reference)\n\n\nasync def synchronize(reference: str):\n    \"\"\"同步指定记忆的向量，并用锁避免同时同步同一条记录。同步失败时保存错误，等待后续重试。\"\"\"\n    kind, identifier = reference.split(':', 1)\n    model = {'preference': UserMemory, 'pattern': QuestionPattern}.get(kind)\n    if model is None:\n        raise ValueError('记忆类型无效')\n    async with engine.connect() as lock:\n        acquired = await lock.scalar(text('SELECT pg_try_advisory_lock(hashtextextended(:key,0))'), {'key': 'memory:' + reference})\n        await lock.commit()\n        if not acquired:\n            return\n        version = None\n        try:\n            async with Session() as session:\n                row = await session.get(model, identifier)\n                if row is None:\n                    return\n                if row.sync_status in ('indexed', 'deleted'):\n                    return\n                owner, version, deleted = row.user_id, row.version, row.deleted\n                content = row.text if kind == 'preference' else row.template\n            # 在没有占用业务事务时调用慢接口。完成后再次核对版本号，防止旧同步任务覆盖新版本的同步状态。\n            if deleted:\n                await asyncio.to_thread(delete_vector, identifier, owner)\n            else:\n                vector = await embed(content)\n                await asyncio.to_thread(write_vector, {'id': identifier, 'user_id': owner, 'kind': kind,\n                                                      'text': content, 'version': version, 'vector': vector})\n            async with Session.begin() as session:\n                current = await session.get(model, identifier, with_for_update=True)\n                if current and current.version == version:\n                    current.sync_status, current.sync_error = ('deleted' if deleted else 'indexed'), None\n        except Exception as error:\n            async with Session.begin() as session:\n                row = await session.get(model, identifier, with_for_update=True)\n                if row and version is not None and row.version == version:\n                    row.sync_status, row.sync_error = 'failed', '向量同步失败：' + type(error).__name__\n        finally:\n            await lock.execute(text('SELECT pg_advisory_unlock(hashtextextended(:key,0))'), {'key':'memory:' + reference})\n            await lock.commit()\n\n\nasync def personalize(user_id: str, question: str) -> dict:\n    \"\"\"读取明确偏好，并检索相关常问模板。使用向量候选前，再核对数据库中的用户、版本和删除状态。\"\"\"\n    result = {'preferences': {}, 'patterns': [], 'vector_status': 'not_needed'}\n    if not get_settings().memory_enabled:\n        return result\n    async with Session() as session:\n        preferences = list(await session.scalars(select(UserMemory).where(UserMemory.user_id == user_id, UserMemory.deleted.is_(False))))\n        patterns = list(await session.scalars(select(QuestionPattern).where(QuestionPattern.user_id == user_id, QuestionPattern.deleted.is_(False),\n                       QuestionPattern.use_count >= get_settings().memory_pattern_min_uses)))\n    result['preferences'] = {row.key: row.value['value'] for row in preferences if row.key in PREFERENCE_VALUES}\n    # 明确偏好直接从 PostgreSQL 读取，不用向量检索。常问模板达到使用次数门槛后才检索相关模式。\n    if patterns:\n        try:\n            candidates = await asyncio.to_thread(search_vectors, user_id, await embed(question))\n            valid = {row.id: row for row in patterns}\n            for item in candidates:\n                entity = item.get('entity', {})\n                row = valid.get(str(item['id']))\n                # Milvus 只负责找候选，最终使用 PostgreSQL 中仍有效的当前用户记录，并拒绝版本不符的旧向量。\n                if row and entity.get('user_id') == user_id and entity.get('version') == row.version and item['distance'] >= get_settings().memory_min_similarity:\n                    result['patterns'].append({'id': row.id, 'template': row.template, 'use_count': row.use_count, 'similarity': round(item['distance'], 4)})\n            result['vector_status'] = 'searched'\n        except Exception:\n            # 向量服务不可用时跳过模板推荐，但明确偏好仍可读取，基础分析仍可继续。\n            result['vector_status'] = 'unavailable'\n    return result\n\n\ndef preference_clauses(question: str) -> list[tuple[str, str]]:\n    \"\"\"将问题拆为短句，判断各句是在描述长期偏好还是本次要求。未写明范围的后续短句沿用最近的范围。\"\"\"\n    clauses, scope = [], 'unspecified'\n    for clause in re.split(r'[,，。；;\\n]|但是|但', question):\n        if re.search(r'本次|这次|此次|现在|今天', clause):\n            scope = 'current'\n        elif re.search(r'记住|以后|默认|总是', clause):\n            scope = 'long'\n        if clause.strip():\n            clauses.append((clause, scope))\n    return clauses\n\n\ndef clause_preferences(clause: str) -> dict[str, set[str]]:\n    \"\"\"从短句中提取允许的图表或报告风格值。出现多个冲突值时，由调用方决定如何处理。\"\"\"\n    patterns = {'chart_kind': {'line': r'折线图|\\bline\\b', 'bar': r'柱状图|条形图|\\bbar\\b'},\n                'report_style': {'concise': r'简洁|简短|简要', 'detailed': r'详细|详尽'}}\n    return {key: {value for value, pattern in candidates.items() if re.search(pattern, clause, re.I)}\n            for key, candidates in patterns.items()}\n\n\ndef resolve_personalization(question: str, preferences: dict) -> dict:\n    \"\"\"合并历史偏好和本次要求，本次明确要求优先。只返回允许的展示偏好，不改变指标口径。\"\"\"\n    selected = dict(preferences)\n    clauses = preference_clauses(question)\n    if any(scope == 'current' for _, scope in clauses):\n        # 例如用户说“以后用柱状图，但这次用折线图”，本次使用折线图，长期偏好由保存偏好的函数另外处理。\n        clauses = [(clause, scope) for clause, scope in clauses if scope == 'current']\n    requested = {key: set() for key in PREFERENCE_VALUES}\n    for clause, _ in clauses:\n        for key, values in clause_preferences(clause).items():\n            if re.search(r'不要|不想|别用|禁止|不使用|不用|不喜欢|不需要', clause):\n                if selected.get(key) in values:\n                    selected.pop(key, None)\n            else:\n                requested[key].update(values)\n    for key, values in requested.items():\n        if len(values) == 1:\n            selected[key] = next(iter(values))\n        elif len(values) > 1:\n            selected.pop(key, None)\n    return {key: value for key, value in selected.items() if key in PREFERENCE_VALUES and value in PREFERENCE_VALUES[key]}\n"}}]},{"title":"backend/memory/vectors.py","anchor":"source-backend-memory-vectors-py","blocks":[{"type":"text","text":"本节提供 `backend/memory/vectors.py` 的完整原代码，便于不离开教程核对上下文。它不是推荐背诵顺序；核心函数的输入输出、设计推导和逐行注释见主章节。源码SHA256：`7ef35efbbc4372ebabd79002cd9e8e8adb18cc82f34a3e6585d98053a0e5eb5e`。\n\n函数定位：`connect`（第10～16行）；`initialize_vector_store`（第19～53行）；`embed`（第56～71行）；`write_vector`（第74～80行）；`delete_vector`（第83～89行）；`search_vectors`（第92～104行）；`vector_health`（第107～119行）；`check`（第109～115行）"},{"type":"code","code":{"language":"python","caption":"backend/memory/vectors.py（从原文件第1行开始）","content":"\"\"\"在本项目专用的 Milvus 数据库中管理记忆向量，每次检索都限定当前用户。\"\"\"\nimport asyncio\nimport json\nimport math\nfrom pymilvus import MilvusClient, DataType\nimport httpx\nfrom backend.core.config import get_settings\n\n\ndef connect(db_name: str | None = None) -> MilvusClient:\n    \"\"\"创建带超时设置的 Milvus 客户端，并明确指定数据库，不修改其他客户端的默认数据库。\"\"\"\n    settings = get_settings()\n    if db_name is None and settings.milvus_database != 'agent_analytics_memory':\n        raise ValueError('长期记忆只允许访问 agent_analytics_memory')\n    return MilvusClient(uri=settings.milvus_uri, token=settings.milvus_token,\n                        db_name=db_name or settings.milvus_database, timeout=settings.milvus_timeout_seconds)\n\n\ndef initialize_vector_store() -> dict:\n    \"\"\"创建本项目的数据库和集合。已存在时复用；已有集合的向量维度不兼容时，报错而不删除重建。\"\"\"\n    settings = get_settings()\n    if settings.milvus_database != 'agent_analytics_memory':\n        raise ValueError('初始化仅允许 agent_analytics_memory，避免修改其他项目数据库')\n    admin = connect('default')\n    try:\n        before = admin.list_databases()\n        if settings.milvus_database not in before:\n            admin.create_database(settings.milvus_database)\n    finally:\n        admin.close()\n    client = connect()\n    try:\n        if not client.has_collection(settings.milvus_collection):\n            schema = client.create_schema(auto_id=False, enable_dynamic_field=False)\n            schema.add_field('id', DataType.VARCHAR, is_primary=True, max_length=36)\n            schema.add_field('user_id', DataType.VARCHAR, max_length=36)\n            schema.add_field('kind', DataType.VARCHAR, max_length=16)\n            schema.add_field('text', DataType.VARCHAR, max_length=8192)\n            schema.add_field('version', DataType.INT64)\n            # 向量列的维度必须与嵌入模型一致。已有集合维度不符时，不能直接写入，因此后面要检查已有定义。\n            schema.add_field('vector', DataType.FLOAT_VECTOR, dim=settings.embedding_dimensions)\n            indexes = client.prepare_index_params()\n            indexes.add_index(field_name='vector', index_type='HNSW', metric_type='COSINE', params={'M':16, 'efConstruction':128})\n            indexes.add_index(field_name='user_id', index_type='INVERTED')\n            client.create_collection(settings.milvus_collection, schema=schema, index_params=indexes, consistency_level='Strong')\n        info = client.describe_collection(settings.milvus_collection)\n        dimension = next(field['params']['dim'] for field in info['fields'] if field['name'] == 'vector')\n        if int(dimension) != settings.embedding_dimensions:\n            raise ValueError('已有记忆向量维度不同，请核对嵌入模型配置；未修改原集合')\n        client.load_collection(settings.milvus_collection)\n        return {'database': settings.milvus_database, 'collection': settings.milvus_collection, 'dimensions': int(dimension)}\n    finally:\n        client.close()\n\n\nasync def embed(text: str) -> list[float]:\n    \"\"\"调用嵌入接口将文本转成向量，检查向量维度和数值是否合法。密钥只从配置中读取。\"\"\"\n    settings = get_settings()\n    key = settings.embedding_api_key or settings.model_api_key\n    if not key:\n        raise ValueError('尚未配置嵌入模型密钥')\n    async with httpx.AsyncClient(timeout=settings.embedding_timeout_seconds) as client:\n        response = await client.post(settings.embedding_base_url.rstrip('/') + '/embeddings',\n                                     headers={'Authorization': 'Bearer ' + key},\n                                     json={'model': settings.embedding_model, 'input': text, 'encoding_format': 'float'})\n        if response.is_error:\n            raise ValueError(f'嵌入接口返回 {response.status_code}')\n        vector = response.json()['data'][0]['embedding']\n    if len(vector) != settings.embedding_dimensions or not all(isinstance(value, (int, float)) and math.isfinite(value) for value in vector):\n        raise ValueError('嵌入向量维度或数值无效')\n    return [float(value) for value in vector]\n\n\ndef write_vector(record: dict):\n    \"\"\"以记忆 ID 写入或更新对应向量，不修改其他记录或其他数据库。\"\"\"\n    client = connect()\n    try:\n        client.upsert(get_settings().milvus_collection, [record])\n    finally:\n        client.close()\n\n\ndef delete_vector(identifier: str, user_id: str):\n    \"\"\"只删除记忆 ID 和用户 ID 同时匹配的向量，不删除集合或数据库。\"\"\"\n    client = connect()\n    try:\n        client.delete(get_settings().milvus_collection, filter='id == ' + json.dumps(identifier) + ' and user_id == ' + json.dumps(user_id))\n    finally:\n        client.close()\n\n\ndef search_vectors(user_id: str, vector: list[float]) -> list[dict]:\n    \"\"\"检索当前用户的常问模板向量。返回候选后，调用方还需检查 PostgreSQL 中的版本和删除状态。\"\"\"\n    settings = get_settings()\n    client = connect()\n    try:\n        # 在 Milvus 检索时先限制用户，service 随后再检查数据库记录，避免使用已删除或过期的候选。\n        result = client.search(settings.milvus_collection, data=[vector],\n                               filter='user_id == ' + json.dumps(user_id) + ' and kind == \"pattern\"',\n                               limit=settings.memory_top_k, output_fields=['id', 'user_id', 'kind', 'text', 'version'],\n                               search_params={'metric_type':'COSINE','params':{'ef':64}}, consistency_level='Strong')\n        return result[0]\n    finally:\n        client.close()\n\n\nasync def vector_health() -> bool:\n    \"\"\"连接 Milvus 并检查项目记忆集合是否存在，连接或检查失败时返回 False。\"\"\"\n    def check():\n        \"\"\"在线程中调用同步 Milvus SDK，避免阻塞 API 使用的异步事件循环。\"\"\"\n        client = connect()\n        try:\n            return client.has_collection(get_settings().milvus_collection)\n        finally:\n            client.close()\n    try:\n        return await asyncio.to_thread(check)\n    except Exception:\n        return False\n"}}]},{"title":"backend/models/__init__.py","anchor":"source-backend-models-init-py","blocks":[{"type":"text","text":"本节提供 `backend/models/__init__.py` 的完整原代码，便于不离开教程核对上下文。它不是推荐背诵顺序；核心函数的输入输出、设计推导和逐行注释见主章节。源码SHA256：`888b607eab9b6f3ecf8e1f8119a588f501ed01e5cea832b6cd049da55a3f5407`。\n\n本文件主要定义导入、配置或数据结构。"},{"type":"code","code":{"language":"python","caption":"backend/models/__init__.py（从原文件第1行开始）","content":"\"\"\"集中导入数据库模型，让建表和导出表结构时能找到所有模型定义。\"\"\"\nfrom backend.models.base import Base\nfrom backend.models.user import User\nfrom backend.models.dataset import Dataset\nfrom backend.models.customer import Customer\nfrom backend.models.product import Product\nfrom backend.models.order import Order\nfrom backend.models.order_item import OrderItem\nfrom backend.models.analysis_task import AnalysisTask\nfrom backend.models.memory import UserMemory, QuestionPattern\nfrom backend.models.conversation import Conversation, ConversationMessage\n\n__all__ = ['Base', 'User', 'Dataset', 'Customer', 'Product', 'Order', 'OrderItem', 'AnalysisTask',\n           'UserMemory', 'QuestionPattern', 'Conversation', 'ConversationMessage']\n"}}]},{"title":"backend/models/analysis_task.py","anchor":"source-backend-models-analysis-task-py","blocks":[{"type":"text","text":"本节提供 `backend/models/analysis_task.py` 的完整原代码，便于不离开教程核对上下文。它不是推荐背诵顺序；核心函数的输入输出、设计推导和逐行注释见主章节。源码SHA256：`4e464d7206c0d627396359a5be9d113fc3a6e46559c43c62ec95ab5bf8928f14`。\n\n本文件主要定义导入、配置或数据结构。"},{"type":"code","code":{"language":"python","caption":"backend/models/analysis_task.py（从原文件第1行开始）","content":"\"\"\"保存任务状态、事件和结果信息。LangGraph 的执行进度由 checkpoint 表另外保存。\"\"\"\nfrom sqlalchemy import String, DateTime, ForeignKey, Text\nfrom sqlalchemy.dialects.postgresql import JSONB\nfrom sqlalchemy.orm import Mapped, mapped_column\nfrom backend.models.base import Base, new_id, utcnow\n\n\nclass AnalysisTask(Base):\n    \"\"\"定义分析任务表，保存问题、执行状态、事件、结果引用和待恢复的答案。\"\"\"\n    __tablename__ = 'analysis_tasks'\n    id: Mapped[str] = mapped_column(String(36), primary_key=True, default=new_id)\n    user_id: Mapped[str] = mapped_column(ForeignKey('users.id', ondelete='CASCADE'), index=True)\n    dataset_id: Mapped[str] = mapped_column(ForeignKey('datasets.id', ondelete='CASCADE'), index=True)\n    question: Mapped[str] = mapped_column(Text)\n    status: Mapped[str] = mapped_column(String(20), default='queued', index=True)\n    # 每个分析任务有独立的 thread_id。config_snapshot 中的 conversation_id 则把多次分析连成一个会话。\n    thread_id: Mapped[str] = mapped_column(String(36), default=new_id, unique=True)\n    model_mode: Mapped[str] = mapped_column(String(10), default='demo')\n    config_snapshot: Mapped[dict] = mapped_column(JSONB, default=dict)\n    # JSONB 列保存消息和文件信息。events 按序号读取，artifacts 保存文件引用，不保存文件内容。\n    # default=list 和 default=dict 在创建记录时生成新对象，避免不同记录共享同一个可变列表或字典。\n    events: Mapped[list] = mapped_column(JSONB, default=list)\n    artifacts: Mapped[list] = mapped_column(JSONB, default=list)\n    usage: Mapped[dict] = mapped_column(JSONB, default=dict)\n    # 用户补充的答案先写数据库再发任务消息。图完成或再次暂停后才清空，避免重试时丢失答案。\n    resume_payload: Mapped[str | None] = mapped_column(Text)\n    clarification: Mapped[str | None] = mapped_column(Text)\n    error_info: Mapped[str | None] = mapped_column(String(2000))\n    created_at: Mapped[object] = mapped_column(DateTime(timezone=True), default=utcnow)\n    updated_at: Mapped[object] = mapped_column(DateTime(timezone=True), default=utcnow, onupdate=utcnow)\n"}}]},{"title":"backend/models/base.py","anchor":"source-backend-models-base-py","blocks":[{"type":"text","text":"本节提供 `backend/models/base.py` 的完整原代码，便于不离开教程核对上下文。它不是推荐背诵顺序；核心函数的输入输出、设计推导和逐行注释见主章节。源码SHA256：`4a3f1b95c4a46b9f98d8e94946210113d584e1f011e674442aa25cc1746b8e71`。\n\n函数定位：`new_id`（第12～14行）；`utcnow`（第17～19行）"},{"type":"code","code":{"language":"python","caption":"backend/models/base.py（从原文件第1行开始）","content":"\"\"\"提供数据库模型基类，以及通用的 UUID 和 UTC 时间函数。\"\"\"\n\nfrom datetime import datetime, timezone\nfrom uuid import uuid4\nfrom sqlalchemy.orm import DeclarativeBase\n\n\nclass Base(DeclarativeBase):\n    \"\"\"定义所有数据库模型共用的基类和表结构信息。\"\"\"\n\n\ndef new_id() -> str:\n    \"\"\"生成 UUID 作为资源 ID。访问资源时仍要检查用户归属，不能只依赖 ID 难以猜测。\"\"\"\n    return str(uuid4())\n\n\ndef utcnow() -> datetime:\n    \"\"\"返回带 UTC 时区的当前时间，用于记录任务和导入的创建、更新时间。\"\"\"\n    return datetime.now(timezone.utc)\n"}}]},{"title":"backend/models/conversation.py","anchor":"source-backend-models-conversation-py","blocks":[{"type":"text","text":"本节提供 `backend/models/conversation.py` 的完整原代码，便于不离开教程核对上下文。它不是推荐背诵顺序；核心函数的输入输出、设计推导和逐行注释见主章节。源码SHA256：`f651e94c0811f9e722f814b705e6e0014dd6f4443e1b92a1ba4f6b8f60f505ff`。\n\n本文件主要定义导入、配置或数据结构。"},{"type":"code","code":{"language":"python","caption":"backend/models/conversation.py（从原文件第1行开始）","content":"\"\"\"保存跨分析任务的会话原文和摘要进度，不用于替代单次任务的 checkpoint。\"\"\"\nfrom sqlalchemy import String, Text, Integer, DateTime, ForeignKey, UniqueConstraint\nfrom sqlalchemy.dialects.postgresql import JSONB\nfrom sqlalchemy.orm import Mapped, mapped_column\nfrom backend.models.base import Base, new_id, utcnow\n\n\nclass Conversation(Base):\n    \"\"\"定义会话记录，绑定用户和数据集。只有摘要成功生成，才更新已总结到的消息序号。\"\"\"\n    __tablename__ = 'analysis_conversations'\n    id: Mapped[str] = mapped_column(String(36), primary_key=True, default=new_id)\n    user_id: Mapped[str] = mapped_column(ForeignKey('users.id', ondelete='CASCADE'), index=True)\n    dataset_id: Mapped[str] = mapped_column(ForeignKey('datasets.id', ondelete='CASCADE'), index=True)\n    summary: Mapped[str] = mapped_column(Text, default='')\n    # summary_cursor 记录已经总结到哪条消息；next_sequence 为下一条原文分配序号，两者用途不同。\n    summary_cursor: Mapped[int] = mapped_column(Integer, default=0)\n    next_sequence: Mapped[int] = mapped_column(Integer, default=1)\n    summary_error: Mapped[str | None] = mapped_column(String(300))\n    summary_usage: Mapped[dict] = mapped_column(JSONB, default=dict)\n    created_at: Mapped[object] = mapped_column(DateTime(timezone=True), default=utcnow)\n    updated_at: Mapped[object] = mapped_column(DateTime(timezone=True), default=utcnow, onupdate=utcnow)\n\n\nclass ConversationMessage(Base):\n    \"\"\"保存原始问题和完整报告，同时用 context_text 保存供模型读取的精简内容。\"\"\"\n    __tablename__ = 'conversation_messages'\n    # 第一项唯一约束防止同一任务角色被重复写入，第二项防止同一会话出现重复消息序号。\n    __table_args__ = (UniqueConstraint('task_id', 'role', name='uq_conversation_task_role'),\n                      UniqueConstraint('conversation_id', 'sequence', name='uq_conversation_sequence'))\n    id: Mapped[str] = mapped_column(String(36), primary_key=True, default=new_id)\n    conversation_id: Mapped[str] = mapped_column(ForeignKey('analysis_conversations.id', ondelete='CASCADE'), index=True)\n    task_id: Mapped[str] = mapped_column(ForeignKey('analysis_tasks.id', ondelete='CASCADE'))\n    sequence: Mapped[int] = mapped_column(Integer)\n    role: Mapped[str] = mapped_column(String(16))\n    # content 保存完整问题或报告，context_text 保存供模型总结的内容，可以省去报告中的大表格。\n    content: Mapped[str] = mapped_column(Text)\n    context_text: Mapped[str] = mapped_column(Text)\n    created_at: Mapped[object] = mapped_column(DateTime(timezone=True), default=utcnow)\n"}}]},{"title":"backend/models/customer.py","anchor":"source-backend-models-customer-py","blocks":[{"type":"text","text":"本节提供 `backend/models/customer.py` 的完整原代码，便于不离开教程核对上下文。它不是推荐背诵顺序；核心函数的输入输出、设计推导和逐行注释见主章节。源码SHA256：`65d7b8ab37c64e0a84cf9ef7236f05c29382a9051a13fecf37114a608e689f43`。\n\n本文件主要定义导入、配置或数据结构。"},{"type":"code","code":{"language":"python","caption":"backend/models/customer.py（从原文件第1行开始）","content":"\"\"\"保存客户记录，分别记录订单使用的客户 ID 和合并同一人多次购买的独立客户标识。\"\"\"\nfrom sqlalchemy import String, ForeignKey\nfrom sqlalchemy.orm import Mapped, mapped_column\nfrom backend.models.base import Base\n\n\nclass Customer(Base):\n    \"\"\"定义客户表，使用数据集 ID 和客户 ID 共同确定一条记录。\"\"\"\n    __tablename__ = 'customers'\n    dataset_id: Mapped[str] = mapped_column(ForeignKey('datasets.id', ondelete='CASCADE'), primary_key=True)\n    customer_id: Mapped[str] = mapped_column(String(100), primary_key=True)\n    customer_unique_id: Mapped[str | None] = mapped_column(String(100))\n    city: Mapped[str | None] = mapped_column(String(100))\n    state: Mapped[str | None] = mapped_column(String(50))\n"}}]},{"title":"backend/models/dataset.py","anchor":"source-backend-models-dataset-py","blocks":[{"type":"text","text":"本节提供 `backend/models/dataset.py` 的完整原代码，便于不离开教程核对上下文。它不是推荐背诵顺序；核心函数的输入输出、设计推导和逐行注释见主章节。源码SHA256：`3fffe29418d3fb1deb9f5d7df704386571945fd55856d235c5846923df1d01e5`。\n\n本文件主要定义导入、配置或数据结构。"},{"type":"code","code":{"language":"python","caption":"backend/models/dataset.py（从原文件第1行开始）","content":"\"\"\"保存数据集信息。数据集导入就绪后，不在原数据集上继续修改业务内容。\"\"\"\nfrom sqlalchemy import String, DateTime, ForeignKey\nfrom sqlalchemy.dialects.postgresql import JSONB\nfrom sqlalchemy.orm import Mapped, mapped_column\nfrom backend.models.base import Base, new_id, utcnow\n\n\nclass Dataset(Base):\n    \"\"\"定义数据集表，记录上传文件、字段映射、导入状态和指标口径。\"\"\"\n    __tablename__ = 'datasets'\n    id: Mapped[str] = mapped_column(String(36), primary_key=True, default=new_id)\n    user_id: Mapped[str] = mapped_column(ForeignKey('users.id', ondelete='CASCADE'), index=True)\n    name: Mapped[str] = mapped_column(String(120))\n    source_type: Mapped[str] = mapped_column(String(20), default='upload')\n    status: Mapped[str] = mapped_column(String(20), default='uploaded', index=True)\n    file_manifest: Mapped[dict] = mapped_column(JSONB, default=dict)\n    field_mapping: Mapped[dict] = mapped_column(JSONB, default=dict)\n    metric_definitions: Mapped[dict] = mapped_column(JSONB, default=dict)\n    import_summary: Mapped[dict] = mapped_column(JSONB, default=dict)\n    error_info: Mapped[str | None] = mapped_column(String(2000))\n    data_version: Mapped[str] = mapped_column(String(36), default=new_id)\n    created_at: Mapped[object] = mapped_column(DateTime(timezone=True), default=utcnow)\n"}}]},{"title":"backend/models/memory.py","anchor":"source-backend-models-memory-py","blocks":[{"type":"text","text":"本节提供 `backend/models/memory.py` 的完整原代码，便于不离开教程核对上下文。它不是推荐背诵顺序；核心函数的输入输出、设计推导和逐行注释见主章节。源码SHA256：`bea1b3730ad075b527071c804cbddaef02581ead57d933ea202c290ca929feb0`。\n\n本文件主要定义导入、配置或数据结构。"},{"type":"code","code":{"language":"python","caption":"backend/models/memory.py（从原文件第1行开始）","content":"\"\"\"在 PostgreSQL 保存长期记忆记录，在本项目专用 Milvus 数据库保存对应向量。\"\"\"\nfrom sqlalchemy import String, Text, Integer, Boolean, DateTime, ForeignKey, UniqueConstraint\nfrom sqlalchemy.dialects.postgresql import JSONB\nfrom sqlalchemy.orm import Mapped, mapped_column\nfrom backend.models.base import Base, new_id, utcnow\n\n\nclass UserMemory(Base):\n    \"\"\"定义明确偏好记录，包括内容版本和同步状态。删除标记使旧向量立即停止使用。\"\"\"\n    __tablename__ = 'user_memories'\n    __table_args__ = (UniqueConstraint('user_id', 'key', name='uq_user_memory_key'),)\n    id: Mapped[str] = mapped_column(String(36), primary_key=True, default=new_id)\n    user_id: Mapped[str] = mapped_column(ForeignKey('users.id', ondelete='CASCADE'), index=True)\n    key: Mapped[str] = mapped_column(String(40))\n    value: Mapped[dict] = mapped_column(JSONB)\n    text: Mapped[str] = mapped_column(Text)\n    # 是否使用记忆以 PostgreSQL 为准。记录被删除或版本改变后，旧 Milvus 向量就不能再使用。\n    version: Mapped[int] = mapped_column(Integer, default=1)\n    deleted: Mapped[bool] = mapped_column(Boolean, default=False)\n    # pending 和 failed 表示还需要后台同步；indexed 和 deleted 表示对应版本的向量操作已经完成。\n    sync_status: Mapped[str] = mapped_column(String(16), default='pending', index=True)\n    sync_error: Mapped[str | None] = mapped_column(String(300))\n    created_at: Mapped[object] = mapped_column(DateTime(timezone=True), default=utcnow)\n    updated_at: Mapped[object] = mapped_column(DateTime(timezone=True), default=utcnow, onupdate=utcnow)\n\n\nclass QuestionPattern(Base):\n    \"\"\"定义常问模板记录，统计不同成功任务的使用次数，不保存历史计算答案。\"\"\"\n    __tablename__ = 'user_question_patterns'\n    __table_args__ = (UniqueConstraint('user_id', 'fingerprint', name='uq_user_pattern_fingerprint'),)\n    id: Mapped[str] = mapped_column(String(36), primary_key=True, default=new_id)\n    user_id: Mapped[str] = mapped_column(ForeignKey('users.id', ondelete='CASCADE'), index=True)\n    fingerprint: Mapped[str] = mapped_column(String(64))\n    template: Mapped[str] = mapped_column(Text)\n    # 只记录用户在不同成功任务中问过多少次这类问题，不保存旧金额作为下次分析的答案。\n    use_count: Mapped[int] = mapped_column(Integer, default=1)\n    version: Mapped[int] = mapped_column(Integer, default=1)\n    deleted: Mapped[bool] = mapped_column(Boolean, default=False)\n    sync_status: Mapped[str] = mapped_column(String(16), default='pending', index=True)\n    sync_error: Mapped[str | None] = mapped_column(String(300))\n    last_used_at: Mapped[object] = mapped_column(DateTime(timezone=True), default=utcnow)\n"}}]},{"title":"backend/models/order.py","anchor":"source-backend-models-order-py","blocks":[{"type":"text","text":"本节提供 `backend/models/order.py` 的完整原代码，便于不离开教程核对上下文。它不是推荐背诵顺序；核心函数的输入输出、设计推导和逐行注释见主章节。源码SHA256：`4b0e310dda187826f7e0dc1712b84ca15f4fdc5ea2f411a8a7afdb6e1f21b6ba`。\n\n本文件主要定义导入、配置或数据结构。"},{"type":"code","code":{"language":"python","caption":"backend/models/order.py（从原文件第1行开始）","content":"\"\"\"保存订单，并用包含数据集 ID 的外键防止关联到其他数据集的客户。\"\"\"\nfrom datetime import datetime\nfrom sqlalchemy import String, DateTime, ForeignKey, ForeignKeyConstraint, Index\nfrom sqlalchemy.orm import Mapped, mapped_column\nfrom backend.models.base import Base\n\n\nclass Order(Base):\n    \"\"\"定义订单表，保存购买和配送时间。业务时间按原始本地时间保存，不自动补上时区。\"\"\"\n    __tablename__ = 'orders'\n    __table_args__ = (\n        ForeignKeyConstraint(['dataset_id', 'customer_id'], ['customers.dataset_id', 'customers.customer_id']),\n        Index('ix_orders_dataset_time', 'dataset_id', 'purchase_time'),\n    )\n    dataset_id: Mapped[str] = mapped_column(ForeignKey('datasets.id', ondelete='CASCADE'), primary_key=True)\n    order_id: Mapped[str] = mapped_column(String(100), primary_key=True)\n    customer_id: Mapped[str] = mapped_column(String(100))\n    status: Mapped[str] = mapped_column(String(30))\n    purchase_time: Mapped[datetime] = mapped_column(DateTime)\n    delivered_time: Mapped[datetime | None] = mapped_column(DateTime)\n    estimated_delivery_time: Mapped[datetime | None] = mapped_column(DateTime)\n"}}]},{"title":"backend/models/order_item.py","anchor":"source-backend-models-order-item-py","blocks":[{"type":"text","text":"本节提供 `backend/models/order_item.py` 的完整原代码，便于不离开教程核对上下文。它不是推荐背诵顺序；核心函数的输入输出、设计推导和逐行注释见主章节。源码SHA256：`4b13a78c5113fb48e3694b3a04b7626477dcce60bd628d2859961b3d2406c971`。\n\n本文件主要定义导入、配置或数据结构。"},{"type":"code","code":{"language":"python","caption":"backend/models/order_item.py（从原文件第1行开始）","content":"\"\"\"保存订单明细，每行代表一个商品项。金额使用 NUMERIC 类型保留小数精度。\"\"\"\nfrom decimal import Decimal\nfrom sqlalchemy import String, Integer, Numeric, ForeignKey, ForeignKeyConstraint, CheckConstraint\nfrom sqlalchemy.orm import Mapped, mapped_column\nfrom backend.models.base import Base\n\n\nclass OrderItem(Base):\n    \"\"\"定义明细表，保存商品金额和运费，并通过约束拒绝负金额及跨数据集关联。\"\"\"\n    __tablename__ = 'order_items'\n    __table_args__ = (\n        ForeignKeyConstraint(['dataset_id', 'order_id'], ['orders.dataset_id', 'orders.order_id']),\n        ForeignKeyConstraint(['dataset_id', 'product_id'], ['products.dataset_id', 'products.product_id']),\n        CheckConstraint('price >= 0 AND freight_value >= 0', name='ck_item_nonnegative'),\n        CheckConstraint('order_item_id > 0', name='ck_item_positive_id'),\n    )\n    dataset_id: Mapped[str] = mapped_column(ForeignKey('datasets.id', ondelete='CASCADE'), primary_key=True)\n    order_id: Mapped[str] = mapped_column(String(100), primary_key=True)\n    order_item_id: Mapped[int] = mapped_column(Integer, primary_key=True)\n    product_id: Mapped[str] = mapped_column(String(100))\n    price: Mapped[Decimal] = mapped_column(Numeric(18, 2))\n    freight_value: Mapped[Decimal] = mapped_column(Numeric(18, 2))\n"}}]},{"title":"backend/models/product.py","anchor":"source-backend-models-product-py","blocks":[{"type":"text","text":"本节提供 `backend/models/product.py` 的完整原代码，便于不离开教程核对上下文。它不是推荐背诵顺序；核心函数的输入输出、设计推导和逐行注释见主章节。源码SHA256：`d8e8ca264783c0a9f2875129937b2a4e923dd451db66279ea2529c67e4d8c930`。\n\n本文件主要定义导入、配置或数据结构。"},{"type":"code","code":{"language":"python","caption":"backend/models/product.py（从原文件第1行开始）","content":"\"\"\"保存商品信息，并保留缺失品类。查询时可把缺失品类归为未分类。\"\"\"\nfrom sqlalchemy import String, ForeignKey\nfrom sqlalchemy.orm import Mapped, mapped_column\nfrom backend.models.base import Base\n\n\nclass Product(Base):\n    \"\"\"定义商品表，使用数据集 ID 和商品 ID 共同确定一条记录。\"\"\"\n    __tablename__ = 'products'\n    dataset_id: Mapped[str] = mapped_column(ForeignKey('datasets.id', ondelete='CASCADE'), primary_key=True)\n    product_id: Mapped[str] = mapped_column(String(100), primary_key=True)\n    category_name: Mapped[str | None] = mapped_column(String(120))\n"}}]},{"title":"backend/models/user.py","anchor":"source-backend-models-user-py","blocks":[{"type":"text","text":"本节提供 `backend/models/user.py` 的完整原代码，便于不离开教程核对上下文。它不是推荐背诵顺序；核心函数的输入输出、设计推导和逐行注释见主章节。源码SHA256：`0f10f7a1e17e94ca34e09799551f7ce50e316676c775ea5028123526ff6bbf54`。\n\n本文件主要定义导入、配置或数据结构。"},{"type":"code","code":{"language":"python","caption":"backend/models/user.py（从原文件第1行开始）","content":"\"\"\"定义本项目独立的用户表，不访问项目一的用户数据。\"\"\"\nfrom sqlalchemy import String, DateTime\nfrom sqlalchemy.orm import Mapped, mapped_column\nfrom backend.models.base import Base, new_id, utcnow\n\n\nclass User(Base):\n    \"\"\"定义用户表，保存不重复的用户名和密码哈希。\"\"\"\n    __tablename__ = 'users'\n    id: Mapped[str] = mapped_column(String(36), primary_key=True, default=new_id)\n    username: Mapped[str] = mapped_column(String(40), unique=True)\n    password_hash: Mapped[str] = mapped_column(String(255))\n    created_at: Mapped[object] = mapped_column(DateTime(timezone=True), default=utcnow)\n"}}]},{"title":"backend/reporting/__init__.py","anchor":"source-backend-reporting-init-py","blocks":[{"type":"text","text":"本节提供 `backend/reporting/__init__.py` 的完整原代码，便于不离开教程核对上下文。它不是推荐背诵顺序；核心函数的输入输出、设计推导和逐行注释见主章节。源码SHA256：`f2b5e57f6c3fccb5f8d0d65961515516411cdea9b8ff0f8849ec3c7055e55f0d`。\n\n本文件主要定义导入、配置或数据结构。"},{"type":"code","code":{"language":"python","caption":"backend/reporting/__init__.py（从原文件第1行开始）","content":"\"\"\"生成报告，并记录报告中结果所依据的表格和工具操作。\"\"\"\n"}}]},{"title":"backend/reporting/builder.py","anchor":"source-backend-reporting-builder-py","blocks":[{"type":"text","text":"本节提供 `backend/reporting/builder.py` 的完整原代码，便于不离开教程核对上下文。它不是推荐背诵顺序；核心函数的输入输出、设计推导和逐行注释见主章节。源码SHA256：`1e6df0e3bbbae8ccd41b3a3ee5180d4de7d0735bfdd24b32c8445b1070c1569f`。\n\n函数定位：`escape_cell`（第5～7行）；`build_report`（第10～38行）"},{"type":"code","code":{"language":"python","caption":"backend/reporting/builder.py（从原文件第1行开始）","content":"\"\"\"根据已保存的计算结果生成 Markdown 报告，不让模型重新生成结果表中的数字。\"\"\"\nfrom backend.core.storage import read_table, write_artifact\n\n\ndef escape_cell(value) -> str:\n    \"\"\"转义 Markdown 表格中的竖线和换行。空值显示为缺失或无定义，而不是零。\"\"\"\n    return '无定义/缺失' if value is None else str(value).replace('|', '\\\\|').replace('\\n', ' ')\n\n\ndef build_report(state: dict) -> dict:\n    \"\"\"根据问题、统计口径和实际结果生成报告，并附上表格、图表来源及计算代码。\"\"\"\n    args = state['action']['arguments']\n    style = state.get('personalization', {}).get('report_style')\n    notes = args['notes'][:3] if style == 'concise' else args['notes']\n    lines = ['# ' + args['title'][:120], '', '## 任务', state['question'], '',\n             '## 运行模式', '规则演示（未调用聊天模型）' if state['mode'] == 'demo' else '模型自主工具调用', '',\n             '## 指标口径', f\"币种：{state['metrics']['currency']}；有效订单状态：{state['metrics']['valid_status']}。\",\n             '按购买时间筛选；商品金额不含运费；订单量去重；数据为所选数据集的固定快照。', '',\n             '## 分析说明', *['- ' + note for note in notes], '']\n    if style:\n        lines += ['说明风格：' + ('简洁；完整计算依据仍保留。' if style == 'concise' else '详细；包含计算方法与依据。'), '']\n    if state.get('clarification_answer'):\n        lines += ['## 用户补充要求', state['clarification_answer'], '']\n    for index, artifact in enumerate(state['artifacts'], 1):\n        if artifact['kind'] != 'table':\n            continue\n        body = read_table(artifact['id'], state['task_id'])\n        # 从已保存文件读取全部结果行，不用模型重写表格，也不把有限的 preview 误当完整结果。\n        lines += [f\"## 结果 {index}：{artifact['label']}\", f\"来源 ID：{artifact['id']}；总行数：{artifact['row_count']}。\", '']\n        lines.append('| ' + ' | '.join(map(escape_cell, body['columns'])) + ' |')\n        lines.append('| ' + ' | '.join('---' for _ in body['columns']) + ' |')\n        lines += ['| ' + ' | '.join(escape_cell(row.get(column)) for column in body['columns']) + ' |' for row in body['rows']]\n        if artifact.get('metric_scope', {}).get('enforced'):\n            lines += ['', f\"执行约束：仅包含状态 {artifact['metric_scope']['valid_status']} 的订单及其商品明细。\"]\n        lines += ['', '```sql' if artifact.get('sql') else '```python', artifact.get('sql') or artifact.get('python', ''), '```', '']\n    lines += ['## 图表来源']\n    lines += [f\"- {item['label']}：图表 {item['id']}，来源表格 {item['source_id']}；来源 {item['source_row_count']} 行，完整绘制 {item['plotted_row_count']} 行。\" for item in state['artifacts'] if item['kind'] == 'chart']\n    return write_artifact(state['task_id'], 'report', args['title'], '\\n'.join(lines).encode('utf-8'), 'md')\n"}}]},{"title":"backend/reporting/requirements.py","anchor":"source-backend-reporting-requirements-py","blocks":[{"type":"text","text":"本节提供 `backend/reporting/requirements.py` 的完整原代码，便于不离开教程核对上下文。它不是推荐背诵顺序；核心函数的输入输出、设计推导和逐行注释见主章节。源码SHA256：`24557d79cac9a973bdfc8a8987d158694d5c4cf46ddcebd1d266eba7d7edfc9a`。\n\n函数定位：`requested_columns`（第5～21行）；`python_requested`（第24～27行）；`chart_requested`（第30～33行）；`chart_forbidden`（第36～38行）"},{"type":"code","code":{"language":"python","caption":"backend/reporting/requirements.py（从原文件第1行开始）","content":"\"\"\"提取用户明确要求的结果列和计算工具，在报告生成前检查这些要求是否完成。\"\"\"\nimport re\n\n\ndef requested_columns(question: str) -> set[str]:\n    \"\"\"提取用户明确列出的结果列名，排除日期格式说明，不猜测用户没有指定的列名。\"\"\"\n    match = re.search(r'(?:最终结果表列名|最终列名|结果表列名|结果列名|列名)\\s*(?:使用|为|是|：|:)?\\s*([^。；;\\n]+)', question)\n    if not match:\n        return set()\n    remaining = match.group(1).strip()\n    columns = set()\n    while remaining:\n        field = re.match(r'([A-Za-z_][A-Za-z_0-9]*)(?:\\s*[（(][^）)]*[）)])?', remaining)\n        if not field:\n            break\n        columns.add(field.group(1))\n        remaining = remaining[field.end():].lstrip()\n        if not remaining or remaining[0] not in ',，、':\n            break\n        remaining = remaining[1:].lstrip()\n    return columns\n\n\ndef python_requested(question: str) -> bool:\n    \"\"\"判断用户是否明确要求使用 Python。否定使用 Python 的表达不算要求。\"\"\"\n    normalized = question.lower()\n    return 'python' in normalized and not re.search(r'(?:不用|不要|无需|不使用|without|do not use|don.t use)\\s*(?:使用\\s*)?python', normalized)\n\n\ndef chart_requested(question: str) -> bool:\n    \"\"\"识别明确绘图要求，避免用户要求图表而模型仅交付表格；否定绘图的表达不计入。\"\"\"\n    text = re.sub(r'(?:不要|不用|无需|不需要|不绘制|不画)\\s*(?:生成|绘制|画)?\\s*(?:折线图|柱状图|条形图|图表|绘图|画图|图)', '', question.lower())\n    return bool(re.search(r'折线图|柱状图|条形图|图表|绘图|画图|绘制.*图', text))\n\n\ndef chart_forbidden(question: str) -> bool:\n    \"\"\"识别明确禁止所有绘图的要求；只否定某种图而要求另一种图，不等于全部禁图。\"\"\"\n    return bool(re.search(r'(?:不要|不用|无需|不需要|不绘制|不画)\\s*(?:生成|绘制|画)?\\s*(?:图表|绘图|画图|图)', question)) and not chart_requested(question)\n"}}]},{"title":"backend/reporting/verification.py","anchor":"source-backend-reporting-verification-py","blocks":[{"type":"text","text":"本节提供 `backend/reporting/verification.py` 的完整原代码，便于不离开教程核对上下文。它不是推荐背诵顺序；核心函数的输入输出、设计推导和逐行注释见主章节。源码SHA256：`cbee710bb03eb2204874c3dc3a45b78dfa3f3847d40bf94549e7fcceb64f53a0`。\n\n函数定位：`select_report_artifacts`（第11～36行）；`mask_month_range`（第39～41行）；`numbers`（第44～47行）；`known_dates`（第50～55行）；`verify_report_inputs`（第58～110行）"},{"type":"code","code":{"language":"python","caption":"backend/reporting/verification.py（从原文件第1行开始）","content":"\"\"\"检查报告数字是否有计算依据，以及图表是否包含来源表的全部行。\"\"\"\nimport re\nfrom decimal import Decimal, InvalidOperation\nfrom backend.core.storage import read_table\n\nNUMBER = re.compile(r'(?\u003c![A-Za-z_0-9])[-+]?\\d+(?:,\\d{3})*(?:\\.\\d+)?(?:[eE][-+]?\\d+)?')\nDATE = re.compile(r'(\\d{4})[-年/](\\d{1,2})(?:[-月/](\\d{1,2}))?')\nMONTH_RANGE = re.compile(r'(\\d{1,2})月\\s*[-—–~至到]\\s*(\\d{1,2})月')\n\n\ndef select_report_artifacts(artifacts: list[dict], references: list[str] | None) -> list[dict]:\n    \"\"\"从当前任务产物选取最终结果，未知引用拒绝；图表的真实来源表自动纳入交付校验。\"\"\"\n    if references is None:\n        return artifacts\n    if not references or len(references) != len(set(references)):\n        raise ValueError('最终结果引用不能为空或重复')\n    by_reference = {}\n    for item in artifacts:\n        by_reference[item['id']] = item\n        if item.get('artifact_ref'):\n            by_reference[item['artifact_ref']] = item\n    selected = []\n    for reference in references:\n        item = by_reference.get(reference)\n        if item is None or item['kind'] not in ('table','chart'):\n            raise ValueError('最终结果引用不属于本任务的表格或图表：' + reference)\n        if item['id'] not in {row['id'] for row in selected}:\n            selected.append(item)\n    for chart in list(selected):\n        if chart['kind'] == 'chart':\n            source = by_reference.get(chart.get('source_id'))\n            if source is None or source['kind'] != 'table':\n                raise ValueError('图表缺少当前任务中的来源表')\n            if source['id'] not in {row['id'] for row in selected}:\n                selected.append(source)\n    return selected\n\n\ndef mask_month_range(match) -> str:\n    \"\"\"在提取数字前去掉合法月份范围的连接符，避免把月份范围读成负数。非法月份不会被忽略。\"\"\"\n    return ' ' if all(1 \u003c= int(part) \u003c= 12 for part in match.groups()) else match.group()\n\n\ndef numbers(text: str) -> set[Decimal]:\n    \"\"\"从文字中提取数字并转成 Decimal，保留正负号，并支持千分位格式。\"\"\"\n    masked = DATE.sub(' ', MONTH_RANGE.sub(mask_month_range, text))\n    return known_dates(text) | {Decimal(match.group().replace(',', '')) for match in NUMBER.finditer(masked)}\n\n\ndef known_dates(text: str) -> set[Decimal]:\n    \"\"\"提取文字中明确出现的年月日，作为可写入报告的日期依据，不把其他任意数字当成统计事实。\"\"\"\n    parts = {Decimal(part) for match in DATE.finditer(text) for part in match.groups() if part}\n    parts.update(Decimal(month) for month in re.findall(r'(\\d{1,2})月', text) if 1 \u003c= int(month) \u003c= 12)\n    parts.update(Decimal(day) for day in re.findall(r'(\\d{1,2})日', text) if 1 \u003c= int(day) \u003c= 31)\n    return parts\n\n\ndef verify_report_inputs(task_id: str, artifacts: list[dict], notes: list[str], title: str = '',\n                         question: str = '', expected_status: str | None = None) -> None:\n    \"\"\"核对结果文件、报告数字、订单状态和图表行数。这些检查不能保证所有业务解释都正确。\"\"\"\n    tables = [item for item in artifacts if item['kind'] == 'table']\n    if not tables or not any(item['row_count'] and any(any(value is not None for value in row.values()) for row in item['preview']) for item in tables):\n        raise ValueError('没有有效计算结果，不能生成完成报告')\n    if sum(map(len, notes)) > 3000 or len(title) > 120:\n        raise ValueError('报告标题限 120 字，说明总长度限 3000 字，请压缩对应字段')\n    allowed = known_dates(question)\n    # 报告数字应来自实际结果文件或明确日期，用户问题中的其他数字不能自动作为统计依据。\n    for item in tables:\n        body = read_table(item['id'], task_id)\n        if len(body['rows']) != item['row_count'] or body['columns'] != item['columns']:\n            raise ValueError('结果文件与产物记录不一致')\n        scope = item.get('metric_scope', {})\n        if expected_status and item.get('sql') and (not scope.get('enforced') or scope.get('valid_status') != expected_status):\n            raise ValueError('SQL 产物缺少当前有效订单状态的执行约束，请重新查询')\n        allowed.update(known_dates(item.get('sql', '')))\n        allowed.add(Decimal(len(body['rows'])))\n        if item.get('metric_id') == 'customer_repeat':\n            allowed.add(Decimal(2))\n        for row in body['rows']:\n            for value in row.values():\n                if value is None or isinstance(value, bool):\n                    continue\n                try:\n                    number = Decimal(str(value))\n                    if number.is_finite():\n                        allowed.update((number, number.quantize(Decimal('.01'))))\n                        if number \u003c 0:\n                            allowed.update((-number, (-number).quantize(Decimal('.01'))))\n                except InvalidOperation:\n                    allowed.update(known_dates(str(value)))\n    for field, text in [('title', title), *[(f'notes[{index}]', note) for index, note in enumerate(notes)]]:\n        if expected_status:\n            state_name = re.escape(expected_status)\n            excluded = re.search(r'(?:排除|不包含|不含|剔除|未包含|exclude\\w*|without)\\s*[（(]?\\s*' + state_name, text, re.IGNORECASE)\n            excluded = excluded or re.search(state_name + r'\\s*[）)]?\\s*(?:已排除|不计入|未计入)', text, re.IGNORECASE)\n            if excluded:\n                raise ValueError(f'{field} 的状态说明与实际查询冲突：实际只包含 {expected_status}，不能称排除该状态；请按指标口径重写。')\n            if expected_status != 'delivered' and any(word in text for word in ('已交付', '已送达')):\n                raise ValueError(f'{field} 错称已交付订单；实际有效状态为 {expected_status}，请使用已确认状态描述。')\n        # 数字出现在结果表中，并不代表报告对它的解释一定正确，业务含义仍需独立评测和检查。\n        unsupported = numbers(text) - allowed\n        if unsupported:\n            values = ', '.join(str(value) for value in sorted(unsupported))\n            raise ValueError(f'{field} 含无依据数字 {values}；先用 SQL/Python 实际计算并保存这些数字，或删去该说明；不能口算后直接写入。')\n    for chart in (item for item in artifacts if item['kind'] == 'chart'):\n        # 比较来源表行数与实际绘制行数，避免来源表完整但图表遗漏后面的类别。\n        source = read_table(chart['source_id'], task_id)\n        count = len(source['rows'])\n        if chart.get('source_row_count') != count or chart.get('plotted_row_count') != count or chart.get('truncated') is not False:\n            raise ValueError('图表没有完整覆盖来源表格，请重新生成完整图表，不能声称已展示全部结果')\n"}}]},{"title":"backend/repositories/__init__.py","anchor":"source-backend-repositories-init-py","blocks":[{"type":"text","text":"本节提供 `backend/repositories/__init__.py` 的完整原代码，便于不离开教程核对上下文。它不是推荐背诵顺序；核心函数的输入输出、设计推导和逐行注释见主章节。源码SHA256：`e2acd275726f7063c540777e8348245125c2585a89cf79be0ed5d7f06c67b605`。\n\n本文件主要定义导入、配置或数据结构。"},{"type":"code","code":{"language":"python","caption":"backend/repositories/__init__.py（从原文件第1行开始）","content":"\"\"\"提供读取和修改数据库记录的函数。\"\"\"\n"}}]},{"title":"backend/repositories/analysis_tasks.py","anchor":"source-backend-repositories-analysis-tasks-py","blocks":[{"type":"text","text":"本节提供 `backend/repositories/analysis_tasks.py` 的完整原代码，便于不离开教程核对上下文。它不是推荐背诵顺序；核心函数的输入输出、设计推导和逐行注释见主章节。源码SHA256：`f73022174f0a5c35e64a96fc87311f12ed295a04e9bee71431ed885a0e354c28`。\n\n函数定位：`owned_task`（第9～14行）；`update_task`（第17～37行）；`emit_event`（第40～51行）；`register_artifact`（第54～67行）；`check_cancelled`（第70～75行）；`mark_report_selection`（第78～84行）"},{"type":"code","code":{"language":"python","caption":"backend/repositories/analysis_tasks.py（从原文件第1行开始）","content":"\"\"\"读取和更新分析任务，保存步骤事件及结果文件信息。\"\"\"\nfrom fastapi import HTTPException\nfrom sqlalchemy import select\nfrom backend.core.database import Session\nfrom backend.models.analysis_task import AnalysisTask\nfrom backend.models.base import utcnow\n\n\nasync def owned_task(session, task_id: str, user_id: str) -> AnalysisTask:\n    \"\"\"查找属于当前用户的任务。任务不存在或属于其他用户时，都返回任务不存在错误。\"\"\"\n    obj = await session.scalar(select(AnalysisTask).where(AnalysisTask.id == task_id, AnalysisTask.user_id == user_id))\n    if obj is None:\n        raise HTTPException(404, '任务不存在')\n    return obj\n\n\nasync def update_task(task_id: str, *, event: tuple[str, dict] | None = None, **changes) -> bool:\n    \"\"\"更新任务状态，并按需写入一条事件，两项修改在同一个事务中提交。\n    \n    更新前先锁住任务记录，避免取消操作与状态更新同时修改它。\n    返回 True 表示修改已提交；任务不存在或已被取消时返回 False，不再更新状态或写入事件。\n    \"\"\"\n    async with Session.begin() as session:\n        task = await session.get(AnalysisTask, task_id, with_for_update=True)\n        # 这里和取消接口都先锁住同一条任务记录。如果取消操作已经提交，就不能再把任务更新为成功。\n        if task is None or task.status == 'cancelled':\n            return False\n        for key, value in changes.items():\n            setattr(task, key, value)\n        if event:\n            kind, payload = event\n            # 任务状态和完成事件一起提交，防止页面看到任务已成功，却还读不到完成事件。\n            # 给 JSONB 字段赋一个新列表，让 ORM 识别内容变化。直接对原列表 append 可能不会触发数据库更新。\n            task.events = [*task.events, {'seq': len(task.events) + 1, 'type': kind,\n                           'time': utcnow().isoformat(), 'payload': payload}]\n        task.updated_at = utcnow()\n    return True\n\n\nasync def emit_event(task_id: str, kind: str, payload: dict) -> None:\n    \"\"\"把步骤事件保存到 PostgreSQL，前端随后通过 SSE 按事件序号读取。\"\"\"\n    async with Session.begin() as session:\n        task = await session.get(AnalysisTask, task_id, with_for_update=True)\n        if task is None:\n            return\n        # 先锁住任务记录再分配事件序号，避免并发写入产生相同序号。浏览器用序号补读已保存的事件。\n        events = list(task.events)\n        events.append({'seq': len(events) + 1, 'type': kind,\n                       'time': utcnow().isoformat(), 'payload': payload})\n        task.events = events\n        task.updated_at = utcnow()\n\n\nasync def register_artifact(task_id: str, artifact: dict) -> dict:\n    \"\"\"锁住任务后登记产物并分配唯一表格别名；已取消任务拒绝登记，同 ID 重投返回原记录。\"\"\"\n    async with Session.begin() as session:\n        task = await session.get(AnalysisTask, task_id, with_for_update=True)\n        if task is None or task.status == 'cancelled':\n            raise InterruptedError('任务已取消')\n        existing = next((item for item in task.artifacts if item['id'] == artifact['id']), None)\n        if existing:\n            return existing\n        if artifact['kind'] == 'table':\n            # 并发工具不能各自按旧快照计算 table_1。分配与登记放在同一个行锁事务中。\n            artifact = {**artifact, 'artifact_ref': f\"table_{sum(item['kind'] == 'table' for item in task.artifacts) + 1}\"}\n        task.artifacts = [*task.artifacts, artifact]\n        return artifact\n\n\nasync def check_cancelled(task_id: str) -> None:\n    \"\"\"检查任务是否被取消。已取消或任务不存在时抛出异常，让调用方停止后续分析。\"\"\"\n    async with Session() as session:\n        task = await session.get(AnalysisTask, task_id)\n        if task is None or task.status == 'cancelled':\n            raise InterruptedError('任务已取消')\n\n\nasync def mark_report_selection(task_id: str, selected_ids: set[str]) -> None:\n    \"\"\"在任务行锁中标记最终交付与中间结果，保留全部来源供追溯，不删除文件。\"\"\"\n    async with Session.begin() as session:\n        task = await session.get(AnalysisTask, task_id, with_for_update=True)\n        if task is None or task.status == 'cancelled':\n            raise InterruptedError('任务已取消')\n        task.artifacts = [{**item, 'delivery_role': 'final' if item['id'] in selected_ids or item['kind']=='report' else 'intermediate'} for item in task.artifacts]\n"}}]},{"title":"backend/repositories/business_data.py","anchor":"source-backend-repositories-business-data-py","blocks":[{"type":"text","text":"本节提供 `backend/repositories/business_data.py` 的完整原代码，便于不离开教程核对上下文。它不是推荐背诵顺序；核心函数的输入输出、设计推导和逐行注释见主章节。源码SHA256：`5512059f49457f518767ffb3554d73aeaad439396881bdbdd3cc5dab5311e393`。\n\n函数定位：`insert_tables`（第9～14行）"},{"type":"code","code":{"language":"python","caption":"backend/repositories/business_data.py（从原文件第1行开始）","content":"\"\"\"分批插入客户、商品、订单和明细。全部批次由调用方在同一个事务中提交。\"\"\"\nfrom sqlalchemy import insert\nfrom backend.models import Customer, Product, Order, OrderItem\n\n# 按字典中的顺序先写客户和商品，再写订单，最后写明细，以满足表之间的外键约束。\nTABLE_MODELS = {'customers': Customer, 'products': Product, 'orders': Order, 'order_items': OrderItem}\n\n\nasync def insert_tables(session, tables: dict[str, list[dict]]) -> None:\n    \"\"\"按外键依赖顺序分批写入四张表。只执行插入，不在函数内部提交事务。\"\"\"\n    for table, model in TABLE_MODELS.items():\n        # 分批用于控制每次 SQL 的参数数量，不表示分批提交。上层会在全部成功后统一提交。\n        for offset in range(0, len(tables[table]), 500):\n            await session.execute(insert(model), tables[table][offset:offset + 500])\n"}}]},{"title":"backend/repositories/datasets.py","anchor":"source-backend-repositories-datasets-py","blocks":[{"type":"text","text":"本节提供 `backend/repositories/datasets.py` 的完整原代码，便于不离开教程核对上下文。它不是推荐背诵顺序；核心函数的输入输出、设计推导和逐行注释见主章节。源码SHA256：`b3546c611e1d40d671162c3cf1142833422ebaf370815c42bd6af0f96e2a4509`。\n\n函数定位：`owned_dataset`（第7～12行）"},{"type":"code","code":{"language":"python","caption":"backend/repositories/datasets.py（从原文件第1行开始）","content":"\"\"\"读取数据集时同时检查它是否属于当前用户。\"\"\"\nfrom fastapi import HTTPException\nfrom sqlalchemy import select\nfrom backend.models.dataset import Dataset\n\n\nasync def owned_dataset(session, dataset_id: str, user_id: str) -> Dataset:\n    \"\"\"查找当前用户的数据集。不存在或属于其他用户时，统一返回数据集不存在错误。\"\"\"\n    obj = await session.scalar(select(Dataset).where(Dataset.id == dataset_id, Dataset.user_id == user_id))\n    if obj is None:\n        raise HTTPException(404, '数据集不存在')\n    return obj\n"}}]},{"title":"backend/schemas/__init__.py","anchor":"source-backend-schemas-init-py","blocks":[{"type":"text","text":"本节提供 `backend/schemas/__init__.py` 的完整原代码，便于不离开教程核对上下文。它不是推荐背诵顺序；核心函数的输入输出、设计推导和逐行注释见主章节。源码SHA256：`ee747cd2cf19fab2166e4cb05a4f97d738e8eddbc459dbc2d8916b60aea5eaed`。\n\n本文件主要定义导入、配置或数据结构。"},{"type":"code","code":{"language":"python","caption":"backend/schemas/__init__.py（从原文件第1行开始）","content":"\"\"\"定义接口接收和返回的数据格式。\"\"\"\n"}}]},{"title":"backend/schemas/analysis_tasks.py","anchor":"source-backend-schemas-analysis-tasks-py","blocks":[{"type":"text","text":"本节提供 `backend/schemas/analysis_tasks.py` 的完整原代码，便于不离开教程核对上下文。它不是推荐背诵顺序；核心函数的输入输出、设计推导和逐行注释见主章节。源码SHA256：`aa93120fb87c9993cdcf0c4ba84f74640ede2c26df8674b6fb90b7c2a82baddc`。\n\n本文件主要定义导入、配置或数据结构。"},{"type":"code","code":{"language":"python","caption":"backend/schemas/analysis_tasks.py（从原文件第1行开始）","content":"\"\"\"定义创建分析任务和提交澄清答案的请求格式。\"\"\"\nfrom typing import Literal\nfrom uuid import UUID\nfrom pydantic import BaseModel, Field, ConfigDict\n\n\nclass TaskRequest(BaseModel):\n    \"\"\"定义分析问题、数据集、可选会话和运行模式等创建任务所需的字段。\"\"\"\n    model_config = ConfigDict(str_strip_whitespace=True)\n    dataset_id: UUID\n    question: str = Field(min_length=2, max_length=4000)\n    mode: Literal['demo', 'llm'] | None = None\n    conversation_id: UUID | None = None\n\n\nclass ResumeRequest(BaseModel):\n    \"\"\"定义恢复任务时提交的补充答案，并拒绝纯空白内容。\"\"\"\n    model_config = ConfigDict(str_strip_whitespace=True)\n    answer: str = Field(min_length=1, max_length=2000)\n"}}]},{"title":"backend/schemas/auth.py","anchor":"source-backend-schemas-auth-py","blocks":[{"type":"text","text":"本节提供 `backend/schemas/auth.py` 的完整原代码，便于不离开教程核对上下文。它不是推荐背诵顺序；核心函数的输入输出、设计推导和逐行注释见主章节。源码SHA256：`bee618bd82e69c9e96b8ae47bbe3aa26fbbf7a6c606f66aeaaa42fd52a040b4d`。\n\n本文件主要定义导入、配置或数据结构。"},{"type":"code","code":{"language":"python","caption":"backend/schemas/auth.py（从原文件第1行开始）","content":"\"\"\"定义登录和注册输入，并限制用户名和密码长度。\"\"\"\nfrom pydantic import BaseModel, Field\n\n\nclass Credentials(BaseModel):\n    \"\"\"定义登录和注册共用的用户名、密码输入格式。\"\"\"\n    username: str = Field(min_length=3, max_length=40, pattern=r'^[A-Za-z0-9_\\u4e00-\\u9fff-]+$')\n    password: str = Field(min_length=8, max_length=128)\n"}}]},{"title":"backend/schemas/datasets.py","anchor":"source-backend-schemas-datasets-py","blocks":[{"type":"text","text":"本节提供 `backend/schemas/datasets.py` 的完整原代码，便于不离开教程核对上下文。它不是推荐背诵顺序；核心函数的输入输出、设计推导和逐行注释见主章节。源码SHA256：`b99dbffbb15cc4e91e75ff16d2506174f5317eccf6f40e77328744e5196095b8`。\n\n本文件主要定义导入、配置或数据结构。"},{"type":"code","code":{"language":"python","caption":"backend/schemas/datasets.py（从原文件第1行开始）","content":"\"\"\"定义导入确认请求。字段映射的键是项目目标字段，值是上传文件的原始列名。\"\"\"\nfrom typing import Literal\nfrom pydantic import BaseModel, Field\n\n\nclass ImportRequest(BaseModel):\n    \"\"\"定义导入时确认的字段映射、币种和有效订单状态等信息。\"\"\"\n    mapping: dict[str, dict[str, str]] = Field(default_factory=dict)\n    sheets: dict[str, str] = Field(default_factory=dict)\n    encoding: Literal['utf-8-sig', 'gb18030'] = 'utf-8-sig'\n    currency: str = Field(default='BRL', pattern=r'^[A-Z]{3}$')\n    valid_status: str = Field(default='delivered', min_length=1, max_length=30)\n"}}]},{"title":"backend/services/__init__.py","anchor":"source-backend-services-init-py","blocks":[{"type":"text","text":"本节提供 `backend/services/__init__.py` 的完整原代码，便于不离开教程核对上下文。它不是推荐背诵顺序；核心函数的输入输出、设计推导和逐行注释见主章节。源码SHA256：`08936fa797cac54f06490a8bef65a05e21bf324d5ee5578df6939dbe60dca917`。\n\n本文件主要定义导入、配置或数据结构。"},{"type":"code","code":{"language":"python","caption":"backend/services/__init__.py（从原文件第1行开始）","content":"\"\"\"处理业务规则，并协调接口、数据库和后台任务。\"\"\"\n"}}]},{"title":"backend/services/analysis_tasks.py","anchor":"source-backend-services-analysis-tasks-py","blocks":[{"type":"text","text":"本节提供 `backend/services/analysis_tasks.py` 的完整原代码，便于不离开教程核对上下文。它不是推荐背诵顺序；核心函数的输入输出、设计推导和逐行注释见主章节。源码SHA256：`3985ba2ac81cd2c86a1fd69b5b0812eeefb4a9c5ca36735b1f7d29ce3a66ba3c`。\n\n函数定位：`serialize_task`（第11～20行）；`create_task`（第23～61行）；`dispatch`（第64～73行）"},{"type":"code","code":{"language":"python","caption":"backend/services/analysis_tasks.py（从原文件第1行开始）","content":"\"\"\"创建分析任务并发送队列消息。发送失败时保留任务，由恢复任务稍后重试。\"\"\"\nfrom fastapi import HTTPException\nfrom backend.core.config import get_settings\nfrom backend.models.analysis_task import AnalysisTask\nfrom backend.repositories.datasets import owned_dataset\nfrom sqlalchemy import select\nfrom backend.models import Conversation\nfrom backend.context.conversations import owned_conversation, append_message\n\n\ndef serialize_task(task: AnalysisTask, include_events: bool = False) -> dict:\n    \"\"\"整理接口需要的任务状态和结果信息，不返回图线程 ID 或数据库配置。\"\"\"\n    body = {'id': task.id, 'dataset_id': task.dataset_id, 'question': task.question,\n            'status': task.status, 'mode': task.model_mode, 'artifacts': task.artifacts,\n            'usage': task.usage, 'error': task.error_info, 'clarification': task.clarification,\n            'created_at': task.created_at.isoformat(), 'updated_at': task.updated_at.isoformat()}\n    body['conversation_id'] = task.config_snapshot.get('conversation_id')\n    if include_events:\n        body['events'] = task.events\n    return body\n\n\nasync def create_task(session, user_id: str, payload) -> AnalysisTask:\n    \"\"\"检查数据集归属和就绪状态后创建任务，并保存本任务使用的口径、数据版本和模型配置。\"\"\"\n    dataset = await owned_dataset(session, str(payload.dataset_id), user_id)\n    if dataset.status != 'ready':\n        raise HTTPException(409, '数据集尚未导入成功')\n    settings = get_settings()\n    if '[时间范围]' in payload.question:\n        raise HTTPException(422, '请先把常用问题模板中的 [时间范围] 填写完整')\n    if payload.conversation_id:\n        conversation = await owned_conversation(session, str(payload.conversation_id), user_id)\n        # 先锁住会话记录再检查是否存在未结束任务，让同时提交的请求依次检查，避免创建重复的活动任务。\n        await session.refresh(conversation, with_for_update=True)\n        if conversation.dataset_id != dataset.id:\n            raise HTTPException(409, '会话绑定原数据集，切换数据集时请新建会话')\n        active = await session.scalar(select(AnalysisTask.id).where(AnalysisTask.user_id == user_id,\n                      AnalysisTask.config_snapshot['conversation_id'].astext == conversation.id,\n                      AnalysisTask.status.in_(['queued','running','waiting_input'])).limit(1))\n        if active:\n            raise HTTPException(409, '当前会话有未结束任务，请等待、补充或取消后再提问')\n    else:\n        conversation = Conversation(user_id=user_id, dataset_id=dataset.id)\n        session.add(conversation)\n        # flush 执行插入并取得默认生成的 ID，但还没有提交事务，后面出错时仍可一起回滚。\n        await session.flush()\n    mode = payload.mode or settings.model_mode\n    if mode == 'llm' and not settings.model_api_key:\n        raise HTTPException(422, '请先在 .env 配置 MODEL_API_KEY 并重启 API 和 Worker')\n    task = AnalysisTask(user_id=user_id, dataset_id=dataset.id, question=payload.question.strip(),\n                        model_mode=mode, config_snapshot={'metrics': dataset.metric_definitions,\n                        'data_version': dataset.data_version, 'model': settings.model_name if mode == 'llm' else 'rule-demo',\n                        'max_steps': settings.max_agent_steps})\n    task.config_snapshot = {**task.config_snapshot, 'conversation_id': conversation.id}\n    # 保存当前口径、数据版本和模型信息，后续按本任务记录执行，便于查看当时使用的分析条件。\n    session.add(task)\n    await session.flush()\n    # await 等待消息追加完成，这里不接收返回值。用户问题与任务记录最后一起提交。\n    await append_message(session, conversation, task.id, 'user', task.question, task.question)\n    await session.commit()\n    return task\n\n\ndef dispatch(job: str, identifier: str) -> bool:\n    \"\"\"向 Celery 发送任务消息。发送成功返回 True，失败返回 False，数据库中已保存的任务不被删除。\"\"\"\n    from backend.workers.celery_app import celery_app\n    try:\n        # 任务记录已经提交后才发送任务 ID。Worker 再根据 ID 查库，消息中不包含业务数据或连接凭据。\n        celery_app.send_task(job, args=[identifier], retry=False)\n        return True\n    except Exception:\n        # PostgreSQL 和 Redis 没有共同事务，所以发送失败后保留 queued 任务，让 Beat 稍后再次发送。\n        return False\n"}}]},{"title":"backend/services/datasets.py","anchor":"source-backend-services-datasets-py","blocks":[{"type":"text","text":"本节提供 `backend/services/datasets.py` 的完整原代码，便于不离开教程核对上下文。它不是推荐背诵顺序；核心函数的输入输出、设计推导和逐行注释见主章节。源码SHA256：`f44054d757069f8f158fe732ce4cae3fa12fbab1e84ffac10978931ee415600b`。\n\n函数定位：`serialize_dataset`（第17～22行）；`save_uploads`（第25～70行）；`preview_dataset`（第73～80行）；`import_dataset`（第83～122行）"},{"type":"code","code":{"language":"python","caption":"backend/services/datasets.py（从原文件第1行开始）","content":"\"\"\"保存和预览上传文件，并由独立 Worker 校验、导入四张业务表。\"\"\"\nimport asyncio\nimport hashlib\nfrom pathlib import Path\nfrom sqlalchemy import select, text\nfrom fastapi import HTTPException\nfrom backend.core.config import get_settings\nfrom backend.core.database import Session, engine\nfrom backend.models.dataset import Dataset\nfrom backend.models.base import new_id\nfrom backend.ingestion.mapping import FIELDS, DEFAULT_METRICS, infer_table, default_mapping\nfrom backend.ingestion.parsers import read_frame, workbook_sheets\nfrom backend.ingestion.validation import normalize_table, validate_relations\nfrom backend.repositories.business_data import insert_tables\n\n\ndef serialize_dataset(dataset: Dataset) -> dict:\n    \"\"\"整理数据集的公开信息，不返回服务器上的上传文件路径。\"\"\"\n    return {'id': dataset.id, 'name': dataset.name, 'status': dataset.status,\n            'source_type': dataset.source_type, 'data_version': dataset.data_version,\n            'metric_definitions': dataset.metric_definitions, 'summary': dataset.import_summary,\n            'error': dataset.error_info, 'created_at': dataset.created_at.isoformat()}\n\n\nasync def save_uploads(session, user_id: str, name: str, files) -> Dataset:\n    \"\"\"在大小限制内保存四个 CSV 或一个 XLSX。文件类型不符、业务表重复或缺失时，返回错误。\"\"\"\n    identifier = new_id()\n    folder = get_settings().storage / 'uploads' / identifier\n    folder.mkdir(parents=True)\n    manifest, total = {}, 0\n    try:\n        for upload in files:\n            extension = Path(upload.filename or '').suffix.lower()\n            if extension not in ('.csv', '.xlsx'):\n                raise ValueError('只接受 CSV 或 XLSX 文件')\n            # 用服务端生成的 UUID 作为实际文件名，原名只用于展示，防止路径穿越和同名文件覆盖。\n            path = folder / f'{new_id()}{extension}'\n            digest = hashlib.sha256()\n            with path.open('wb') as handle:\n                while chunk := await upload.read(1024 * 1024):\n                    total += len(chunk)\n                    if total > get_settings().max_upload_mb * 1024 * 1024:\n                        raise ValueError('上传总大小超过限制')\n                    digest.update(chunk)\n                    handle.write(chunk)\n            if extension == '.xlsx':\n                for sheet in await asyncio.to_thread(workbook_sheets, path):\n                    table = infer_table(sheet)\n                    if table:\n                        if table in manifest:\n                            raise ValueError(f'{table} 被重复提供')\n                        manifest[table] = {'path': str(path), 'name': upload.filename, 'sheet': sheet, 'sha256': digest.hexdigest()}\n            else:\n                table = infer_table(upload.filename or '')\n                if table is None or table in manifest:\n                    raise ValueError('CSV 文件名应为 customers/products/orders/order_items，或官方 Olist 名称')\n                manifest[table] = {'path': str(path), 'name': upload.filename, 'sheet': None, 'sha256': digest.hexdigest()}\n        if set(manifest) != set(FIELDS):\n            raise ValueError('请一次提供客户、商品、订单和商品明细四张表')\n        dataset = Dataset(id=identifier, user_id=user_id, name=name, file_manifest=manifest,\n                          metric_definitions=dict(DEFAULT_METRICS))\n        session.add(dataset)\n        await session.commit()\n        return dataset\n    except ValueError as error:\n        # 仅清理本次上传生成的目录，路径由服务端 UUID 确定，不使用用户提供的删除路径。\n        for file in folder.iterdir():\n            file.unlink()\n        folder.rmdir()\n        raise HTTPException(422, str(error)) from None\n\n\nasync def preview_dataset(dataset: Dataset, encoding: str = 'utf-8-sig') -> dict:\n    \"\"\"读取每张表的列名和少量样例，给出建议映射，供用户确认后导入。\"\"\"\n    result = {}\n    for table, entry in dataset.file_manifest.items():\n        frame = await asyncio.to_thread(read_frame, Path(entry['path']), entry.get('sheet'), encoding, 5)\n        result[table] = {'columns': list(frame.columns), 'rows': frame.to_dict('records'),\n                         'mapping': default_mapping(list(frame.columns), table), 'fields': FIELDS[table]}\n    return result\n\n\nasync def import_dataset(dataset_id: str) -> None:\n    \"\"\"锁住本次数据集并校验全部内容。四表数据和导入成功状态在同一事务中保存。\"\"\"\n    async with engine.connect() as lock_connection:\n        locked = await lock_connection.scalar(text('SELECT pg_try_advisory_lock(hashtextextended(:key, 0))'), {'key': 'import:' + dataset_id})\n        await lock_connection.commit()\n        if not locked:\n            return\n        try:\n            async with Session() as session:\n                dataset = await session.get(Dataset, dataset_id)\n                if dataset is None or dataset.status == 'ready':\n                    return\n                manifest, mapping = dataset.file_manifest, dataset.field_mapping\n            tables = {}\n            for table, entry in manifest.items():\n                frame = await asyncio.to_thread(read_frame, Path(entry['path']), entry.get('sheet'), mapping.get('encoding', 'utf-8-sig'))\n                columns = mapping.get('columns', {}).get(table) or default_mapping(list(frame.columns), table)\n                tables[table] = await asyncio.to_thread(normalize_table, frame, table, columns, dataset_id)\n            # 先检查字段类型、主键和表间关联，再写数据库。文件上传完成并不表示已经可以分析。\n            validate_relations(tables)\n            # 四表所有批次和 ready 状态一起提交。任何插入失败都会回滚，避免留下只导入一部分的数据。\n            async with Session.begin() as session:\n                await insert_tables(session, tables)\n                # 导入后立即执行 ANALYZE 更新数据分布统计，帮助 PostgreSQL 为首条分析查询选择合适的执行计划。\n                await session.execute(text('ANALYZE public.customers, public.products, public.orders, public.order_items'))\n                dataset = await session.get(Dataset, dataset_id)\n                dataset.status = 'ready'\n                dataset.error_info = None\n                dataset.import_summary = {table: len(rows) for table, rows in tables.items()}\n        except Exception as error:\n            # 导入失败后，另开事务保存失败状态和原因，让页面显示错误，用户也能据此修正并重试。\n            async with Session.begin() as session:\n                dataset = await session.get(Dataset, dataset_id)\n                if dataset:\n                    dataset.status = 'failed'\n                    dataset.error_info = str(error)[:1000] if isinstance(error, ValueError) else '导入失败，请查看 Worker 日志并重试'\n            raise\n        finally:\n            await lock_connection.execute(text('SELECT pg_advisory_unlock(hashtextextended(:key, 0))'), {'key': 'import:' + dataset_id})\n            await lock_connection.commit()\n"}}]},{"title":"backend/tools/__init__.py","anchor":"source-backend-tools-init-py","blocks":[{"type":"text","text":"本节提供 `backend/tools/__init__.py` 的完整原代码，便于不离开教程核对上下文。它不是推荐背诵顺序；核心函数的输入输出、设计推导和逐行注释见主章节。源码SHA256：`6aaaef63ab6aef0e912286b767e7a683bf04ff8dc9c9c46231d9652952f015ab`。\n\n本文件主要定义导入、配置或数据结构。"},{"type":"code","code":{"language":"python","caption":"backend/tools/__init__.py（从原文件第1行开始）","content":"\"\"\"提供模型可以调用的分析工具。\"\"\"\n"}}]},{"title":"backend/tools/chart.py","anchor":"source-backend-tools-chart-py","blocks":[{"type":"text","text":"本节提供 `backend/tools/chart.py` 的完整原代码，便于不离开教程核对上下文。它不是推荐背诵顺序；核心函数的输入输出、设计推导和逐行注释见主章节。源码SHA256：`fb6e0188009782bc7b83115bb09036c2387ecaae27f5d7d75fcccbc9c8ded6ce`。\n\n函数定位：`create_chart`（第16～19行）；`draw_chart`（第22～72行）"},{"type":"code","code":{"language":"python","caption":"backend/tools/chart.py（从原文件第1行开始）","content":"\"\"\"使用程序预先定义的绘图方式生成 PNG，不执行模型编写的绘图代码。\"\"\"\nimport io\nimport textwrap\nimport threading\nfrom pathlib import Path\nimport matplotlib\nmatplotlib.use('Agg')\nimport matplotlib.pyplot as plt\nfrom matplotlib import font_manager\nfrom backend.core.storage import read_table, write_artifact\n\n\nCHART_LOCK = threading.Lock()\n\n\ndef create_chart(task_id: str, artifact_id: str, x: str, y: str, title: str, kind: str = 'bar', currency: str | None = None) -> dict:\n    \"\"\"保护 Matplotlib 共享状态，独立查询仍并发，单进程中的绘图依次完成。\"\"\"\n    with CHART_LOCK:\n        return draw_chart(task_id, artifact_id, x, y, title, kind, currency)\n\n\ndef draw_chart(task_id: str, artifact_id: str, x: str, y: str, title: str, kind: str = 'bar', currency: str | None = None) -> dict:\n    \"\"\"绘制当前任务表格的全部行，并记录来源、行数和方向。数据过多或字段不适合绘图时，明确报错。\"\"\"\n    if kind not in ('bar', 'line'):\n        raise ValueError('仅支持 bar 或 line')\n    body = read_table(artifact_id, task_id)\n    if x not in body['columns'] or y not in body['columns'] or not body['rows']:\n        raise ValueError('图表列不存在或结果为空')\n    rows = body['rows']\n    # 单图数据超过上限时要求用户聚合或分组，不偷偷截取部分行。需要 Top N 时应先查询对应范围。\n    if len(rows) > 200:\n        raise ValueError(f'完整图表包含 {len(rows)} 行，超出单图可读上限 200；请明确聚合或分组后分别绘图，不会自动截取。')\n    labels = [str(row[x]) for row in rows]\n    if len(set(labels)) != len(labels):\n        raise ValueError('图表横轴维度存在重复值，请先按该维度聚合或分别查询各系列')\n    numbers = [float(row[y]) for row in rows]\n    if not all(__import__('math').isfinite(value) for value in numbers):\n        raise ValueError('图表存在非有限数值')\n    chinese_font = Path('C:/Windows/Fonts/msyh.ttc')\n    font = font_manager.FontProperties(fname=str(chinese_font)) if chinese_font.exists() else None\n    horizontal = kind == 'bar' and len(rows) > 16\n    # 类别多时使用横向条形图，并按类别数增加图的高度，让后面的类别和标签也能显示。\n    size = (12, max(5, len(rows) * .25 + 1)) if horizontal else (max(9, min(20, len(rows) * .3)), 4.5)\n    fig, axis = plt.subplots(figsize=size, layout='constrained')\n    try:\n        if horizontal:\n            axis.barh(range(len(rows)), numbers, color='#176f64')\n            axis.set_yticks(range(len(rows)), labels=[textwrap.fill(label, 35) for label in labels], fontproperties=font, fontsize=8)\n            axis.invert_yaxis()\n        elif kind == 'bar':\n            axis.bar(labels, numbers, color='#176f64')\n        else:\n            axis.plot(labels, numbers, color='#176f64', marker='o')\n        axis.set_title(title[:120], fontproperties=font)\n        units = f'{y} ({currency})' if currency and any(word in y.lower() for word in ('amount', 'sales', 'price', 'aov')) else y\n        if horizontal:\n            axis.set_xlabel(units, fontproperties=font)\n        else:\n            axis.set_ylabel(units, fontproperties=font)\n            axis.tick_params(axis='x', rotation=25)\n            if font:\n                for label in axis.get_xticklabels():\n                    label.set_fontproperties(font)\n        axis.spines[['top', 'right']].set_visible(False)\n        stream = io.BytesIO()\n        fig.savefig(stream, format='png', dpi=140)\n        return write_artifact(task_id, 'chart', title, stream.getvalue(), 'png', source_id=artifact_id, x=x, y=y,\n                              source_row_count=len(rows), plotted_row_count=len(rows), truncated=False,\n                              chart_kind=kind, orientation='horizontal' if horizontal else 'vertical')\n    finally:\n        # 每次绘图后都关闭 figure，避免长期运行的 Worker 不断累积图对象、占用内存。\n        plt.close(fig)\n"}}]},{"title":"backend/tools/customer_metrics.py","anchor":"source-backend-tools-customer-metrics-py","blocks":[{"type":"text","text":"本节提供 `backend/tools/customer_metrics.py` 的完整原代码，便于不离开教程核对上下文。它不是推荐背诵顺序；核心函数的输入输出、设计推导和逐行注释见主章节。源码SHA256：`b0e4c7da9c6e36a01511f81a858d307324a3e9e785fa9f87e093a494f32495e8`。\n\n函数定位：`customer_repeat_requested`（第6～9行）；`customer_repeat_metrics`（第12～41行）"},{"type":"code","code":{"language":"python","caption":"backend/tools/customer_metrics.py（从原文件第1行开始）","content":"\"\"\"按固定的独立客户定义计算复购，模型只填写日期范围，不重新定义谁算同一位客户。\"\"\"\nfrom datetime import date\nfrom backend.execution.sql_executor import execute_query\n\n\ndef customer_repeat_requested(question: str) -> bool:\n    \"\"\"判断问题是否要求复购分析，让报告校验时确认使用了专门的复购计算结果。\"\"\"\n    normalized = question.lower()\n    return any(word in normalized for word in ('复购', 'repeat_customer', 'repeat customer', 'repurchase', '购买至少两单', '购买至少两次'))\n\n\nasync def customer_repeat_metrics(task_id: str, dataset_id: str, valid_status: str,\n                                  start_date: str | None = None, end_date: str | None = None) -> dict:\n    \"\"\"按独立客户标识合并有效订单，统计至少购买两单的客户及其占比。开始日包含，结束日不包含。\"\"\"\n    start = date.fromisoformat(start_date) if start_date else None\n    end = date.fromisoformat(end_date) if end_date else None\n    if start and end and start >= end:\n        raise ValueError('复购时间范围应为开始日期早于结束日期，结束日期不包含在内')\n    filters = []\n    if start:\n        filters.append(f\"o.purchase_time >= '{start.isoformat()}'\")\n    if end:\n        filters.append(f\"o.purchase_time \u003c '{end.isoformat()}'\")\n    where = ' WHERE ' + ' AND '.join(filters) if filters else ''\n    # Olist 的 customer_id 用于订单关联，customer_unique_id 才能识别同一人在不同订单中的购买行为。\n    # 先按独立客户统计订单数，再计算至少两单客户的比例。缺少独立标识的订单单独统计，不猜测其客户归属。\n    query = '''WITH valid_customer_orders AS (\n        SELECT c.customer_unique_id, o.order_id\n        FROM orders o JOIN customers c ON c.dataset_id=o.dataset_id AND c.customer_id=o.customer_id''' + where + '''\n    ), customer_counts AS (\n        SELECT customer_unique_id, COUNT(DISTINCT order_id) AS n\n        FROM valid_customer_orders WHERE customer_unique_id IS NOT NULL GROUP BY customer_unique_id\n    ) SELECT COUNT(*) AS unique_customers,\n        COUNT(CASE WHEN n>=2 THEN 1 END) AS repeat_customers,\n        ROUND(100.0 * COUNT(CASE WHEN n>=2 THEN 1 END) / NULLIF(COUNT(*),0),2) AS repeat_rate,\n        (SELECT COUNT(DISTINCT order_id) FROM valid_customer_orders WHERE customer_unique_id IS NULL) AS unidentified_orders\n        FROM customer_counts'''\n    # 固定指标查询也经过统一执行器，仍须遵守只读权限、数据集范围和有效订单状态限制。\n    result = await execute_query(task_id, dataset_id, query, valid_status)\n    return {**result, 'metric_id': 'customer_repeat', 'customer_identity': 'customer_unique_id',\n            'date_range': {'start_inclusive': start_date, 'end_exclusive': end_date}}\n"}}]},{"title":"backend/tools/dataset_schema.py","anchor":"source-backend-tools-dataset-schema-py","blocks":[{"type":"text","text":"本节提供 `backend/tools/dataset_schema.py` 的完整原代码，便于不离开教程核对上下文。它不是推荐背诵顺序；核心函数的输入输出、设计推导和逐行注释见主章节。源码SHA256：`f0cc643ec489f0e10624e3c14eea5949064c971f5e7d8a68895fcdaed4943b14`。\n\n函数定位：`describe_schema`（第5～22行）"},{"type":"code","code":{"language":"python","caption":"backend/tools/dataset_schema.py（从原文件第1行开始）","content":"\"\"\"向模型说明四表字段、表间关系和已经确认的统计口径。\"\"\"\nfrom backend.ingestion.mapping import FIELDS\n\n\ndef describe_schema(metrics: dict) -> dict:\n    \"\"\"返回数据字典，解释连接字段和金额所对应的商品项，提醒模型避免联表后重复统计。\"\"\"\n    return {'dialect': 'postgresql', 'tables': {name: ['dataset_id', *fields] for name, fields in FIELDS.items()}, 'metrics': metrics,\n            'supported_statistics': ['COUNT', 'SUM', 'AVG', 'MIN', 'MAX', 'ROUND', 'ABS', 'COALESCE', 'NULLIF', 'CAST',\n                                     'DATE_TRUNC', 'TO_CHAR', 'EXTRACT', 'LAG', 'LEAD'],\n            'relations': ['orders.customer_id = customers.customer_id', 'order_items.order_id = orders.order_id',\n                          'order_items.product_id = products.product_id'],\n            'field_meanings': {'customers.customer_id': '订单关联客户记录，同一自然客户的不同订单可能使用不同记录 ID',\n                               'customers.customer_unique_id': '跨订单识别独立客户；复购必须先按此字段合并订单',\n                               'order_items.price': '单个商品项金额，NUMERIC，不含运费',\n                               'order_items.freight_value': '单个商品项的运费，NUMERIC；总运费逐行 SUM；按订单预聚合仍用 SUM，不能取 MAX 或去重',\n                               'orders.purchase_time': '无时区购买时间；时间范围左闭右开'},\n            'notes': ['所有联合关联包含 dataset_id；查询已由 RLS 限定当前数据集',\n                      '分析中的 / 使用 NUMERIC 定点数除法；计数比例不会执行整数截断，零分母仍需 NULLIF',\n                      '订单及明细由执行器强制限定 metrics.valid_status；不要写冲突状态',\n                      '复购使用 customer_repeat_metrics；不得先按 customer_id 统计再直接判断复购',\n                      '订单量对 order_id 去重；一行 order_items 表示一个商品项',\n                      'price 为定点金额，不含 freight_value；没有退款或成本数据']}\n"}}]},{"title":"backend/tools/python.py","anchor":"source-backend-tools-python-py","blocks":[{"type":"text","text":"本节提供 `backend/tools/python.py` 的完整原代码，便于不离开教程核对上下文。它不是推荐背诵顺序；核心函数的输入输出、设计推导和逐行注释见主章节。源码SHA256：`1447ed662d4d68d0fc721d8c2322d66e69d00b285d80ababda14277b95484526`。\n\n函数定位：`analyze_table`（第5～7行）"},{"type":"code","code":{"language":"python","caption":"backend/tools/python.py（从原文件第1行开始）","content":"\"\"\"提供 Python 计算工具，只能读取当前任务已经生成的表格。\"\"\"\nfrom backend.execution.sandbox import execute_python\n\n\nasync def analyze_table(task_id: str, artifact_id: str, code: str) -> dict:\n    \"\"\"在隔离容器中对指定表格运行分析代码，并返回新生成的表格信息。\"\"\"\n    return await execute_python(task_id, artifact_id, code)\n"}}]},{"title":"backend/tools/sales_metrics.py","anchor":"source-backend-tools-sales-metrics-py","blocks":[{"type":"text","text":"本节提供 `backend/tools/sales_metrics.py` 的完整原代码，便于不离开教程核对上下文。它不是推荐背诵顺序；核心函数的输入输出、设计推导和逐行注释见主章节。源码SHA256：`0c3f2e5428aeb1874c6e9ac0ee8c177bb4f8c51a6f0bc66d127b5859424cbe15`。\n\n函数定位：`sales_metrics`（第6～48行）"},{"type":"code","code":{"language":"python","caption":"backend/tools/sales_metrics.py（从原文件第1行开始）","content":"\"\"\"以固定业务粒度计算常用销售指标，避免模型自行定义运费和客单价。\"\"\"\nfrom datetime import date\nfrom backend.execution.sql_executor import execute_query\n\n\nasync def sales_metrics(task_id: str, dataset_id: str, valid_status: str,\n
