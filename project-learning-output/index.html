"user\") card.append(element(\"strong\", \"\", \"用户问题 · \" + message.sequence), element(\"p\", \"\", message.content));\r\n      else card.append(element(\"summary\", \"\", \"分析报告 · \" + message.sequence + \" · 点击展开\"), renderMarkdown(message.content));\r\n      byId(\"conversation-messages\").append(card); state.historyCursor = message.sequence;\r\n    }\r\n    byId(\"more-history\").hidden = state.historyCursor >= body.last_sequence;\r\n  } catch (error) { if (request === state.historyRequest) { byId(\"summary-status\").textContent = \"历史读取失败，可关闭后重试。\"; toast(error.message); } }\r\n  finally { if (request === state.historyRequest) { state.historyLoading = false; byId(\"more-history\").disabled = false; } }\r\n}\r\n\r\n/** 为页面控件绑定事件处理函数，并恢复当前标签页的登录状态。 */\r\nasync function initialize() {\r\n  byId(\"close-history\").addEventListener(\"click\",closeHistory); byId(\"conversation-panel\").addEventListener(\"close\",historyClosed);\r\n  byId(\"conversation-panel\").addEventListener(\"click\",historyBackdrop);\r\n  byId(\"question\").addEventListener(\"input\",updateQuestionCount); byId(\"event-details\").addEventListener(\"change\",toggleEventDetails);\r\n  for (const button of document.querySelectorAll(\"[data-artifact-kind]\")) button.addEventListener(\"click\",filterArtifacts);\r\n  byId(\"new-conversation\").addEventListener(\"click\", newConversation); byId(\"show-history\").addEventListener(\"click\", showHistory);\r\n  byId(\"more-history\").addEventListener(\"click\", moreHistory); byId(\"refresh-memory\").addEventListener(\"click\", refreshMemories);\r\n  byId(\"preferences-form\").addEventListener(\"submit\", savePreferences);\r\n  byId(\"auth-form\").addEventListener(\"submit\", login); byId(\"register\").addEventListener(\"click\", register);\r\n  byId(\"logout\").addEventListener(\"click\", logout); byId(\"demo\").addEventListener(\"click\", loadDemo);\r\n  byId(\"show-upload\").addEventListener(\"click\", toggleUpload); byId(\"upload-form\").addEventListener(\"submit\", uploadFiles);\r\n  byId(\"confirm-import\").addEventListener(\"click\", confirmImport); byId(\"encoding\").addEventListener(\"change\", changeEncoding);\r\n  byId(\"analysis-form\").addEventListener(\"submit\", submitAnalysis); byId(\"mode\").addEventListener(\"change\", changeMode);\r\n  byId(\"refresh\").addEventListener(\"click\", refreshCurrent); byId(\"resume-form\").addEventListener(\"submit\", resumeAnalysis);\r\n  byId(\"cancel\").addEventListener(\"click\", cancelAnalysis);\r\n  for (const button of document.querySelectorAll(\"[data-question]\")) button.addEventListener(\"click\", fillQuestion);\r\n  if (state.token) { try { await enterWorkspace(); } catch { logout(); } }\r\n  setInterval(pollDatasets, 4000);\r\n}\r\n\r\ninitialize();\r\n"}}]},{"title":"evaluations/oracle.py","anchor":"source-evaluations-oracle-py","blocks":[{"type":"text","text":"本节提供 `evaluations/oracle.py` 的完整原代码，便于不离开教程核对上下文。它不是推荐背诵顺序；核心函数的输入输出、设计推导和逐行注释见主章节。源码SHA256：`9e9af462ccdc1a7508a6d9247316c959c065bc430fd0e8c8a4aea13a39c37731`。\n\n函数定位：`reference_answers`（第6～42行）；`compare_rows`（第45～73行）"},{"type":"code","code":{"language":"python","caption":"evaluations/oracle.py（从原文件第1行开始）","content":"\"\"\"根据原始四表独立计算答案，不复用 Agent 的 SQL 或报告检查逻辑。\"\"\"\nfrom collections import defaultdict\nfrom decimal import Decimal\n\n\ndef reference_answers(tables: dict, valid_status: str = 'delivered') -> dict:\n    \"\"\"用字典关联四表并通过 Decimal 汇总，生成订单、月份、品类、地区和客户指标的基准答案。\"\"\"\n    orders = {row['order_id']: row for row in tables['orders'] if row['status'] == valid_status}\n    customers = {row['customer_id']: row for row in tables['customers']}\n    products = {row['product_id']: row for row in tables['products']}\n    amounts, freight = Decimal(0), Decimal(0)\n    month, category, region = {}, {}, {}\n    for item in tables['order_items']:\n        order = orders.get(item['order_id'])\n        if order is None:\n            continue\n        price = Decimal(str(item['price']))\n        amounts += price\n        freight += Decimal(str(item['freight_value']))\n        keys = (order['purchase_time'][:7], products[item['product_id']]['category_name'], customers[order['customer_id']]['state'])\n        for target, key in zip((month, category, region), keys):\n            entry = target.setdefault(key, {'amount': Decimal(0), 'orders': set()})\n            entry['amount'] += price\n            entry['orders'].add(order['order_id'])\n    valid_customers = defaultdict(set)\n    for order in orders.values():\n        valid_customers[customers[order['customer_id']]['customer_unique_id']].add(order['order_id'])\n    repeated = sum(len(ids) > 1 for ids in valid_customers.values())\n    summary = [{'order_count': len(orders), 'item_amount': amounts, 'freight_amount': freight}]\n    categories = [{'category': key, 'item_amount': value['amount'], 'order_count': len(value['orders']),\n                   'share_percent': value['amount'] / amounts * 100 if amounts else None} for key, value in category.items()]\n    monthly = [{'month': key, 'item_amount': value['amount'], 'order_count': len(value['orders'])} for key, value in month.items()]\n    regions = [{'state': key, 'item_amount': value['amount'], 'order_count': len(value['orders'])} for key, value in region.items()]\n    before, after = month.get('2017-10', {}).get('amount', Decimal(0)), month.get('2017-11', {}).get('amount', Decimal(0))\n    return {'summary': summary, 'monthly': monthly, 'category': categories, 'region': regions,\n            'change': [{'previous_amount': before, 'current_amount': after, 'delta_amount': after - before,\n                        'change_percent': (after - before) / before * 100 if before else None}],\n            'aov': [{'order_count': len(orders), 'item_amount': amounts, 'freight_amount': freight,\n                     'total_amount': amounts + freight, 'aov': amounts / len(orders) if orders else None}],\n            'customer': [{'unique_customers': len(valid_customers), 'repeat_customers': repeated,\n                          'repeat_rate': repeated / len(valid_customers) * 100 if valid_customers else None}],\n            'empty': [{'order_count': 0, 'item_amount': Decimal(0)}]}\n\n\ndef compare_rows(actual: list[dict], expected: list[dict], tolerance: Decimal = Decimal('0.011')) -> dict:\n    \"\"\"先按维度匹配全部行，再检查数值是否位于允许的绝对误差范围内。\"\"\"\n    errors = []\n    if len(actual) != len(expected):\n        errors.append(f'行数不一致：实际 {len(actual)}，标准 {len(expected)}')\n    remaining = list(actual)\n    for target in expected:\n        dimensions = {key: value for key, value in target.items() if isinstance(value, str)}\n        match = next((row for row in remaining if all(str(row.get(key)) == value for key, value in dimensions.items())), None)\n        if match is None:\n            errors.append('缺少维度：' + str(dimensions))\n            continue\n        remaining.remove(match)\n        for key, value in target.items():\n            observed = match.get(key)\n            if value is None:\n                correct = observed is None\n            elif isinstance(value, str):\n                correct = str(observed) == value\n            else:\n                try:\n                    difference = abs(Decimal(str(observed)) - Decimal(str(value)))\n                    # 计数必须为整数且完全相等，金额和百分比则允许规定范围内的两位小数舍入误差。\n                    correct = difference == 0 if isinstance(value, int) else difference \u003c= tolerance\n                except Exception:\n                    correct = False\n            if not correct:\n                errors.append(f'{dimensions} {key}：实际 {observed}，标准 {value}')\n    return {'passed': not errors, 'errors': errors}\n"}}]}]}]};


function highlightForReading(el) {
  if (el.dataset.readingHighlighted || typeof hljs === 'undefined') return;
  const lines = el.querySelectorAll(':scope > .line');
  const requested = (el.className.match(/language-([a-z0-9-]+)/i)||[])[1] || 'python';
  const language = hljs.getLanguage(requested) ? requested : 'plaintext';
  if (lines.length) {
    // 保留原有行号包装；整块highlightElement会删除这些span。
    lines.forEach(line => { line.innerHTML = hljs.highlight(line.textContent, {language, ignoreIllegals:true}).value; });
    el.classList.add('hljs');
  } else { hljs.highlightElement(el); }
  el.dataset.readingHighlighted = 'true';
}

          h += '</div></div>';

function deriveGroupTitle(title) {
  // Try to extract module name from title like "用户模块 — 短信登录..." or "秒杀模块 — ..."
  let m = title.match(/^(.+?模块)\s*[—\-]\s*/);
  return m ? m[1] : '';
}
function getModuleDotClass(title) {
  let t = (title||'').toLowerCase();
  if (t.includes('用户')) return 'toc-module-dot--user';
  if (t.includes('商户')||t.includes('shop')) return 'toc-module-dot--shop';
  if (t.includes('秒杀')||t.includes('seckill')) return 'toc-module-dot--seckill';
  if (t.includes('探店')||t.includes('笔记')||t.includes('blog')) return 'toc-module-dot--blog';
  if (t.includes('关注')||t.includes('follow')) return 'toc-module-dot--follow';
  return 'toc-module-dot--default';
}

function renderContent(chapters) {
  allSections = [];
  let h = '';
  chapters.forEach(ch => {
    ch.sections.forEach(sec => {
      let secHtml = '<section class="section-block" id="'+(sec.anchor||'')+'" data-anchor="'+(sec.anchor||'')+'"><h2 class="section-heading">'+esc(sec.title)+'<button class="section-share-btn" onclick="copyShareLink(\''+(sec.anchor||'')+'\',this)" title="复制链接">🔗</button></h2>';
      sec.blocks.forEach(b => { secHtml += renderBlock(b); });
      secHtml += '</section>';
      allSections.push({ anchor: sec.anchor, title: sec.title, chapterTitle: ch.title, groupTitle: sec.groupTitle || deriveGroupTitle(sec.title), html: secHtml });
      h += '<section class="section-block" id="'+sec.anchor+'" data-anchor="'+sec.anchor+'" data-lazy="true"></section>'; 
    });
  });
  document.getElementById('contentInner').innerHTML = '<div class="section-viewport" id="sectionViewport">'+h+'</div>';
  requestAnimationFrame(() => {
    // Respect URL hash for initial section selection, or resume from last position
    const hash = location.hash.slice(1);
    let initialIdx = 0;
    if (hash) {
      const found = allSections.findIndex(s => s.anchor === hash);
      if (found >= 0) initialIdx = found;
    } else {
      try {
        const saved = parseInt(localStorage.getItem('xishu-learning-last-section') || '0');
        if (saved > 0 && saved < allSections.length) initialIdx = saved;
      } catch(e) {}
    }
    showSection(initialIdx, true);
    // 仅渲染当前章节，避免完整源码附录阻塞首屏。
  });
}

function renderBlock(b) {

    case 'endpoint': return renderEndpointBlock(b.endpoint);
    case 'callchain': return renderCallchainBlock(b.callchain);
    case 'diagram': return renderDiagramBlock(b.diagram);
    case 'table': return renderTableBlock(b.table);
    case 'question': return renderQuestionBlock(b.question);
    case 'list': return renderListBlock(b.list);
    default: return '';
  }
}

function renderCallchainStep(s) {
  const id = 'cs-'+Math.random().toString(36).slice(2,8), hasCode = s.code&&s.code.trim(), hasSql = s.sql&&s.sql.trim(), hasAnnot = s.lineAnnotations&&s.lineAnnotations.length;

  if (hasAnnot) { h += '<div class="callchain-annotations"><div class="callchain-annotations-label">📝 逐行解释</div>'; s.lineAnnotations.forEach(a => { h += '<div class="callchain-annotation-item"><span class="callchain-annotation-line">L'+a.line+'</span><span>'+esc(a.annotation)+'</span></div>'; }); h += '</div>'; }
  h += '</div>';

function renderDiagrams() { if (typeof mermaid!=='undefined') { try { mermaid.run({querySelector:'.mermaid'}).catch(()=>{}); } catch(e) {} } }

function renderTableBlock(t) { if (!t||!t.headers||!t.rows) return ''; let h='<div class="table-wrapper"><table class="content-table"><thead><tr>'; t.headers.forEach(hd=>{h+='<th>'+esc(hd)+'</th>';}); h+='</tr></thead><tbody>'; t.rows.forEach(r=>{h+='<tr>';r.forEach(c=>{h+='<td>'+esc(c)+'</td>';});h+='</tr>';}); return h+'</tbody></table></div>'; }

function renderQuestionBlock(q) { if (!q) return ''; const cc='qcat-'+(q.category||'').replace(/\s+/g,'-').toLowerCase(); return '<div class="question-card" data-question><div class="question-header" onclick="this.parentElement.classList.toggle(\'open\');this.setAttribute(\'aria-expanded\',this.parentElement.classList.contains(\'open\'))" aria-expanded="false"><span class="question-category-badge '+cc+'">'+esc(q.category||'')+'</span><span class="question-text">'+esc(q.question)+'</span><span class="question-chevron">▾</span></div><div class="question-answer"><div class="question-answer-body">'+marked.parse(q.answer||'')+'</div></div></div>'; }

function renderListBlock(l) { if (!l||!l.items) return ''; const cls='list-block--'+(l.style==='icon'?'unordered':l.style); let h='<ul class="list-block '+cls+'">'; l.items.forEach(it=>{ let lc='list-item'; if (it.highlight) lc+=' highlighted'; h+='<li class="'+lc+'">'; if (l.style==='icon'&&l.icon) h+='<span class="list-item-icon">'+getIcon(l.icon)+'</span>'; h+='<span>'+esc(it.content)+'</span></li>'; }); return h+'</ul>'; }
function getIcon(n) { const m={target:'🎯',star:'⭐',check:'✅',lightbulb:'💡',rocket:'🚀',shield:'🛡️',tool:'🔧',book:'📖'}; return m[n]||'•'; }

function highlightAllCode() { document.querySelectorAll('.code-block-body pre code, .text-content pre code').forEach(el=>{ if (typeof hljs!=='undefined') highlightForReading(el); }); }

function toggleEl(id,btn) { const el=document.getElementById(id); if (!el) return; if (el.style.display!=='none'){el.style.display='none';btn.querySelector('span').textContent='▶';btn.setAttribute('aria-expanded','false');} else {el.style.display='block';btn.querySelector('span').textContent='▼';btn.setAttribute('aria-expanded','true');} }
function toggleAllCode() {
  const active = document.querySelector('.section-block.active');
  if (!active) return;
  const bodies = active.querySelectorAll('.callchain-code-body');
  const allOpen = bodies.length > 0 && Array.from(bodies).every(b => b.classList.contains('open'));
  bodies.forEach(b => {
    if (allOpen) { b.classList.remove('open'); }
    else { b.classList.add('open'); b.querySelectorAll('pre code').forEach(el => { if (typeof hljs !== 'undefined') highlightForReading(el); }); }
  });
  active.querySelectorAll('.callchain-code-toggle').forEach(btn => {
    if (allOpen) { btn.classList.remove('open'); btn.querySelector('.callchain-code-toggle-arrow').textContent = '\u25b6'; }
    else { btn.classList.add('open'); btn.querySelector('.callchain-code-toggle-arrow').textContent = '\u25bc'; }
  });
  const btnEl = document.getElementById('btnExpandAll');
  if (btnEl) {
    btnEl.querySelector('.nav-arrow').textContent = allOpen ? '\u229e' : '\u229f';
    btnEl.childNodes[1].textContent = allOpen ? ' 展开代码' : ' 折叠代码';
  }
}

function toggleCallchainCode(btn,bodyId) { const body=document.getElementById(bodyId); if (!body) return; if (body.classList.contains('open')){body.classList.remove('open');btn.classList.remove('open');btn.querySelector('.callchain-code-toggle-arrow').textContent='▶';btn.setAttribute('aria-expanded','false');} else {body.classList.add('open');btn.classList.add('open');btn.querySelector('.callchain-code-toggle-arrow').textContent='▼';btn.setAttribute('aria-expanded','true');body.querySelectorAll('pre code').forEach(el=>{if(typeof hljs!=='undefined')highlightForReading(el);});} }
function handleSearch(query) {
  const resultsEl = document.getElementById('searchResults');
  if (!query || query.trim().length < 2) { resultsEl.classList.remove('open'); return; }
  const q = query.toLowerCase().trim();
  const results = [];
  allSections.forEach((sec, idx) => {
    const titleMatch = sec.title.toLowerCase().includes(q);
    const textContent = sec.html.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').toLowerCase();
    const textIdx = textContent.indexOf(q);
    if (titleMatch || textIdx >= 0) {
      let preview = '';
      if (textIdx >= 0) {
        const start = Math.max(0, textIdx - 25);
        const end = Math.min(textContent.length, textIdx + q.length + 40);
        preview = (start > 0 ? '...' : '') + textContent.substring(start, end) + (end < textContent.length ? '...' : '');
      }
      results.push({ idx, title: sec.title, preview: preview || sec.title, groupTitle: sec.groupTitle });
    }
  });
  if (results.length === 0) {
    resultsEl.innerHTML = '<div class="search-result-empty">未找到匹配结果</div>';
  } else {
    resultsEl.innerHTML = results.slice(0, 15).map(r =>
      '<button class="search-result-item" onclick="navigateToSection(' + r.idx + ');document.getElementById(\'searchResults\').classList.remove(\'open\');document.getElementById(\'searchInput\').value=\'\';">' +
      '<div class="sr-title">' + esc(r.title) + (r.groupTitle ? ' <span style="color:var(--text-tertiary);font-size:0.7rem;">(' + esc(r.groupTitle) + ')</span>' : '') + '</div>' +
      (r.preview !== r.title ? '<div class="sr-preview">' + esc(r.preview) + '</div>' : '') +
      '</button>'
    ).join('');
  }
  resultsEl.classList.add('open');
}

function copyShareLink(anchor, btn) {
  const url = location.href.split('#')[0] + '#' + anchor;
  navigator.clipboard.writeText(url).then(() => {
    btn.classList.add('copied'); btn.textContent = '✓';
    setTimeout(() => { btn.classList.remove('copied'); btn.textContent = '🔗'; }, 1500);
  }).catch(() => {});
}

function copyCode(btn) { const c=btn.getAttribute('data-code'); navigator.clipboard.writeText(c).then(()=>{btn.classList.add('copied');btn.innerHTML='✓ 已复制';setTimeout(()=>{btn.classList.remove('copied');btn.innerHTML='📋 复制';},2000);}).catch(()=>{const ta=document.createElement('textarea');ta.value=c;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);btn.classList.add('copied');btn.innerHTML='✓ 已复制';setTimeout(()=>{btn.classList.remove('copied');btn.innerHTML='📋 复制';},2000);}); }

function showSection(idx, isInitial) {
  if (idx < 0 || idx >= allSections.length) return;
  const viewport = document.getElementById('sectionViewport');
  const allBlocks = document.querySelectorAll('.section-block');
  const oldActive = document.querySelector('.section-block.active');

  if (oldActive && idx !== currentSectionIdx) {
    viewport.classList.add('transitioning');
    setTimeout(() => { doShow(idx, allBlocks, viewport, isInitial); }, 180);
  } else {
    doShow(idx, allBlocks, viewport, isInitial);
  }
}

function doShow(idx, allBlocks, viewport, isInitial) {
  if (allBlocks[idx] && allBlocks[idx].dataset.lazy) {
    const fragment = document.createElement('template');
    fragment.innerHTML = allSections[idx].html;
    allBlocks[idx].replaceWith(fragment.content.firstElementChild);
    allBlocks = document.querySelectorAll('.section-block');
  }
  allBlocks.forEach(b => b.classList.remove('active'));
  if (allBlocks[idx]) allBlocks[idx].classList.add('active');
  document.getElementById('btnPrev').disabled = (idx === 0);
  document.getElementById('btnNext').disabled = (idx === allSections.length - 1);
  document.getElementById('sectionInfo').textContent = (idx + 1) + ' / ' + allSections.length;
  document.getElementById('mainContent').scrollTop = 0;
  currentSectionIdx = idx;

  // Progress tracking: save last position + mark as viewed
  try {
    localStorage.setItem('xishu-learning-last-section', idx);
    let viewed = JSON.parse(localStorage.getItem('xishu-learning-viewed') || '[]');
    const anchor = allSections[idx]?.anchor;
    if (anchor && !viewed.includes(anchor)) { viewed.push(anchor); localStorage.setItem('xishu-learning-viewed', JSON.stringify(viewed)); }
  } catch(e) {}

  const sec = allSections[idx];

  // Update breadcrumb
  if (sec) { let bc = ''; if (sec.groupTitle) bc += esc(sec.groupTitle) + ' › '; document.getElementById('breadcrumb').innerHTML = bc + '<span>' + esc(sec.title) + '</span>'; }

  // Update sidebar
  document.querySelectorAll('.toc-section-link').forEach(l => l.classList.remove('active'));
  if (sec) {
    const link = document.querySelector('.toc-section-link[data-anchor="'+sec.anchor+'"]');
    if (link) { link.classList.add('active'); link.classList.add('viewed'); link.scrollIntoView({ block:'nearest', behavior:'smooth' }); }
  }

  // Update URL hash for back/forward button support
  const newHash = '#' + sec.anchor;
  if (location.hash !== newHash) {
    history.pushState(null, '', newHash);
  }

  // Re-highlight code in newly visible section
  if (allBlocks[idx]) {
    allBlocks[idx].querySelectorAll('pre code').forEach(el => {
      if (typeof hljs !== 'undefined') highlightForReading(el);
    });
    // Render mermaid diagrams in this section
    const mermaidEls = allBlocks[idx].querySelectorAll('.mermaid');
    if (mermaidEls.length > 0) {
      mermaidEls.forEach(el => {
        el.removeAttribute('data-processed');
        el.innerHTML = el.getAttribute('data-original') || el.textContent || '';
        el.offsetHeight;  // force synchronous reflow so mermaid gets real dimensions
      });
      if (typeof mermaid !== 'undefined') {
        try { mermaid.run({ querySelector: '.section-block.active .mermaid' }).catch(()=>{}); } catch(e) {}
      }
    }
  }

  if (viewport) viewport.classList.remove('transitioning');
}

function navigateSection(dir) {
  const newIdx = currentSectionIdx + dir;
  if (newIdx >= 0 && newIdx < allSections.length) showSection(newIdx);
}

function closeReadingMenu() {
  if (document.getElementById('sidebar').classList.contains('open')) toggleMobileSidebar();
}
function navigateToSection(idx) {
  closeReadingMenu();
  if (idx >= 0 && idx < allSections.length) showSection(idx);
}

function navigateToSectionByAnchor(anchor) {
  closeReadingMenu();
  const idx = allSections.findIndex(s => s.anchor === anchor);
  if (idx >= 0) showSection(idx);
}

function setupKeyboardNav() {
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); navigateSection(-1); }
    if (e.key === 'ArrowRight') { e.preventDefault(); navigateSection(1); }
  });
}

function setupHashNavigation() {
  window.addEventListener('hashchange', () => {
    if (suppressHashChange) { suppressHashChange = false; return; }
    const anchor = location.hash.slice(1);
    if (anchor) {
      const idx = allSections.findIndex(s => s.anchor === anchor);
      if (idx >= 0 && idx !== currentSectionIdx) showSection(idx);
    }
  });
}

function setupThemeToggle() { document.getElementById('themeToggle').addEventListener('click',()=>{isDarkMode=!isDarkMode; if(isDarkMode){document.documentElement.setAttribute('data-theme','dark');document.querySelector('.theme-toggle-icon').textContent='◐';} else {document.documentElement.removeAttribute('data-theme');document.querySelector('.theme-toggle-icon').textContent='◑';} localStorage.setItem('xishu-learning-theme',isDarkMode?'dark':'light'); if(typeof mermaid!=='undefined'){mermaid.initialize({theme:isDarkMode?'dark':'default',startOnLoad:false});} setTimeout(renderDiagrams,300); }); }

function esc(s) { return (typeof s==='string'?s:String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function escAttr(s) { return (typeof s==='string'?s:String(s)).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

if (typeof marked!=='undefined') marked.setOptions({breaks:true,gfm:true,headerIds:false,mangle:false});
</script>
