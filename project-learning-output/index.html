、文件 UUID、分块读取和累计大小限制，记录 SHA-256 清单；`preview_dataset` 用同一解析器只读 5 行；`default_mapping` 仅认同名或 Olist 明确别名，最后要求用户确认。上传事务只创建 uploaded 元数据，尚不写四张业务表。\n\n**5. 从约束推导方案（设计意图为推断）**\n\n“先保留原文，再给建议，再让人确认”把业务语义责任显式化；解析规则统一能减少预览与正式导入分歧。UUID 将用户展示名称与存储寻址分开，是根据代码可推断的边界设计，而非某段未记录的作者历史。\n\n**6. 可选方案及适用条件**\n\n可选：固定模板可不提供复杂映射，入口更简单但用户需要先整理文件；成熟 ETL 平台可支持任意列、编码、断点和分布式处理，适合更大规模但成本明显提高。内容嗅探能补充后缀校验，但仍不能替代业务校验。\n\n**7. 收益与代价**\n\n收益是可追溯、较早反馈错误、ID 不丢前导零；代价是用户多一步确认、文件先落盘、后续仍要全量读取。SHA-256 只记录内容指纹，当前没有跨上传哈希查重或签名可信机制。\n\n**8. 保证范围与剩余风险**\n\n`save_uploads` 只捕获 ValueError 做清理，I/O 或 commit 异常可能留下文件；文件系统与 PG 不是共同事务。后缀是第一层筛选而非绝对格式证明；合法列名以 .1 结尾也可能被 read_frame 当疑似重名拒绝。\n\n**9. 面试表达与追问**\n\n回答：“上传阶段只建立可审阅的数据集草稿，确认后才进入全量导入。”追问：为什么不让模型猜？因为统计口径错误可产生看似正确的数字；哈希能去重吗？当前仅记录，未实现去重策略；为什么先预览？让用户在长导入前验证映射，但预览不能代替全量校验。"},{"type":"callchain","callchain":{"endpoint":"POST /api/datasets → save_uploads；GET /api/datasets/{id}/preview → preview_dataset → read_frame","steps":[{"layer":"Service","filePath":"backend/services/datasets.py:25-70","functionName":"save_uploads","explanation":"调用者 upload_dataset 先限制最多 4 个文件，再把认证 user.id、表单 name、UploadFile 列表传入；本函数返回 Dataset，由 serialize_dataset 生成公开响应。它逐块保存文件、建立四表清单并提交 uploaded，不解析所有业务值，也不返回“分析完成”。教学输入四份 CSV 会生成 D 目录和四个 UUID 文件；一份缺失或重复导致 ValueError、删除本次目录并返回 422。排查先看文件名是否符合固定规则、大小累计及四表完整性；数据库或磁盘异常不属于 ValueError 清理范围。","code":"async def save_uploads(session, user_id: str, name: str, files) -> Dataset:\n    \"\"\"在大小限制内保存四个 CSV 或一个 XLSX。文件类型不符、业务表重复或缺失时，返回错误。\"\"\"\n    identifier = new_id()\n    folder = get_settings().storage / 'uploads' / identifier\n    folder.mkdir(parents=True)\n    manifest, total = {}, 0\n    try:\n        for upload in files:\n            extension = Path(upload.filename or '').suffix.lower()\n            if extension not in ('.csv', '.xlsx'):\n                raise ValueError('只接受 CSV 或 XLSX 文件')\n            # 用服务端生成的 UUID 作为实际文件名，原名只用于展示，防止路径穿越和同名文件覆盖。\n            path = folder / f'{new_id()}{extension}'\n            digest = hashlib.sha256()\n            with path.open('wb') as handle:\n                while chunk := await upload.read(1024 * 1024):\n                    total += len(chunk)\n                    if total > get_settings().max_upload_mb * 1024 * 1024:\n                        raise ValueError('上传总大小超过限制')\n                    digest.update(chunk)\n                    handle.write(chunk)\n            if extension == '.xlsx':\n                for sheet in await asyncio.to_thread(workbook_sheets, path):\n                    table = infer_table(sheet)\n                    if table:\n                        if table in manifest:\n                            raise ValueError(f'{table} 被重复提供')\n                        manifest[table] = {'path': str(path), 'name': upload.filename, 'sheet': sheet, 'sha256': digest.hexdigest()}\n            else:\n                table = infer_table(upload.filename or '')\n                if table is None or table in manifest:\n                    raise ValueError('CSV 文件名应为 customers/products/orders/order_items，或官方 Olist 名称')\n                manifest[table] = {'path': str(path), 'name': upload.filename, 'sheet': None, 'sha256': digest.hexdigest()}\n        if set(manifest) != set(FIELDS):\n            raise ValueError('请一次提供客户、商品、订单和商品明细四张表')\n        dataset = Dataset(id=identifier, user_id=user_id, name=name, file_manifest=manifest,\n                          metric_definitions=dict(DEFAULT_METRICS))\n        session.add(dataset)\n        await session.commit()\n        return dataset\n    except ValueError as error:\n        # 仅清理本次上传生成的目录，路径由服务端 UUID 确定，不使用用户提供的删除路径。\n        for file in folder.iterdir():\n            file.unlink()\n        folder.rmdir()\n        raise HTTPException(422, str(error)) from None","language":"python","lineAnnotations":[{"line":1,"annotation":"异步服务接收请求会话、已认证用户 ID、数据集名称和上传文件对象；返回 Dataset，而不是四张业务表。"},{"line":2,"annotation":"说明边界：这里只保存文件及清单，正式解析和业务入库稍后由 Worker 负责。"},{"line":3,"annotation":"先生成数据集 UUID，后续文件目录与数据库记录使用同一标识。"},{"line":4,"annotation":"在 storage/uploads 下拼接服务端 UUID 目录；不用上传者给出的目录片段。"},{"line":5,"annotation":"创建独立目录及必要父目录；此处还在 try 外，创建失败直接向上抛出。"},{"line":6,"annotation":"manifest 记录四张表对应的物理文件，total 统计本次所有文件的累计字节数。"},{"line":7,"annotation":"进入格式、缺表和重复表错误的清理边界；并非所有异常都会由这个 except 捕获。"},{"line":8,"annotation":"逐个消费 UploadFile；文件对象来自 FastAPI multipart 解析。"},{"line":9,"annotation":"只取原始文件名最后一个后缀并转小写；空文件名按空串处理。"},{"line":10,"annotation":"后缀允许集合限制为 CSV、XLSX；这不是对文件内容格式的完整认证。"},{"line":11,"annotation":"使用 ValueError 进入本函数统一 422 和清理分支。"},{"line":12,"annotation":"注释解释 UUID 文件名的安全目的：原始文件名只能保存在展示元数据中。"},{"line":13,"annotation":"每份物理文件再生成独立 UUID，因此两个原名相同的文件也不会互相覆盖。"},{"line":14,"annotation":"创建 SHA-256 增量摘要器；摘要用于记录文件内容指纹，当前函数不据此全局去重。"},{"line":15,"annotation":"二进制写模式打开文件；退出 with 时即使异常也会关闭句柄。"},{"line":16,"annotation":"海象运算符把每次 await 读取的最多 1 MiB 同时赋给 chunk；空字节表示文件结束。"},{"line":17,"annotation":"把当前块大小累加到整个请求总量，而不是只约束单个文件。"},{"line":18,"annotation":"把配置中的 MiB 限制换算为字节比较；已经写过的块会在 ValueError 清理时删除。"},{"line":19,"annotation":"超过上限立即中断，避免继续读取及落盘余下内容。"},{"line":20,"annotation":"按文件块更新内容摘要，避免把全文件一次加载到内存。"},{"line":21,"annotation":"将当前块写入磁盘；同步文件写会占用此时事件循环，只有读取上传对象用了 await。"},{"line":22,"annotation":"XLSX 是一个包含多个工作表的物理文件，需要逐表建立业务映射。"},{"line":23,"annotation":"把同步 Excel 工作表读取放在线程，避免解析期间阻塞异步事件循环。"},{"line":24,"annotation":"根据工作表名识别 customers/products/orders/order_items，未识别的工作表返回 None。"},{"line":25,"annotation":"仅把能识别的业务工作表写入清单，其他工作表被跳过。"},{"line":26,"annotation":"同一业务表只允许出现一次，避免后一个文件悄悄覆盖前一个。"},{"line":27,"annotation":"明确报出哪个业务表重复；不自动拼接两个不同来源。"},{"line":28,"annotation":"清单保存物理路径、原始名、工作表名和整份 XLSX 的哈希，正式导入据此定位。"},{"line":29,"annotation":"CSV 路径不涉及工作表选择，直接按文件名识别业务表。"},{"line":30,"annotation":"允许项目标准文件名和 Olist 官方名称，不能靠列内容任意猜表。"},{"line":31,"annotation":"无法识别或本次已提供过的 CSV 都拒绝，保持一表一来源。"},{"line":32,"annotation":"向用户说明允许的命名形式，触发统一文件清理。"},{"line":33,"annotation":"CSV 清单的 sheet 明确为 None，解析器据后缀走 CSV 分支。"},{"line":34,"annotation":"集合相等检查保证四种业务表恰好齐全，而不是只检查上传文件数量。"},{"line":35,"annotation":"缺少任一表就拒绝整个上传，不创建一个误导性的可分析数据集。"},{"line":36,"annotation":"创建当前用户所属的数据集 ORM 对象，文件清单是 JSONB 元数据。"},{"line":37,"annotation":"复制默认指标字典，避免依赖共享的可变全局字典；默认币种只是标签。"},{"line":38,"annotation":"将对象加入当前 session；add 本身不是持久提交。"},{"line":39,"annotation":"提交后数据库中才有 uploaded 数据集；此事务不涵盖此前文件系统写入。"},{"line":40,"annotation":"把已提交 Dataset 交给上传路由序列化，返回值不是导入成功标志。"},{"line":41,"annotation":"仅拦截 ValueError；数据库异常、I/O 异常、取消等可能留下待清理文件，这是当前边界。"},{"line":42,"annotation":"注释强调清理范围只由本次服务端 UUID 确定，不能删除用户任意指定路径。"},{"line":43,"annotation":"枚举本次独立目录中的文件；不会遍历整个 uploads。"},{"line":44,"annotation":"删除这次已落盘的一个文件；属于本函数自身产生的补偿清理。"},{"line":45,"annotation":"文件删除后移除已空的本次目录。"},{"line":46,"annotation":"将校验失败转换为 HTTP 422，并隐藏内部异常链以避免冗长错误展示。"}],"keyPoint":"文件上传成功是一个可追溯草稿，不是四表已就绪。"},{"layer":"Parser","filePath":"backend/ingestion/parsers.py:8-20","functionName":"read_frame","explanation":"调用者是 preview_dataset 和 import_dataset，前者传 limit=5，后者不传上限；返回 DataFrame，后续不是直接执行 SQL，而是交给映射和规范化。函数按字符串读取 ID 和金额原文，Excel 先做 ZIP 解压大小检查，列名去空格后拒绝可疑重名。输入含 customer_id=0001 时仍返回字符串 0001；传错编码会产生 UnicodeError，工作表不存在或 Excel 无效应检查用户确认的 sheet 和原文件。它是同步库封装，异步调用者使用 asyncio.to_thread 才避免堵塞事件循环。","code":"def read_frame(path: Path, sheet: str | None = None, encoding: str = 'utf-8-sig', limit: int | None = None):\n    \"\"\"读取表格数据，限制 XLSX 解压后的大小，并拒绝重复列名。\"\"\"\n    if path.suffix == '.xlsx':\n        with zipfile.ZipFile(path) as archive:\n            if sum(item.file_size for item in archive.infolist()) > get_settings().max_upload_mb * 1024 * 1024 * 10:\n                raise ValueError('Excel 解压后体积过大')\n        frame = pd.read_excel(path, sheet_name=sheet or 0, dtype=str, keep_default_na=False, nrows=limit)\n    else:\n        frame = pd.read_csv(path, dtype=str, keep_default_na=False, encoding=encoding, nrows=limit)\n    frame.columns = [str(column).strip() for column in frame.columns]\n    if frame.columns.duplicated().any() or any('.1' == column[-2:] for column in frame.columns):\n        raise ValueError('表头可能存在重复字段，请修正后上传')\n    return frame","language":"python","lineAnnotations":[{"line":1,"annotation":"同步读取器供预览与正式导入共用；limit=None 读全量，预览传 5。"},{"line":2,"annotation":"明确输入格式检查和重复列检查职责，不负责字段业务含义。"},{"line":3,"annotation":"按物理路径后缀选择 Excel 解析，不相信浏览器声明的 MIME 类型。"},{"line":4,"annotation":"XLSX 是 ZIP 包，先读取压缩目录信息。"},{"line":5,"annotation":"累加各成员声明的解压字节数，超过上传上限十倍就拒绝，降低压缩炸弹风险。"},{"line":6,"annotation":"抛出可展示的 ValueError；这层限制不能证明文件完全无恶意内容。"},{"line":7,"annotation":"dtype=str 保留 001 等标识；keep_default_na=False 不把 NA 识别成缺失；sheet 为假值时取第一个表。"},{"line":8,"annotation":"非 XLSX 走 CSV 路径；上游已限制后缀，因此正常来源只能是 CSV。"},{"line":9,"annotation":"按用户选定编码读 CSV，并沿用字符串与空值策略；nrows 控制预览行数。"},{"line":10,"annotation":"列名统一转文本并去两侧空格，避免表头尾部空格导致映射失败。"},{"line":11,"annotation":"同时检查真实重复列和 Pandas 常见的 .1 自动重名标记；合法名字恰好以 .1 结尾也会误报。"},{"line":12,"annotation":"不静默选择同名列之一，让用户修正源表，避免指标读取错误列。"},{"line":13,"annotation":"返回 DataFrame 给预览器或 normalize_table；尚未写任何业务表。"}],"keyPoint":"保留原始字符串含义，再按固定字段转换类型。"}]}},{"type":"text","text":"**`preview_dataset` 的辅助调用（普通代码概述）：**遍历 `dataset.file_manifest`，把每项 path/sheet/encoding/limit=5 交给 `read_frame`，返回 columns、rows、mapping、fields。`infer_table` 仅接受 customers 等标准名和 olist_customers_dataset 等别名；`default_mapping` 返回“目标字段 → 已存在源列”。预览路由先 `owned_dataset`，再捕获 ValueError/UnicodeError 变成 422，不返回内部绝对路径。\n\n**关键语法：**`while chunk := await upload.read(...)` 先完成异步读，再赋给 chunk，再判断非空；它不是“没有返回值所以拿不到数据”。相反 `append_message(...)` 这种副作用函数可以正常返回 None，await 只表示等待其修改操作完成。`asyncio.to_thread(func,...)` 让同步库在线程执行；它不会把 Pandas 自动变成多进程高吞吐流水线，也不会保证取消 await 时同步线程立即停止。"}]},{"title":"值转换和关联校验：错误数据为什么必须明确拒绝","anchor":"data-tasks-ingestion-validation","groupTitle":"数据、任务与后台执行","blocks":[{"type":"text","text":"**1. 业务需求**\n\n用户要求报告中的金额和订单计数可复核，因此输入不能被系统静默改数、丢行或关联到另一份数据。\n\n**2. 用于理解的最直接方案（不代表项目历史）**\n\n对照方案：Pandas 自动推断类型，读取失败行跳过，金额先 float 再四舍五入，重复 ID 取最后一行。\n\n**3. 它在哪些场景失效**\n\n0001 变 1 会破坏关联；12.301 被改为 12.30 造成金额差；订单同一明细重复可能翻倍；订单引用不存在客户则 JOIN 时默默丢单。没有明确错误位置，用户也无法修文件。\n\n**4. 源码确认的当前实现**\n\n`normalize_table` 先校验映射，再逐行 convert_value，附服务器 dataset_id；必填、类型、重复主键和空表都拒绝；`validate_relations` 对四表 ID 集合做交叉检查。金额直接 Decimal，日期必须无时区原本地时间；第 2 行开始的错误坐标对应源文件。\n\n**5. 从约束推导方案（设计意图为推断）**\n\n从“不能静默改变统计样本”推导出严格失败；从“需要定位源数据”推导出表名/行号/字段错误；从“同 ID 不应跨集关联”推导出服务端隔离键与数据库复合外键。先检查字段映射再读行，可让结构性错误更早出现。\n\n**6. 可选方案及适用条件**\n\n可选：隔离区保存坏行、允许用户确认排除，适用于允许部分数据分析的 ETL，但报告必须标注排除比例；数据库 staging 表再用 SQL 校验适合超大导入，可以减少 Python 内存，但需要额外状态和清理。\n\n**7. 收益与代价**\n\n收益是错误透明、金额不经 float、写库前发现大部分问题；代价是任何一条错误阻止整体导入、全量字典与集合占内存。当前日期策略简单可解释，但不支持直接导入有时区的跨地区时间。\n\n**8. 保证范围与剩余风险**\n\n验证“关系存在”不等于源数据事实真实；Decimal 输入精确不保证模型后续任意 Python 都精确。state 文本应用校验上限通常 100，而 Customer.state 数据库列为 50，51—100 字符可能晚到数据库才失败；正序号也没有提前检查 PostgreSQL Integer 最大值。\n\n**9. 面试表达与追问**\n\n回答：“我的导入宁可给出具体错误位置，也不隐式丢样本；四表关系在内存和数据库双重检查。”追问：12.300 能过吗？数值等于量化后的 12.30，可通过；一订单多明细为何不是重复？键是订单+序号；校验全过能证明业务真实吗？不能，只能证明当前定义的结构和约束成立。"},{"type":"callchain","callchain":{"endpoint":"import_dataset → normalize_table → convert_value；四表完成后 validate_relations","steps":[{"layer":"Validation","filePath":"backend/ingestion/validation.py:33-61","functionName":"normalize_table","explanation":"输入由 import_dataset 提供：完整 DataFrame、固定表名、用户确认映射及服务端 dataset_id；返回 list[dict]，写入 tables[table] 后供四表关联检查和批写。以 price 原列商品价映射到目标 price 为例，合法 12.30 变成 Decimal，未映射可选品类可为 None；一行失败会抛含 orders 第 N 行 字段名的错误，整个数据集不进入 ready。它为每行补隔离键并维护 keys 集合，不会自动丢弃重复行；排查重点是映射方向、源列空值和复合主键。","code":"def normalize_table(frame, table: str, mapping: dict[str, str], dataset_id: str) -> list[dict]:\n    \"\"\"按字段映射转换每行数据，并检查必填值和重复主键。报错时指出表名、行号和字段名。\"\"\"\n    for field in REQUIRED[table]:\n        if mapping.get(field) not in frame.columns:\n            raise ValueError(f'{table} 缺少必填字段映射：{field}')\n    if set(mapping) - set(FIELDS[table]) or any(source not in frame.columns for source in mapping.values()):\n        raise ValueError(f'{table} 字段映射包含未知字段或不存在的源列')\n    rows, keys = [], set()\n    # 第 1 行是表头，因此数据行号从 2 开始，方便用户直接在 CSV 或 Excel 中定位错误。\n    for index, source in enumerate(frame.to_dict('records'), 2):\n        # dataset_id 由服务端填写，不使用文件中的同名列，防止上传数据被写入其他数据集。\n        record = {'dataset_id': dataset_id}\n        for field in FIELDS[table]:\n            try:\n                record[field] = convert_value(field, source.get(mapping.get(field), ''))\n                if field in REQUIRED[table] and record[field] is None:\n                    raise ValueError('必填值为空')\n            except (ValueError, InvalidOperation, OverflowError) as error:\n                raise ValueError(f'{table} 第 {index} 行 {field}：{error}') from None\n        identifier = table.removesuffix('s') + '_id'\n        # 一个订单可以有多条明细，因此明细按订单 ID 和明细序号共同判断重复，不能只看订单 ID。\n        key = ((record['order_id'], record['order_item_id']) if table == 'order_items' else record[identifier])\n        if key in keys:\n            raise ValueError(f'{table} 第 {index} 行主键重复')\n        keys.add(key)\n        rows.append(record)\n    if not rows:\n        raise ValueError(f'{table} 没有数据行')\n    return rows","language":"python","lineAnnotations":[{"line":1,"annotation":"把单个 DataFrame 转成数据库可批量插入的字典列表，不进行提交。"},{"line":2,"annotation":"说明字段映射、必填和重复检查职责；错误应能回到原文件定位。"},{"line":3,"annotation":"先遍历目标表必填字段，防止读完全部行才发现根本没有必需列。"},{"line":4,"annotation":"mapping 的键是项目字段，值是源列名；必须能在 DataFrame 表头找到。"},{"line":5,"annotation":"缺映射立即拒绝，提示目标字段而不是猜测相近列名。"},{"line":6,"annotation":"集合差拒绝未知目标字段；any 拒绝不存在的源列，二者都防止映射悄悄失效。"},{"line":7,"annotation":"向上抛 ValueError，由 Worker 保存 failed 和具体原因。"},{"line":8,"annotation":"rows 收集规范记录；keys 用集合在内存内快速发现当前文件重复主键。"},{"line":9,"annotation":"注释规定用户可见行号含表头，因此第一条数据从第 2 行开始。"},{"line":10,"annotation":"to_dict('records') 得到每行字典；enumerate(...,2) 为定位错误保留表格行号。"},{"line":11,"annotation":"注释强调 dataset_id 不从上传文件读取，避免跨数据集写入。"},{"line":12,"annotation":"用服务端传入的 dataset_id 初始化该行；后续每张业务表都带同一隔离键。"},{"line":13,"annotation":"只遍历 FIELDS 白名单，不把上传文件的任意额外列写数据库。"},{"line":14,"annotation":"把单个单元格转换包进异常上下文，以补充具体字段位置。"},{"line":15,"annotation":"用映射找到原始单元格，未映射可选列默认空串；convert_value 负责类型。"},{"line":16,"annotation":"同一个 None 对必填字段是错误，对可选字段合法，所以检查必须在转换后。"},{"line":17,"annotation":"显式拒绝空必填值，不依赖后续数据库报通用 NOT NULL 错误。"},{"line":18,"annotation":"捕获转换、Decimal、溢出错误；不是无差别吞掉所有编程错误。"},{"line":19,"annotation":"错误加入表名、行号、目标字段，并屏蔽异常链，便于用户修文件。"},{"line":20,"annotation":"例如 orders 去尾 s 得 order，再拼 order_id；order_items 后面有专门处理。"},{"line":21,"annotation":"注释区分订单一行与订单明细多行，避免把合法多商品订单当重复。"},{"line":22,"annotation":"明细用 (order_id,order_item_id) 元组，其他表用各自业务 ID 作为本次集合键。"},{"line":23,"annotation":"同一张文件第二次出现该键就拒绝，而不是覆盖第一行。"},{"line":24,"annotation":"报告发生重复的原始行号。"},{"line":25,"annotation":"成功检查后把业务键加入集合，为后续行去重检查提供依据。"},{"line":26,"annotation":"只有完整校验通过的行才加入结果列表。"},{"line":27,"annotation":"空文件没有可分析内容，因此不能成为 ready 数据集的一部分。"},{"line":28,"annotation":"用目标表名提示哪张表为空。"},{"line":29,"annotation":"返回规范记录，交给 validate_relations 后才允许 insert_tables。"}],"keyPoint":"主键粒度、源行坐标与服务端 dataset_id 必须在规范化时确定。"},{"layer":"Validation","filePath":"backend/ingestion/validation.py:7-30","functionName":"convert_value","explanation":"调用者 normalize_table 逐目标字段调用，field 来自固定 FIELDS，value 来自映射后原始单元格；返回 None、int、Decimal、datetime 或文本，由规范记录接收。教学例 price=\"12.30\" 返回 Decimal(\"12.30\")，price=\"12.301\" 报错，customer_id=\"0001\" 保留字符串；有 Z 时区的时间会被识别后拒绝，不能声称已转换 UTC。函数不单独判必填，空值交给调用者按 REQUIRED 判定，这样可选配送日期仍可缺失；排查 InvalidOperation、原始时间格式、长度上限。","code":"def convert_value(field: str, value: str):\n    \"\"\"按目标字段转换输入值。金额必须非负、有限，并且小数精度不超过两位。\"\"\"\n    value = str(value).strip()\n    if not value:\n        return None\n    if field == 'order_item_id':\n        number = int(value)\n        if number \u003c= 0:\n            raise ValueError('明细序号必须为正整数')\n        return number\n    if field in ('price', 'freight_value'):\n        # 金额从原始文本直接转为 Decimal，避免先转 float 产生误差。NaN、无穷大和精度不符的值都会被拒绝。\n        amount = Decimal(value)\n        if not amount.is_finite() or amount \u003c 0 or amount > Decimal('9999999999999999.99') or amount != amount.quantize(Decimal('0.01')):\n            raise ValueError('金额必须是非负、有限的两位小数')\n        return amount\n    if field.endswith('_time'):\n        parsed = datetime.fromisoformat(value.replace('Z', '+00:00'))\n        if parsed.tzinfo is not None:\n            raise ValueError('首版时间模板要求无时区的原始本地时间')\n        return parsed\n    if len(value) > (120 if field == 'category_name' else 100):\n        raise ValueError('字段长度超出模板限制')\n    return value","language":"python","lineAnnotations":[{"line":1,"annotation":"依据项目目标字段转换一个单元格；field 是服务端固定字段，value 来自上传原文。"},{"line":2,"annotation":"说明金额的有限、非负和两位有效小数约束；不做自动四舍五入。"},{"line":3,"annotation":"统一成去空白字符串；此路径避免先转 float 的精度损失。"},{"line":4,"annotation":"空串进入缺失值分支，不在这里直接判必填。"},{"line":5,"annotation":"返回 None；normalize_table 根据该字段是否必填决定拒绝还是接受。"},{"line":6,"annotation":"只有明细序号使用整数规则，订单/客户标识仍保留字符串前导零。"},{"line":7,"annotation":"int 解析非整数字符串时抛 ValueError，外层补充行号和字段名。"},{"line":8,"annotation":"序号必须严格大于零，零与负数不能作为订单内明细编号。"},{"line":9,"annotation":"明确业务错误，不默默改成 1。"},{"line":10,"annotation":"返回 Python 整数供数据库 Integer 列写入。"},{"line":11,"annotation":"商品金额和运费共用 Decimal 校验，不把其他文本字段误当金额。"},{"line":12,"annotation":"注释指出从原始文本直接构造 Decimal，且异常数字必须拒绝。"},{"line":13,"annotation":"Decimal 保留十进制数值；非法字符串可能触发 InvalidOperation，由上层统一定位。"},{"line":14,"annotation":"短路依次检查有限性、非负、Numeric(18,2) 上限和量化前后数值是否相等；12.300 数值等于 12.30 可通过，12.301 不能通过。"},{"line":15,"annotation":"失败时不给隐式修约机会，防止导入统计与源文件不一致。"},{"line":16,"annotation":"返回 Decimal 给规范化记录，后续金额以数据库 Numeric 存储。"},{"line":17,"annotation":"目标字段以 _time 结尾才应用时间规则。"},{"line":18,"annotation":"把 Z 规范成 +00:00 后交给 ISO 时间解析；识别到时区后下一步仍拒绝。"},{"line":19,"annotation":"检查 tzinfo，确保首版数据按无时区原始本地时间保存。"},{"line":20,"annotation":"有时区时直接拒绝，避免未定义时区转换导致月份跨界。"},{"line":21,"annotation":"返回 datetime；此时它必须是无时区对象。"},{"line":22,"annotation":"品类名最多 120 字符，其余普通文本最多 100，提前符合模型列长度。"},{"line":23,"annotation":"报长度错误而不截断，避免两个标识被截成相同值。"},{"line":24,"annotation":"返回规范文本，标识前导零得以保留。"}],"keyPoint":"数值转换和必填约束分开，才能区分可空与错误。"},{"layer":"Validation","filePath":"backend/ingestion/validation.py:64-74","functionName":"validate_relations","explanation":"输入是全部四表规范记录，它只通过正常返回 None 表示未发现关联错误；import_dataset 只有此调用成功后才开插入事务。举例订单 o1 指客户 c2，但 customers 只有 c1，会立即抛订单客户不存在；明细指不存在 p2 也失败，没有业务行写入。集合检查使查找不必对每行重复扫描整表，但它占用额外内存；数据库复合外键还会再检查，避免绕过导入函数的写入破坏关联。","code":"def validate_relations(tables: dict[str, list[dict]]) -> None:\n    \"\"\"检查订单引用的客户，以及明细引用的订单和商品，是否存在于本次导入的数据中。\"\"\"\n    customers = {row['customer_id'] for row in tables['customers']}\n    products = {row['product_id'] for row in tables['products']}\n    orders = {row['order_id'] for row in tables['orders']}\n    for row in tables['orders']:\n        if row['customer_id'] not in customers:\n            raise ValueError(f\"订单 {row['order_id']} 的客户不存在\")\n    for row in tables['order_items']:\n        if row['order_id'] not in orders or row['product_id'] not in products:\n            raise ValueError(f\"商品项 {row['order_id']}/{row['order_item_id']} 的关联不存在\")","language":"python","lineAnnotations":[{"line":1,"annotation":"在四张表都完成单表规范化后校验本次导入的引用关系；正常结束隐式返回 None。"},{"line":2,"annotation":"说明必须引用本次数据，而不是依赖数据库里其他用户已有的同名 ID。"},{"line":3,"annotation":"集合保存当前客户 ID，后续 membership 平均为 O(1)。"},{"line":4,"annotation":"集合保存当前商品 ID，使明细检查不必每次全表扫描。"},{"line":5,"annotation":"集合保存当前订单 ID，阻止孤立明细入库。"},{"line":6,"annotation":"逐条检查订单的客户引用。"},{"line":7,"annotation":"客户不在本次客户集合意味着四表不自洽。"},{"line":8,"annotation":"抛出含订单 ID 的错误，导入事务尚未开始，数据库不会留下部分业务行。"},{"line":9,"annotation":"再逐条检查商品明细的两个引用。"},{"line":10,"annotation":"明细必须同时引用本次存在的订单和商品；任一不满足都会失败。"},{"line":11,"annotation":"报订单 ID/明细序号组合，便于在 order_items 源文件定位。"}],"keyPoint":"无返回对象不代表没工作：校验通过继续，失败以异常阻止写入。"}]}}]},{"title":"确认后入队：为什么先提交方案，再让 Worker 读","anchor":"data-tasks-ingestion-confirm","groupTitle":"数据、任务与后台执行","blocks":[{"type":"text","text":"**1. 业务需求**\n\n用户确认列映射、有效状态和币种后只应启动一轮导入；重复点击不能产生两个相互覆盖的导入方案。\n\n**2. 用于理解的最直接方案（不代表项目历史）**\n\n对照方案：先给队列发消息，再更新数据库 mapping；或者不加锁，先读 status 再直接改 importing。\n\n**3. 它在哪些场景失效**\n\nWorker 可能比 commit 更快，拿到旧映射甚至查不到数据集；两请求同时读到 uploaded 都通过检查，后一个可能在首个导入中途改口径。\n\n**4. 源码确认的当前实现**\n\nconfirm_import 先检查归属，再 refresh(with_for_update=True)，只允许 uploaded/failed，保存映射/编码/币种/有效状态并改 importing，commit 后才 dispatch。ImportRequest 限定 encoding 为 utf-8-sig 或 gb18030，currency 为三位大写字母；具体 sheet 存在性最终由解析器验证。\n\n**5. 从约束推导方案（设计意图为推断）**\n\n行锁串行化“状态判断+方案写入”；先提交保证消息消费者读到已确认条件；把长解析放队列使 HTTP 快速返回。导入本体再用协作锁（advisory lock），这两把锁保护的是“确认方案”与“长执行”两个不同阶段。\n\n**6. 可选方案及适用条件**\n\n可选：事务 outbox 把待发送记录与 importing 一起写库，由专门投递器可靠转发；或全同步导入，适合极小文件但请求长、断线体验差。当前扫描补偿更简单，但恢复时延受 Beat 可用性影响。\n\n**7. 收益与代价**\n\n收益是重复点击得到明确 409、消费者不读未提交方案；代价是前端要轮询状态、监控队列。PG 与 Redis 仍有提交后投递前崩溃窗口，使用 Beat 尝试补发，不是分布式原子提交。\n\n**8. 保证范围与剩余风险**\n\n返回 importing+dispatched=True 只说明投递未报错，不能宣称四表已成功；False 时保留 importing，依赖后续恢复任务。ready 禁止原地改映射，删除接口又拒绝已被任意分析任务引用的数据集。\n\n**9. 面试表达与追问**\n\n回答：“短行锁防并发修改导入方案，长协作锁（advisory lock）防重复执行，二者职责不同。”追问：提交后发送失败？保留 importing 后扫描补发；币种三字母能验证真实币种吗？只能验证格式，非汇率或真实性；能原地换数据吗？当前 ready 不允许。"},{"type":"callchain","callchain":{"endpoint":"POST /api/datasets/{dataset_id}/import → owned_dataset → 行锁确认 → commit → dispatch","steps":[{"layer":"API","filePath":"backend/api/routes/datasets.py:68-85","functionName":"confirm_import","explanation":"浏览器确认预览后提交 ImportRequest；数据集 ID 来自 URL，user.id 来自 JWT，session 是请求级依赖。函数在短行锁事务内保存 mapping、encoding、sheets、currency 和 valid_status，返回 status/dispatched 给前端，后续由 Worker 读记录执行；D 原 status=uploaded 成功后为 importing。重复确认或 ready 数据得到 409，工作表覆盖错误得到 422；应查数据集状态而不是看到 dispatched 就认为导入已完成。","code":"@router.post('/{dataset_id}/import')\nasync def confirm_import(dataset_id: str, payload: ImportRequest, user=Depends(current_user), session=Depends(get_session)):\n    \"\"\"锁住尚未就绪的数据集，保存用户确认的字段映射和统计口径，再发送导入任务。\"\"\"\n    dataset = await owned_dataset(session, dataset_id, user.id)\n    await session.refresh(dataset, with_for_update=True)\n    if dataset.status not in ('uploaded', 'failed'):\n        raise HTTPException(409, '该数据集已导入或正在导入')\n    manifest = dict(dataset.file_manifest)\n    for table, sheet in payload.sheets.items():\n        if table not in manifest or Path(manifest[table]['path']).suffix != '.xlsx':\n            raise HTTPException(422, '工作表选择无效')\n        manifest[table] = {**manifest[table], 'sheet': sheet}\n    dataset.file_manifest = manifest\n    dataset.field_mapping = {'columns': payload.mapping, 'encoding': payload.encoding}\n    dataset.metric_definitions = {**DEFAULT_METRICS, 'currency': payload.currency, 'valid_status': payload.valid_status}\n    dataset.status, dataset.error_info = 'importing', None\n    await session.commit()\n    return {'status': dataset.status, 'dispatched': dispatch('analytics.import', dataset.id)}","language":"python","lineAnnotations":[{"line":1,"annotation":"POST 路由对应用户点击确认导入；此接口保存方案并排队，不同步处理全部行。"},{"line":2,"annotation":"路径参数定位数据集；Pydantic 解析字段映射与币种，Depends 注入已认证用户及请求 session。"},{"line":3,"annotation":"声明检查、保存和派发顺序；业务表真正写入在 Worker。"},{"line":4,"annotation":"首先按 user.id 检查归属，不允许只知道 UUID 就改别人的数据。"},{"line":5,"annotation":"重新读取并锁住同一数据集行；第二个并发确认要等第一个事务结束再看状态。"},{"line":6,"annotation":"只允许首次 uploaded 或失败重试；ready 数据不能原地替换，importing 不能重复确认。"},{"line":7,"annotation":"HTTP 409 表示当前状态冲突，而不是请求 JSON 格式错。"},{"line":8,"annotation":"复制 JSONB 清单再修改，最终重新赋值使 ORM 能跟踪变更。"},{"line":9,"annotation":"遍历用户明确选择的工作表覆盖，不把模型建议自动当成确认。"},{"line":10,"annotation":"只有存在于清单的 XLSX 表能修改 sheet；CSV 不接受工作表选择。"},{"line":11,"annotation":"无效表名或文件类型返回 422；具体 sheet 是否存在还会在读文件阶段验证。"},{"line":12,"annotation":"保留原路径与哈希，只替换用户确认的 sheet 名称。"},{"line":13,"annotation":"把新字典赋回 JSONB；仅原地修改嵌套值可能不会触发 ORM 更新。"},{"line":14,"annotation":"保存目标字段→原列的映射及编码，Worker 按这份方案重读全量数据。"},{"line":15,"annotation":"合并默认口径、三字母币种和有效状态；currency 只标注金额单位，不执行换汇。"},{"line":16,"annotation":"同时切换 importing 并清除旧失败原因，页面能显示新一轮处理中。"},{"line":17,"annotation":"先提交，保证 Worker 收到消息后查得到刚确认的映射和口径。"},{"line":18,"annotation":"提交后才给 Redis 发导入 ID；返回 dispatched 是投递是否成功，不是业务数据已 ready。"}],"keyPoint":"先锁住确认方案，再提交，再投递，不能颠倒。"}]}}]},{"title":"四表入库：分批执行为什么仍要一次提交","anchor":"data-tasks-ingestion-transaction","groupTitle":"数据、任务与后台执行","blocks":[{"type":"text","text":"**1. 业务需求**\n\n用户只应看见四表全部可用的数据集，不能订单已导入但商品、明细还没写完就开始分析。\n\n**2. 用于理解的最直接方案（不代表项目历史）**\n\n对照方案：每插入 500 行就 commit，把 Dataset 早早设为 ready 以显示进度。\n\n**3. 它在哪些场景失效**\n\n最后一批金额溢出时前几批已无法回滚；JOIN 得到局部结果仍可能生成正常图表。恢复时重插又撞主键，用户很难判断数据是不是完整。\n\n**4. 源码确认的当前实现**\n\nimport_dataset 先获取 import:D 协作锁（advisory lock），再解析、规范化、关联检查；Session.begin 包含 insert_tables 的全部批次、ANALYZE、status=ready、error 清空和行数汇总。任何写入异常回滚全部四表，另外开事务保存 failed；最终同连接解锁。\n\n**5. 从约束推导方案（设计意图为推断）**\n\n业务完整单位是“本次四表快照”，因此事务边界必须覆盖这个单位；SQL 分批只是防参数过多，不能改变业务提交粒度。先校验后写缩短持写事务时间；长解析用连接协作锁（advisory lock）避免重复 Worker。\n\n**6. 可选方案及适用条件**\n\n可选：staging 表+原子版本切换支持更大规模、导入进度和旧版本在线查询；PostgreSQL COPY 可提高导入吞吐，但需要相同错误定位/回滚语义。逐表 commit 只适合能明确容忍部分就绪且分析层严密隔离的产品。\n\n**7. 收益与代价**\n\n收益是 ready 与真实完整数据一致，失败易重试；代价是大事务 WAL、锁和内存压力，ANALYZE 对共享业务表也有开销。当前读取全表到 Python，没有“百万行无压力”的证据。\n\n**8. 保证范围与剩余风险**\n\n事务只覆盖 PG 业务行和状态，不覆盖上传文件、队列及 checkpoint。ready 重投会跳过；failed 不被执行器排除，人工投递可重试，但应先修正源文件/映射。数据库物理故障仍可能使记录失败原因的事务失败，不能承诺每次错误都一定可见。\n\n**9. 面试表达与追问**\n\n回答：“500 行一批是 SQL 执行批次，四张表最终只提交一次。”追问：解析失败是否先写入？没有，全部解析后才开始写事务；为何 ANALYZE？帮助优化器掌握新数据分布，不是业务求和；两份重复消息？拿不到 import 锁直接退出，已 ready 再到也跳过。"},{"type":"callchain","callchain":{"endpoint":"analytics.import → import_job → import_dataset → insert_tables → PostgreSQL COMMIT","steps":[{"layer":"Service","filePath":"backend/services/datasets.py:83-122","functionName":"import_dataset","explanation":"Celery import_job 使用 asyncio.run 调用此异步服务，输入只有已存在 D；清单与字段方案从数据库读，返回 None。它保留协作锁（advisory lock）连接跨越同步解析与多次短会话，先校验完整四表，再由一个写事务把全部业务行和 ready 一起提交；错误另事务标 failed 后重抛给 Celery。教学案例若第二条明细重复，normalize_table 失败，四表没有部分数据；若最后数据库约束失败，之前所有 insert 也回滚。长函数先按 1—13 行理解互斥与取配置，14—20 行理解内存校验，22—29 行理解唯一写事务，30—40 行理解失败与解锁。","code":"async def import_dataset(dataset_id: str) -> None:\n    \"\"\"锁住本次数据集并校验全部内容。四表数据和导入成功状态在同一事务中保存。\"\"\"\n    async with engine.connect() as lock_connection:\n        locked = await lock_connection.scalar(text('SELECT pg_try_advisory_lock(hashtextextended(:key, 0))'), {'key': 'import:' + dataset_id})\n        await lock_connection.commit()\n        if not locked:\n            return\n        try:\n            async with Session() as session:\n                dataset = await session.get(Dataset, dataset_id)\n                if dataset is None or dataset.status == 'ready':\n                    return\n                manifest, mapping = dataset.file_manifest, dataset.field_mapping\n            tables = {}\n            for table, entry in manifest.items():\n                frame = await asyncio.to_thread(read_frame, Path(entry['path']), entry.get('sheet'), mapping.get('encoding', 'utf-8-sig'))\n                columns = mapping.get('columns', {}).get(table) or default_mapping(list(frame.columns), table)\n                tables[table] = await asyncio.to_thread(normalize_table, frame, table, columns, dataset_id)\n            # 先检查字段类型、主键和表间关联，再写数据库。文件上传完成并不表示已经可以分析。\n            validate_relations(tables)\n            # 四表所有批次和 ready 状态一起提交。任何插入失败都会回滚，避免留下只导入一部分的数据。\n            async with Session.begin() as session:\n                await insert_tables(session, tables)\n                # 导入后立即执行 ANALYZE 更新数据分布统计，帮助 PostgreSQL 为首条分析查询选择合适的执行计划。\n                await session.execute(text('ANALYZE public.customers, public.products, public.orders, public.order_items'))\n                dataset = await session.get(Dataset, dataset_id)\n                dataset.status = 'ready'\n                dataset.error_info = None\n                dataset.import_summary = {table: len(rows) for table, rows in tables.items()}\n        except Exception as error:\n            # 导入失败后，另开事务保存失败状态和原因，让页面显示错误，用户也能据此修正并重试。\n            async with Session.begin() as session:\n                dataset = await session.get(Dataset, dataset_id)\n                if dataset:\n                    dataset.status = 'failed'\n                    dataset.error_info = str(error)[:1000] if isinstance(error, ValueError) else '导入失败，请查看 Worker 日志并重试'\n            raise\n        finally:\n            await lock_connection.execute(text('SELECT pg_advisory_unlock(hashtextextended(:key, 0))'), {'key': 'import:' + dataset_id})\n            await lock_connection.commit()","language":"python","lineAnnotations":[{"line":1,"annotation":"Celery import_job 传入数据库中的 dataset_id；整个异步导入正常结束返回 None。"},{"line":2,"annotation":"说明四表与 ready 同事务，但文件系统写入不在这次数据库事务内。"},{"line":3,"annotation":"单独保留一条连接专门持有 session-level advisory lock，而不是用短事务行锁包住全程解析。"},{"line":4,"annotation":"按 import:数据集ID 生成协作锁（advisory lock）键，try 表示不等待：同一导入正在执行时重复消息直接退出。"},{"line":5,"annotation":"结束取锁 SQL 的事务；这里 commit 不会释放连接级协作锁（advisory lock）。"},{"line":6,"annotation":"检查是否真正取得锁，防止两个 Worker 同时解析写入。"},{"line":7,"annotation":"无锁退出，当前真正执行者负责完成导入。"},{"line":8,"annotation":"进入最终解锁保护区；中间任何返回或异常都应走 finally。"},{"line":9,"annotation":"短会话只读取清单和映射，不为整个文件解析保持数据库事务。"},{"line":10,"annotation":"按主键加载 Dataset；任务消息不携带文件数据，数据库才是状态来源。"},{"line":11,"annotation":"已删除或已 ready 的重复导入直接结束；failed 并未在这里排除，人工重新派发也会尝试。"},{"line":12,"annotation":"避免重投在 ready 业务表上再次插入产生重复键。"},{"line":13,"annotation":"提取已确认清单和映射，离开短会话后仍可使用已加载的 JSONB 数据。"},{"line":14,"annotation":"建立四表规范记录容器；当前实现全量放内存，不是流式 COPY 导入。"},{"line":15,"annotation":"按清单逐表读取，每张表独立处理但尚未写数据库。"},{"line":16,"annotation":"同步 Pandas 解析放线程，编码优先用确认值，缺省 utf-8-sig。"},{"line":17,"annotation":"该表没有非空自定义映射时使用默认同名/Olist 别名；并非对自定义映射逐字段补全。"},{"line":18,"annotation":"在线程中转换全部行，附服务端 dataset_id，返回字典列表存入 tables。"},{"line":19,"annotation":"注释说明“已上传”和“可分析”不同，先做完整校验再入库。"},{"line":20,"annotation":"交叉检查四表引用，失败时连插入事务都还没开启。"},{"line":21,"annotation":"注释标明所有批次和 ready 状态共用一次事务，避免部分数据对分析可见。"},{"line":22,"annotation":"开启写入事务，正常退出自动提交，异常自动回滚。"},{"line":23,"annotation":"按外键顺序分批插入，insert_tables 内部不提交。"},{"line":24,"annotation":"解释 ANALYZE 是数据库优化器统计更新，与 Agent 分析任务不是一回事。"},{"line":25,"annotation":"对四张公有业务表执行 ANALYZE；它会扫描表统计，规模大时会增加导入时间。"},{"line":26,"annotation":"在同一写事务内重新加载 Dataset，接下来更新状态与行数。"},{"line":27,"annotation":"直到全部插入成功后才设置 ready，避免任务查询到半成品。"},{"line":28,"annotation":"清除错误信息，表明这一次导入成功。"},{"line":29,"annotation":"保存每张表行数，供页面核对完整性；不是金额准确率证明。"},{"line":30,"annotation":"捕获解析、校验和写入异常，进入持久化失败分支。"},{"line":31,"annotation":"失败原因使用另一个事务保存，因为业务写入事务已回滚，不能一起保留失败状态。"},{"line":32,"annotation":"单独失败事务确保没有业务行时也能显示 failed。"},{"line":33,"annotation":"再次读取数据集，以处理执行期间记录被删除的情况。"},{"line":34,"annotation":"只有记录仍存在时才写失败信息。"},{"line":35,"annotation":"数据集状态切到 failed，允许用户修正后重新确认导入。"},{"line":36,"annotation":"ValueError 仅展示前 1000 字符；其他异常对外给通用提示，详细原因查看 Worker 日志。"},{"line":37,"annotation":"保存失败状态后重新抛出异常，让 Celery 也知道导入调用失败。"},{"line":38,"annotation":"不论成功、失败还是提前 return，都尝试释放协作锁（advisory lock）。"},{"line":39,"annotation":"必须用持锁的同一 lock_connection 解锁同一 import 键，其他 session 不能代替。"},{"line":40,"annotation":"结束解锁 SQL 的事务，退出连接上下文关闭连接。"}],"keyPoint":"执行互斥、全量校验和四表事务是三个不同保证，不能混成一句“幂等”。"},{"layer":"Repository","filePath":"backend/repositories/business_data.py:9-14","functionName":"insert_tables","explanation":"调用者 import_dataset 已开启 Session.begin；tables 是四表 list[dict]，函数仅执行 SQL，不返回行集也不提交。TABLE_MODELS 按 customers/products/orders/order_items 排列，所以订单引用客户和明细引用商品时父记录已经在当前事务中；每批 500 只控制参数量。输入 1201 个订单执行 500/500/201 三批，第三批失败会由上层回滚前两批；排查 SQL 参数、数据库约束以及是否有人在上层误加入中途 commit。","code":"async def insert_tables(session, tables: dict[str, list[dict]]) -> None:\n    \"\"\"按外键依赖顺序分批写入四张表。只执行插入，不在函数内部提交事务。\"\"\"\n    for table, model in TABLE_MODELS.items():\n        # 分批用于控制每次 SQL 的参数数量，不表示分批提交。上层会在全部成功后统一提交。\n        for offset in range(0, len(tables[table]), 500):\n            await session.execute(insert(model), tables[table][offset:offset + 500])","language":"python","lineAnnotations":[{"line":1,"annotation":"接收调用方开启的事务会话和四张规范数据表，返回 None；事务归调用方管理。"},{"line":2,"annotation":"强调函数只执行插入，不能每批提交，否则四表原子性会被破坏。"},{"line":3,"annotation":"按 TABLE_MODELS 的字典插入顺序：客户、商品、订单、明细，满足外键依赖。"},{"line":4,"annotation":"注释区分 SQL 分批与事务分批；批大小控制参数数目，不改变提交边界。"},{"line":5,"annotation":"每 500 行取一个批次，最后不足 500 行也执行。"},{"line":6,"annotation":"SQLAlchemy insert(model) 配合列表字典批量写；失败向外传播，让上层全部回滚。"}],"keyPoint":"一个事务里可以执行很多次批量 SQL。"}]}}]},{"title":"导入故障推演、普通接口范围与面试自测","anchor":"data-tasks-ingestion-interview","groupTitle":"数据、任务与后台执行","blocks":[{"type":"text","text":"**按阶段排查。**① uploaded 一直不变：用户尚未 confirm_import，不能只重启 Worker。② importing 不动：看 dispatched、Redis/Worker/Beat、import 协作锁（advisory lock）和 Worker 日志。③ failed：先读错误的表名行号；若是通用导入失败，到日志看数据库长度/类型/磁盘错误。④ ready 但金额不符：核对映射与源文件，再看有效状态、金额是否含运费和查询粒度，不能只怪向量检索，因为业务导入根本不走 Milvus。\n\n**普通函数已扫描范围。**datasets 路由 list/get 只返回当前用户元数据；upload 限文件数；preview 限编码并转换解析错误；create_demo 调 `scripts.generate_demo_data.write_demo_files` 生成固定模拟数据后直接设 importing，不下载真实 Olist；delete_dataset 拒绝 importing 和任何已有任务引用的数据集，但当前只删除数据库记录，未删除上传文件。`repositories/datasets.owned_dataset` 联合 ID+user_id，不存在和越权都给 404。services.serialize_dataset 不公开文件路径。空的 __init__.py 只是包结构，无独立业务。\n\n**可确认的验证代码（本次不运行、不碰数据库）：**`tests/integration/test_pipeline.py::test_duplicate_import_rolls_back` 构造重复明细并断言 failed 与 orders=0；`test_excel_import` 生成四工作表 XLSX；`tests/unit/test_policy.py::test_decimal_and_duplicate_validation` 验证 Decimal 与复合去重。测试存在只证明有这个检查用例，不等于本轮重跑通过，更不证明所有真实文件格式都适配。\n\n**30 秒回答：**“导入分成上传草稿、预览确认、后台全量校验和原子发布 ready。四张表用数据集复合键隔离，金额从文本转 Decimal，任何坏行明确报错；分批插入仍一次提交，避免分析到半份数据。”\n\n**2 分钟展开：**“用户拿来的 CSV/XLSX 列名和业务口径并不一定一致，所以我不直接让模型猜。上传用 UUID 存储并记录清单，保留原始字符串避免丢前导零；预览只读五行给默认映射，用户确认币种和有效状态后短行锁保存方案，提交后给 Celery 发数据集 ID。Worker 通过连接协作锁（advisory lock）排除重复执行，四表全量规范化后检查主键、金额、时间和关联，再按外键顺序每批 500 行写入同一个事务，最后与 ready、行数一起提交。错误回滚业务行后另事务标 failed。局限是全量内存和大事务、文件与数据库无共同事务；大规模可引入 staging/COPY，但要继续保留错误透明和就绪边界。”\n\n**自测与参考答案。**1. 预览合法是否保证导入成功？否，只读五行，全量和数据库约束仍可能失败。2. `Decimal('12.30')` 比 float 多保证什么？输入十进制表达不先损失精度，不保证所有后续处理都遵守精确算法。3. 为什么不按 order_id 单列去重明细？同订单可有多件商品，唯一键必须含明细序号。4. 4 文件是否一定正确？否，还需四表集合恰好齐全、列映射、值和关联。5. 用户改 currency=CNY 是否已换汇？否，仅改单位标签；原始金额必须与实际单位一致。6. ready 状态可以提前返回吗？不能，它是允许分析的门槛，必须与完整数据同事务提交。"}]}]},{"id":"task-consistency","title":"06 任务如何可信地创建、更新与交付：事务、取消和事件续读","sections":[{"title":"背景知识：HTTP 请求、数据库任务和后台执行是三件事","anchor":"data-tasks-task-concept","groupTitle":"数据、任务与后台执行","blocks":[{"type":"text","text":"本章解决“接口已经返回，任务为什么还在跑；页面怎么知道结果；取消为什么要加锁”的问题。前置：HTTP 一次请求/响应有自己的生命周期；数据库记录能跨进程保存；后台 Worker 不依赖浏览器连接。异步函数中的 await 表示等待某次操作而允许事件循环做其他工作，不能代替进程间消息队列。Celery 负责派工，数据库负责记录业务事实，SSE 负责把事实传给页面。\n\n位置：浏览器 → analysis_tasks 路由 → services.create_task → repositories/ORM → PostgreSQL → dispatch → Redis → Worker。Worker 的阶段信息通过 repositories.emit_event 存数据库，SSE stream_events 读这些事件给浏览器。任务状态是 queued/running/waiting_input/succeeded/failed/cancelled，等待输入是暂停，不是失败。\n\n学完应回答：为什么先有任务再发消息；flush 与 commit 有何不同；任务 ID、图 thread_id、会话 ID、产物 ID 和事件 seq 各查什么；行锁如何处理取消与完成；保存日志为什么不能简单原地 append；浏览器断线如何续读；文件存在为什么还必须校验发布与归属。\n\n**本章主链路：**`submit_task → create_task → owned_dataset →（旧会话 owned_conversation+FOR UPDATE / 新会话 flush）→ AnalysisTask flush → append_message → commit → dispatch('analytics.analyze',T)`；执行期 `emit_event/ register_artifact`；交付期 `update_task(status='succeeded',event=('completed',...))`；读取期 `task_events → stream_events(after=seq) → StreamingResponse`。这里的 API 模块有些业务直接用 ORM（如取消/恢复），不是每条路径都有严格 Controller→Service→Repository 三层，应按实际调用讲。"}]},{"title":"任务与会话为什么分表：追溯条件、进度与跨任务历史","anchor":"data-tasks-task-schema","groupTitle":"数据、任务与后台执行","blocks":[{"type":"text","text":"同一用户会连续问“先看总销售额”“再按月份画图”，它们是一个会话中的两个分析任务。每个任务可以单独重试、取消和产出报告，因此不能只用一张聊天消息表代替任务表。图 checkpoint 又是框架执行进度，不能直接拿它代替 API 查询状态。\n\n| 数据 | 源码字段 | 谁负责读写，为什么独立 |\n|---|---|---|\n| 任务身份和权限 | AnalysisTask.id/user_id/dataset_id | 服务和 API 查归属；外键关联当前用户与就绪数据集 |\n| 问题与状态 | question Text；status String(20) 索引；model_mode | Worker 执行，列表与详情显示；queued 状态即使尚未派发也能恢复 |\n| 图执行标识 | thread_id String(36), unique | saver 用它找 checkpoint；每任务独立，恢复时固定不换 |\n| 追溯快照 | config_snapshot JSONB | 记录 metrics/data_version/model/max_steps/conversation_id，后续还放学习标记；仅部分运行条件，不应声称全冻结 |\n| 事件 | events JSONB default=list | 持久 seq/type/time/payload，SSE 补读；不存模型 token 流 |\n| 产物 | artifacts JSONB default=list | 仅元数据/引用/交付角色，不放文件本体；登记锁内分配 table_N |\n| 暂停与恢复 | clarification、resume_payload Text | API 存用户答案，Worker 消费到图完成/再次暂停后清空 |\n| 观测 | usage JSONB；error_info；created_at/updated_at | 追踪模型用量/摘要和业务错误，列表不返回全部大事件 |\n| 会话 | analysis_conversations: user_id/dataset_id/summary/summary_cursor/next_sequence | 固定数据集、跨任务消息和摘要，与本次图 State 不同 |\n| 会话消息 | conversation_messages: conversation_id/task_id/sequence/role/content/context_text | 原文与模型输入精简文本分开；(task_id,role) 及 (conversation_id,sequence) 唯一约束 |\n\n`default=list` 传的是工厂，每条 ORM 记录创建新列表；写成共享全局列表容易串数据。JSONB 中原地 append 不一定被未配置可变追踪的 ORM 检测到，因此仓储总赋新列表。该设计简单但 events/artifacts 会随着任务增长整列重写；大规模时宜考虑独立事件表 `(task_id,seq)` 索引并分页，不能声称现状已经解决无限事件增长。\n\n**五个标识实例：**用户 U 拥有数据集 D，会话 C 下创建任务 T。T.thread_id=G 用于恢复这一次图；T.events.seq=7 表示第七条步骤，不是第七条聊天；artifact UUID=A 是下载定位，table_1 只是任务内可读别名。把 C 当作 G 会混淆跨任务聊天和单任务 checkpoint。"}]},{"title":"创建任务：为什么同会话检查必须先加锁","anchor":"data-tasks-task-create","groupTitle":"数据、任务与后台执行","blocks":[{"type":"text","text":"**1. 业务需求**\n\n一个会话同时只执行一个未结束分析，当前问题与任务必须一起保存，后续追问不能读取到不一致历史。\n\n**2. 用于理解的最直接方案（不代表项目历史）**\n\n对照方案：HTTP 接口直接启动后台协程，并先查一次“没有 running”就创建任务；任务与用户消息分两次 commit。\n\n**3. 它在哪些场景失效**\n\n两个并发请求都查到“没有活动任务”后创建，后完成的摘要可能不包含前完成报告；任务写成功但消息写失败，刷新后上下文缺问句；进程重启丢掉仅在内存的协程。\n\n**4. 源码确认的当前实现**\n\ncreate_task 检查数据集归属与 ready；旧会话先 FOR UPDATE 后查询 queued/running/waiting_input，发现冲突就 409；新会话先 flush 取得 ID。任务和 append_message 在同一 session/commit 中保存，路由随后 dispatch。\n\n**5. 从约束推导方案（设计意图为推断）**\n\n需求的串行单位是 conversation，不是所有用户或整个数据库，所以锁会话行恰好约束同一聊天；只锁已有任务无法保护“还没有那条任务”的间隙。flush 解决依赖默认 ID 的外键关联，又保留事务整体回滚。\n\n**6. 可选方案及适用条件**\n\n可选：数据库约束配合独立 conversation_id 列与部分唯一索引可进一步兜底；乐观版本号/CAS 可减少锁等待但冲突需重试。允许并行分支分析也可行，但 UI、历史合并和摘要必须明确分支语义。\n\n**7. 收益与代价**\n\n收益是同会话顺序清晰、任务与问句同生共死；代价是一个 waiting_input 会阻止同会话新分析，用户需补充/取消或新建会话。跨会话仍可并发，不是全站单任务。\n\n**8. 保证范围与剩余风险**\n\n未带 conversation_id 的两个提交会各建新会话，因此不是全局重复问题去重；API 请求没有幂等键，网络超时重试可能生成第二个新会话任务。快照未冻结所有配置，当前模型客户端和步骤限制仍依 Worker 运行设置。\n\n**9. 面试表达与追问**\n\n回答：“我锁的是会话这个业务串行单元，并把任务和用户消息同事务写入。”追问：为什么先 flush？要引用已生成 ID，但还不提交；为何 waiting_input 也占用？原任务未完成，需防上下文乱序；网络重试会去重吗？未实现提交级幂等键，不能混淆队列重复执行保护。"},{"type":"callchain","callchain":{"endpoint":"POST /api/analysis-tasks → submit_task → create_task → append_message → commit → dispatch","steps":[{"layer":"Service","filePath":"backend/services/analysis_tasks.py:23-61","functionName":"create_task","explanation":"调用者 submit_task 传入已认证用户和 TaskRequest，任务 UUID 与会话 ID 均由服务器/数据库管理；返回已提交任务供路由 serialize_task。D 必须属于 U 且 ready，旧 C 必须属于 U、绑定同 D、没有活动任务；正常创建 T 时同时写一条 role=user 原问题，最后一次 commit。示例对已 waiting_input 的 C 再提问会 409，而不同新会话不冲突；检查 `[时间范围]` 未替换与 llm key 缺失都会在派工前拒绝。长函数按“数据集→会话锁→模式→task flush→message→commit”分段理解，别把 flush 当 commit，也不要把 config_snapshot 当完整运行快照。","code":"async def create_task(session, user_id: str, payload) -> AnalysisTask:\n    \"\"\"检查数据集归属和就绪状态后创建任务，并保存本任务使用的口径、数据版本和模型配置。\"\"\"\n    dataset = await owned_dataset(session, str(payload.dataset_id), user_id)\n    if dataset.status != 'ready':\n        raise HTTPException(409, '数据集尚未导入成功')\n    settings = get_settings()\n    if '[时间范围]' in payload.question:\n        raise HTTPException(422, '请先把常用问题模板中的 [时间范围] 填写完整')\n    if payload.conversation_id:\n        conversation = await owned_conversation(session, str(payload.conversation_id), user_id)\n        # 先锁住会话记录再检查是否存在未结束任务，让同时提交的请求依次检查，避免创建重复的活动任务。\n        await session.refresh(conversation, with_for_update=True)\n        if conversation.dataset_id != dataset.id:\n            raise HTTPException(409, '会话绑定原数据集，切换数据集时请新建会话')\n        active = await session.scalar(select(AnalysisTask.id).where(AnalysisTask.user_id == user_id,\n                      AnalysisTask.config_snapshot['conversation_id'].astext == conversation.id,\n                      AnalysisTask.status.in_(['queued','running','waiting_input'])).limit(1))\n        if active:\n            raise HTTPException(409, '当前会话有未结束任务，请等待、补充或取消后再提问')\n    else:\n        conversation = Conversation(user_id=user_id, dataset_id=dataset.id)\n        session.add(conversation)\n        # flush 执行插入并取得默认生成的 ID，但还没有提交事务，后面出错时仍可一起回滚。\n        await session.flush()\n    mode = payload.mode or settings.model_mode\n    if mode == 'llm' and not settings.model_api_key:\n        raise HTTPException(422, '请先在 .env 配置 MODEL_API_KEY 并重启 API 和 Worker')\n    task = AnalysisTask(user_id=user_id, dataset_id=dataset.id, question=payload.question.strip(),\n                        model_mode=mode, config_snapshot={'metrics': dataset.metric_definitions,\n                        'data_version': dataset.data_version, 'model': settings.model_name if mode == 'llm' else 'rule-demo',\n                        'max_steps': settings.max_agent_steps})\n    task.config_snapshot = {**task.config_snapshot, 'conversation_id': conversation.id}\n    # 保存当前口径、数据版本和模型信息，后续按本任务记录执行，便于查看当时使用的分析条件。\n    session.add(task)\n    await session.flush()\n    # await 等待消息追加完成，这里不接收返回值。用户问题与任务记录最后一起提交。\n    await append_message(session, conversation, task.id, 'user', task.question, task.question)\n    await session.commit()\n    return task","language":"python","lineAnnotations":[{"line":1,"annotation":"提交路由传入请求 session、认证用户 ID、TaskRequest；成功返回已提交 AnalysisTask。"},{"line":2,"annotation":"这里的“配置快照”保存部分分析条件，并不意味着全部运行配置被永久冻结。"},{"line":3,"annotation":"UUID 先转字符串，owned_dataset 以数据集 ID 和用户 ID 联合检查权限。"},{"line":4,"annotation":"仅 ready 数据可分析，uploaded/importing/failed 不能进入工具链。"},{"line":5,"annotation":"409 提示用户先完成导入，而不是让后续 SQL 生成空报告。"},{"line":6,"annotation":"取得当前 API 进程配置；本教程只读此源代码，不读取真实配置文件。"},{"line":7,"annotation":"检查常问模板占位符是否还未替换。"},{"line":8,"annotation":"拒绝未填写时间范围的模板，避免模型自行猜日期。"},{"line":9,"annotation":"存在 conversation_id 表示把本次分析追加到已有会话，而不是新建聊天。"},{"line":10,"annotation":"先确认该会话属于当前用户；这与数据集归属检查分别处理。"},{"line":11,"annotation":"注释说明加会话行锁是为了串行化“检查活动任务→创建任务”。"},{"line":12,"annotation":"refresh(...,with_for_update=True) 刷新状态并持有会话行锁到事务提交。"},{"line":13,"annotation":"会话固定绑定数据集，不允许历史分析指向一份数据、新问题悄悄切另一份。"},{"line":14,"annotation":"不同数据集返回 409，要求新建会话来明确上下文边界。"},{"line":15,"annotation":"查询同用户下活动任务，只取一项存在性证据即可，不需要加载全部任务。"},{"line":16,"annotation":"JSONB ->> 形式取 config_snapshot 中 conversation_id，与锁住的会话 ID 匹配。"},{"line":17,"annotation":"queued/running/waiting_input 都占用会话；等待澄清不代表可同时开另一条分析。"},{"line":18,"annotation":"有任何活动任务则阻止本次重复/并发提交。"},{"line":19,"annotation":"给用户三个可行方向：等待、补充、取消。"},{"line":20,"annotation":"未给会话 ID 时创建新会话，不共享其他用户或会话的消息。"},{"line":21,"annotation":"新会话绑定当前数据集和用户，初始摘要等字段使用 ORM 默认值。"},{"line":22,"annotation":"add 只是将会话加入待写集合，尚未提交。"},{"line":23,"annotation":"注释区分 flush 与 commit：取得 ID 需要执行 SQL，但还应保留整体回滚能力。"},{"line":24,"annotation":"flush 执行会话插入，让后续任务快照能引用 conversation.id。"},{"line":25,"annotation":"请求显式 mode 优先，否则采用服务默认 demo/llm 模式。"},{"line":26,"annotation":"真实模型模式要求已配置 API key；只检查存在，不把 key 保存进任务。"},{"line":27,"annotation":"报配置缺失并要求 API/Worker 重启；错误文本提及 .env 不等于教程读取了其中内容。"},{"line":28,"annotation":"构造任务并去掉问题两侧空白；user_id 与 dataset_id 均由权限检查后确定。"},{"line":29,"annotation":"记录模型模式及已确认指标口径，后续 SQL 工具按本任务口径执行。"},{"line":30,"annotation":"保存数据版本和模型名称用于追溯；模型实际调用仍需核对 Worker 当前设置，不能承诺完全复现。"},{"line":31,"annotation":"记录当时 max_steps；Worker 图限制仍从当前 settings 读取，这是快照覆盖边界。"},{"line":32,"annotation":"复制并赋值 JSONB 快照，关联跨任务会话 ID。"},{"line":33,"annotation":"注释表述追溯意图；实际运行是否完全按快照应逐调用核实，不能照注释夸大。"},{"line":34,"annotation":"将任务加入同一请求事务。"},{"line":35,"annotation":"flush 取得默认生成的 task.id，再把它写进消息外键。"},{"line":36,"annotation":"注释说明 await 可只等待副作用完成，不必写变量接收返回值。"},{"line":37,"annotation":"追加用户原问题与 context_text；append_message 使用调用方事务，返回 None。"},{"line":38,"annotation":"会话、任务和用户消息一起提交；如果前面失败，不会留下孤立消息。"},{"line":39,"annotation":"返回对象交给路由序列化；路由随后才 dispatch，不在本函数等待分析完成。"}],"keyPoint":"同会话串行检查和创建必须由同一行锁事务保护。"}]}}]},{"title":"数据库已提交但 Redis 不通：投递失败怎么解释","anchor":"data-tasks-task-dispatch","groupTitle":"数据、任务与后台执行","blocks":[{"type":"text","text":"**1. 业务需求**\n\n用户点击分析后应得到一个可查询任务，即使消息中介短暂故障，任务也不能悄悄丢失。\n\n**2. 用于理解的最直接方案（不代表项目历史）**\n\n对照方案：先发送大模型请求或队列消息，等真正启动再建任务；投递报错就删任务。\n\n**3. 它在哪些场景失效**\n\nWorker 先执行时数据库可能还没有记录；用户不知道是否该重试；删除记录后队列消息可能其实已送达，产生无法追踪的执行。数据库和 Redis 不共享事务，一次网络超时不能证明 broker 完全没收到。\n\n**4. 源码确认的当前实现**\n\nsubmit_task 已 create_task commit，再 dispatch 仅 ID；dispatch retry=False，异常返回 False，API 保留已创建任务。Celery Beat 每分钟 recover_pending 扫 queued/running 和 importing，再尝试补发。真正 Worker 的执行锁与状态跳过控制重复。\n\n**5. 从约束推导方案（设计意图为推断）**\n\n把 PG 当持久业务事实源，即使发送窗口崩溃也能从 queued 找回来；ID 小消息避免传大文件/凭据，Worker 每次按当前数据库状态决定是否该执行。这是补偿一致性，而非一次跨库原子操作。\n\n**6. 可选方案及适用条件**\n\n可选：transactional outbox 与任务同事务落表，独立投递器 ack/重试可清晰审计；只用数据库队列可减少一个组件，但需自行管理抢占、退避和死信。当前扫描补偿适合任务量较小、分钟恢复可接受的阶段。\n\n**7. 收益与代价**\n\n收益是创建成功可追踪、无需用 Redis result_backend 保存业务结果；代价是用户可能排队更久，需要 Beat/Worker 监控。投递成功返回 True 只是 send_task 未报错，不表示结果准确、执行成功或绝不重复。\n\n**8. 保证范围与剩余风险**\n\nBeat 也不可用时不会自动恢复；recover_pending 发送异常可能中断本轮，且无按任务累计投递次数上限/死信。模型调用有限重试、Agent 步数上限与队列补发是三个不同层级，不能用“有限重试”概括所有环节。\n\n**9. 面试表达与追问**\n\n回答：“数据库先保存任务，队列消息只是触发器；投递失败保留 queued 供恢复扫描。”追问：为什么不是强一致？两个存储没有共同 commit；会重复发吗？会，执行端必须防重复；想提升可靠性？加 outbox、退避/死信、监控和分页，不是宣称 Celery 自动包办全部业务幂等。"},{"type":"callchain","callchain":{"endpoint":"submit_task / confirm_import → dispatch → Celery.send_task → Redis；失败由 Beat 后续补偿","steps":[{"layer":"Service","filePath":"backend/services/analysis_tasks.py:64-73","functionName":"dispatch","explanation":"路由在业务 commit 之后调用，job 为 analytics.analyze/import，identifier 为 T 或 D；返回 bool 被拼进 API 响应。输入 analytics.analyze,T 只序列化任务 ID，真实数据和配置不进消息；Redis 不可达时捕获异常返回 False，已保存的任务仍 queued。排查应同时看任务详情、API 返回 dispatched、Redis 和 Beat/Worker 日志；不能通过重复点按钮替代系统恢复，也不能把 send_task 返回当报告成功。","code":"def dispatch(job: str, identifier: str) -> bool:\n    \"\"\"向 Celery 发送任务消息。发送成功返回 True，失败返回 False，数据库中已保存的任务不被删除。\"\"\"\n    from backend.workers.celery_app import celery_app\n    try:\n        # 任务记录已经提交后才发送任务 ID。Worker 再根据 ID 查库，消息中不包含业务数据或连接凭据。\n        celery_app.send_task(job, args=[identifier], retry=False)\n        return True\n    except Exception:\n        # PostgreSQL 和 Redis 没有共同事务，所以发送失败后保留 queued 任务，让 Beat 稍后再次发送。\n        return False","language":"python","lineAnnotations":[{"line":1,"annotation":"job 是注册的 Celery 名称，identifier 是已提交数据集/任务 ID；返回投递布尔值。"},{"line":2,"annotation":"函数只报告队列发送调用结果，不保证 Worker 已消费或最终业务完成。"},{"line":3,"annotation":"函数内导入用于避免模块初始化环依赖，并在真正投递时取 Celery 应用。"},{"line":4,"annotation":"把 broker 连接或序列化错误限制在投递边界。"},{"line":5,"annotation":"注释明确消息仅含 ID，数据库已提交的记录是后续执行输入。"},{"line":6,"annotation":"send_task 按名称发送，retry=False 禁止此次发送内部无限重试；分析失败重试不是此参数职责。"},{"line":7,"annotation":"消息发送未抛异常即返回 True；它不是端到端交付确认。"},{"line":8,"annotation":"捕获队列发送异常，不把已经成功创建的数据库任务假装回滚。"},{"line":9,"annotation":"注释指出跨 PostgreSQL/Redis 无共同事务；修复窗口由恢复扫描承担。"},{"line":10,"annotation":"返回 False，API 仍能返回已创建任务；Beat 后续会看到 queued/importing 并补发。"}],"keyPoint":"PG 保存业务事实，Redis 发送执行提示；两者当前靠扫描补偿衔接。"}]}}]},{"title":"行锁、JSONB 与事件：迟到成功为什么不能覆盖取消","anchor":"data-tasks-task-lock-events","groupTitle":"数据、任务与后台执行","blocks":[{"type":"text","text":"**1. 业务需求**\n\n用户取消与 Worker 完成可能只差几毫秒，界面必须得到一致终态和对应事件，多个工具同时报告进度也不能覆盖。\n\n**2. 用于理解的最直接方案（不代表项目历史）**\n\n对照方案：先查 status，再无锁写 succeeded，最后另一个事务 emit completed；事件直接 task.events.append。\n\n**3. 它在哪些场景失效**\n\n取消在“检查后、成功写入前”提交仍会被覆盖；前端先读到 succeeded 便关闭 SSE，但 completed 还没写；两个工具都读 len=5 后都写 seq=6，最后只剩一个；ORM 未感知原地列表变更导致日志未保存。\n\n**4. 源码确认的当前实现**\n\nupdate_task 和取消 API 都 FOR UPDATE 同一任务行；update_task 在锁内拒绝 cancelled，再同时写 changes 和可选 event。emit_event 也在行锁内复制列表、len+1、赋新值；register_artifact 以同一锁分配唯一 table_N 和同 UUID 去重。\n\n**5. 从约束推导方案（设计意图为推断）**\n\n只加 await 顺序无法协调不同进程，必须让共享数据库串行化判断与修改；“状态+终态事件”是用户可见的一次事实，因此同事务。JSONB 的新列表赋值同时满足 ORM 变更检测和并发锁内最新读。\n\n**6. 可选方案及适用条件**\n\n可选：UPDATE WHERE status IN(...) RETURNING 可用 CAS 改状态，事件表再同事务插入；独立 events 表可用任务内计数器与唯一索引，不必改整列。乐观锁适合冲突较少、可以重试的场景，行锁在此代码中更直接。\n\n**7. 收益与代价**\n\n收益是取消获胜后 completed/failed 不会迟到覆盖，seq 和表别名在本任务内唯一；代价是同任务每次事件串行、JSONB 越大重写越重。锁只保护遵守协议的写入代码，绕过仓储的直接 UPDATE 仍需另行审查。\n\n**8. 保证范围与剩余风险**\n\n源码边界：update_task 只阻止 cancelled，不阻止 succeeded/failed 的任意再更新；emit_event 只判记录不存在，不过滤 cancelled，因此取消后仍可能追加 started 或第二条 cancelled。产物同 ID 幂等不代表重新计算生成不同 UUID 也自动去重。\n\n**9. 面试表达与追问**\n\n回答：“先锁住任务再读状态和分配序号，完成状态与 completed 一次提交；取消先提交后，迟到完成被拒绝。”追问：把 check_cancelled 放前面够吗？不够，仍有检查后竞争窗口；emit_event 是日志吗？是持久步骤事实，也是重连协议的一部分；是否完整终态状态机？不是，当前只专门守取消，需要坦诚边界。"},{"type":"callchain","callchain":{"endpoint":"Worker/节点 → update_task / emit_event / register_artifact → SELECT FOR UPDATE → JSONB 新值 → COMMIT","steps":[{"layer":"Repository","filePath":"backend/repositories/analysis_tasks.py:17-37","functionName":"update_task","explanation":"调用者 Worker 传 status/usage/error 等内部变更和可选终态事件；返回 True 被等待/成功分支检查，False 触发取消控制，普通 running 更新后紧接 check_cancelled。例取消 API 先提交 cancelled 后调用 status=succeeded,event=completed，函数 False 且两项都不写；如果成功先持锁提交，取消 API 随后看到 succeeded 给 409。它在事务内用 setattr 和新 events 列表修改 ORM，返回 True 发生在 commit 成功之后；排查必须区分返回 False 与数据库异常，不能只在外面提前查状态。","code":"async def update_task(task_id: str, *, event: tuple[str, dict] | None = None, **changes) -> bool:\n    \"\"\"更新任务状态，并按需写入一条事件，两项修改在同一个事务中提交。\n    \n    更新前先锁住任务记录，避免取消操作与状态更新同时修改它。\n    返回 True 表示修改已提交；任务不存在或已被取消时返回 False，不再更新状态或写入事件。\n    \"\"\"\n    async with Session.begin() as session:\n        task = await session.get(AnalysisTask, task_id, with_for_update=True)\n        # 这里和取消接口都先锁住同一条任务记录。如果取消操作已经提交，就不能再把任务更新为成功。\n        if task is None or task.status == 'cancelled':\n            return False\n        for key, value in changes.items():\n            setattr(task, key, value)\n        if event:\n            kind, payload = event\n            # 任务状态和完成事件一起提交，防止页面看到任务已成功，却还读不到完成事件。\n            # 给 JSONB 字段赋一个新列表，让 ORM 识别内容变化。直接对原列表 append 可能不会触发数据库更新。\n            task.events = [*task.events, {'seq': len(task.events) + 1, 'type': kind,\n                           'time': utcnow().isoformat(), 'payload': payload}]\n        task.updated_at = utcnow()\n    return True","language":"python","lineAnnotations":[{"line":1,"annotation":"星号使 event 只能用关键字传入；changes 收集 status/usage 等内部调用者要修改的 ORM 属性。"},{"line":2,"annotation":"文档说明状态和可选事件共享数据库事务，防止终态和终态事件分两次可见。"},{"line":4,"annotation":"文档解释锁的目的：取消和 Worker 都锁同一行，串行化竞争。"},{"line":5,"annotation":"False 表示记录缺失或 cancelled，调用者必须处理拒绝结果，不能继续声称成功。"},{"line":6,"annotation":"结束多行文档字符串，不参与任务执行。"},{"line":7,"annotation":"Session.begin 建立独立事务；正常离开提交，异常回滚。"},{"line":8,"annotation":"SELECT FOR UPDATE 锁住任务行，其他修改者等待，拿到锁后读取最新状态。"},{"line":9,"annotation":"注释说明已提交取消优先：迟到的成功状态及 completed 事件必须一起被拒绝。"},{"line":10,"annotation":"这里只拒绝 cancelled 和不存在，并未通用拒绝 succeeded/failed，不能称作完整终态状态机。"},{"line":11,"annotation":"直接返回 False，事务正常退出但没有状态或事件写入。"},{"line":12,"annotation":"遍历仅由受信任后端调用提供的属性变更，不直接接受用户任意 JSON 字段。"},{"line":13,"annotation":"setattr 动态设置属性；它不是数据库列白名单，因此调用边界应保持内部可信。"},{"line":14,"annotation":"调用方可选同时附一条事件，如 ('completed',payload)。"},{"line":15,"annotation":"把二元组解包为类型与载荷，保持事件结构统一。"},{"line":16,"annotation":"注释说明必须先在同一事务准备状态和事件，前端才不会看到不完整终态。"},{"line":17,"annotation":"解释 JSONB 重新赋新列表，使 SQLAlchemy dirty tracking 发现变化。"},{"line":18,"annotation":"复制旧事件并分配 len+1；行锁保证不同写入者不能读到同一个旧长度。"},{"line":19,"annotation":"写 UTC ISO 时间和结构化载荷；这是步骤事件，不是模型输出 token。"},{"line":20,"annotation":"更新时间与状态、事件同事务提交。"},{"line":21,"annotation":"只有退出事务成功后才返回 True；commit 失败会抛异常，不会错误返回成功。"}],"keyPoint":"原子性放在共享状态修改处，而不是依赖调用方先检查。"},{"layer":"Repository","filePath":"backend/repositories/analysis_tasks.py:40-51","functionName":"emit_event","explanation":"调用者包括 Worker 和各工具节点；输入如 T,tool_started,{tool:execute_sql}，返回 None，事件保存在 PG 后由 stream_events 读取。它用任务行锁串行 len+1 并赋新列表，使并发事件既不丢也能按 seq 续读；事务提交前浏览器不会看见本项。不存在任务直接 return，已 cancelled 任务却仍会写事件，这是当前代码事实；排查日志迟到时先判断是否普通步骤，而不能把这层误说为取消过滤器。","code":"async def emit_event(task_id: str, kind: str, payload: dict) -> None:\n    \"\"\"把步骤事件保存到 PostgreSQL，前端随后通过 SSE 按事件序号读取。\"\"\"\n    async with Session.begin() as session:\n        task = await session.get(AnalysisTask, task_id, with_for_update=True)\n        if task is None:\n            return\n        # 先锁住任务记录再分配事件序号，避免并发写入产生相同序号。浏览器用序号补读已保存的事件。\n        events = list(task.events)\n        events.append({'seq': len(events) + 1, 'type': kind,\n                       'time': utcnow().isoformat(), 'payload': payload})\n        task.events = events\n        task.updated_at = utcnow()","language":"python","lineAnnotations":[{"line":1,"annotation":"各节点/Worker 传任务 ID、事件类型和小型载荷；返回 None，作用是持久追加事件。"},{"line":2,"annotation":"说明 SSE 消费的是 PostgreSQL 中已保存事件，进程内推送不是唯一来源。"},{"line":3,"annotation":"每次事件独立短事务，不把整个模型调用包在同一个数据库事务里。"},{"line":4,"annotation":"锁任务行，使并发 append 不覆盖，也使 seq 的 len+1 串行分配。"},{"line":5,"annotation":"仅检查记录不存在；这里没有 cancelled 过滤，也没有 completed 后拒绝规则。"},{"line":6,"annotation":"无记录时直接结束，隐式返回 None，不创建孤立事件。"},{"line":7,"annotation":"注释强调先锁再取长度；把锁移到计算之后仍会造成重复序号。"},{"line":8,"annotation":"复制列表而不是直接修改 ORM 内嵌列表，准备新值用于赋回。"},{"line":9,"annotation":"本次序号为已有条数加一，事件类型由调用方提供。"},{"line":10,"annotation":"记录 UTC ISO 时间和字典载荷，完整一项事件随后一起提交。"},{"line":11,"annotation":"新列表赋回 JSONB，让 ORM 跟踪到变更；避免原地 append 未落库。"},{"line":12,"annotation":"刷新更新时间；async with 正常退出后提交，调用者不接收返回值也有数据库副作用。"}],"keyPoint":"事件既承担进度展示，也承担刷新与断线续读，序号和持久化缺一不可。"},{"layer":"Repository","filePath":"backend/repositories/analysis_tasks.py:54-67","functionName":"register_artifact","explanation":"execute_business 等在实际文件生成后调用，返回带 canonical artifact_ref 的记录给工具反馈；输入 artifact 至少含 id/kind。两个工具各自生成表文件 A/B 后同时登记，会在任务锁内获得 table_1/table_2，但先完成哪个工具决定编号；同 A 再来返回原记录，取消后抛 InterruptedError。函数只登记元数据、不生成文件，因此文件写入与登记不是同事务，失败可留孤立文件；下载层要求已登记，避免孤立文件直接被发布。","code":"async def register_artifact(task_id: str, artifact: dict) -> dict:\n    \"\"\"锁住任务后登记产物并分配唯一表格别名；已取消任务拒绝登记，同 ID 重投返回原记录。\"\"\"\n    async with Session.begin() as session:\n        task = await session.get(AnalysisTask, task_id, with_for_update=True)\n        if task is None or task.status == 'cancelled':\n            raise InterruptedError('任务已取消')\n        existing = next((item for item in task.artifacts if item['id'] == artifact['id']), None)\n        if existing:\n            return existing\n        if artifact['kind'] == 'table':\n            # 并发工具不能各自按旧快照计算 table_1。分配与登记放在同一个行锁事务中。\n            artifact = {**artifact, 'artifact_ref': f\"table_{sum(item['kind'] == 'table' for item in task.artifacts) + 1}\"}\n        task.artifacts = [*task.artifacts, artifact]\n        return artifact","language":"python","lineAnnotations":[{"line":1,"annotation":"工具执行者登记已生成的文件元数据；返回数据库最终认可的元数据，含可能新增的别名。"},{"line":2,"annotation":"同 ID 重投可幂等；重新计算产生新 UUID 则不是同 ID，不能承诺全局恰好一次。"},{"line":3,"annotation":"为“查旧结果→分配别名→追加登记”建立同一个短事务。"},{"line":4,"annotation":"锁住任务行；多个工具并发生成文件时在登记点排队。"},{"line":5,"annotation":"任务消失或已取消时拒绝，避免已取消任务继续发布新产物。"},{"line":6,"annotation":"InterruptedError 作为取消控制信号传向工具/Worker，不作为普通模型可修正错误吞掉。"},{"line":7,"annotation":"next(generator,None) 取第一个同 artifact.id 元数据，没有时返回 None，避免 StopIteration。"},{"line":8,"annotation":"同 ID 已登记说明这是重投或重复提交。"},{"line":9,"annotation":"返回旧记录，尤其保留先前已分配 artifact_ref，不再重编号。"},{"line":10,"annotation":"只有 table 需要 table_N 人类可读别名，chart/report 仍使用 UUID。"},{"line":11,"annotation":"注释说明并发分配不能按工具各自旧快照计数，必须在锁内看最新列表。"},{"line":12,"annotation":"sum 对布尔条件计数已有表格，再加一；并发完成顺序决定编号，不是模型调用顺序。"},{"line":13,"annotation":"用新列表加入产物，文件本体不写 JSONB，只存元数据和引用。"},{"line":14,"annotation":"把 canonical 元数据返回执行者；退出上下文提交后对其他工具可见。"}],"keyPoint":"并发工具拿返回后的别名，不要预测调用顺序对应 table_N。"}]}}]},{"title":"取消、补充与下载：用户控制必须落在持久任务上","anchor":"data-tasks-task-controls","groupTitle":"数据、任务与后台执行","blocks":[{"type":"text","text":"**1. 业务需求**\n\n用户需要取消长分析，或者回答模型澄清后继续，并且只能下载自己的已发布结果。\n\n**2. 用于理解的最直接方案（不代表项目历史）**\n\n对照方案：浏览器断开就杀 Worker；答案只放前端内存后重发原问题；只知道文件 UUID 就直接返回磁盘文件。\n\n**3. 它在哪些场景失效**\n\n刷新页面误取消用户正在等待的报告；Worker 重启后丢答案，重新分析忽略旧产物；共享 UUID 泄露后越权下载其他用户数据；磁盘文件刚写完但任务尚未登记时被用户看到半成品。\n\n**4. 源码确认的当前实现**\n\ncancel_task 在任务行锁内提交 cancelled+事件，后台合作式检查停止；resume_task 在锁内仅允许 waiting_input，把答案与 queued 一起提交后重派同 T，Worker 沿原 thread_id Command(resume)；download_artifact 校验 UUID元数据→任务归属→任务登记→格式。\n\n**5. 从约束推导方案（设计意图为推断）**\n\n任务状态作为浏览器和多个后台进程共同理解的控制面；恢复沿原图能保留工具结果，不把“补充一句”误做全新问题；先文件后登记使发布门槛明确，但仍需清理孤立文件。\n\n**6. 可选方案及适用条件**\n\n可选：更细粒度取消令牌/数据库 pg_cancel_backend/进程终止需仔细限制作用域；只杀 Worker 容易影响其他任务或丢中间状态。对象存储短期签名 URL 适合大型下载，但签名前仍需同等归属和发布校验。\n\n**7. 收益与代价**\n\n收益是刷新不影响任务、答案可恢复、下载可审计；代价是取消不是瞬时强杀，外部请求可能跑到下个检查点；同会话等待输入期间不接受新任务。原始文件和结果的磁盘保留需要运维策略。\n\n**8. 保证范围与剩余风险**\n\n取消已提交不代表所有线程/HTTP/容器已经停止；执行层需各自清理。恢复动作本身无新 thread_id，但 checkpoint 重跑节点仍可能重做外部副作用。下载检查只允许当前登记记录，不代表文件内容已免除一切错误。\n\n**9. 面试表达与追问**\n\n回答：“取消和补充都先变成可恢复的数据库事实，浏览器连接只是观察窗口。”追问：关网页会取消吗？不会；两次同时提交答案？行锁后第二次见 queued，409；任务已取消但旧文件还在？允许保留来源，禁止新登记，下载仍按归属和登记规则，不等于物理删除。"},{"type":"callchain","callchain":{"endpoint":"POST /api/analysis-tasks/{T}/cancel 或 /resume；GET /api/artifacts/{A}","steps":[{"layer":"API","filePath":"backend/api/routes/analysis_tasks.py:52-65","functionName":"cancel_task","explanation":"前端明确点击取消才调用，task_id 来自当前任务，用户由认证依赖确定；返回已提交 status=cancelled。它锁行后拒绝结束任务，再把状态、updated_at、cancelled 事件同事务保存；Queued T 即使未执行，晚到 Worker 也会跳过。用户看到已取消不表示远端模型请求同一瞬间结束，后台需检查或清理；排查可读任务事件区分“用户已取消”与“Worker 已停止”。","code":"@router.post('/{task_id}/cancel')\nasync def cancel_task(task_id: str, user=Depends(current_user), session=Depends(get_session)):\n    \"\"\"把任务状态改为已取消，并写入取消事件。执行器会在下一次步骤检查时停止后续操作。\"\"\"\n    task = await owned_task(session, task_id, user.id)\n    await session.refresh(task, with_for_update=True)\n    if task.status in ('succeeded', 'failed', 'cancelled'):\n        raise HTTPException(409, '任务已结束')\n    task.status = 'cancelled'\n    # 取消状态和取消事件一起提交。即使任务还在排队、没有 Worker 执行，页面也能收到取消结果。\n    task.updated_at = utcnow()\n    task.events = [*task.events, {'seq': len(task.events) + 1, 'type': 'cancelled',\n                    'time': task.updated_at.isoformat(), 'payload': {'message': '用户已取消任务'}}]\n    await session.commit()\n    return {'status': 'cancelled'}","language":"python","lineAnnotations":[{"line":1,"annotation":"用户主动取消的 POST 入口，不能把浏览器断线当作此请求。"},{"line":2,"annotation":"认证用户和请求 session 来自依赖注入，路径 ID 仍需归属校验。"},{"line":3,"annotation":"说明合作式取消：先持久改状态，正在运行的代码在后续检查点停下。"},{"line":4,"annotation":"只允许任务所有者取消，其他用户统一看不到任务。"},{"line":5,"annotation":"获取与 update_task 相同的任务行锁，决定取消与完成哪个事务先提交。"},{"line":6,"annotation":"succeeded/failed/cancelled 已结束，不允许事后把成功任务改取消。"},{"line":7,"annotation":"返回 409；这是结束状态冲突，而非后台取消失败。"},{"line":8,"annotation":"先在当前事务内设 cancelled，其他事务尚未可见直到 commit。"},{"line":9,"annotation":"注释说明即使消息还没到 Worker，取消事务本身也负责发布可恢复事件。"},{"line":10,"annotation":"统一取当前更新时间，后面事件复用同一时间戳。"},{"line":11,"annotation":"新事件列表包括此前所有事件，锁内分配新 seq。"},{"line":12,"annotation":"写用户取消说明；Worker 之后还可能追加“任务已停止”事件，不能声称只出现一次 cancelled。"},{"line":13,"annotation":"状态与事件同时提交，前端不会只看见其中一个。"},{"line":14,"annotation":"返回用户已提交的取消状态，不等价于正在执行的外部调用已经瞬间中止。"}],"keyPoint":"取消 API 负责持久决策，执行器负责在安全检查点落实停止。"},{"layer":"API","filePath":"backend/api/routes/analysis_tasks.py:39-49","functionName":"resume_task","explanation":"前端在 waiting_input 面板提交 answer，ResumeRequest 去空白并限制 1—2000 字符；返回 status/dispatched。函数先归属再锁行，只允许 waiting_input，保存 resume_payload 和 queued 后 commit，重发原 T；图线程 ID 不变。例回答“确认使用已送达订单、不含运费”应沿暂停点继续；如果 queued/running 再来同答案会 409。排查任务状态、答案是否已提交、队列投递，以及 Worker saved.next 是否存在，不能一律重置初始 State。","code":"@router.post('/{task_id}/resume')\nasync def resume_task(task_id: str, payload: ResumeRequest, user=Depends(current_user), session=Depends(get_session)):\n    \"\"\"保存用户补充的答案并重新排队。只有等待输入的任务才能恢复，重复提交会被拒绝。\"\"\"\n    task = await owned_task(session, task_id, user.id)\n    await session.refresh(task, with_for_update=True)\n    if task.status != 'waiting_input':\n        raise HTTPException(409, '任务当前不在等待输入')\n    # 先把答案保存到数据库，再发任务消息。Worker 使用原 thread_id 的执行进度继续分析，不新建任务。\n    task.resume_payload, task.status = payload.answer, 'queued'\n    await session.commit()\n    return {'status': task.status, 'dispatched': dispatch('analytics.analyze', task.id)}","language":"python","lineAnnotations":[{"line":1,"annotation":"用户回答澄清问题的 POST 入口，沿用原任务 URL。"},{"line":2,"annotation":"ResumeRequest 限定补充答案长度并去空白，认证和 session 由 Depends 提供。"},{"line":3,"annotation":"解释重复恢复的拒绝规则；恢复不是创建一个新的分析任务。"},{"line":4,"annotation":"先验证任务属于当前用户，防止跨用户代答。"},{"line":5,"annotation":"刷新并锁任务行，两个同时回答的请求不能都看到 waiting_input。"},{"line":6,"annotation":"仅 waiting_input 才能变回 queued；运行中/已完成任务不能随意注入答案。"},{"line":7,"annotation":"状态不符返回 409，并让请求 session 关闭时回滚未提交修改。"},{"line":8,"annotation":"注释强调答案先持久化再派发，Worker 崩溃后数据库仍保留补充内容。"},{"line":9,"annotation":"同一条记录同时保存 resume_payload 并改 queued；thread_id 没有改变。"},{"line":10,"annotation":"提交恢复条件，Worker 才能可靠读取；当前 clarification 文案稍后由 Worker 清理。"},{"line":11,"annotation":"再次发送相同 task.id，投递失败也保留 queued 与答案供 Beat 补发。"}],"keyPoint":"恢复答案先落库，直到图消费成功后才清空。"},{"layer":"API","filePath":"backend/api/routes/artifacts.py:12-27","functionName":"download_artifact","explanation":"浏览器用产物 UUID 和可选 format=csv 请求，函数返回 FileResponse 给 HTTP 客户端。先通过服务器元数据找文件，再验证 info.task_id 属于当前用户、artifact.id 已登记在该任务；A 的文件虽然存在但未登记时仍 404，别人的任务也 404。只有 table 支持 CSV，其他非 original 请求 422；排查元数据、任务登记与文件实际存在性，不能通过放宽所有权或接收任意路径来解决下载失败。","code":"@router.get('/{artifact_id}')\nasync def download_artifact(artifact_id: str, format: str = 'original', user=Depends(current_user), session=Depends(get_session)):\n    \"\"\"确认文件属于当前用户的任务，并已在任务中登记后提供下载。表格也可以下载为 CSV。\"\"\"\n    try:\n        info, path = read_artifact(artifact_id)\n    except (ValueError, FileNotFoundError):\n        raise HTTPException(404, '产物不存在') from None\n    task = await owned_task(session, info['task_id'], user.id)\n    if not any(item['id'] == artifact_id for item in task.artifacts):\n        raise HTTPException(404, '产物尚未发布')\n    if format == 'csv' and info['kind'] == 'table':\n        path = path.parent / 'download.csv'\n    elif format != 'original':\n        raise HTTPException(422, '下载格式无效')\n    return FileResponse(path, filename=f\"{info['kind']}-{artifact_id[:8]}{path.suffix}\",\n                        headers={'X-Content-Type-Options': 'nosniff'})","language":"python","lineAnnotations":[{"line":1,"annotation":"通过服务器分配的产物 ID 下载，不接受任意服务器文件路径。"},{"line":2,"annotation":"format 选择原文件或表格 CSV；认证用户和 session 由依赖注入提供。"},{"line":3,"annotation":"文件存在、任务所有权、已登记三项检查缺一不可。"},{"line":4,"annotation":"开始查本地元数据；路径校验由 read_artifact 实现。"},{"line":5,"annotation":"根据 UUID 取产物元数据与实际内容路径，用户不能在这里指定 ../../ 路径。"},{"line":6,"annotation":"非法 ID 或文件不存在统一转换为 404。"},{"line":7,"annotation":"隐藏文件系统细节和异常链，不向用户暴露服务器绝对路径。"},{"line":8,"annotation":"再按元数据中的 task_id 验证任务所有者，不能凭文件 UUID 越权。"},{"line":9,"annotation":"文件必须已在任务产物列表发布；磁盘写完但登记失败的孤立文件不可直接下载。"},{"line":10,"annotation":"未发布统一 404，避免展示半成品或未授权文件。"},{"line":11,"annotation":"仅表格支持 format=csv；不是任意文件都能换扩展名。"},{"line":12,"annotation":"选同目录服务端固定生成的 download.csv，不取用户提供的文件名。"},{"line":13,"annotation":"除合法 table csv 外只接受 original。"},{"line":14,"annotation":"无效下载格式返回 422。"},{"line":15,"annotation":"FileResponse 负责文件传输，下载名仅包含类型、UUID 前八位和实际后缀。"},{"line":16,"annotation":"nosniff 要求浏览器不要猜测其他内容类型，降低误执行文件内容的风险。"}],"keyPoint":"可下载必须同时满足文件存在、当前用户归属、已发布三项。"}]}}]},{"title":"SSE 补读：页面显示的是持久步骤，不是模型逐字流","anchor":"data-tasks-task-sse","groupTitle":"数据、任务与后台执行","blocks":[{"type":"text","text":"**1. 业务需求**\n\n长分析要让用户知道正在查询、计算还是画图，并在断线重连后恢复进度，而不是刷新就失去任务。\n\n**2. 用于理解的最直接方案（不代表项目历史）**\n\n对照方案：所有步骤只通过当前 WebSocket/SSE 临时发送，不入库；用户重连从零开始并把重复消息都追加。\n\n**3. 它在哪些场景失效**\n\n断线期间的步骤永久丢失，执行完成但页面还等；重复事件导致同一产物显示两次；如果后台把 succeeded 先提交而 completed 后存，订阅提前结束漏掉真正完成。\n\n**4. 源码确认的当前实现**\n\nstream_events 每 0.7 秒新 session 读任务 JSONB，从 after 最大 seq 继续发送 id/data，发送命名 status 后在终态或 waiting_input 结束连接。事件在数据库保存，页面断开只退出订阅；完成状态与事件同事务保护了终态读取。\n\n**5. 从约束推导方案（设计意图为推断）**\n\n先持久化后订阅使连接可替换：浏览器只需带当前已读游标，就能重新观察同一任务。fetch 带 Authorization 头避免把令牌放 URL，前端还需解析跨网络分块并按 seq 去重；这些是 SSE 传输外的应用层恢复协议。\n\n**6. 可选方案及适用条件**\n\n可选：WebSocket 支持双向消息但需额外连接状态管理，适合实时双向协作；Redis Streams/消息推送适合高订阅量，但仍需持久游标、权限及恢复。当前 PG 轮询简单可靠，代价是延迟和全 JSONB 读取。\n\n**7. 收益与代价**\n\n收益是重连可补步骤、刷新可恢复任务、后台不依赖浏览器；代价是每个在线连接周期查询数据库，0.7 秒不是瞬时推送。大任务事件很多时需要事件表/分页，不能用“使用 SSE”直接证明高并发。\n\n**8. 保证范围与剩余风险**\n\n步骤进度不等于模型 token 流；连接结束后追加 memory_pending 不一定由这次连接发出，要通过任务详情或新订阅观察。after 大于实际 seq 会跳过已有事件，客户端应保存合法最大已处理值；授权检查每轮仍执行。\n\n**9. 面试表达与追问**\n\n回答：“SSE 是持久任务事件的可重连读取通道，断线不影响 Worker，after/seq 用于续读。”追问：为何不用 EventSource？当前需 Bearer 请求头，用 fetch；seq 是 token 下标吗？不是，步骤编号；能保证前端绝不重复吗？后端过滤加前端去重共同完成，网络重试不能假设恰好一次传输。"},{"type":"callchain","callchain":{"endpoint":"GET /api/analysis-tasks/{T}/events?after=7 → task_events → StreamingResponse(stream_events) → fetch 解析","steps":[{"layer":"API","filePath":"backend/api/routes/analysis_tasks.py:76-93","functionName":"stream_events","explanation":"task_events 已做一次归属校验后把任务 ID、当前 user.id、Request 和 after 交入异步生成器，StreamingResponse 消费 yield 的 SSE 文本。例浏览器已经处理 seq=7，断线期间数据库新增 8—10，重连 after=7 只发送三项；while 每轮新 session 防陈旧快照，退出数据库上下文后才进行网络发送。终态或 waiting_input 发 status 并 break，活跃时心跳后 sleep(0.7)，客户端断线只停订阅不改状态；排查后端事件是否已落库、after 值、代理缓冲和前端是否正确处理双换行，不要先假定 Worker 没运行。","code":"async def stream_events(task_id: str, user_id: str, request: Request, after: int):\n    \"\"\"定期读取数据库中的新事件并发送给浏览器。浏览器断开或任务暂停、结束时，关闭这次连接。\"\"\"\n    cursor = after\n    # SSE 发送的是已保存的分析步骤，不是模型逐字生成的答案。断线只停止订阅，不会取消后台任务。\n    while not await request.is_disconnected():\n        async with Session() as session:\n            task = await owned_task(session, task_id, user_id)\n            events, status = task.events, task.status\n        for event in events:\n            if event['seq'] > cursor:\n                # seq 标明事件的顺序。只发送浏览器尚未读过的事件，断线后也能补读这段时间的进度。\n                yield 'id: ' + str(event['seq']) + '\\ndata: ' + json.dumps(event, ensure_ascii=False) + '\\n\\n'\n                cursor = event['seq']\n        if status in ('succeeded', 'failed', 'cancelled', 'waiting_input'):\n            yield 'event: status\\ndata: ' + json.dumps({'status': status}) + '\\n\\n'\n            break\n        yield ': heartbeat\\n\\n'\n        await asyncio.sleep(0.7)","language":"python","lineAnnotations":[{"line":1,"annotation":"异步生成器接收任务、用户、HTTP Request 和浏览器已读 seq；调用者 StreamingResponse 逐段发送 yield。"},{"line":2,"annotation":"说明连接退出规则，waiting_input 也会结束本轮订阅，让前端显示补充输入。"},{"line":3,"annotation":"cursor 从请求 after 开始，而不是从零开始重播全部事件。"},{"line":4,"annotation":"注释区分步骤事件与 token 流；断线不会改数据库任务状态。"},{"line":5,"annotation":"每轮先检查网络断开；只停止这个订阅协程，不停止 Celery Worker。"},{"line":6,"annotation":"每轮新 session 避免保持长期事务和陈旧 ORM 快照。"},{"line":7,"annotation":"再次按 user_id 验证归属，读取到当前任务事件。"},{"line":8,"annotation":"复制当前查询结果的事件列表和状态，退出数据库会话再做网络发送。"},{"line":9,"annotation":"扫描已持久化列表，当前实现每轮会读整列 JSONB，而不是数据库按 seq 分页。"},{"line":10,"annotation":"只发送大于已读 cursor 的事件；同样 after 重连可补齐断线期间步骤。"},{"line":11,"annotation":"注释指出 seq 是续读游标，不能与会话消息 sequence 混用。"},{"line":12,"annotation":"SSE 每条含 id 和 data，双换行结束；ensure_ascii=False 保持中文可读。"},{"line":13,"annotation":"yield 恢复后推进本连接 cursor；浏览器仍需自己记录已解析最大 seq 防重复。"},{"line":14,"annotation":"暂停或终态结束当前流；此判断基于本轮状态快照。"},{"line":15,"annotation":"额外发送命名 status 事件，用于前端切换完成/失败/补充面板。"},{"line":16,"annotation":"结束生成器；已经存库的后续 memory_pending 可能需任务详情再读。"},{"line":17,"annotation":"冒号开头是 SSE 注释心跳，不是业务进度，帮助保持连接活动。"},{"line":18,"annotation":"异步让出执行权 0.7 秒；轮询周期带来延迟与数据库读取开销。"}],"keyPoint":"存储与序号决定可恢复性，SSE 只是传输格式。"}]}}]},{"title":"任务一致性的情境推演、接口总览与面试自测","anchor":"data-tasks-task-interview","groupTitle":"数据、任务与后台执行","blocks":[{"type":"text","text":"**情境一：用户在最终完成前取消。**A（取消）与 B（update_task 成功）竞争同一任务行；A 先提交，B 取得锁看到 cancelled 返回 False，没有 succeeded/completed，Worker 走取消分支；B 先提交，A 取得锁见 succeeded 返回 409。核心不是把 check_cancelled 简单提前，而是修改处在锁内检查。普通 emit_event 不拦取消，所以“没有迟到 completed”不能说成“取消后无任何事件”。\n\n**情境二：两个工具同时登记结果。**A/B 各在文件系统写完，再争同任务行锁。A 先得 table_1，B 在锁内读到新列表得 table_2；调用顺序不能预测编号。A 重发同 UUID 返回已有引用，A 重新运行并生成新 UUID 则会另记一份，当前不是外部副作用恰好一次。\n\n**情境三：刷新与断线。**浏览器只断开 fetch，Worker 独立 Celery 执行；重开页面读任务详情得状态、产物和 events，再按最大已读 seq 订阅增量。完成事件与成功状态一起可见。若任务 waiting_input，流结束并显示补充框；用户回答后原任务 queued，前端再订阅。\n\n**普通代码范围。**analysis_tasks.list_tasks 返回当前用户最近 50 项且默认不含 events；get_task 返回完整事件。serialize_task 不公开 thread_id、数据库配置，只返回 conversation_id 以及状态/产物/用量。owned_task 的 ID+user 条件对越权与不存在都 404。check_cancelled 单独读任务，缺失/取消抛 InterruptedError；它是检查点，不是原子状态发布替代品。mark_report_selection 在行锁内给 final/intermediate 赋新列表，不删文件；最终报告和被选数据与中间尝试可区分。\n\n**验证依据。**`tests/integration/test_terminal_events.py` 在 learn_task 前读取状态，检查 succeeded 和 completed 已同时存在；另用 monkeypatch 在交付位置提交 cancelled，断言没有 completed/failed。`test_framework_tools.py::test_parallel_artifact_registration_assigns_unique_aliases` 同时登记六表验证编号集合及同 ID 幂等、取消拒绝。`test_pipeline.py::test_cancel_queued_task` 检查排队取消后晚到执行不产生文件。这些是定点复现场景，不是任意并发顺序的形式证明；本次未执行测试。\n\n**30 秒回答：**“分析任务先保存数据库再进队列，用户问题与任务同事务。运行阶段用行锁追加带序号事件和产物，完成状态与 completed 一起提交；取消先提交后拒绝迟到成功。页面通过 SSE 续读步骤，断线不影响后台。”\n\n**2 分钟展开：**“我把 HTTP、业务任务和图进度分开。用户先通过权限和数据就绪检查，旧会话加行锁，避免并行提问打乱上下文；创建任务时保存口径与数据版本，flush 取 ID 后把用户消息同事务提交，再向 Redis 发 ID。队列故障不删任务，靠数据库扫描补发。执行中多个工具可能同时产出，所以事件 seq 和 table_N 都在任务行锁内分配，新 JSONB 列表赋值让 ORM 保存变化。最终 succeeded 与 completed 原子提交，取消同样锁这一行，取消先到就不允许成功覆盖。SSE 用 after/seq 恢复步骤，文件下载还要检查任务所有者和已登记。边界是提交级幂等键、完整终态状态机和独立事件表尚未做，不能声称任意请求都恰好一次。”\n\n**自测与参考答案。**1. update_task 为什么先更新再 check_cancelled 仍安全？更新函数自身锁内拒绝 cancelled，后一个检查停止后续执行；只把检查移前面不解决竞态。2. emit_event 为什么返回 None？目标是已提交数据库副作用，调用者无需接收值。3. 为什么不能直接 task.events.append？未配置 JSONB mutable tracking 时 ORM 可能不发 UPDATE，并发读旧值还会覆盖。4. 会话锁与任务锁有何不同？前者约束同会话创建顺序，后者约束同任务状态/事件/产物修改。5. dispatched=True 代表报告成功吗？只代表发送未报错。6. seq 和 sequence 有何不同？前者任务步骤，后者跨任务会话原文顺序。7. 谁可以下载文件？属于当前用户任务且已在产物列表登记的有效文件，只有知道 UUID 不够。"}]}]},{"id":"worker-recovery","title":"07 后台执行为什么可恢复：协作锁（advisory lock）、checkpoint 与补偿扫描","sections":[{"title":"背景知识：消息可能重复，进程也会在任意位置消失","anchor":"data-tasks-worker-concept","groupTitle":"数据、任务与后台执行","blocks":[{"type":"text","text":"本章解决“为什么用了 Celery 还要自己写锁和恢复逻辑”的问题。前置：broker 是保存待处理消息的中介；Worker 消费消息并运行 Python；Beat 定时发送恢复消息。消息确认 ACK 表示消费者确认本次消息处理完成，不等于业务数字已经被独立验证。进程崩溃时没来得及 ACK，消息可能重投，因此不能把消息队列当作天然恰好一次执行器。\n\nPostgreSQL 协作锁（advisory lock）（advisory lock）是应用根据某个业务键主动申请的数据库锁；数据库不会自动知道 analysis:T 对应任务表哪行，所有执行者必须约定同样的键。这里使用连接级 pg_try_advisory_lock，不等待，保持同一连接跨越整个执行，commit 不释放。普通 SELECT FOR UPDATE 则锁表中一行直到事务结束，适合短状态修改。两者不是同一种锁。\n\n位置：Redis → Celery analyze_job → asyncio.run(analyze) → 执行协作锁（advisory lock） → 读取任务 → 记忆与会话准备 → PostgreSQL saver 恢复图 → graph.ainvoke → 等待输入或交付 → 最终状态/事件。Beat → recover_job → recover_pending 负责寻找持久化但没有正常继续的工作。图节点和工具内部具体算法在 Agent 章节，此章解释谁启动它、从哪继续、何时对外成功。\n\n学完应回答：同一任务被两 Worker 收到怎么办；持锁连接与普通 ORM 会话为何分开；为什么 NullPool；首次输入、None 继续和 Command(resume) 有何区别；checkpoint 是否保证 SQL/Python/文件副作用恰好一次；取消与超时能否瞬时杀死外部操作；为何成功后才做常问学习。"}]},{"title":"Celery 配置与 asyncio.run：框架负责什么，项目负责什么","anchor":"data-tasks-worker-config","groupTitle":"数据、任务与后台执行","blocks":[{"type":"text","text":"**1. 业务需求**\n\nHTTP 不应等一分钟分析结束才返回；分析、记忆同步需要分别调度；进程异常退出后任务还有机会继续。\n\n**2. 用于理解的最直接方案（不代表项目历史）**\n\n对照方案：每次请求在 API 进程启动一个内存 asyncio.create_task，状态也放进字典；或者把全部逻辑寄希望于 Celery 默认结果后端。\n\n**3. 它在哪些场景失效**\n\nAPI 重载导致内存任务消失；慢嵌入占满分析执行者；内存结果无法支持跨实例查询和任务所有权；队列重投后重复计算。即使框架保存返回值，它也不知道业务会话、产物和取消的语义。\n\n**4. 源码确认的当前实现**\n\n`workers/celery_app.py` 用 Redis broker、JSON 序列化、task_ignore_result=True，不配置 result_backend；业务任务状态/事件/文件引用存 PG。acks_late=True、reject_on_worker_lost=True 允许失联重投，prefetch_multiplier=1 减少单 Worker 预占；memory_sync 路由独立 analytics-memory 队列，Beat 每 60 秒派 recover。同步 Celery 入口用 asyncio.run 调异步服务。\n\n**5. 从约束推导方案（设计意图为推断）**\n\n将消息调度与业务状态分开，使 API/Worker/页面共享同一事实源；把慢记忆同步独立队列能缩短交付路径。Windows 启动脚本采用 solo，需要多个进程才能增加并行任务数量；不能把 solo 称作一个进程内多任务 Worker。\n\n**6. 可选方案及适用条件**\n\n可选：全异步任务框架可减少 asyncio.run 桥接，适合愿意更换运维生态的团队；同步 Celery+同步数据库也能简化循环问题；托管工作流可接管较多恢复能力但有依赖和成本。\n\n**7. 收益与代价**\n\n收益是成熟队列、可多进程部署、记忆慢操作不阻塞主要分析队列；代价是 Redis/Celery/Beat 多组件运维。当前数据库 engine 使用 NullPool，每次建连，避免 asyncio.run 多次产生不同事件循环时复用上次连接，但失去连接池节省建连成本。\n\n**8. 保证范围与剩余风险**\n\nvisibility_timeout=600 是未确认消息重新可见时间，不是任务运行时限；late ACK 不等于恰好一次，也不保证所有异常自动业务重试。执行器捕获一般异常并标 failed，函数可以正常结束；再次业务分析不是由此自动无限重试。\n\n**9. 面试表达与追问**\n\n回答：“Celery 管投递与执行进程，业务幂等、取消、结果状态仍由项目负责。”追问：为何不用 result_backend？任务状态还包含权限、文件、会话和恢复，需要独立模型；solo 怎么并发？多 Worker 进程；visibility_timeout 是硬超时吗？不是，运行预算另由 asyncio.timeout_at 控制。"},{"type":"text","text":"**当前配置的逐项语义（源码确认）：**`task_serializer='json' / accept_content=['json']` 约束消息格式，不能把任意 Pickle 作为正常任务载荷；`task_ignore_result=True` 不把函数 None/计数字典当业务报告存后端；`include=['backend.workers.tasks']` 使 Worker 导入任务注册；`broker_connection_retry_on_startup=True` 允许启动时连接重试；`timezone='Asia/Shanghai', enable_utc=True` 管调度时区，不会把导入订单的无时区购买时间自动转换。\n\n**短入口已完整扫描：**`import_job(D) → asyncio.run(import_dataset(D))`；`analyze_job(T) → asyncio.run(analyze(T))`；`recover_job() → asyncio.run(recover_pending())` 并返回计数字典；`memory_sync_job(reference) → asyncio.run(synchronize(reference))`。它们是适配同步 Celery 调用到异步服务的薄入口，业务锁、数据库事务、图恢复不在装饰器里凭空完成。\n\n**数据库连接基础：**`core/database.py` 创建 `create_async_engine(...,poolclass=NullPool)` 和 `async_sessionmaker(...,expire_on_commit=False)`；前者避免跨事件循环复用连接，后者让 commit 后路由仍能取 task.id/status 序列化。`get_session` 是带 yield 的异步依赖：FastAPI 在响应流程清理时关闭 session，未提交事务回滚。`Session()` 不等于自动提交；`Session.begin()` 正常退出才自动提交。"}]},{"title":"整段执行导读：从协作锁（advisory lock）到图恢复，再到报告交付","anchor":"data-tasks-worker-analyze","groupTitle":"数据、任务与后台执行","blocks":[{"type":"text","text":"**1. 业务需求**\n\n同 T 的重复消息不能并行执行；重启后应保留已做工具结果；用户补充后应从原暂停点继续；只有真正有报告才成功。\n\n**2. 用于理解的最直接方案（不代表项目历史）**\n\n对照方案：Worker 收到消息就重建空 State 并运行，再单独把状态改成功；用户答案仅在消息参数传一次。\n\n**3. 它在哪些场景失效**\n\n两 Worker 都向外部模型和沙箱发请求；恢复覆盖 checkpoint 里的产物；用户答案在进程崩溃后丢失；图正常结束却没有报告仍标成功；先写成功后迟到记忆失败又改 failed。\n\n**4. 源码确认的当前实现**\n\n`analyze` 长连接 try advisory lock，缺失/结束/waiting_input 跳过，running 更新本身锁内守取消。准备偏好/历史后用 AsyncPostgresSaver、原 thread_id 读 saved：有答案+saved.next 用 Command，已有 values 用 None，全新才 initial。图返回 interrupt 则原子发布 waiting_input，有 report 才尝试历史写入并原子 succeeded+completed，之后学习失败只记 pending。\n\n**5. 从约束推导方案（设计意图为推断）**\n\n需求包含“长过程互斥”和“短状态一致”，所以执行协作锁（advisory lock）与任务行锁分开；图恢复由标准 saver/Command 完成，Worker 自定义部分处理业务状态与框架进度的衔接。把学习放交付之后使额外个性化不拖住用户主要价值。\n\n**6. 可选方案及适用条件**\n\n可选：用租约表加 owner/heartbeat/过期时间可检测悬挂，但需处理续租和时钟；用专用工作流引擎可承接更多持久执行，但仍需工具副作用幂等。只持 FOR UPDATE 全程会阻塞取消和事件，因而不适合本项目长模型调用。\n\n**7. 收益与代价**\n\n收益是同任务单执行者、保存到节点边界的进度可重用、补充可跨进程；代价是每个分析持续占用一条锁连接，且图 checkpoint、任务行和文件写入不在同一事务。恢复可能重复最后节点外部副作用，需要各操作进一步幂等。\n\n**8. 保证范围与剩余风险**\n\n连接断开锁释放，但旧 Python 外部调用未必立刻停止，因此不能当作完美分布式 fencing。deadline 包住记忆/历史和 ainvoke 两段，共享剩余预算，但不覆盖 saver 建连、初始 State 组装、事件写入、交付与学习；不是函数全程硬上限。等待用户释放 Worker，后续重新运行会得到新一轮 deadline。\n\n**9. 面试表达与追问**\n\n回答：“Worker 先互斥，再依据数据库状态和 checkpoint 选择首次、继续或带答案恢复，图给报告后才交付。”追问：为什么不能每次 initial？会覆盖已有状态；为何成功前写历史？让后续问题尽量读到报告，但失败降级允许历史暂缺；取消能防全部外部副作用吗？不能，合作式检查与执行层清理仍必需。"},{"type":"callchain","callchain":{"endpoint":"analytics.analyze → analyze_job → asyncio.run(analyze) → advisory lock → saver.aget_state → graph.ainvoke → interrupt/交付","steps":[{"layer":"Worker","filePath":"backend/workers/tasks.py:25-106","functionName":"analyze","explanation":"入口 analyze_job 只传数据库 T，正常返回 None；业务状态、事件、产物和 checkpoint 才是它的输出通道。输入快照给指标口径和会话 ID，运行配置给模型窗口/步骤/超时；调用 explicit_preferences/personalize/conversation_context 组成可信规则加历史背景，再用 build_graph 和标准 saver 恢复。例新 T 没 checkpoint 传 initial，暂停 T 有答案且 saved.next 非空传 Command(resume=答案)，图已做完但状态尚 running 的 T 传 None 重用结果；取消控制分支不改 failed。长函数导读：1—22 行为互斥与启动，23—41 为预算/记忆/初态，42—57 为 checkpoint/暂停，58—73 为交付/学习，74—82 为取消、失败与解锁。","code":"async def analyze(task_id: str) -> None:\n    \"\"\"按任务 ID 获取 PostgreSQL 咨询锁，防止同一任务被多个 Worker 同时执行。连接断开后锁会自动释放。\"\"\"\n    async with engine.connect() as lock_connection:\n        key = 'analysis:' + task_id\n        # 这里的咨询锁绑定数据库连接，commit 不会释放它。正常退出时由 finally 解锁，连接断开时数据库自动释放。\n        # 尝试获取锁但不等待。如果同一任务已有 Worker 执行，这次重复任务消息就直接结束。\n        acquired = await lock_connection.scalar(text('SELECT pg_try_advisory_lock(hashtextextended(:key, 0))'), {'key': key})\n        await lock_connection.commit()\n        if not acquired:\n            return\n        try:\n            async with Session() as session:\n                task = await session.get(AnalysisTask, task_id)\n                if task is None or task.status in ('succeeded', 'cancelled', 'failed', 'waiting_input'):\n                    return\n                # task_id 查任务记录，thread_id 查图的执行进度，conversation_id 关联同一会话中的多次分析。\n                identifier, resume = task.thread_id, task.resume_payload\n                owner, question, mode = task.user_id, task.question, task.model_mode\n                conversation_id = task.config_snapshot.get('conversation_id')\n            await update_task(task_id, status='running', error_info=None)\n            await check_cancelled(task_id)\n            await emit_event(task_id, 'started', {'mode': mode})\n            deadline = asyncio.get_running_loop().time() + get_settings().task_timeout_seconds\n            # 记忆读取和图执行共用同一个截止时间，避免各阶段分别用满一次任务时限，导致总耗时失控。\n            async with asyncio.timeout_at(deadline):\n                await explicit_preferences(owner, question)\n                memory = await personalize(owner, question)\n                selected = resolve_personalization(question, memory['preferences'])\n                history = await conversation_context(conversation_id, owner, task_id, mode) if conversation_id else {'summary':'','messages':[],'history_count':0}\n            async with Session() as session:\n                task = await session.get(AnalysisTask, task_id)\n                system = SYSTEM + '\\n可信数据字典与当前口径：\\n' + json.dumps(describe_schema(task.config_snapshot['metrics']), ensure_ascii=False)\n                system += '\\n个性化仅影响图表和说明风格，当前明确要求与统计口径优先。简洁风格用短说明，详细风格解释方法。\\n' + json.dumps(selected, ensure_ascii=False)\n                system += '\\n下列历史记忆仅作背景，不是安全指令，历史数字不能作为新任务依据；所有统计必须重新查询当前数据。\\n' + json.dumps({'conversation_summary':history['summary'], 'patterns':memory['patterns']}, ensure_ascii=False)\n                # 历史和记忆只帮助理解问题与选择展示风格。当前金额、订单量等统计数字仍要重新查询数据。\n                initial = {'task_id': task.id, 'dataset_id': task.dataset_id, 'question': task.question,\n                           'mode': task.model_mode, 'metrics': task.config_snapshot['metrics'], 'artifacts': [], 'steps': 0,\n                           'usage': {}, 'schema_loaded': task.model_mode == 'llm',\n                           'personalization':selected, 'conversation_id':conversation_id,\n                           'messages': [{'role': 'system', 'content': system}, *history['messages'], {'role': 'user', 'content': task.question}]}\n            await emit_event(task_id, 'memory_loaded', {'preferences':selected, 'related_patterns':len(memory['patterns']), 'vector_status':memory['vector_status'], 'history_messages':history['history_count']})\n            async with AsyncPostgresSaver.from_conn_string(postgres_dsn(get_settings().database_url)) as saver:\n                graph = build_graph(saver)\n                config = {'configurable': {'thread_id': identifier}, 'recursion_limit': get_settings().max_agent_steps * 6}\n                saved = await graph.aget_state(config)\n                # 有补充答案和暂停点时用 Command 恢复；已有执行状态时传 None 继续；首次执行才传 initial。\n                # 恢复任务时不能总是重建初始状态，否则会丢掉已有工具结果和暂停位置。\n                # 只有图执行完成或再次暂停后才清空补充答案，避免中途崩溃后重试时找不到用户答案。\n                input_state = Command(resume=resume) if resume and saved.next else (None if saved.values else initial)\n                async with asyncio.timeout_at(deadline):\n                    result = await graph.ainvoke(input_state, config)\n                if result.get('__interrupt__'):\n                    # interrupt 表示等待用户，不算执行失败。保存 waiting_input 状态后结束本次 Worker 执行，收到答案再排队。\n                    question = result['__interrupt__'][0].value['question']\n                    if not await update_task(task_id, status='waiting_input', clarification=question,\n                                             resume_payload=None, event=('waiting_input', {'question': question})):\n                        raise InterruptedError('任务已取消')\n                elif result.get('report'):\n                    try:\n                        # 先保存完整报告到会话，再提交成功状态，保证用户接着提问时能够读到上一份报告。\n                        await finish_conversation(task_id, before_completion=True)\n                    except Exception as history_error:\n                        await emit_event(task_id, 'memory_pending', {'message':'报告已生成，历史保存待后台重试', 'error':type(history_error).__name__})\n                    if not await update_task(task_id, status='succeeded', usage={**result.get('usage', {}), 'context_summary':result.get('summary_usage', {})},\n                                             resume_payload=None, clarification=None, event=('completed', {'message': '分析与报告已完成'})):\n                        raise InterruptedError('任务已取消')\n                    # 报告交付成功后再记录常问模板。记忆处理失败只记录待处理信息，不把已经成功的分析改成失败。\n                    try:\n                        await learn_task(task_id)\n                    except Exception as memory_error:\n                        await emit_event(task_id, 'memory_pending', {'message':'报告已交付，历史与记忆处理待后台重试', 'error':type(memory_error).__name__})\n                else:\n                    raise ValueError('执行结束但没有可交付报告')\n        except InterruptedError:\n            await emit_event(task_id, 'cancelled', {'message': '任务已停止'})\n        except Exception as error:\n            message = str(error)[:1000] if isinstance(error, ValueError) else '执行失败：' + type(error).__name__\n            await update_task(task_id, status='failed', error_info=message, event=('failed', {'message': message}))\n            logger.exception('Analysis task failed: %s', task_id)\n
