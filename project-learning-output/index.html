       finally:\n            await lock_connection.execute(text('SELECT pg_advisory_unlock(hashtextextended(:key, 0))'), {'key': key})\n            await lock_connection.commit()","language":"python","lineAnnotations":[{"line":1,"annotation":"Celery analyze_job 把已提交任务 ID 传入；返回 None，业务结果通过数据库和文件交付。"},{"line":2,"annotation":"说明执行级互斥：同一 task_id 不能被两个遵守协议的 Worker 同时分析。"},{"line":3,"annotation":"为长执行单独保留数据库连接，协作锁（advisory lock）生命周期不依赖普通 Session 的短事务。"},{"line":4,"annotation":"analysis: 前缀与导入、会话锁隔开命名空间，任务 ID 决定互斥粒度。"},{"line":5,"annotation":"注释说明 session-level advisory lock 绑定连接；commit 不释放，连接中断数据库会释放。"},{"line":6,"annotation":"注释说明不等待拿锁，重复消息直接返回，避免 Worker 被同一任务排队耗尽。"},{"line":7,"annotation":"使用参数绑定计算 64 位哈希锁键并试锁；哈希理论上可能碰撞，但碰撞只导致额外串行。"},{"line":8,"annotation":"结束取锁 SQL 的隐式事务；连接仍保留协作锁（advisory lock）。"},{"line":9,"annotation":"未取得锁意味着此刻另一个持锁者在执行，当前调用不能继续。"},{"line":10,"annotation":"跳过此次重复消息，不把任务标成失败。"},{"line":11,"annotation":"进入受 finally 保护的主执行区域，保证正常/异常退出都解锁。"},{"line":12,"annotation":"短会话加载持久任务，不长时间锁任务行，取消接口因此能在分析中间提交。"},{"line":13,"annotation":"按 task_id 主键读任务，队列里的消息不是状态真相。"},{"line":14,"annotation":"缺失、已成功、已取消、已失败和等待用户的任务都跳过；只有 queued/running 被执行。"},{"line":15,"annotation":"直接返回仍会走外层 finally 解锁；不重复交付已成功结果。"},{"line":16,"annotation":"注释区分任务主键、图线程、跨任务会话，三者不能互换。"},{"line":17,"annotation":"读取同一任务固定 thread_id 和可能待消费的补充答案。"},{"line":18,"annotation":"保存用户、原问题和模式，供记忆、模型上下文使用。"},{"line":19,"annotation":"从 JSONB 快照取会话 ID；老任务可没有会话，因此后面提供空历史兼容。"},{"line":20,"annotation":"尝试切 running；update_task 内部锁行并拒绝 cancelled，所以不是无条件覆盖取消。这里没接收布尔值，下一行补做取消检查。"},{"line":21,"annotation":"再次检查已取消/已删除并抛控制异常；单独把检查移到更新前仍挡不住两者之间的竞争。"},{"line":22,"annotation":"持久保存 started 步骤；emit_event 不拦 cancelled，所以检查后立即取消仍可能看到迟到 started。"},{"line":23,"annotation":"使用单调时钟计算绝对截止点，避免墙上时钟调整影响计时。"},{"line":24,"annotation":"注释说明记忆和图共享剩余预算，而不是各自重新给完整时长。"},{"line":25,"annotation":"第一个 timeout_at 仅包以下记忆与会话准备；不是整个函数全覆盖硬超时。"},{"line":26,"annotation":"从本次明确文字更新允许的偏好，当前用户要求优先于旧默认。"},{"line":27,"annotation":"读取 PostgreSQL 偏好和经校验的向量候选常问模式。"},{"line":28,"annotation":"把当前问题与旧偏好合并，得到此次真正使用的展示偏好。"},{"line":29,"annotation":"取跨任务摘要和近期原文，排除本任务，避免用户问题重复进入历史；无会话用空结构。"},{"line":30,"annotation":"短会话读取任务快照并构造首次图输入，这一段不在刚才 timeout 块内部。"},{"line":31,"annotation":"重读任务以使用数据库中的口径数据，仍未给模型授予写数据库权限。"},{"line":32,"annotation":"可信系统规则后附服务端数据字典与当前统计口径，避免模型猜字段和金额定义。"},{"line":33,"annotation":"明确个性化只控制图表/说明，不改变有效订单状态等统计口径。"},{"line":34,"annotation":"把历史摘要与常问模式标为背景，禁止将历史数字当作当前任务统计依据。"},{"line":35,"annotation":"注释强调每次新任务必须查询当前数据；模型记忆不充当数字来源。"},{"line":36,"annotation":"首次图 State 明确放 task_id、dataset_id、原问题；工具随后从服务端状态拿作用域。"},{"line":37,"annotation":"设置 mode、metrics、空产物和 steps=0，仅首次执行才应使用这些空初值。"},{"line":38,"annotation":"初始化 usage，llm 模式预置 schema_loaded，服务端已提供可信字典。"},{"line":39,"annotation":"传入本次展示偏好及会话标识，不把真实 API key 放入 State。"},{"line":40,"annotation":"消息顺序是系统规则→历史→当前用户问题；历史只帮助理解，不替代新查询。"},{"line":41,"annotation":"持久记忆准备进度及计数，让前端可见加载情况；载荷不含向量原始数据或密钥。"},{"line":42,"annotation":"打开 PostgreSQL checkpoint saver，使用转换后的 DSN；这里是运行代码连接，不是教程读取配置。"},{"line":43,"annotation":"把 saver 交给 build_graph，使节点边界状态可跨 Worker 进程保存。"},{"line":44,"annotation":"thread_id 选择原图状态；recursion_limit 是图遍历保护，不等于模型输出 token 上限。"},{"line":45,"annotation":"读取已保存状态，决定首次、继续或带补充答案恢复。"},{"line":46,"annotation":"注释解释三种输入路径，不能每次重置成初始 State。"},{"line":47,"annotation":"注释解释重置会覆盖已保存产物、工具结果和暂停位置。"},{"line":48,"annotation":"注释解释不要在恢复前提前清空 resume_payload，否则崩溃重投会丢用户答案。"},{"line":49,"annotation":"有答案且 saved.next 有暂停/后继时用 Command；无答案但有状态传 None；全新任务才传 initial。"},{"line":50,"annotation":"重新进入同一个绝对 deadline；前面已耗掉的准备时间不会被重新补满。"},{"line":51,"annotation":"等待图运行至 END 或 interrupt；工具返回和校验结果保存在图 State/checkpoint 中。"},{"line":52,"annotation":"检查框架保留的 __interrupt__ 结果，而不是把等待用户当异常失败。"},{"line":53,"annotation":"注释说明暂停会结束本次 Worker 占用，用户答复后再由消息启动新执行。"},{"line":54,"annotation":"取第一个暂停值中的澄清问题，交给数据库和前端展示。"},{"line":55,"annotation":"行锁内把状态改 waiting_input，同时准备澄清文案；若取消先提交会返回 False。"},{"line":56,"annotation":"清空已消费答案并附 waiting_input 事件，状态与事件原子提交。"},{"line":57,"annotation":"状态更新拒绝时走 InterruptedError，不能仍显示等待输入覆盖取消。"},{"line":58,"annotation":"没有 interrupt 且有 report 才视为具备交付条件，不以“图正常返回”直接当成功。"},{"line":59,"annotation":"把会话历史收尾包成可补偿步骤，局部失败不阻塞已有报告交付。"},{"line":60,"annotation":"注释说明先试写完整会话报告，再提交成功，尽量让紧接着的新提问能读到。"},{"line":61,"annotation":"before_completion=True 允许在终态提交前写报告原文；该调用和成功提交不是一个共同事务。"},{"line":62,"annotation":"历史写入失败单独捕获，保留当前报告流程。"},{"line":63,"annotation":"保存 memory_pending 提示后台补偿，不暴露底层错误细节，仅记录异常类型。"},{"line":64,"annotation":"在一个行锁事务里写 succeeded、模型 usage 和摘要 usage；取消获胜时不允许迟到成功。"},{"line":65,"annotation":"同时清理恢复答案/澄清文案，并追加 completed，这样 SSE 看到终态时能读到完成事件。"},{"line":66,"annotation":"取消先提交导致 False 时抛取消控制异常，禁止再学成功常问模式。"},{"line":67,"annotation":"注释说明学习是交付之后的附加价值，不应把已交付成功任务改失败。"},{"line":68,"annotation":"单独捕获记忆学习错误，不让它落到外层失败分支。"},{"line":69,"annotation":"学习成功任务的常问模式和历史，内部负责幂等标记及异步向量同步。"},{"line":70,"annotation":"学习失败留给后台恢复，不撤销 succeeded。"},{"line":71,"annotation":"追加待处理事件；因为 completed 已可见，当前 SSE 连接可能已经关闭，应从详情查看晚到事件。"},{"line":72,"annotation":"既未暂停也没有 report 属于不能交付的结果，不接受空成功。"},{"line":73,"annotation":"抛业务 ValueError，外层转 failed；这条约束保护用户不拿到“成功但无报告”。"},{"line":74,"annotation":"InterruptedError 独立处理，避免把用户取消误标失败。"},{"line":75,"annotation":"追加任务已停止事件但不改状态；可能与取消 API 原事件形成两个不同 seq 的 cancelled。"},{"line":76,"annotation":"其他执行错误走失败路径；TimeoutError 在此落入非 ValueError 分支。"},{"line":77,"annotation":"业务 ValueError 可展示截断文字；其他异常只展示类型，详细堆栈写日志。"},{"line":78,"annotation":"失败状态与 failed 事件同事务写；若任务已取消 update_task 会拒绝，取消不被失败覆盖。"},{"line":79,"annotation":"保留堆栈和 task_id 供排查；不要把日志中的敏感输入直接展示给用户。"},{"line":80,"annotation":"无论失败、取消、暂停、成功都执行解锁收尾。"},{"line":81,"annotation":"同一连接对同一 key 释放协作锁（advisory lock）；不能用另一个 Session 来假装释放。"},{"line":82,"annotation":"提交解锁 SQL 事务，再退出 connection 上下文；数据库连接失联同样会释放连接级锁。"}],"keyPoint":"工作流框架保存“执行到哪里”，业务代码决定“能否对用户宣布完成”。"}]}},{"type":"text","text":"**首次 State 与恢复 State 的区别。**首次 initial.artifacts=[]、steps=0、messages=系统+历史+当前问题是合理起点；恢复时如果又把这些空列表传入，会抹去已经保存的工具结果。`saved.values` 代表有保存状态，`saved.next` 是下一步节点名集合；当前代码只有 resume 非空且 next 非空才发 Command，含有旧 values 无答案则传 None。None 不是“没有输入所以什么都不会发生”，而是标准图执行语义中的使用已有线程状态继续。\n\n**可信与不可信数据。**服务器拼入的数据字典与口径是可信约束；历史摘要、常问模式只作为背景，提示中要求统计重新查询。它没有给模型 SQL 写权限，也没有把真实 Key 放 State；提示标注仍不是防提示注入的形式证明，真正执行权限由 SQL/Python 工具层约束。\n\n**交付顺序的精确边界。**图 finalize 已创建 report 文件、登记产物、标交付角色并 emit report_ready；之后 Worker 才 try finish_conversation，再 update_task 成功+completed。会话写入抛异常会记 memory_pending，仍可能成功交付，所以不能绝对承诺“所有 succeeded 都立刻有上一份会话报告”。学习后到事件可能发生在当前 SSE 已关闭之后。config_snapshot.model/max_steps 主要做追溯，并未保证所有调用完全从快照取值。"}]},{"title":"澄清恢复和进程崩溃：checkpoint 不等于业务恰好一次","anchor":"data-tasks-worker-checkpoint","groupTitle":"数据、任务与后台执行","blocks":[{"type":"text","text":"**1. 业务需求**\n\n模型缺关键口径时应等用户，而非猜测；Worker 重启时应尽量从已保存图进度继续，用户不用重新描述全部需求。\n\n**2. 用于理解的最直接方案（不代表项目历史）**\n\n对照方案：一直占住 Worker while 等答案，或等待输入标 failed；任何重启都重新问模型、重新执行全部 SQL。\n\n**3. 它在哪些场景失效**\n\n长等待占执行容量，Worker 重启失去等待状态；用户以为失败重复提交；已生成图表重复产生；外部调用可能在 checkpoint 保存前成功，恢复后又执行一次。\n\n**4. 源码确认的当前实现**\n\n图用 interrupt 保存暂停，Worker 将问题与 waiting_input 同事务发布后结束执行；resume API 存答案+queued，再派原 T；Worker 用相同 thread_id 的 saver 和 Command 恢复。resume_payload 直到图完成或再次暂停才清空；图已完整但任务成功未提交时，saved.values 可用于继续收尾。\n\n**5. 从约束推导方案（设计意图为推断）**\n\n把等待作为持久状态而非活进程，将“用户什么时候回答”与“哪个 Worker 当前存活”解耦。节点恢复需要理解框架会重新进入暂停节点，interrupt 前不得随意放不可重入副作用；业务状态和 checkpoint 双存仍需各自恢复路径。\n\n**6. 可选方案及适用条件**\n\n可选：业务层拆成多个显式阶段任务，答案触发下一阶段不依赖图 interrupt，逻辑更显式但图状态需自行管理；人机工单系统适合长审批和审计。当前 interrupt 适合模型主动澄清并保留工具上下文。\n\n**7. 收益与代价**\n\n收益是暂停不占执行者、答案不因崩溃丢失、重用已保存结果；代价是依赖 checkpoint 数据库、恢复路径更复杂、业务状态和图状态可能短暂不一致。\n\n**8. 保证范围与剩余风险**\n\ncheckpoint 保存节点状态，不把 HTTP 请求、Docker 执行、文件系统和 PG 更新变成一个原子事务；register_artifact 只对同 UUID 去重。测试模拟图已完但 running 的恢复，不等于验证所有任意崩溃点与副作用都无重复。\n\n**9. 面试表达与追问**\n\n回答：“等待用户是可恢复暂停，答案先落库，再按原线程恢复；checkpoint 是进度保证，不是所有外部工具恰好一次。”追问：暂停期间占 Worker 吗？本次执行结束释放；答案何时清空？消费完成或再次暂停后；为什么要同 thread_id？否则会读取另一条图进度。"},{"type":"text","text":"**情境推演：**T 在 clarify 节点 interrupt，数据库 waiting_input，Worker finally 解锁。用户提交“按 delivered 不含运费”，API 在行锁中存答案、改 queued、提交、派 T；Worker 新取锁，读到旧 G、resume、saved.next，Command(resume) 让图回到原执行线程。若发送前 API 崩溃，queued+答案仍在；Beat 可以补发。若图完成后、清答案/成功提交前 Worker 崩溃，resume 仍在，saved.values 仍可收尾；但节点外部副作用的重入要逐项分析，不能拿“有 checkpoint”一概保证。\n\n`tests/integration/test_pipeline.py::test_clarification_checkpoint_resume` 检查 waiting_input→resume→succeeded。`tests/integration/test_recovery.py::test_recovery_after_graph_complete` 完成图后只把任务改 running，再调用 recover_pending/analyze，断言成功且产物数没有增加。后者验证一个具体收尾窗口，不是给所有故障点打包背书；本次仅阅读测试代码，没有实际运行。"}]},{"title":"Beat 如何找回遗留任务：执行锁比 running 字样更可信","anchor":"data-tasks-worker-recover","groupTitle":"数据、任务与后台执行","blocks":[{"type":"text","text":"**1. 业务需求**\n\n数据库可能已 queued 而发送未完成，也可能 Worker 崩溃留下 running；后台需要无需用户反复点击就找回可恢复工作。\n\n**2. 用于理解的最直接方案（不代表项目历史）**\n\n对照方案：定时把所有 running 强制设 queued 重发，或只重发超过固定分钟的任务。\n\n**3. 它在哪些场景失效**\n\n正常慢任务也被重复发送，甚至被标错失败；有些刚创建就丢投递的 queued 不到时间阈值迟迟没人发现；旧 Worker 仍在跑时抢占会制造两执行者。\n\n**4. 源码确认的当前实现**\n\nrecover_pending 查全部 importing、queued/running；导入直接补发由 import 锁挡重复，分析先按同 analysis:T try lock，能取才解锁并补发，不能取则认为仍有执行者。memory_enabled 下额外补 preference/pattern pending/failed 及 succeeded 但未 memory_recorded 的历史/学习。\n\n**5. 从约束推导方案（设计意图为推断）**\n\n状态是业务阶段，不是进程存活信号；连接锁由数据库在断连时释放，能帮助区分仍执行与遗留 running。探测锁必须先释放再发，否则消息立刻到 Worker 时会被探测者自己挡住；执行端重新取锁解决扫描与真正执行之间窗口。\n\n**6. 可选方案及适用条件**\n\n可选：租约+心跳可以提供耗时与故障判断，但要防过期旧执行者继续写；outbox 可专注解决投递窗口；定时扫描仍可作为漏单兜底。分页/按更新时间索引/退避与死信适合任务规模和故障积压增长。\n\n**7. 收益与代价**\n\n收益是 queued 丢投递、running 失联、图完成未发终态都能进入恢复路径；代价是分钟级延迟和扫描/锁探测开销。导入每分钟可能反复补发，真正 import_dataset 拿锁跳过，不等于队列完全无重复。\n\n**8. 保证范围与剩余风险**\n\n没有全量分页、按任务的退避/死信；发送一项异常可中断本轮；先探测后释放再发送不是租约占用，但 Worker 重新锁可排除并行。成功任务历史补偿位于 memory_enabled 分支，关闭记忆时这条补偿也关闭，是应进一步拆分审查的耦合点。\n\n**9. 面试表达与追问**\n\n回答：“扫描先找业务待办，再用与执行者相同协作锁（advisory lock）判断当前是否真的无人执行，最后补发 ID。”追问：running 就一定卡死吗？不是；扫描拿锁是否一直保留到 Worker 接棒？没有，发送前释放，Worker 自己重取；次数计数是成功吗？仅本轮发送调用计数。"},{"type":"callchain","callchain":{"endpoint":"Beat 每 60 秒 → analytics.recover → recover_job → recover_pending → send_task → 执行端再次协作锁（advisory lock）校验","steps":[{"layer":"Recovery","filePath":"backend/workers/tasks.py:121-152","functionName":"recover_pending","explanation":"由 recover_job 经 asyncio.run 调入，无参数；返回 datasets/tasks/memories 发送次数给调度日志，并不更新为全部完成。输入来自 PG 状态，遍历 importing 直接补发，queued/running 先协作锁（advisory lock）探测；示例一个 running T 有存活 Worker 持锁则跳过，另一个 queued Q 没锁则补发。记忆开启时每类同步最多 50 条，未学习成功任务最多 20 条，并尝试历史和学习；未对全部数据集/任务分页，失败发送可中断本轮。排查 Beat 是否运行、消息路由、协作锁（advisory lock）连接和 recover_job 异常，不应无条件把所有 running 强改 queued。","code":"async def recover_pending() -> dict:\n    \"\"\"重新发送待导入或待分析任务。对于 running 任务，只有没有 Worker 持有执行锁时才重新发送。\"\"\"\n    sent = {'datasets': 0, 'tasks': 0, 'memories': 0}\n    async with Session() as session:\n        datasets = list(await session.scalars(select(Dataset).where(Dataset.status == 'importing')))\n        tasks = list(await session.scalars(select(AnalysisTask).where(AnalysisTask.status.in_(['queued', 'running']))))\n    for dataset in datasets:\n        celery_app.send_task('analytics.import', args=[dataset.id])\n        sent['datasets'] += 1\n    for task in tasks:\n        async with engine.connect() as connection:\n            key = 'analysis:' + task.id\n            # running 状态不代表进程已经失联。先尝试获取执行锁，拿不到时说明还有执行者，不重新发送任务。\n            available = await connection.scalar(text('SELECT pg_try_advisory_lock(hashtextextended(:key, 0))'), {'key': key})\n            if available:\n                await connection.execute(text('SELECT pg_advisory_unlock(hashtextextended(:key, 0))'), {'key': key})\n                await connection.commit()\n                celery_app.send_task('analytics.analyze', args=[task.id])\n                sent['tasks'] += 1\n    if get_settings().memory_enabled:\n        # 数据库保留待同步和未学习标记。即使 Redis 发送失败或 Worker 重启，恢复任务仍能发现尚未完成的工作。\n        async with Session() as session:\n            for kind, model in (('preference', UserMemory), ('pattern', QuestionPattern)):\n                pending = list(await session.scalars(select(model).where(model.sync_status.in_(['pending','failed'])).limit(50)))\n                for row in pending:\n                    enqueue(kind + ':' + row.id)\n                    sent['memories'] += 1\n            completed = list(await session.scalars(select(AnalysisTask.id).where(AnalysisTask.status == 'succeeded', AnalysisTask.config_snapshot['memory_recorded'].astext.is_(None)).limit(20)))\n        for identifier in completed:\n            await finish_conversation(identifier)\n            await learn_task(identifier)\n    return sent","language":"python","lineAnnotations":[{"line":1,"annotation":"由每分钟 Celery recover_job 调用；返回本轮发送计数，不代表任务成功完成数。"},{"line":2,"annotation":"说明任务状态只是线索，还要查看执行锁来判断 running 是否仍有执行者。"},{"line":3,"annotation":"三个计数字段分别记录数据集、分析和记忆补发尝试。"},{"line":4,"annotation":"短会话读取待恢复清单，后续投递不持有这个查询事务。"},{"line":5,"annotation":"所有 importing 数据集都进入本轮列表，目前未分页或限量。"},{"line":6,"annotation":"所有 queued/running 分析任务进入列表，waiting_input 不自动恢复以免绕过用户澄清。"},{"line":7,"annotation":"遍历导入任务；这里不先探测 import 锁，真正 import_dataset 会尝试锁并去重。"},{"line":8,"annotation":"发送已存在数据集 ID，当前调用没有像 dispatch 那样局部 catch 发送异常。"},{"line":9,"annotation":"发送调用成功后计数加一；若后续未执行，这不是 ready 数。"},{"line":10,"annotation":"逐个检查候选分析任务是否仍被有效执行者持锁。"},{"line":11,"annotation":"为当前探测保留单独连接，以便取得后立刻释放连接级锁。"},{"line":12,"annotation":"使用与 analyze 完全相同的键名规则，才检查的是同一执行互斥锁。"},{"line":13,"annotation":"注释强调 running 不等于卡死；只看状态贸然补发会制造重复队列流量。"},{"line":14,"annotation":"try lock 成功代表此瞬间无持锁执行者；不是永久预占或租约心跳证明。"},{"line":15,"annotation":"只有当前可取得锁时才补发。"},{"line":16,"annotation":"先释放探测锁，否则 Worker 立即收到消息也拿不到锁；发送后仍需 Worker 再取锁。"},{"line":17,"annotation":"提交解锁事务，保持锁释放过程完整。"},{"line":18,"annotation":"发送同一个 task.id，Worker 再次判断状态、执行锁和 checkpoint，而不是新建任务。"},{"line":19,"annotation":"增加补发次数，不能拿它当成功次数或重试总上限。"},{"line":20,"annotation":"下面包含向量同步及成功任务历史/学习补偿，只有 memory_enabled 时运行。"},{"line":21,"annotation":"注释说明待同步/未学习标记在数据库持久化，不依赖进程内待办列表。"},{"line":22,"annotation":"短会话批量读取记忆同步待办。"},{"line":23,"annotation":"对 preference 与 pattern 两种 ORM 表使用同样待同步流程。"},{"line":24,"annotation":"每类只取 pending/failed 前 50 条；没有显式排序及退避，长期失败条目可能反复占用名额。"},{"line":25,"annotation":"遍历当前批待同步记忆。"},{"line":26,"annotation":"用 类型:ID 的引用派发独立记忆队列，不在这个分析恢复循环直接做嵌入网络请求。"},{"line":27,"annotation":"记录同步投递尝试；enqueue 本身也可能降级而不是保证成功入队。"},{"line":28,"annotation":"取最多 20 个 succeeded 且没有 memory_recorded 的任务；JSONB 缺键 as text 为空用于筛选。"},{"line":29,"annotation":"离开查询会话后逐个修复成功任务的历史与学习。"},{"line":30,"annotation":"先补会话报告；即使任务已 succeeded，也要保证后续会话能读到历史。"},{"line":31,"annotation":"再学常问模板，内部幂等标记防止重复累计成功任务。"},{"line":32,"annotation":"返回本轮汇总；前面某次 send_task 或收尾异常可中断整轮，需查看 Beat/Worker 日志。"}],"keyPoint":"补发不是重新创建；状态、执行锁和 checkpoint 共同决定能否继续。"}]}}]},{"title":"八个事故如何讲清、可靠性边界与面试自测","anchor":"data-tasks-worker-interview","groupTitle":"数据、任务与后台执行","blocks":[{"type":"text","text":"**1. 两 Worker 收到同 T。**第一个拿 analysis:T 锁，第二个 try 返回 False 直接结束；第一个提交普通状态事务不会释放协作锁（advisory lock）。第一个连接断开数据库释放锁，恢复者可能接管，但旧外部调用是否仍继续需要具体分析，不能承诺分布式 fencing。\n\n**2. 批量工具一项失败。**普通工具错误应反馈给模型作修正，图是否继续由工具/决策节点决定，Worker 只观察最终图结果；取消控制异常传播到 Worker 的 InterruptedError 分支。并发兄弟协程取消与 gather 清理属于工具执行章，不能归功于 Celery 自动完成。\n\n**3. 即将成功时取消。**最终 update_task 锁内检查让取消先提交则拒绝成功/完成事件；普通步骤仍可能晚到。产物文件可能已经生成，应保留来源并由下载权限控制，不能把取消等同于所有物理文件已删除。\n\n**4. 用户补充后恢复。**答案先持久化原任务，不换图线程；用 Command(resume) 区别首次 initial。拿不到暂停点却硬重置初态可能覆盖已有工作，应查 saved.next/values、thread_id 和任务状态。\n\n**5. 浏览器断线。**网络订阅退出，独立 Worker 继续；重连补读数据库事件。这和 Python 协程被取消、Celery 进程退出是不同层的故障，别混为一谈。\n\n**6. 长对话摘要失败。**会话管理保留旧摘要/游标并返回可控历史，图输入管理也有预算保护；Worker 本身不是摘要算法，负责给准备和 graph 两段同一 deadline。原文仍保存，具体摘要游标成功才推进见上下文章。\n\n**7. Milvus 不可用或旧记忆。**PG 偏好/版本是事实源，向量候选需回 PG 校验；查询可降级，后续 memory_sync 独立队列补偿。它不影响订单 SQL 数据是否可读；不要把“有向量召回”误说为数值答案从记忆直接取。\n\n**8. SQL 可执行但口径错。**数据库成功和图未抛异常不代表分析正确；固定指标工具、口径约束、结果校验与评测另行提供保护。Worker 必须有 report 才成功，但不能从 report 字段存在推导数字必定准确。\n\n**当前风险清单（基于静态代码，非本次运行复现）：**长期锁连接增加连接预算；PG/Redis/文件/checkpoint 多存储无共同事务；恢复扫描无分页、退避/死信和细粒度故障隔离；memory_enabled 与历史补偿耦合；部分 config_snapshot 只追溯未驱动运行；任务 timeout 不覆盖全部收尾；emit_event 可在终态后追加；update_task 未实现全终态迁移约束。改进可按业务规模优先引入 outbox/提交幂等键、独立事件表、独立历史补偿、明确 deadline 覆盖和监控；这不是声称目前已实现。\n\n**测试边界。**`test_tool_failure_then_repair` 首次危险 SQL 后给演示适配器正确调用，证明反馈链可修正一个特定失败；`test_steps_budget_terminates` 连续错误到步骤上限停止；它们使用 demo/mock，不能证明任意真实模型都会修正。真正效果评测需要独立基准、完整交付定义、同分母比较；本章不重新运行付费模型、数据库集成或 Docker 测试。\n\n**30 秒回答：**“Celery 的消息允许重复，Worker 先用 PG 连接协作锁（advisory lock）保证同任务当前单执行者，再按数据库状态与 LangGraph checkpoint 恢复。等待用户释放 Worker，答案持久化后按原线程继续。Beat 扫遗留任务补发，业务成功和完成事件原子发布；边界是外部副作用并非恰好一次。”\n\n**2 分钟展开：**“API 提交任务只发 ID，Redis 是调度触发器，PG 是状态真相。Worker 收到重复消息用非等待 advisory lock 跳过，再看任务是否已结束；用短行锁写运行状态但不长锁任务行，所以取消还能进来。准备记忆和历史后打开标准 AsyncPostgresSaver，首次 initial、已有状态 None、有答案暂停点 Command(resume)，避免从零覆盖已做结果。图 interrupt 则 waiting_input，用户答后同 T/G 再运行；有报告先试写会话，成功状态与 completed 同事务提交，学习在后且失败降级。Beat 看 queued/running 并尝试同锁来找失联工作。late ACK 和 checkpoint 分别解决消息恢复与图进度，不能替代 SQL、文件等副作用幂等；现阶段还需要 outbox、分页/退避、完整迁移和更充分故障测试。”\n\n**自测与参考答案。**1. 为什么不全程 FOR UPDATE？会阻塞取消和事件；长协作锁（advisory lock）互斥执行，短行锁更新共享记录。2. commit 为什么协作锁（advisory lock）还在？使用连接级而非事务级 advisory lock，直到显式 unlock/断连。3. 同 T 来两消息都能进入 graph 吗？正常同键协议下只有拿锁者进入。4. checkpoint 能防止重复扣款吗？不能；扣款必须有业务幂等键/外部幂等接口等，本项目也未提供扣款功能。5. 超时是否覆盖整个 analyze？没有，两个 timeout_at 共享截止点但包围范围有限。6. visibility_timeout 与 task_timeout 区别？前者 broker 未 ACK 消息重见，后者应用执行预算。7. Beat 补发失败会自动全局永久重试吗？后续调度可再扫，但当前无完善死信/退避与发送逐项隔离，不应承诺永久可靠完成。8. memory_enabled=False 为何要关注历史？现有成功任务历史补偿在该分支内，关闭记忆会一起跳过这条补偿，建议拆分。"}]}]},{"id":"agent-protocol","title":"08 Agent 如何把自然语言变成可验证的行动","sections":[{"title":"先理解背景：模型提出动作，程序承担执行责任","anchor":"agent-protocol-foundation","groupTitle":"Agent 如何把自然语言变成可验证的行动","blocks":[{"type":"text","text":"**本章解决的问题**：为什么这不是一个让模型回答销售问题的普通聊天框？**前置知识**：Python字典、函数调用和HTTP；后文会解释图、状态与工具协议。**位置**：API已创建任务，Worker正在运行Agent。**读完应能回答**：模型究竟控制什么，程序又必须保留什么决定权？\n\n用户说“分析2017年10月至11月销售趋势并画折线图”，模型并不能直接看见整个数据库。系统给模型可信表结构和已确认口径，模型返回一个结构化工具请求；服务端执行真实查询，产生文件和引用，再把结果摘要交回模型。这个“决策→执行→观察→再决策”的循环才是此项目Agent的主要行为。完整结果文件是数字依据，模型文字是有条件接受的解释。\n\n**从需求推导设计**：业务要的是可下载、可追溯的分析结果；约束是模型会产生错误SQL、错误数字或过早结束。最直接的对照方案是“把问题交给模型，让它生成SQL和答案后直接展示”，但数据库执行错误、无依据数字和遗漏用户要求会直接进入交付。因此当前源码把模型决策、工具执行、要求核验和报告构建拆成不同节点。这样失败能回到模型修复，finish也只能申请校验，不能自行宣布任务成功。\n\n**源码事实与推断分开**：图节点与条件边可以从 graph.py 直接确认；“把交付责任留给程序”是根据这些门槛推断的设计意图，不是代码作者留下的正式设计记录。另一种合理方案是用预制工作流始终执行固定几步，优点是成本和行为更可预期，适合固定报表；另一种是直接使用完整预制ReAct Agent，优点是减少编排代码，但项目仍需包入权限、口径、取消和交付核验。当前方案的收益是业务门槛清楚，代价是更多自定义节点与故障状态。\n\n**贯穿案例的起点**：订单数据已ready，task_id固定当前任务，dataset_id固定数据快照，question包含日期和图表要求，metrics包含valid_status和currency。注意 currency 只是报告金额标签，BRL是巴西雷亚尔；此代码不提供汇率换算。稍后模型选sales_metrics，程序产生一张完整表和折线图，再finish，核验完成后生成报告。\n\n**能保证/不能保证**：程序限定可执行工具与交付必要条件，不保证模型总能选到最佳方案，也不保证任意SQL业务含义正确。简历可以说“模型自主选择已注册工具，程序实施权限和结果核验”，不能说“模型自主访问任意服务”或“完全消除幻觉”。"}]},{"title":"状态、节点与条件边：先看真正的完整闭环","anchor":"agent-graph","groupTitle":"Agent 如何把自然语言变成可验证的行动","blocks":[{"type":"text","text":"**背景知识**：图不是流程图图片，而是可运行的状态转换。State像一次任务共享的数据袋；节点读取它并返回更新；边决定下一步。AnalysisState使用TypedDict(total=False)，表示未执行到的字段可以不存在，它不做Pydantic式运行时检查。源码没有给messages配置自动追加reducer，所以每个节点追加历史时必须返回“旧列表+新增”，不是只返回新的一条。\n\n**真实链路**：Worker.analyze → build_graph(checkpointer) → START→context→decide→按action分流。普通业务与tool_batch进tools，澄清进clarify，finish进verify；tools/clarify回context，verify失败回context、成功进finalize→END。checkpointer保存执行状态；用户、业务数据和跨任务对话由应用表管理。短期checkpoint不是长期记忆Store，不能把二者混成同一个组件。\n\n**为何context每次都在决策前**：工具反馈本身也占窗口，首轮预算正确不意味着下一轮正确。若只在请求开始做一次摘要，后续多工具结果不断累积仍可能超限。代价是每轮都要做预算整理与必要摘要。最简单的替代方案是只保留最近N条消息，但工具调用与结果可能被切断，且早期用户要求可能丢失；摘要需要保留约束、并保持工具协议配对。\n\n读代码时先找route_action的分流，再找route_verification的verified，最后看外层Worker如何发布succeeded：图END不等于数据库已经提交最终成功。"},{"type":"callchain","callchain":{"endpoint":"analyze → build_graph → context → decide → tools / clarify / verify → finalize","steps":[{"layer":"Agent / 工具 / 受限执行","filePath":"backend/agent/graph.py:22-41","functionName":"build_graph","explanation":"调用者是 Worker 中的 analyze，传入已经打开的 PostgreSQL checkpointer。函数不执行分析，而是返回可调用的编译图；Worker 再用 thread_id 调用 ainvoke 恢复或开始一次任务。节点名称由程序注册，模型只能通过工具动作影响已定义的条件边，不能凭文本增加系统权限。副作用主要是构造内存对象，真正的 checkpoint 写入发生在运行图时。例：sales_metrics 动作走 tools→context→decide，finish 走 verify，失败回 context，成功进 finalize。故障时先核对 action.name、verified 以及保存的 next，不要把图定义与图执行混为一谈。","code":"def build_graph(checkpointer):\n    \"\"\"创建分析流程，并接入保存执行进度和暂停等待用户的能力。\"\"\"\n    graph = StateGraph(AnalysisState)\n    graph.add_node('context', manage_context)\n    graph.add_node('decide', decide)\n    graph.add_node('tools', execute_tool)\n    graph.add_node('clarify', clarify)\n    graph.add_node('verify', verify)\n    graph.add_node('finalize', finalize)\n    # 每轮先整理符合长度限制的上下文，再让模型选择工具。模型不能自行增加执行节点。\n    graph.add_edge(START, 'context')\n    graph.add_edge('context', 'decide')\n    graph.add_conditional_edges('decide', route_action)\n    # 工具执行后把结果交给模型，让模型根据结果决定下一步，从而形成多轮分析循环。\n    graph.add_edge('tools', 'context')\n    graph.add_edge('clarify', 'context')\n    graph.add_conditional_edges('verify', route_verification)\n    graph.add_edge('finalize', END)\n    # checkpointer 保存图中各节点的状态和暂停位置。用户账号和跨任务聊天历史由其他表保存。\n    return graph.compile(checkpointer=checkpointer)","language":"python","lineAnnotations":[{"line":1,"annotation":"定义 build_graph；普通函数在当前线程完成本步骤；类型标注表达接口约定，不会自动做业务验证。"},{"line":2,"annotation":"函数职责约定：创建分析流程，并接入保存执行进度和暂停等待用户的能力。；下面以实际语句核对这个约定。"},{"line":3,"annotation":"以 AnalysisState 声明图的状态字段；它是 TypedDict 类型约定，不是自动运行时校验器。"},{"line":4,"annotation":"注册上下文节点，把长历史变成本轮允许发送的输入。"},{"line":5,"annotation":"注册决策节点；只有这里向模型请求下一步动作。"},{"line":6,"annotation":"注册业务工具节点；内部再交给标准 ToolNode 执行。"},{"line":7,"annotation":"注册人工澄清节点；它可通过 interrupt 暂停任务。"},{"line":8,"annotation":"注册结果核验节点；finish 请求不能直接绕过检查生成报告。"},{"line":9,"annotation":"注册最终文件生成节点，将已验证结果变成可下载报告。"},{"line":10,"annotation":"作者在这里强调的顺序或边界：每轮先整理符合长度限制的上下文，再让模型选择工具。模型不能自行增加执行节点。"},{"line":11,"annotation":"初次进入图先做上下文预算，否则第一轮也可能超过窗口。"},{"line":12,"annotation":"上下文准备完成后才允许模型读取本轮消息。"},{"line":13,"annotation":"根据 route_action 返回值选择 tools、clarify 或 verify，而不是固定调用某一个工具。"},{"line":14,"annotation":"作者在这里强调的顺序或边界：工具执行后把结果交给模型，让模型根据结果决定下一步，从而形成多轮分析循环。"},{"line":15,"annotation":"工具返回后重新整理上下文，避免工具输出使下一轮超预算。"},{"line":16,"annotation":"用户补充信息后也重新整理上下文，让新要求进入后续决策。"},{"line":17,"annotation":"按核验结果分流；失败重新决策，成功才生成报告。"},{"line":18,"annotation":"报告节点完成后图结束；任务的 succeeded 发布仍由外层 Worker 负责。"},{"line":19,"annotation":"作者在这里强调的顺序或边界：checkpointer 保存图中各节点的状态和暂停位置。用户账号和跨任务聊天历史由其他表保存。"},{"line":20,"annotation":"编译时绑定外部 saver，使同一 thread_id 的图状态可在进程重启后继续读取。"}],"keyPoint":"模型负责选择下一步，程序负责限定能走的路和交付门槛。"},{"layer":"Agent / 工具 / 受限执行","filePath":"backend/agent/graph.py:12-14","functionName":"route_action","explanation":"调用者是图的条件边，输入为 decide 更新后的状态。它只返回已定义的节点名，不执行工具；默认分支覆盖普通业务工具和 tool_batch，后者在工具节点内部拆分。例：action.name='finish' 返回 verify，action.name='sales_metrics' 返回 tools。缺失 action 是上游协议问题，不应在这里悄悄当成完成。","code":"def route_action(state: dict) -> str:\n    \"\"\"读取模型选择的动作，决定接下来执行工具、询问用户，还是检查分析结果。\"\"\"\n    return {'ask_clarification': 'clarify', 'finish': 'verify'}.get(state['action']['name'], 'tools')","language":"python","lineAnnotations":[{"line":1,"annotation":"定义 route_action；普通函数在当前线程完成本步骤；类型标注表达接口约定，不会自动做业务验证。"},{"line":2,"annotation":"函数职责约定：读取模型选择的动作，决定接下来执行工具、询问用户，还是检查分析结果。；下面以实际语句核对这个约定。"},{"line":3,"annotation":"用动作名查两个控制分支，未知或业务动作走 tools；真正未知工具还会被 ToolNode 拒绝。"}],"keyPoint":"finish 是校验申请，不能直接映射到报告生成。"}]}},{"type":"text","text":"**失败推演**：模型拿到表后直接finish但用户要求的图还没生成，route_action先送verify，verify返回verified=False，条件边回context，模型看具体错误后补绘图。不能为了“响应更快”删掉verify，这会把“工具成功”误当“用户目标完成”。\n\n**小自测**：为什么普通工具后回context而不是直接decide？答案：工具结果使消息体积变化，下一次模型请求必须重新检查输入预算；完整messages仍保留，request_messages可以更短。"}]},{"title":"复用bind_tools：为什么还保留项目自己的动作结构","anchor":"agent-framework-protocol","groupTitle":"Agent 如何把自然语言变成可验证的行动","blocks":[{"type":"text","text":"**背景知识**：函数调用协议把“请帮我查询”转成name、参数和调用ID三部分。LangChain的@tool从函数签名生成schema，ChatOpenAI.bind_tools让模型知道有哪些工具，响应由框架解析为AIMessage.tool_calls。工具调用ID相当于一轮中的收据号，结果必须用同一个ID返回ToolMessage；两个同名SQL仍是两张不同收据。\n\n**直接方案的故障**：手写JSON提取、取response.tool_calls[0]、再按工具名匹配结果，看似少几行，却会丢同轮第二个调用；模型下一轮看到未配对的assistant工具请求还可能拒绝处理。当前model_action完整保留所有标准调用，再映射成项目可持久化action或tool_batch，目的是让已有图控制节点与旧checkpoint兼容，而不是重写框架解析器。\n\n**明确分工**：框架负责schema生成、标准消息与JSON工具参数解析；项目负责预算、有限重试、动作路由、任务权限、统计口径和交付要求。ProviderChatOpenAI只在super()处理后保存reasoning_content，并在请求组装后回放该字段；工具调用解析仍继承框架。这个兼容层确实依赖上游下划线方法，升级LangChain应通过协议测试核对，不能声称它是无维护成本的扩展。\n\n**调用者/数据去向**：decide调用model_action，后者返回(action,messages,increment)。decide累计steps和用量并发持久事件；前端收到的是model_started/model_completed/decision等步骤事件，这里使用ainvoke完整响应，不是逐token推送。"},{"type":"callchain","callchain":{"endpoint":"decide → model_action → ProviderChatOpenAI.bind_tools → ainvoke → AIMessage → action","steps":[{"layer":"Agent / 工具 / 受限执行","filePath":"backend/agent/model.py:66-72","functionName":"model_parameters","explanation":"由 model_action 构建 ProviderChatOpenAI 时调用，输入来自 Settings 的非敏感生成参数，返回字典被 ** 展开。max_retries=0 是关键：项目在外层统一限制三次总尝试，避免 SDK 重试乘上业务重试。硅基流动的思考开关通过 extra_body 传输，其他提供商收到空扩展体；模型名称仍需与实际服务能力匹配。例：协议不返回 tool_calls 时走业务纠正，不等于 SDK 网络重试。","code":"def model_parameters() -> dict:\n    \"\"\"返回框架模型的生成参数，平台字段放入 extra_body，不包含密钥。\"\"\"\n    settings = get_settings()\n    return {'model': settings.model_name, 'temperature': settings.model_temperature,\n            'max_tokens': settings.model_max_tokens, 'timeout': settings.model_timeout_seconds,\n            'max_retries': 0,\n            'extra_body': {'enable_thinking': settings.model_enable_thinking} if settings.model_provider == 'siliconflow' else {}}","language":"python","lineAnnotations":[{"line":1,"annotation":"定义 model_parameters；普通函数在当前线程完成本步骤；类型标注表达接口约定，不会自动做业务验证。"},{"line":2,"annotation":"函数职责约定：返回框架模型的生成参数，平台字段放入 extra_body，不包含密钥。；下面以实际语句核对这个约定。"},{"line":3,"annotation":"从缓存配置读取模型参数，此处不展示或返回密钥。"},{"line":4,"annotation":"返回模型名称与采样温度，让模型实例采用配置的生成行为。"},{"line":5,"annotation":"同时设置输出 token 上限和单次网络等待时间；它们不等同于任务总时限。"},{"line":6,"annotation":"关闭 SDK 自动重试，让 model_action 的三次循环成为唯一外层请求计数器。"},{"line":7,"annotation":"仅在 siliconflow 提供商下注入 enable_thinking；extra_body 是兼容接口扩展字段容器。"}],"keyPoint":"重试只在一层计数，才能估算最坏响应时间。"},{"layer":"Agent / 工具 / 受限执行","filePath":"backend/agent/model.py:75-132","functionName":"model_action","explanation":"由 decide 调用。输入的 request_messages 是预算内视图，messages 是完整任务历史；两者不能相互覆盖。返回 action、完整历史新版本和本轮累计 usage，分别由 decide 写回图状态及任务用量。核心顺序是先绑定框架工具定义，再预算检查、调用模型、检查 JSON 和调用 ID，最后完整保存所有调用；没有通过协议检查的内容不会进入执行器。例：同一响应产生 sales_metrics(call_a) 与 customer_repeat_metrics(call_b)，action.calls 有两项，原 assistant 消息也保留两项，下一轮必须配对两份 ToolMessage。遇到 401/模型不支持工具时立即失败，429/连接故障最多三次；纯文字纠正同样消耗这三次预算。","code":"async def model_action(state: dict) -> tuple[dict, list[dict], dict]:\n    \"\"\"通过 bind_tools/ainvoke 获得全部标准工具调用，有限修正纯文字响应并累计用量。\"\"\"\n    settings = get_settings()\n    if not settings.model_api_key:\n        raise ValueError('尚未配置 MODEL_API_KEY，请使用演示模式或填写 .env')\n    messages = list(state.get('request_messages', state['messages']))\n    corrections, repairs, accumulated = [], 0, {}\n    started = time.perf_counter()\n    # SDK 重试关闭，由此处统一限制网络重试与协议纠正的总次数，避免两层重试相乘。\n    async with create_http_client() as client:\n        model = ProviderChatOpenAI(**model_parameters(), api_key=settings.model_api_key,\n            base_url=settings.model_base_url, http_async_client=client)\n        bound = model.bind_tools(MODEL_TOOLS, tool_choice='auto')\n        for attempt in range(3):\n            if estimate_tokens(messages) + estimate_tokens(TOOLS) + settings.model_max_tokens + 500 > settings.model_context_tokens:\n                raise ValueError('上下文超过保守预算；未截断本次问题')\n            try:\n                standard_messages = convert_to_messages(messages)\n                for original, standard in zip(messages, standard_messages):\n                    if original.get('reasoning_content') is not None:\n                        standard.additional_kwargs['reasoning_content'] = original['reasoning_content']\n                response = await bound.ainvoke(standard_messages)\n                usage = response.response_metadata.get('token_usage') or {}\n                for key in ('total_tokens', 'prompt_tokens', 'completion_tokens'):\n                    accumulated[key] = accumulated.get(key, 0) + int(usage.get(key) or 0)\n                if response.invalid_tool_calls:\n                    raise ValueError('模型工具参数不是合法 JSON；未执行不完整调用')\n                if not response.tool_calls:\n                    if attempt == 2:\n                        raise ValueError('模型连续未返回工具调用；未采用未经验证的文字回答')\n                    repairs += 1\n                    if not corrections:\n                        corrections = [{'role': 'user', 'content': '刚才的纯文字响应未被采用。请返回工具调用：无当前依据先查询，缺条件时澄清，有完整产物再 finish。不得直接复用历史答案。'}]\n                        messages = [*messages, *corrections]\n                    continue\n                ids = [call['id'] for call in response.tool_calls]\n                if any(not identifier for identifier in ids) or len(ids) != len(set(ids)):\n                    raise ValueError('模型工具调用 ID 缺失或重复，无法可靠配对结果')\n                calls = [{'name': call['name'], 'arguments': call['args'], 'call_id': call['id']}\n                         for call in response.tool_calls]\n                # 不再取 calls[0] 丢掉其他调用。旧单调用 checkpoint 仍能按原 action 结构恢复。\n                action = calls[0] if len(calls) == 1 else {'name': 'tool_batch', 'calls': calls}\n                assistant = convert_to_openai_messages(response)\n                if response.additional_kwargs.get('reasoning_content') is not None:\n                    assistant['reasoning_content'] = response.additional_kwargs['reasoning_content']\n                increment = {**accumulated, 'protocol_repairs': repairs,\n                    'model_seconds': round(time.perf_counter() - started, 3), 'http_attempts': attempt + 1}\n                return action, [*state['messages'], *corrections, assistant], increment\n            except openai.APIStatusError as error:\n                if error.status_code not in (429, 500, 502, 503, 504):\n                    raise ValueError(f'模型接口返回 {error.status_code}，请检查模型、地址和工具支持') from None\n                if attempt == 2:\n                    raise ValueError('模型接口暂时不可用，有限重试后失败') from None\n            except openai.APIConnectionError:\n                if attempt == 2:\n                    raise ValueError('模型接口暂时不可用，有限重试后失败') from None\n            await asyncio.sleep(2 ** attempt)\n    raise RuntimeError('模型调用未完成')","language":"python","lineAnnotations":[{"line":1,"annotation":"定义 model_action；async 表示调用后获得协程，调用者需 await 才能取得本步骤结果。"},{"line":2,"annotation":"函数职责约定：通过 bind_tools/ainvoke 获得全部标准工具调用，有限修正纯文字响应并累计用量。；下面以实际语句核对这个约定。"},{"line":3,"annotation":"获取当前配置；模型选择与窗口大小在这里实际生效。"},{"line":4,"annotation":"在发出请求前检查是否配置 API Key，避免把缺配置误判为网络问题。"},{"line":5,"annotation":"明确指出缺少配置；这只是错误文字，教程不会读取实际 .env。"},{"line":6,"annotation":"优先复制预算内 request_messages；若没有该视图则复制完整历史，防止后续纠正直接改写原列表。"},{"line":7,"annotation":"初始化纠正消息、协议修复次数和各类 token 的累计字典。"},{"line":8,"annotation":"用单调性能计时器记录本轮所有尝试的总耗时。"},{"line":9,"annotation":"作者在这里强调的顺序或边界：SDK 重试关闭，由此处统一限制网络重试与协议纠正的总次数，避免两层重试相乘。"},{"line":10,"annotation":"异步上下文保证正常结束或异常时关闭 HTTP 连接资源。"},{"line":11,"annotation":"用统一参数创建框架模型；密钥只用于该客户端，不写入图状态。"},{"line":12,"annotation":"绑定服务地址和可替换 HTTP 客户端，测试可注入 MockTransport 而无需付费调用。"},{"line":13,"annotation":"bind_tools 将同一组 @tool 定义转成模型协议；auto 允许模型选零个、一个或多个调用。"},{"line":14,"annotation":"网络失败和纯文字纠正共用最多三次尝试，不各自无限循环。"},{"line":15,"annotation":"将消息、工具 schema、最大输出与 500 余量一起估算，不能只数聊天正文。"},{"line":16,"annotation":"预算不足明确失败，不从当前用户问题中静默裁剪。"},{"line":17,"annotation":"将接口调用纳入可分类重试范围，参数或协议错误不会统一吞掉。"},{"line":18,"annotation":"把可持久化的字典消息转成 LangChain 标准消息对象。"},{"line":19,"annotation":"按位置配对原始字典与框架消息，以补充提供商兼容字段。"},{"line":20,"annotation":"只有原历史确实带 reasoning_content 时才附加，避免凭空构造推理内容。"},{"line":21,"annotation":"把推理字段放在 additional_kwargs，由兼容层回传给要求它的服务商。"},{"line":22,"annotation":"ainvoke 发出一次完整工具决策请求；这里没有逐 token 向前端流式发送。"},{"line":23,"annotation":"从标准响应 metadata 取服务商用量，缺失时使用空字典。"},{"line":24,"annotation":"分别累计总输入输出三个指标，使重试消耗也可观察。"},{"line":25,"annotation":"兼容缺失或 None 的计数，按整数累加到本轮统计。"},{"line":26,"annotation":"框架已将不合法工具 JSON 标记到 invalid_tool_calls，先拒绝再执行。"},{"line":27,"annotation":"不执行无法完整解析的参数，避免把残缺 JSON 猜成查询或代码。"},{"line":28,"annotation":"检查模型是否真的返回工具调用，普通文字不是这个工作流的完成协议。"},{"line":29,"annotation":"第三次仍无工具时不再修复。"},{"line":30,"annotation":"报告协议失败，保持结果依据门槛，而不是把最后一段文字直接交付。"},{"line":31,"annotation":"记录发生一次纯文字协议修复。"},{"line":32,"annotation":"纠正提示只追加一次，避免每次失败不断扩张上下文。"},{"line":33,"annotation":"构造明确的纠正要求：查询、澄清或在有完整产物后 finish，历史答案不能当本次证据。"},{"line":34,"annotation":"仅本次请求消息加纠正提示，原始历史还会在成功返回时完整合并。"},{"line":35,"annotation":"重新进入下一次尝试；此分支不经过末尾网络退避。"},{"line":36,"annotation":"提取全部工具调用的 ID，用来建立结果配对关系。"},{"line":37,"annotation":"任一 ID 为空或重复都会导致反馈归属不确定，因此整体拒绝。"},{"line":38,"annotation":"明确报协议错误，不能靠顺序猜两个同名调用谁对应哪个结果。"},{"line":39,"annotation":"把框架 name/args/id 映射到项目内部动作结构，arguments 不再自行解析 JSON。"},{"line":40,"annotation":"遍历 response.tool_calls 的全部元素，保证没有仅保留第一项的问题。"},{"line":41,"annotation":"作者在这里强调的顺序或边界：不再取 calls[0] 丢掉其他调用。旧单调用 checkpoint 仍能按原 action 结构恢复。"},{"line":42,"annotation":"单调用沿用兼容结构，多调用使用 tool_batch 包住完整 calls 列表。"},{"line":43,"annotation":"把完整 AIMessage 转回可序列化字典，供 checkpoint 和下轮模型协议使用。"},{"line":44,"annotation":"检查兼容层是否保留了服务商推理字段。"},{"line":45,"annotation":"回写这个字段以便下一轮重放，字段不作为页面分析解释展示。"},{"line":46,"annotation":"用累计 token、修复次数构建本轮观测数据。"},{"line":47,"annotation":"耗时覆盖所有尝试，http_attempts 使用一基计数，便于定位响应慢在哪里。"},{"line":48,"annotation":"返回动作、保留原历史的追加结果和用量；调用者 decide 分别接收三项。"},{"line":49,"annotation":"按 HTTP 状态分类接口异常，而不是遇到所有错误都重试。"},{"line":50,"annotation":"只对限流和部分服务端错误重试；认证、参数、模型不存在通常应立即修配置。"},{"line":51,"annotation":"向用户反馈状态码而非原始完整异常，避免敏感请求信息进入错误内容。"},{"line":52,"annotation":"第三次发生可重试状态时结束循环。"},{"line":53,"annotation":"把重试耗尽变成明确的业务失败，而不是无限占用 Worker。"},{"line":54,"annotation":"单独处理连接错误，允许短暂网络故障恢复。"},{"line":55,"annotation":"连接错误也遵守同一三次尝试上限。"},{"line":56,"annotation":"最后一次连接仍失败时返回清楚的错误。"},{"line":57,"annotation":"第一次失败等待 1 秒、第二次等待 2 秒；异步 sleep 不阻塞事件循环。"},{"line":58,"annotation":"防御性终点：若没有成功返回或预期异常，不能返回不完整三元组。"}],"keyPoint":"模型响应中的全部工具调用和调用 ID 都必须保留，纯文字不直接作为未经核验的最终答案。"}]}},{"type":"text","text":"**具体例子**：模型响应包含call_sales:sales_metrics({group_by:'total'})和call_repeat:customer_repeat_metrics({})。action变tool_batch、calls长度2；历史assistant消息tool_calls长度也是2。执行完必须出现tool_call_id分别为call_sales和call_repeat的两条反馈，模型才知道每项是否完成。\n\n**替代与代价**：直接把整个AIMessage交给预制agent可少一层内部结构，但要适配当前持久状态与控制节点；现在的映射增加兼容代码，收益是支持旧单调用状态并保留业务路由。真正不能省的是完整调用ID和结果配对。"}]},{"title":"工具签名是模型契约，ToolRuntime是服务端权限入口","anchor":"agent-tool-definitions","groupTitle":"Agent 如何把自然语言变成可验证的行动","blocks":[{"type":"text","text":"**背景知识**：Pydantic根据类型标注检查输入形状，Literal限定枚举，extra='forbid'拒绝未声明字段。它检查“参数形状”，不检查“这个用户是否有权限”。工具定义采用@tool(response_format='content_and_artifact')，返回两项：模型可见content和服务端内部artifact。后者是ToolMessage的元信息槽位，不等于直接把完整文件发给模型。\n\n**当前8个注册工具**：6个业务工具为get_dataset_schema、execute_sql、sales_metrics、customer_repeat_metrics、run_python、render_chart；2个控制工具为ask_clarification和finish。以前口头说“7个”不能继续当事实，当前定义是8个。控制工具的函数体故意抛错，由专门图节点完成暂停或校验，不能混进一般业务执行。\n\n**需求→约束→方案**：用户数据必须隔离，但模型也需要传日期、SQL和轴字段。最直接签名可以让模型传task_id、dataset_id；失败时模型幻觉一个UUID，甚至恶意要求其他人的dataset。当前把这些字段放到ToolRuntime.backend_state，由ToolNode注入，模型schema根本没有这些字段。仍要在仓储和文件层检查归属，因为隐藏参数不是唯一安全边界。\n\n**为什么联合统计绘图**：统计表与图的依赖确定，程序可先算表再按给定轴绘图，不必强迫模型等一次结果再发一次请求。它减少一次模型往返，但并未把查询和画图并行；表先登记，图后生成，图失败会留下可重用表。自定义分析仍可先SQL再Python再绘图，不是只能固定报表。"},{"type":"callchain","callchain":{"endpoint":"@tool → ToolNode注入ToolRuntime → invoke_business → execute_business → 结果与内部元信息","steps":[{"layer":"Agent / 工具 / 受限执行","filePath":"backend/agent/tool_registry.py:52-62","functionName":"sales_metrics","explanation":"这是模型看到的销售工具签名，不是实际 SQL 计算器。框架根据 Literal、类型标注和 docstring 生成参数 schema；运行时参数不出现在模型可填写字段里。包装器把可选 None 去掉，并要求联合绘图时轴字段和标题同时具备，然后调用 invoke_business。例：month+chart_x='month'+chart_y='item_amount'+chart_title='趋势' 可一次工具请求顺序完成统计和绘图，降低额外模型轮次；只给 chart_kind 会报缺绘图字段。","code":"async def sales_metrics(runtime: ToolRuntime, start_date: str | None = None,\n                         end_date: str | None = None, group_by: Literal['total', 'month'] = 'total',\n                         chart_x: str | None = None, chart_y: str | None = None,\n                         chart_title: str | None = None, chart_kind: Literal['bar', 'line'] | None = None):\n    \"\"\"固定口径销售指标：order_count/item_amount/freight_amount/total_amount/aov；月度返回差值和两位小数增长率。可用 chart_x/chart_y/chart_title 自动绘图，减少模型轮次。\"\"\"\n    args = {'group_by': group_by, 'start_date': start_date, 'end_date': end_date,\n            'chart_x': chart_x, 'chart_y': chart_y, 'chart_title': chart_title, 'chart_kind': chart_kind}\n    if any(value is not None for key, value in args.items() if key.startswith('chart_')):\n        if not all(args[key] is not None for key in ('chart_x', 'chart_y', 'chart_title')):\n            raise ValueError('联合绘图需要 chart_x、chart_y、chart_title')\n    return await invoke_business(runtime, 'sales_metrics', {key: value for key, value in args.items() if value is not None})","language":"python","lineAnnotations":[{"line":1,"annotation":"定义 sales_metrics；async 表示调用后获得协程，调用者需 await 才能取得本步骤结果。"},{"line":2,"annotation":"end_date 是排他上界，group_by 的 Literal 只允许 total 或 month，不能让模型任意造分组模式。"},{"line":3,"annotation":"chart_x 与 chart_y 指向实际查询表的列，不是让模型生成绘图代码。"},{"line":4,"annotation":"chart_title 可选；chart_kind 只允许 bar/line，None 表示没有主动要求该扩展参数。"},{"line":5,"annotation":"函数职责约定：固定口径销售指标：order_count/item_amount/freight_amount/total_amount/aov；月度返回差值和两位小数增长率。可用 chart_x/chart_y/chart_title 自动绘图，减少模型轮次。；下面以实际语句核对这个约定。"},{"line":6,"annotation":"把统计参数统一放入业务字典；task_id 和 dataset_id 不由模型传入。"},{"line":7,"annotation":"同时收集四项绘图参数，后续判断是否请求联合绘图。"},{"line":8,"annotation":"只要任一 chart_ 参数有值，就视为想绘图，不能把不完整绘图要求悄悄忽略。"},{"line":9,"annotation":"联合绘图必须提供 x/y/title，图形类型可由下游默认。"},{"line":10,"annotation":"早期拒绝缺字段组合，让模型修复而不是先查询再发现没有轴。"},{"line":11,"annotation":"去掉 None 后转交统一执行入口；缺省参数留给业务函数默认值处理。"}],"keyPoint":"工具定义、模型 schema 和执行参数校验来自同一处，减少协议漂移。"},{"layer":"Agent / 工具 / 受限执行","filePath":"backend/agent/tool_registry.py:8-21","functionName":"invoke_business","explanation":"所有六个业务 @tool 包装器都调用它。ToolRuntime 由 ToolNode 注入，backend_state、task_id、dataset_id 与 call_id 由服务器可信状态提供，而不是让模型传入账号范围。返回二元组中的第一项是模型看到的 JSON 内容，第二项是 ToolMessage.artifact 中的内部执行详情，execute_tool 用它合并产物。例：模型只提交 sales_metrics 的日期和分组，实际 execute_business 仍从状态拿当前授权 dataset_id。finally 释放活跃任务登记，与信号量自动释放一起保证异常后不会长期占住名额。","code":"async def invoke_business(runtime: ToolRuntime, name: str, arguments: dict):\n    \"\"\"在本批次并发限额内执行授权业务工具，分别返回模型可见内容与内部产物。\"\"\"\n    from backend.agent.nodes.tools import execute_business, feedback_content\n    state = runtime.state['backend_state']\n    action = {'name': name, 'arguments': arguments, 'call_id': runtime.tool_call_id}\n    import asyncio\n    task = asyncio.current_task()\n    state['_tool_tasks'].add(task)\n    try:\n        async with state['_tool_semaphore']:\n            result = await execute_business({**state, 'action': action})\n    finally:\n        state['_tool_tasks'].discard(task)\n    return feedback_content(result['body']), result","language":"python","lineAnnotations":[{"line":1,"annotation":"定义 invoke_business；async 表示调用后获得协程，调用者需 await 才能取得本步骤结果。"},{"line":2,"annotation":"函数职责约定：在本批次并发限额内执行授权业务工具，分别返回模型可见内容与内部产物。；下面以实际语句核对这个约定。"},{"line":3,"annotation":"延迟导入避免工具注册与节点互相导入形成启动循环。"},{"line":4,"annotation":"从运行时的 backend_state 读取服务器提供的上下文；工具 schema 不暴露这个字段。"},{"line":5,"annotation":"用框架当前 tool_call_id 构造动作，确保同名并发调用的事件也能区分。"},{"line":6,"annotation":"导入异步调度工具，仅用于本次运行时控制对象。"},{"line":7,"annotation":"取得正在执行该工具的协程任务，供外层取消时追踪。"},{"line":8,"annotation":"在等待信号量之前登记，等待名额的兄弟任务也能被取消。"},{"line":9,"annotation":"包裹登记后的全部阶段，保证异常也会移除任务引用。"},{"line":10,"annotation":"异步获取任务内信号量，达到 tool_concurrency 时挂起等待而非阻塞线程。"},{"line":11,"annotation":"传入当前动作的状态副本，避免并发工具互相覆盖 action 字段。"},{"line":12,"annotation":"无论成功、业务异常或协程取消，都执行任务追踪清理。"},{"line":13,"annotation":"discard 容忍集合已清理的情况，不因移除不存在元素再抛异常。"},{"line":14,"annotation":"第一项生成模型可见内容，第二项保留内部 artifacts 信息供工具节点合并。"}],"keyPoint":"模型只能提供业务参数；身份、数据范围、调用 ID 由框架运行时注入。"}]}},{"type":"text","text":"**替代方案**：也可以使用闭包绑定dataset_id、或编排层统一上下文参数。闭包适合简单局部调用，ToolRuntime适合与标准ToolNode消息和状态注入对齐。当前方案代价是需要理解ToolRuntime和外层backend_state约定，收益是模型签名更小、权限输入不暴露、测试能检查schema中确实没有授权字段。\n\n**保证边界**：Pydantic拒绝模型偷偷增加dataset_id等未知参数，不证明合法query安全；合法SQL仍要经过AST、角色与RLS。工具docstring帮助模型选择，但绝不是执行授权策略。"}]},{"title":"这一章如何向面试官讲清楚","anchor":"agent-protocol-interview","groupTitle":"Agent 如何把自然语言变成可验证的行动","blocks":[{"type":"text","text":"**30秒概括**：项目用LangGraph管理“上下文→模型决策→标准工具执行→结果核验”的循环。LangChain负责工具schema和消息协议，项目保留权限、口径和交付门槛；finish只是申请结束，验证通过才生成报告。\n\n**2分钟讲解**：从用户问月度趋势开始，Worker带固定task_id和dataset_id恢复图。上下文节点构造预算内输入，decide用bind_tools让模型选择工具，model_action保留全部tool_calls及ID。单业务或tool_batch到工具节点，参数由同一@tool schema检查，授权状态通过ToolRuntime注入。工具结果回到模型可继续补算。模型单独finish后先检查明确列、Python、复购、图表与数字依据，再由程序读取完整文件写报告；最后Worker处理会话与最终任务状态。这样模型保留分析灵活性，执行责任仍受程序约束。代价是多轮成本与编排复杂度，保证也有限，不能验证所有SQL语义。\n\n**追问1：为什么不用一个大prompt完成所有事？** 答：prompt只影响概率，无法强制只读权限、取消获胜或报告必须含图。源码中SQL执行器、图verify和Worker分别实施这些约束。\n\n**追问2：你是否重新实现了LangChain工具调用？** 答：标准JSON解析、schema和ToolMessage由框架承担；项目映射动作结构用于图分流与持久化兼容，并处理业务规则。不能把业务约束都丢给ToolNode，也不该手写替代框架协议。\n\n**追问3：AI能不能随意增加工具？** 答：不能，模型只看到MODEL_TOOLS；ToolNode只注册BUSINESS_TOOLS，图节点也由程序定义。增加工具要显式提供签名、执行约束与测试。\n\n**自测与答案**：①消息只有一半tool_calls结果会怎样？协议不完整，可能导致后续拒绝或错误归属。②TypedDict会拒绝未知字段吗？不会，它主要是类型提示，执行校验是Pydantic等实际逻辑。③demo能证明模型自主规划吗？不能，demo_action是规则路径。④最容易夸大什么？“完全自主、无幻觉、任何SQL都正确”，当前没有这些证据。"}]}]},{"id":"tool-concurrency","title":"09 同轮多工具怎样并发，怎样在失败后收住","sections":[{"title":"并发不是随便一起跑：先画数据依赖","anchor":"tool-concurrency-foundation","groupTitle":"同轮多工具怎样并发，怎样在失败后收住","blocks":[{"type":"text","text":"**本章问题**：既要多个工具重叠执行降低等待，又不能让Python读取尚未生成的表。**前置知识**：协程是可暂停恢复的执行单元，await等待I/O时让其他协程运行；并发可以在等待时重叠，不等同于CPU并行。**位置**：decide已经返回一个或多个调用。**应能回答**：哪类可并发，为什么不全部并发，取消时怎样清理。\n\n以“销售与复购汇总”为例，两者只读同一个不可变ready数据集，不依赖彼此新结果，可以同轮并发。“查询→按表算占比→根据新列画图”有实际依赖，后两项必须等真实表返回引用，不能假装模型事先知道table_1就是谁。当前独立集合明确列四项：schema、SQL、sales、repeat；Python/绘图放在后面的单项组串行执行。它是保守分组，不是通用依赖DAG调度器。\n\n**简单对照与失败**：只for循环逐个工具最易理解，但两项各3秒查询变至少6秒；对所有任务asyncio.gather虽可能接近3秒，但模型同轮编造依赖引用时会读错表，多个图线程还可能冲突Matplotlib全局状态。当前对独立组用标准ToolNode并发，invoke_business再用Semaphore限额，依赖组顺序推进。收益是保留可证明独立场景的重叠与可控错误；代价是部分实际独立的Python也会串行，潜在并发没吃满。\n\n**替代方案**：可由模型提交显式依赖并由程序验证后构建DAG，适合更复杂大任务但验证成本更高；也可业务层预先规划固定报表，延迟更稳定但自由度下降。目前不宜声称有自动DAG规划。"}]},{"title":"ToolNode做执行协议，外层分组做业务调度","anchor":"tool-standard-runner","groupTitle":"同轮多工具怎样并发，怎样在失败后收住","blocks":[{"type":"text","text":"**职责边界**：ToolNode输入标准AIMessage.tool_calls，对每个调用找工具、校验参数、注入ToolRuntime并产生ToolMessage；外层execute_tool决定分组顺序、当前任务限额、控制工具不可混批与错误后清理。标准节点并不理解“必须先有销售表再画图”的业务关系，也不替代任务归属。\n\n**子图为何关闭checkpoint**：当前backend_state含Semaphore和Task集合，它们属于正在运行的进程对象，不是可以恢复的业务事实。若让子图继承PostgreSQL saver，会试图序列化这类对象；恢复后锁的原始拥有者也已不存在。外层图只保存消息、产物引用和状态，在完整工具节点边界建立持久进度。这减少序列化与恢复歧义，但意味着节点中途重试仍需业务幂等保护，不能宣传每次外部副作用“恰好一次”。\n\n**读代码路线**：先读build_tool_runner理解框架承担哪些工作，再读execute_tool第14—18行理解分组和Semaphore，最后读结果按call_id合并与异常drain。活跃协程在invoke_business等待Semaphore前已登记，因此取消包括正在排队的工具。"},{"type":"callchain","callchain":{"endpoint":"execute_tool → 分组 → TOOL_RUNNER.ainvoke → ToolNode → invoke_business","steps":[{"layer":"Agent / 工具 / 受限执行","filePath":"backend/agent/nodes/tools.py:167-175","functionName":"build_tool_runner","explanation":"模块加载时构建一次 TOOL_RUNNER，execute_tool 每个组会调用它。ToolNode 承担标准工具查找、Pydantic 参数校验、ToolRuntime 注入和 ToolMessage 构造；它不代替业务的 SQL/RLS/文件授权。这个子图明确不持久化，因为 backend_state 包含 Semaphore 和 asyncio.Task 集合；外层业务图在完整节点边界保存可序列化结果。例：真实 checkpoint 集成测试验证多工具能执行且不会试图序列化锁。","code":"def build_tool_runner():\n    \"\"\"创建标准 ToolNode 子图，让框架提供 ToolRuntime、参数校验和每个调用的 ToolMessage。\"\"\"\n    builder = StateGraph(ToolExecutionState)\n    builder.add_node('tools', ToolNode(BUSINESS_TOOLS, handle_tool_errors=tool_error_feedback))\n    builder.add_edge(START, 'tools')\n    builder.add_edge('tools', END)\n    # 明确关闭子图 checkpoint，避免继承父图的 PostgreSQL saver 并尝试保存 Semaphore/Task。\n    # 持久进度由外层业务图保存；此处只执行当前批次，运行时限流对象不进入数据库。\n    return builder.compile(checkpointer=False)","language":"python","lineAnnotations":[{"line":1,"annotation":"定义 build_tool_runner；普通函数在当前线程完成本步骤；类型标注表达接口约定，不会自动做业务验证。"},{"line":2,"annotation":"函数职责约定：创建标准 ToolNode 子图，让框架提供 ToolRuntime、参数校验和每个调用的 ToolMessage。；下面以实际语句核对这个约定。"},{"line":3,"annotation":"子图状态只需 messages 与可信 backend_state，不复用父图所有持久字段。"},{"line":4,"annotation":"注入六个业务工具和统一错误转换函数；控制工具不在这里真实执行。"},{"line":5,"annotation":"子图入口直接进入本批 ToolNode，不重复模型决策。"},{"line":6,"annotation":"当前批执行完成就结束，外层继续安排后续依赖组。"},{"line":7,"annotation":"作者在这里强调的顺序或边界：明确关闭子图 checkpoint，避免继承父图的 PostgreSQL saver 并尝试保存 Semaphore/Task。"},{"line":8,"annotation":"作者在这里强调的顺序或边界：持久进度由外层业务图保存；此处只执行当前批次，运行时限流对象不进入数据库。"},{"line":9,"annotation":"显式 False 防止继承父级 saver，把任务与信号量写入数据库；不是关闭整个项目 checkpoint。"}],"keyPoint":"复用标准工具执行协议，业务授权和持久化边界依然由项目明确决定。"},{"layer":"Agent / 工具 / 受限执行","filePath":"backend/agent/nodes/tools.py:181-229","functionName":"execute_tool","explanation":"由外层图 tools 节点调用，接收单动作或 tool_batch；返回完整消息新版本、合并产物和 schema_loaded。它先把控制动作混批拒绝，再把独立查询组成一组受限并发，把 Python/绘图按单项组串行执行。每个组转成标准 AIMessage.tool_calls 后由 TOOL_RUNNER 解析执行，最后按最初调用顺序写回所有反馈。例：销售 A 与复购 B 并发，B 先完成得到 table_1，A 得 table_2，但反馈仍 A、B 排列，每份靠 call_id 正确配对；不能按别名数字推测原工具顺序。外部取消异常会取消并等待活跃兄弟协程清理；普通可修复业务错误通常转成反馈，不会抹掉其他成功工具。","code":"async def execute_tool(state: dict) -> dict:\n    \"\"\"完整处理一轮调用：独立只读操作受限并发，依赖已有表格的 Python 与绘图串行执行。\"\"\"\n    await check_cancelled(state['task_id'])\n    calls = [{**call, 'call_id': call.get('call_id') or f\"legacy_{state.get('steps', 0)}_{index}\"}\n             for index, call in enumerate(state['action'].get('calls') or [state['action']])]\n    settings = get_settings()\n    names = [call['name'] for call in calls]\n    # finish/澄清不能与计算混批，否则工具尚未完成时就可能暂停或提前交付。\n    if len(calls) > settings.max_tools_per_round or any(name in ('finish', 'ask_clarification') for name in names):\n        reason = '一轮工具数量超过上限' if len(calls) > settings.max_tools_per_round else 'finish 和人工澄清必须单独调用；本批次未执行，请先完成业务工具'\n        await emit_event(state['task_id'], 'tool_error', {'tool': 'tool_batch', 'message': reason})\n        messages = [convert_to_openai_messages(ToolMessage(content=json.dumps({'error': reason}, ensure_ascii=False), tool_call_id=call['call_id'])) for call in calls]\n        return {'messages': [*state['messages'], *messages]}\n    independent = {'get_dataset_schema', 'execute_sql', 'customer_repeat_metrics', 'sales_metrics'}\n    parallel = [call for call in calls if call['name'] in independent or call['name'] not in TOOL_BY_NAME]\n    dependent = [call for call in calls if call['name'] not in independent and call['name'] in TOOL_BY_NAME]\n    groups = ([parallel] if parallel else []) + [[call] for call in dependent]\n    current = {**state, 'artifacts': list(state.get('artifacts', [])), '_tool_semaphore': asyncio.Semaphore(settings.tool_concurrency), '_tool_tasks': set()}\n    results = {}\n    if len(calls) > 1:\n        await emit_event(state['task_id'], 'tool_batch_started', {'tools': names, 'count': len(calls), 'concurrency': settings.tool_concurrency})\n    for group in groups:\n        await check_cancelled(state['task_id'])\n        standard_calls = [{'name': call['name'], 'args': call['arguments'], 'id': call['call_id'], 'type': 'tool_call'} for call in group]\n        try:\n            result = await TOOL_RUNNER.ainvoke({'messages': [AIMessage(content='', tool_calls=standard_calls)], 'backend_state': current})\n        except BaseException:\n            # ToolNode 内部并发执行。取消或失败向外传播前，停止仍执行的兄弟任务并等待清理，防止后台继续写产物。\n            pending = list(current['_tool_tasks'])\n            for task in pending:\n                task.cancel()\n            if pending:\n                await asyncio.gather(*pending, return_exceptions=True)\n            raise\n        for message in result['messages']:\n            results[message.tool_call_id] = convert_to_openai_messages(message)\n            detail = message.artifact or {}\n            known = {item['id'] for item in current['artifacts']}\n            current['artifacts'] += [item for item in detail.get('artifacts', []) if item['id'] not in known]\n            if detail.get('schema_loaded'):\n                current['schema_loaded'] = True\n            if message.status == 'error':\n                await emit_event(state['task_id'], 'tool_error', {'tool': message.name, 'message': message.content})\n    await check_cancelled(state['task_id'])\n    if len(calls) > 1:\n        await emit_event(state['task_id'], 'tool_batch_completed', {'count': len(calls)})\n    # 按模型原调用顺序保存反馈，执行完成顺序可以不同，但所有调用都有对应结果。\n    return {'messages': state['messages'] if state['mode'] == 'demo' else [*state['messages'], *[results[call['call_id']] for call in calls]],\n            'artifacts': current['artifacts'], 'schema_loaded': current.get('schema_loaded', False)}","language":"python","lineAnnotations":[{"line":1,"annotation":"定义 execute_tool；async 表示调用后获得协程，调用者需 await 才能取得本步骤结果。"},{"line":2,"annotation":"函数职责约定：完整处理一轮调用：独立只读操作受限并发，依赖已有表格的 Python 与绘图串行执行。；下面以实际语句核对这个约定。"},{"line":3,"annotation":"执行任何批次前读取任务取消状态，减少已经取消任务的副作用。"},{"line":4,"annotation":"复制动作并为旧 checkpoint 缺失 ID 生成确定的兼容 ID。"},{"line":5,"annotation":"兼容 action.calls 多调用与原单 action 结构，不再只执行第一项。"},{"line":6,"annotation":"读取每轮工具数和任务内并发数上限。"},{"line":7,"annotation":"汇总动作名用于控制混批检查和事件展示。"},{"line":8,"annotation":"作者在这里强调的顺序或边界：finish/澄清不能与计算混批，否则工具尚未完成时就可能暂停或提前交付。"},{"line":9,"annotation":"一轮数量超限或混入 finish/ask_clarification 都拒绝执行，避免边计算边交付或暂停。"},{"line":10,"annotation":"区分数量限制与控制混批错误，让模型知道如何拆分下一轮。"},{"line":11,"annotation":"将整批拒绝原因写进持久事件，页面可看到为何没有工具执行。"},{"line":12,"annotation":"为每个原调用构造 ToolMessage，即使整批拒绝也维持协议完整配对。"},{"line":13,"annotation":"返回原历史加所有错误结果，让模型在下一轮重新规划。"},{"line":14,"annotation":"仅列明可独立读取的 schema、SQL、复购和销售工具；不是任意代码都并行。"},{"line":15,"annotation":"独立工具放入并发组，未知名称也交标准 ToolNode 生成工具不存在反馈。"},{"line":16,"annotation":"其余已知业务工具依赖先前表格，放入后面的串行队列。"},{"line":17,"annotation":"第一个组可多项并发，后续每个依赖调用单独一组；这里没有建立任意依赖 DAG。"},{"line":18,"annotation":"复制 artifacts，创建当前批次信号量和活跃协程集合；每个任务各有一份，不是部署级全局限流。"},{"line":19,"annotation":"用调用 ID 建反馈映射，避免同名工具或先后变化导致错配。"},{"line":20,"annotation":"单调用无需额外批事件，多调用才记录批开始。"},{"line":21,"annotation":"事件记录请求工具数与本批并发限额，便于观察执行重叠与耗时。"},{"line":22,"annotation":"顺序遍历组，保证依赖组只能在前一组完成并合并结果后开始。"},{"line":23,"annotation":"组与组之间再次检查取消，避免用户已取消还开始新的串行计算。"},{"line":24,"annotation":"把项目动作转换成标准 tool_call，args/name/id 字段遵守 LangChain 协议。"},{"line":25,"annotation":"将 ToolNode 执行放在可清理异常的边界中。"},{"line":26,"annotation":"AIMessage 承载当前组全部调用，backend_state 仅从服务器注入，不由模型决定。"},{"line":27,"annotation":"捕获 BaseException 是为了覆盖 CancelledError 等非普通 Exception 的取消路径。"},{"line":28,"annotation":"作者在这里强调的顺序或边界：ToolNode 内部并发执行。取消或失败向外传播前，停止仍执行的兄弟任务并等待清理，防止后台继续写产物。"},{"line":29,"annotation":"拷贝仍活动的 Task 集合，随后取消不会干扰集合迭代。"},{"line":30,"annotation":"遍历每个仍在执行或等待名额的兄弟任务。"},{"line":31,"annotation":"请求协程取消；不能仅仅让父协程抛错后把兄弟工具留在后台。"},{"line":32,"annotation":"只在确实有待清理任务时等待它们结束。"},{"line":33,"annotation":"gather 等待 finally 清理，return_exceptions=True 防止某个取消再次打断其余清理。"},{"line":34,"annotation":"清理完仍向 Worker 传播原异常，由外层决定 cancelled 或 failed。"},{"line":35,"annotation":"标准 ToolNode 返回每个调用的 ToolMessage，逐一合并。"},{"line":36,"annotation":"按 tool_call_id 存反馈字典，序列化为 checkpoint 可保存的消息格式。"},{"line":37,"annotation":"artifact 是工具内部元信息槽位，不是直接把整份 CSV 内容塞给模型。"},{"line":38,"annotation":"读取已经合并的产物 ID 集合，避免每个分支回传原 artifacts 导致重复。"},{"line":39,"annotation":"只加入本次新增 ID；短别名已由数据库登记时的锁决定，不能在这里猜编号。"},{"line":40,"annotation":"检查该工具是否实际完成了获取 schema。"},{"line":41,"annotation":"一旦有工具载入 schema，就保留该状态供后续决策使用。"},{"line":42,"annotation":"标准工具参数错误可由 ToolNode 返回 status=error，不要求整个任务立即失败。"},{"line":43,"annotation":"将这种框架级错误也写成持久事件，业务错误通常已在 execute_business 内记录。"},{"line":44,"annotation":"全部组完成后再检查取消，防止结果刚返回时用户取消仍继续推进。"},{"line":45,"annotation":"多调用批次结束时产生对称的完成事件。"},{"line":46,"annotation":"批完成只代表这些工具已返回，不代表报告已经通过核验。"},{"line":47,"annotation":"作者在这里强调的顺序或边界：按模型原调用顺序保存反馈，执行完成顺序可以不同，但所有调用都有对应结果。"},{"line":48,"annotation":"按 calls 原始顺序取回各个 ID 的结果；demo 不需要伪造模型协议消息。"},{"line":49,"annotation":"返回合并后的产物和 schema 状态，外层图替换这些字段；临时信号量不会返回持久状态。"}],"keyPoint":"并发顺序可以变化，调用与结果配对不能变化；并发限额目前属于一次任务批次。"}]}},{"type":"text","text":"**例子**：tool_concurrency=2，同轮4个sales_metrics，最多2个业务执行同时活动，剩下异步等待。若两个不同任务各2个，同时可能有4个数据库查询；此Semaphore不是全局池，不能声称系统最高并发2。实际部署容量需要SQL连接数、Worker数和数据库负载一起估算。\n\n**控制混批**：模型同时返回sales_metrics与finish时整批拒绝，每个call_id各收到错误结果，不偷偷执行前一项再提前结束。这样下一轮能明确拆成“先业务，后finish”。"}]},{"title":"短引用、反馈与共享产物：为什么不靠完成顺序猜结果","anchor":"tool-result-reference","groupTitle":"同轮多工具怎样并发，怎样在失败后收住","blocks":[{"type":"text","text":"**问题背景**：模型不擅长准确复制长UUID；给它table_1这样的短引用有利于后续调用，但并发完成先后不可预测。若每个分支本地用len(artifacts)+1分配别名，两个分支都可能叫table_1。当前publish_result交由数据库register_artifact在任务行锁下登记并分配唯一别名；execute_tool只按ID合并各分支新增产物，不自行分配编号。\n\n**具体执行**：销售A与复购B一起启动。B先登记table_1，A后登记table_2，结果反馈最终仍按照模型原请求A再B排列，各自带call_id和实际artifact_ref。下一轮模型要画销售图，必须用A反馈中的table_2；“第一项请求一定table_1”是错误假设。若用未知引用，resolve_table_reference在当前任务表里查不到，并列出当前有效引用。即使知道真实UUID，read_table仍检查task_id。\n\n**为什么缩反馈而不缩结果**：模型只需列名、行数、有限preview和引用决定下一步；完整JSON/CSV存文件，图表与报告后续按引用读取。直接截断一大串JSON可能切掉结束引号，下一轮模型连引用都看不清；当前feedback_content重新生成小JSON，保留依赖所需字段。SQL/代码与服务器路径不重复塞进反馈，减轻预算。"},{"type":"callchain","callchain":{"endpoint":"publish_result → register_artifact → ToolMessage.artifact → execute_tool合并 → resolve_table_reference","steps":[{"layer":"Agent / 工具 / 受限执行","filePath":"backend/agent/nodes/tools.py:54-62","functionName":"resolve_table_reference","explanation":"由 execute_business 在 Python/绘图之前调用，输入是当前任务状态和模型提供的 table_N 或 UUID。函数只在当前状态 artifacts 里的表格中查找，返回真实 ID，再由 read_table 进行文件归属校验；查不到时列出可用引用作为可修复反馈。例：同轮并发查询的完成先后会改变 table_1 对应谁，模型必须读实际返回值，不能假设首个调用必然得到 table_1。短引用提高可用性，真正授权仍是服务器任务范围与读取检查，UUID 本身不是权限。","code":"def resolve_table_reference(state: dict, reference: str) -> str:\n    \"\"\"把本任务中的 table_1 等短名称或真实 UUID 转为表格 ID。找不到时，报错并列出可用的表格名称。\"\"\"\n    tables = [item for item in state.get('artifacts', []) if item['kind'] == 'table']\n    for index, item in enumerate(tables, 1):\n        if reference in (item['id'], item.get('artifact_ref', f'table_{index}')):\n            return item['id']\n    # 只在当前任务的表格中查找引用，不允许模型使用其他任务的表格或自行指定文件路径。\n    available = ', '.join(item.get('artifact_ref', f'table_{index}') for index, item in enumerate(tables, 1)) or '无表格，请先查询'\n    raise ValueError('表格引用无效，不能编造 UUID。当前任务可用 artifact_ref：' + available)","language":"python","lineAnnotations":[{"line":1,"annotation":"定义 resolve_table_reference；普通函数在当前线程完成本步骤；类型标注表达接口约定，不会自动做业务验证。"},{"line":2,"annotation":"函数职责约定：把本任务中的 table_1 等短名称或真实 UUID 转为表格 ID。找不到时，报错并列出可用的表格名称。；下面以实际语句核对这个约定。"},{"line":3,"annotation":"从状态仅筛选 table，不允许把图表或报告 ID 当成 Python 输入表。"},{"line":4,"annotation":"兼容旧产物没有短别名的情况，按表格列表产生后备名称。"},{"line":5,"annotation":"同时接受真实 ID 和已经登记的短别名，但不会查其他任务或外部目录。"},{"line":6,"annotation":"找到后只返回规范真实 ID，后续文件层可统一校验。"},{"line":7,"annotation":"作者在这里强调的顺序或边界：只在当前任务的表格中查找引用，不允许模型使用其他任务的表格或自行指定文件路径。"},{"line":8,"annotation":"构造当前确实存在的引用列表；没有表则明确提示先查询。"},{"line":9,"annotation":"抛出可修复错误，帮助模型改用真实返回值，而不是编造新的 UUID 重试。"}],"keyPoint":"易读引用服务模型体验，任务范围检查服务数据安全，两者不可互相替代。"},{"layer":"Agent / 工具 / 受限执行","filePath":"backend/agent/nodes/tools.py:39-51","functionName":"feedback_content","explanation":"由 invoke_business 和兼容反馈入口调用。输入是结果元数据或错误，输出是模型可理解的完整 JSON 字符串；完整结果仍保存在文件，反馈只是有限预览。它移除 SQL、Python、服务器路径等重复内容，过长时重建包含引用与行数的小字典，而不是截断 JSON 字符串。例：上千行结果的 preview 或列元数据很大时，模型仍可拿到 table_2 继续调用 Python。注意 6000 是触发压缩的字符数阈值，不是证明最终 compact 永远小于 6000 的硬保证，超长 columns/label 仍应由预算检查兜底。","code":"def feedback_content(body: dict) -> str:\n    \"\"\"生成有长度上限的完整 JSON，SQL、代码和服务器路径不重复放入模型反馈。\"\"\"\n    visible = {key: value for key, value in body.items() if key not in ('sql', 'effective_sql', 'python', 'filename', 'task_id', 'dataset_id')}\n    content = json.dumps(visible, ensure_ascii=False)\n    if len(content) > 6000:\n        # 结果太长时重新生成较小的 JSON。不能直接截断字符串，否则模型可能无法解析结果和文件引用。\n        compact = {key:body[key] for key in ('id','artifact_ref','kind','label','columns','row_count','source_id','metric_id') if key in body}\n        compact['notice'] = '结果摘要较大，请使用引用或进一步聚合；完整结果已保存。'\n        if body.get('chart'):\n            compact['chart'] = {key:body['chart'][key] for key in ('id','kind','source_id','source_row_count','plotted_row_count') if key in body['chart']}\n        content = json.dumps(compact, ensure_ascii=False)\n    # tool_call_id 必须与 assistant 消息里的调用 ID 一致，模型才能识别这条结果属于哪次调用。\n    return content","language":"python","lineAnnotations":[{"line":1,"annotation":"定义 feedback_content；普通函数在当前线程完成本步骤；类型标注表达接口约定，不会自动做业务验证。"},{"line":2,"annotation":"函数职责约定：生成有长度上限的完整 JSON，SQL、代码和服务器路径不重复放入模型反馈。；下面以实际语句核对这个约定。"},{"line":3,"annotation":"过滤重复 SQL、执行 SQL、Python 代码、路径和内部任务范围，减少上下文消耗。"},{"line":4,"annotation":"ensure_ascii=False 保留中文可读性，并先尝试序列化完整可见反馈。"},{"line":5,"annotation":"超过 6000 字符时转入结构化压缩，不直接砍前 6000 字。"},{"line":6,"annotation":"作者在这里强调的顺序或边界：结果太长时重新生成较小的 JSON。不能直接截断字符串，否则模型可能无法解析结果和文件引用。"},{"line":7,"annotation":"保留结果 ID、短别名、类型、列名和行数，使后续引用与检查仍可进行。"},{"line":8,"annotation":"明确告诉模型完整结果已保存，避免把摘要变小理解成查询结果被截断。"},{"line":9,"annotation":"联合统计绘图结果还有图表子对象，需要保留来源关系。"},{"line":10,"annotation":"只复制图表引用与覆盖行数，去掉图表中无关的大块字段。"},{"line":11,"annotation":"重新编码小字典，保证左右括号、引号与 JSON 结构完整。"},{"line":12,"annotation":"作者在这里强调的顺序或边界：tool_call_id 必须与 assistant 消息里的调用 ID 一致，模型才能识别这条结果属于哪次调用。"},{"line":13,"annotation":"返回字符串给 ToolMessage.content；调用 ID 由外层 ToolMessage 单独承载。"}],"keyPoint":"压缩的是模型反馈，不是结果文件；压缩后也必须保留可解析引用。"}]}},{"type":"text","text":"**收益与代价**：短引用改善模型调用稳定性，数据库分配别名增加一次事务和行锁等待；完整结果文件避免反复传输大表，但需要文件授权、清理和一致性管理。反馈压缩仍是有限策略，保留列名等字段可能很大，最终预算检查必须继续存在。\n\n**替代方案**：把结果直接全塞回模型最简单但浪费窗口/成本；用专门结果表存行数据便于统一事务与检索，但增加数据库体量和下载转换；当前文件+数据库元数据在结果大小受限的分析任务里比较直接，并非唯一正确架构。"}]},{"title":"八分钟推演：参数错、业务错、取消分别怎么处理","anchor":"tool-error-cancel-scenarios","groupTitle":"同轮多工具怎样并发，怎样在失败后收住","blocks":[{"type":"text","text":"**先区分三类失败**。①参数错：execute_sql缺query，Pydantic拒绝，不进业务层，ToolNode为该call_id反馈error；同批合法销售工具仍可成功。②业务可修复错：SQL列不存在、图表维度重复等由execute_business转换简明错误，模型拿到真实反馈后改参数，不代表整批都失败。③取消或系统级传播异常：不能再当“请模型重试”的普通工具错误，必须让外层停止任务并处理兄弟协程。\n\n**情境一：A参数错，B合法**。ToolNode对A返回缺query错误，对B执行产生表。外层按两个ID保留结果，下轮模型只需补A，不应抹掉B表。这由tests/unit/test_tool_batches.py的test_bad_parameters_do_not_discard_successful_sibling覆盖。\n\n**情境二：A发现取消，B正在等待**。InterruptedError从execute_business穿透，tool_error_feedback也再次抛出，execute_tool捕获BaseException，拷贝_tool_tasks，逐个cancel，再gather(return_exceptions=True)等待finally。最后原异常继续传播到Worker，不能“清理后继续finish”。gather的return_exceptions只让收尾等待完整，不是把任务取消解释为成功。\n\n**情境三：SQL成功，联合绘图失败**。表已经保存登记，partial记录该表；绘图错误反馈包含真实table引用，模型下一轮可以仅render_chart修复，不必重复SQL。联合调用是先后依赖，不是两步数据库事务原子提交；用户会看到查询成功及绘图错误的分别事件。\n\n**情境四：线程/容器仍在工作**。取消asyncio Task不必然中断to_thread中的subprocess.run或Matplotlib绘制。Python容器在finally强删；绘图函数最终关闭figure，登记结果前仍做取消检查。但不能宣称取消后CPU立即停止、磁盘绝不产生孤儿文件。业务安全边界是禁止取消后的任务重新成功登记/发布，而物理清理存在延迟与失败可能。\n\n**排查顺序**：先用call_id看同一个工具开始/完成/错误事件，再看工具参数错误还是业务错误，再看任务最终状态和取消时间，最后检查Docker残留、文件登记与数据库日志。不要按同名工具或事件先后顺序盲目对应。\n\n下面把贯穿所有业务工具的execute_business完整展开。长函数先看四段：第3—21行检查与规范化，第22—40行分发和登记，第41—56行联合绘图与成功返回，第57行以后区分取消与可修复失败。这样先抓业务阶段，再读每句，避免把不同异常路径混为一谈。"},{"type":"callchain","callchain":{"endpoint":"ToolNode → invoke_business → execute_business → 具体工具 / publish_result → 成功或错误反馈","steps":[{"layer":"Agent / 工具 / 受限执行","filePath":"backend/agent/nodes/tools.py:78-151","functionName":"execute_business","explanation":"这是六类业务工具统一经过的授权执行入口，由invoke_business在拿到任务内并发名额后调用。输入state包含可信task/dataset/metrics及当前action；返回body供模型读取，artifacts和schema_loaded供外层图合并。函数先禁图/解析本次偏好，再规范引用、记录工具开始，分发真实执行器并登记结果；若联合绘图则先表后图，避免多一次模型请求。例：sales_metrics查询成功但chart_x不存在，表已登记，错误反馈带真实table_N，模型可修图而非重算。InterruptedError单独穿透；普通参数、语法和数据库已知错误转为有限反馈，避免泄露完整内部异常。","code":"async def execute_business(state: dict) -> dict:\n    \"\"\"执行业务约束与产物登记；参数解析和工具分发由 ToolNode 处理。\"\"\"\n    await check_cancelled(state['task_id'])\n    name, args = state['action']['name'], state['action']['arguments']\n    artifacts = list(state.get('artifacts', []))\n    completion_emitted = False\n    partial = None\n    try:\n        question = state.get('question', '') + '\\n' + state.get('clarification_answer', '')\n        if chart_forbidden(question) and (name == 'render_chart' or any(key.startswith('chart_') for key in args)):\n            raise ValueError('用户已明确不需要绘图，请仅交付计算结果')\n        # 把用户补充的要求也纳入本次偏好判断，避免旧偏好覆盖用户刚指定的图表类型。\n        selected = resolve_personalization(state.get('question', '') + '\\n' + state.get('clarification_answer',''), state.get('personalization', {}))\n        if name == 'render_chart' and selected.get('chart_kind'):\n            args = {**args, 'kind':selected['chart_kind']}\n        if name == 'execute_sql' and 'chart_x' in args and selected.get('chart_kind'):\n            args = {**args, 'chart_kind':selected['chart_kind']}\n        if name in ('run_python', 'render_chart'):\n            args = {**args, 'artifact_id': resolve_table_reference(state, args['artifact_id'])}\n        await emit_tool_event(state, 'tool_started', {'tool': name, 'arguments': args,\n                          'requested_arguments':state['action']['arguments']})\n        if name == 'get_dataset_schema':\n            body = describe_schema(state['metrics'])\n            update = {'schema_loaded': True}\n        else:\n            if name == 'execute_sql':\n                # 查询使用图状态中的任务 ID、数据集 ID 和有效订单状态，模型只能提供查询内容。\n                result = await search_data(state['task_id'], state['dataset_id'], args['query'], state['metrics']['valid_status'])\n            elif name == 'customer_repeat_metrics':\n                result = await customer_repeat_metrics(state['task_id'], state['dataset_id'], state['metrics']['valid_status'], **args)\n            elif name == 'sales_metrics':\n                result = await sales_metrics(state['task_id'], state['dataset_id'], state['metrics']['valid_status'], **{key:value for key,value in args.items() if not key.startswith('chart_')})\n            elif name == 'run_python':\n                result = await analyze_table(state['task_id'], args['artifact_id'], args['code'])\n            elif name == 'render_chart':\n                result = await asyncio.to_thread(create_chart, state['task_id'], currency=state['metrics']['currency'], **args)\n            else:\n                raise ValueError('该动作不是执行工具')\n            result = await publish_result(state, artifacts, result)\n            body, update = result, {}\n            if name in ('execute_sql', 'sales_metrics') and 'chart_x' in args:\n                # 模型可在一次调用中同时请求查询和绘图。程序先登记查询结果，再顺序绘图，减少一次模型请求。\n                partial = result\n                await emit_tool_event(state, 'tool_completed', {'tool': name, 'result': result})\n                name = 'render_chart'\n                chart_args = {'artifact_id': result['id'], 'x': args['chart_x'], 'y': args['chart_y'],\n                              'title': args['chart_title'], 'kind': args.get('chart_kind', 'bar')}\n                await emit_tool_event(state, 'tool_started', {'tool': name, 'arguments': chart_args, 'combined_with_sql': True})\n                chart = await asyncio.to_thread(create_chart, state['task_id'], currency=state['metrics']['currency'], **chart_args)\n                chart = await publish_result(state, artifacts, chart)\n                await emit_tool_event(state, 'tool_completed', {'tool': name, 'result': chart, 'combined_with_sql': True})\n                body = {**result, 'chart': chart}\n                completion_emitted = True\n        if not completion_emitted:\n            await emit_tool_event(state, 'tool_completed', {'tool': name, 'result': body})\n        return {**update, 'artifacts': artifacts, 'body': body}\n    except InterruptedError:\n        # 用户取消任务时直接向上抛出异常，让 Worker 停止。不能把取消当作普通工具错误交给模型重试。\n        raise\n    except Exception as error:\n        message = str(error)[:800] if isinstance(error, (ValueError, SyntaxError)) else '工具执行失败：' + type(error).__name__\n        if isinstance(error, DBAPIError):\n            code = getattr(error.orig, 'sqlstate', None)\n            if code in ('42702', '42703', '42P01', '42883', '42601', '42804', '42803'):\n                # 只反馈允许公开的 SQL 字段或语法错误，帮助模型修正查询，不把所有数据库异常内容直接发给模型。\n                message = str(error.orig).splitlines()[0][:500]\n            elif code == '57014':\n                message = 'SQL 查询超时，请缩小查询范围或减少关联。'\n        await emit_tool_event(state, 'tool_error', {'tool': name, 'message': message})\n        feedback = {'error': message}\n        if partial:\n            # 如果查询成功但绘图失败，就反馈已保存的表格引用。模型可以重新绘图，不必再次查询相同数据。\n            feedback['table'] = {'id': partial['id'], 'artifact_ref': partial['artifact_ref'], 'columns': partial['columns'], 'preview': partial['preview']}\n        return {'body': feedback, 'artifacts': artifacts}","language":"python","lineAnnotations":[{"line":1,"annotation":"定义 execute_business；async 表示调用后获得协程，调用者需 await 才能取得本步骤结果。"},{"line":2,"annotation":"函数职责约定：执行业务约束与产物登记；参数解析和工具分发由 ToolNode 处理。；下面以实际语句核对这个约定。"},{"line":3,"annotation":"执行副作用前检查任务取消；取消不进入后续模型自我修复。"},{"line":4,"annotation":"当前工具名和模型业务参数来自本次action，不改变可信任务范围。"},{"line":5,"annotation":"复制产物列表；并发分支在自己的列表里追加，由外层统一按ID合并。"},{"line":6,"annotation":"标记是否已经分别发出联合查询/绘图完成事件，避免末尾重复发完成。"},{"line":7,"annotation":"初始化已完成表格引用；只有联合绘图中表成功后才设置。"},{"line":8,"annotation":"业务约束和实际执行都进入可修复错误反馈边界。"},{"line":9,"annotation":"合并原问题与用户补充，使后来的明确禁图也生效。"},{"line":10,"annotation":"用户全面禁图时，独立绘图或任意chart_参数都在查询/文件副作用前拒绝。"},{"line":11,"annotation":"明确返回禁止原因，不只是依赖prompt希望模型自觉遵守。"},{"line":12,"annotation":"作者在这里强调的顺序或边界：把用户补充的要求也纳入本次偏好判断，避免旧偏好覆盖用户刚指定的图表类型。"},{"line":13,"annotation":"重新解析本次明确要求与已读取偏好，当前用户要求优先于默认偏好。"},{"line":14,"annotation":"独立绘图若已解析出应采用类型，则调整实际参数。"},{"line":15,"annotation":"使用新字典覆盖kind，同时保留模型原参数供事件审计。"},{"line":16,"annotation":"对execute_sql联合绘图同样应用解析出的类型；sales_metrics联合路径目前没有同一分支。"},{"line":17,"annotation":"覆盖chart_kind而不是kind，因为联合绘图签名使用chart_前缀。"},{"line":18,"annotation":"Python/绘图输入必须引用已生成的表，SQL不需要artifact_id。"},{"line":19,"annotation":"将table_N规范成当前任务真实UUID，未知或其他任务引用不会在这里通过。"},{"line":20,"annotation":"工具开始事件记录实际采用参数，前端可展示运行过程。"},{"line":21,"annotation":"同时记录模型请求参数，让排查者能比较偏好规范化前后差异。"},{"line":22,"annotation":"表结构工具不产生文件表格，单独处理。"},{"line":23,"annotation":"用可信metrics生成固定表结构和已确认口径说明。"},{"line":24,"annotation":"设置schema_loaded，让规则演示等后续节点知道已提供结构。"},{"line":25,"annotation":"其他业务工具都会产生新的表或图文件。"},{"line":26,"annotation":"SQL分支只接受query，授权范围仍由状态提供。"},{"line":27,"annotation":"作者在这里强调的顺序或边界：查询使用图状态中的任务 ID、数据集 ID 和有效订单状态，模型只能提供查询内容。"},{"line":28,"annotation":"将服务端task_id/dataset_id/valid_status传入受限执行器，模型无权替换。"},{"line":29,"annotation":"识别专用复购工具分支。"},{"line":30,"annotation":"传可信范围与经schema验证的日期参数，公式由工具固定。"},{"line":31,"annotation":"识别固定销售指标分支。"},{"line":32,"annotation":"去掉chart_参数再调用统计器，统计器只负责SQL表，图表在后面顺序执行。"},{"line":33,"annotation":"识别对已生成表的Python计算。"},{"line":34,"annotation":"传真实表ID与代码进入隔离容器，不把模型代码直接exec在API进程。"},{"line":35,"annotation":"识别预制绘图工具。"},{"line":36,"annotation":"将阻塞绘图放线程，传可信币种标签；create_chart内部还有Matplotlib进程锁。"},{"line":37,"annotation":"理论上ToolNode已拒绝未知工具，这里仍防御未授权业务动作。"},{"line":38,"annotation":"对不是业务执行动作的名称明确报错，不默认完成。"},{"line":39,"annotation":"每份结果在取消检查后登记；数据库锁分配真实短别名，再追加分支列表。"},{"line":40,"annotation":"标准文件结果作为模型body，普通工具没有额外schema状态更新。"},{"line":41,"annotation":"只有SQL/销售工具且带chart_x才启动联合绘图，先查询的真实结果已存在。"},{"line":42,"annotation":"作者在这里强调的顺序或边界：模型可在一次调用中同时请求查询和绘图。程序先登记查询结果，再顺序绘图，减少一次模型请求。"},{"line":43,"annotation":"保存已完成表元信息，后续图错也能回传可重用引用。"},{"line":44,"annotation":"单独发查询完成事件，让用户知道表计算已成功。"},{"line":45,"annotation":"切换事件中的当前工具名为render_chart，后续错误应归绘图阶段。"},{"line":46,"annotation":"联合图的artifact_id直接使用刚产生的真实结果，不让模型提前猜引用。"},{"line":47,"annotation":"取模型标题与图形类型，类型没传则bar；本次偏好覆盖差异需注意。"},{"line":48,"annotation":"发绘图开始，并标记这是联合执行而非另一模型决策轮。"},{"line":49,"annotation":"在线程中调用预制图形生成器；此时表格已经登记，不与查询并行。"},{"line":50,"annotation":"绘图完成也要检查取消并登记，图文件不是未经授权就交付。"},{"line":51,"annotation":"发绘图完成，表与图各有明确事件和来源关系。"},{"line":52,"annotation":"合并反馈为表信息加chart对象，模型可一次拿到两份最终引用。"},{"line":53,"annotation":"记住已发两阶段完成，防止通用结尾再重复发一次。"},{"line":54,"annotation":"非联合工具仍需要通用完成事件。"},{"line":55,"annotation":"为schema、单SQL、Python或单图发布对应完成事件。"},{"line":56,"annotation":"返回分支产物与模型可见body；ToolMessage内部artifact会保留这个结构。"},{"line":57,"annotation":"特殊捕获取消异常，禁止它进入普通错误反馈分支。"},{"line":58,"annotation":"作者在这里强调的顺序或边界：用户取消任务时直接向上抛出异常，让 Worker 停止。不能把取消当作普通工具错误交给模型重试。"},{"line":59,"annotation":"取消继续向外抛，由execute_tool清理兄弟协程，再交Worker处理最终状态。"},{"line":60,"annotation":"其他普通执行错误可反馈给模型，使其按错误修正而非崩掉整个批次。"},{"line":61,"annotation":"ValueError/SyntaxError给有限详细信息；未知错误只给类型，减少内部泄露。"},{"line":62,"annotation":"数据库驱动异常可按SQLSTATE提供特定可修复提示。"},{"line":63,"annotation":"从原始驱动异常读取sqlstate；缺失则保持通用错误。"},{"line":64,"annotation":"允许字段歧义、列不存在、表不存在、函数不存在、语法/类型/分组错误反馈。"},{"line":65,"annotation":"作者在这里强调的顺序或边界：只反馈允许公开的 SQL 字段或语法错误，帮助模型修正查询，不把所有数据库异常内容直接发给模型。"},{"line":66,"annotation":"仅取数据库错误首行最多500字，不把全部堆栈和连接细节给模型。"},{"line":67,"annotation":"SQLSTATE57014代表取消/语句时限相关数据库错误，在此使用超时提示。"},{"line":68,"annotation":"指导模型缩小查询范围或减少关联，而不是原样无限重试。"},{"line":69,"annotation":"将具体阶段错误保存到事件，并带当前call_id便于并发定位。"},{"line":70,"annotation":"构造统一error反馈结构给ToolMessage。"},{"line":71,"annotation":"若已有真实表而只是后续绘图失败，可保留部分成功价值。"},{"line":72,"annotation":"作者在这里强调的顺序或边界：如果查询成功但绘图失败，就反馈已保存的表格引用。模型可以重新绘图，不必再次查询相同数据。"},{"line":73,"annotation":"回传已登记表的ID、别名、列与预览，让下一轮只需重新绘图。"},{"line":74,"annotation":"保留当前已登记产物，同时反馈错误；这不是把失败工具包装成成功报告。"}],"keyPoint":"标准框架执行工具，业务入口实施本次用户要求、授权上下文和产物登记。"}]}}]},{"title":"面试：解释并发收益时同时说清它的范围","anchor":"tool-concurrency-interview","groupTitle":"同轮多工具怎样并发，怎样在失败后收住","blocks":[{"type":"text","text":"**30秒概括**：模型同轮可返回多个调用，项目完整保留全部ID；独立只读工具经标准ToolNode受限并发，Python和绘图依赖真实结果按组串行。取消异常传播前取消并等待兄弟协程清理，成功结果与可修复错误逐一保留。\n\n**2分钟讲解**：先根据是否依赖新产物分类。销售、复购与普通只读查询可并发；Python/图需要先拿实际引用，保守串行。每轮统一转AIMessage，再由ToolNode校验和注入ToolRuntime。Semaphore只限制当前批次，不能代替全局容量控制。每个工具把真实结果登记到任务，由行锁分配唯一table_N；完成顺序可以不同，反馈仍按原call_id顺序保存。普通参数/业务错误各自反馈，取消等传播异常则drain兄弟任务。最后检查取消再继续图，避免已取消任务开启下一组。\n\n**追问1：为什么不直接gather全部工具？** 答：有产物依赖与共享库状态。当前只把已知独立项并发，依赖项单项组，Matplotlib另外进程内锁保护。\n\n**追问2：并发3是不是整个系统最多3？** 答：不是，Semaphore在execute_tool里为每次任务批次创建。多个Worker、多个任务会叠加，部署级限制需要额外调度或共享配额。\n\n**追问3：工具A失败会把B成功结果撤销吗？** 答：参数或可修复业务错误通常变成独立反馈，B结果保留；取消等传播异常会清理活跃兄弟。文件和数据库没有跨资源全局回滚，不应宣称整个批次事务原子。\n\n**自测与答案**：①call_a先发、call_b先完成，table_1属于谁？由实际登记结果决定，不能猜。②为什么不把Semaphore放父图State？它不可作为可靠持久业务状态，重启也不能恢复原锁持有者。③为何catch BaseException？覆盖CancelledError等取消路径；清理后仍raise，不吞取消。④去掉gather会怎样？兄弟协程可能仍在清理甚至继续副作用，父任务已经返回。"}]}]},{"id":"execution-security-metrics","title":"10 受限执行与固定口径：让模型能分析，也不能越界","sections":[{"title":"先分清安全、准确性与统计粒度","anchor":"execution-foundation","groupTitle":"受限执行与固定口径：让模型能分析，也不能越界","blocks":[{"type":"text","text":"**本章问题**：SQL能执行不代表业务正确；参数合法不代表拥有权限。**前置知识**：表、行、列与SELECT基本概念；AST是程序的语法树，RLS是数据库按策略过滤行。**位置**：ToolNode已接受工具参数，execute_business正在选择真实执行器。**应能回答**：每层防护解决什么，以及标准指标为什么不是“把Agent写死”。\n\n想象一张订单表A(100元)与两条明细(40、60)。联表后订单金额字段若每条都出现100，再SUM就是200，这是“粒度不对”；即使SQL只读、RLS完全正确，它仍会算错。反过来，SELECT SUM(price)语义也许正确，但如果读到了别人的dataset，就是权限错误。业务口径、安全权限、计算语义必须分别处理。\n\n**需求推导**：常见销售与复购的定义稳定、风险高，交给固定指标工具；其他维度与自定义计算保留SQL和Python灵活性。最直接的对照方案是把所有公式放prompt，缺点是模型可能MAX运费、混淆customer_id或口算环比；完全固定所有分析虽稳定，却无法覆盖自然语言多样需求。当前折中是“稳定口径由程序固定，自由分析由受限工具承担”。\n\n**权限链**：模型只提供query/code等业务内容 → AST筛查 → SQL口径改写 → 独立只读角色与只读事务 → RLS指定dataset；Python另走AST+Docker无网络/只读根/限资源。prompt有提醒作用，但不得作为唯一安全层。源码证实层次存在；抵御所有恶意输入仍需独立安全测试，不可据此宣称绝对安全。"}]},{"title":"SQL三层约束：允许做什么、允许看谁、必须按什么状态","anchor":"execution-sql-policy","groupTitle":"受限执行与固定口径：让模型能分析，也不能越界","blocks":[{"type":"text","text":"**真实调用链**：@tool execute_sql→invoke_business→execute_business→search_data→execute_query→validate_sql→scoped_query→只读SQLAlchemy连接→write_table→register_artifact。固定sales/repeat也走execute_query，专用指标不绕过权限。\n\n**AST许可层**：sqlglot解析完整查询和嵌套节点，限制单SELECT/UNION、四业务表、批准函数，拒绝嵌套写入、系统表、COPY、设置函数等。关键词搜索会误判字符串或漏掉CTE中的DELETE，因此采用结构检查。函数白名单减能力但也限制复杂分析，遇到不支持函数要通过受控变更而不是直接放行任意函数。\n\n**RLS权限层**：独立非超级只读角色执行事务，set_config('app.dataset_id',id,true)提供本次数据集，数据库策略按dataset_id限制行。true使设置只属于当前事务，不能泄漏给下个任务。只读事务防写，RLS防跨数据集，两者互不替代；若部署角色可绕RLS，应用层看似设置了dataset也不够，角色权限应由初始化/健康检查与集成测试验证。\n\n**状态口径层**：valid_status是用户确认的业务范围。scoped_query对真实orders加状态子查询，对order_items用匹配dataset/order的EXISTS；即使模型忘记WHERE也不纳入无效状态。显式冲突状态要求修正。CTE作用域解析保护同名逻辑表，不能用字符串replace。"},{"type":"callchain","callchain":{"endpoint":"search_data → execute_query → validate_sql → scoped_query → RLS查询","steps":[{"layer":"Agent / 工具 / 受限执行","filePath":"backend/execution/policy.py:13-49","functionName":"validate_sql","explanation":"由 execute_query 先行调用，输入为模型 SQL 字符串，输出为通过检查且归一化后的 PostgreSQL SQL。AST 是语法树：程序能检查嵌套 CTE 或子查询内部是否有写操作，而不是仅搜索几个关键词。白名单限定四张业务表与批准函数，除法自内向外将分子转 NUMERIC，防止 1/2 先变 0。例：SELECT COUNT(*)/2 FROM orders 经改写保留小数；WITH changed AS (DELETE...) SELECT... 被禁止。它不授权用户、不限定数据集、不证明 SUM 的业务含义，后续仍需只读角色、RLS 和口径改写。","code":"def validate_sql(query: str) -> str:\n    \"\"\"只允许指定业务表上的查询，并把除法的分子转为 NUMERIC，避免整数相除丢失小数。\"\"\"\n    if len(query) > 16000:\n        raise ValueError('SQL 超长')\n    try:\n        statements = sqlglot.parse(query, read='postgres')\n    except sqlglot.errors.ParseError:\n        raise ValueError('SQL 语法解析失败') from None\n    if len(statements) != 1 or not isinstance(statements[0], (exp.Select, exp.Union)):\n        raise ValueError('只允许单条 SELECT 查询')\n    tree = statements[0]\n    # 通过语法树检查查询及其子查询中的禁止操作，不能只搜索关键词。实际数据库权限仍需单独限制。\n    forbidden = (exp.Insert, exp.Update, exp.Delete, exp.Create, exp.Drop, exp.Command, exp.Into, exp.Lock,\n                 exp.Copy, exp.Alter, exp.Transaction)\n    if any(isinstance(node, forbidden) for node in tree.walk()):\n        raise ValueError('SQL 包含不允许的操作')\n    ctes = {node.alias_or_name for node in tree.find_all(exp.CTE)}\n    # 允许引用查询中定义的 CTE，但真实表只能是四张业务表，不允许访问系统表、其他数据库或未知 schema。\n    for table in tree.find_all(exp.Table):\n        if table.name not in TABLES | ctes or table.catalog or table.db not in ('', 'public'):\n            raise ValueError('只能访问当前数据集的四张业务表')\n    if not any(table.name in TABLES for table in tree.find_all(exp.Table)):\n        raise ValueError('分析查询必须引用业务数据')\n    for function in tree.find_all(exp.Func):\n        if isinstance(function, (exp.Binary, exp.Unary, exp.Predicate)):\n            continue  # sqlglot 也把 AND 等运算符归入 Func，但它们不是数据库函数，因此这里跳过函数白名单检查。\n        name = function.name.upper() if isinstance(function, exp.Anonymous) else function.sql_name().upper()\n        # sqlglot 用 TimestampTrunc 表示 PostgreSQL 的 DATE_TRUNC，检查白名单时将名称统一为 DATE_TRUNC。\n        if isinstance(function, exp.TimestampTrunc):\n            name = 'DATE_TRUNC'\n        if name not in FUNCTIONS:\n            raise ValueError(f'函数 {name} 不在允许范围内')\n    # 从最内层除法开始转换，避免嵌套计算先丢失小数。转换后的 SQL 会保存在结果信息中，便于追溯。\n    for division in reversed(list(tree.find_all(exp.Div))):\n        # PostgreSQL 的整数除法中 1/2 得到 0。先将分子转换为 NUMERIC，再执行除法，才能保留小数结果。\n        division.set('this', exp.Cast(this=division.this.copy(), to=exp.DataType.build('NUMERIC')))\n    return tree.sql(dialect='postgres').rstrip(';')","language":"python","lineAnnotations":[{"line":1,"annotation":"定义 validate_sql；普通函数在当前线程完成本步骤；类型标注表达接口约定，不会自动做业务验证。"},{"line":2,"annotation":"函数职责约定：只允许指定业务表上的查询，并把除法的分子转为 NUMERIC，避免整数相除丢失小数。；下面以实际语句核对这个约定。"},{"line":3,"annotation":"先限制 SQL 字符数，避免无限大输入拖慢解析器。"},{"line":4,"annotation":"超长明确失败，不截断成另一条可执行 SQL。"},{"line":5,"annotation":"将第三方语法解析的错误转换为稳定业务提示。"},{"line":6,"annotation":"按 PostgreSQL 方言解析全部语句，才能发现分号后的第二条语句。"},{"line":7,"annotation":"捕获明确的 ParseError，保留未知程序错误以便排查。"},{"line":8,"annotation":"不把完整解析异常细节透给模型，返回简明语法错误。"},{"line":9,"annotation":"只允许恰好一条 SELECT 或 UNION 顶层查询，拒绝 DML/DDL。"},{"line":10,"annotation":"多语句或非查询在数据库访问前失败。"},{"line":11,"annotation":"取唯一语法树，后续检查覆盖其全部后代节点。"},{"line":12,"annotation":"作者在这里强调的顺序或边界：通过语法树检查查询及其子查询中的禁止操作，不能只搜索关键词。实际数据库权限仍需单独限制。"},{"line":13,"annotation":"禁止写入、建删表、命令、SELECT INTO 和显式锁节点。"},{"line":14,"annotation":"继续禁止 COPY、ALTER 与事务控制；不能让查询自行导出文件或改变执行边界。"},{"line":15,"annotation":"tree.walk 遍历所有层级，防止写操作藏在 CTE 中。"},{"line":16,"annotation":"发现任一禁止节点就拒绝整条查询。"},{"line":17,"annotation":"收集 CTE 名称，允许后续查询引用自己声明的临时逻辑表。"},{"line":18,"annotation":"作者在这里强调的顺序或边界：允许引用查询中定义的 CTE，但真实表只能是四张业务表，不允许访问系统表、其他数据库或未知 schema。"},{"line":19,"annotation":"枚举语法树中所有表引用，而不是只看最外层 FROM。"},{"line":20,"annotation":"仅真实业务表或本查询 CTE 可用，且拒绝跨 catalog 与非 public schema。"},{"line":21,"annotation":"用户表、系统表和其他数据库对象在这里被拦截。"},{"line":22,"annotation":"查询至少引用业务数据，不能借查询接口只调用函数或探测系统。"},{"line":23,"annotation":"没有真实业务表引用时返回分析范围错误。"},{"line":24,"annotation":"检查函数节点，阻止文件、设置和未知函数调用。"},{"line":25,"annotation":"部分布尔或算术节点在 sqlglot 中也属于 Func，不能误当数据库函数拒绝。"},{"line":26,"annotation":"跳过这些运算符节点，继续检查真正函数。"},{"line":27,"annotation":"统一匿名函数与框架内置函数的名称表示。"},{"line":28,"annotation":"作者在这里强调的顺序或边界：sqlglot 用 TimestampTrunc 表示 PostgreSQL 的 DATE_TRUNC，检查白名单时将名称统一为 DATE_TRUNC。"},{"line":29,"annotation":"识别 sqlglot 对 DATE_TRUNC 的专用节点类型。"},{"line":30,"annotation":"把内部名称规范成白名单所用的 DATE_TRUNC。"},{"line":31,"annotation":"检查归一化的函数名是否属于允许集合。"},{"line":32,"annotation":"告诉模型哪个函数不受支持，以便改写成 PostgreSQL 允许用法。"},{"line":33,"annotation":"作者在这里强调的顺序或边界：从最内层除法开始转换，避免嵌套计算先丢失小数。转换后的 SQL 会保存在结果信息中，便于追溯。"},{"line":34,"annotation":"逆序处理除法树，先修内层计算，防止内层整数截断后外层转换已来不及。"},{"line":35,"annotation":"作者在这里强调的顺序或边界：PostgreSQL 的整数除法中 1/2 得到 0。先将分子转换为 NUMERIC，再执行除法，才能保留小数结果。"},{"line":36,"annotation":"复制原分子再 CAST AS NUMERIC，保留原表达式结构且避免节点引用冲突。"},{"line":37,"annotation":"生成标准 PostgreSQL SQL 并去末尾分号，以便执行器安全包成子查询。"}],"keyPoint":"语法许可、数据库权限、业务口径是三个不同问题。"},{"layer":"Agent / 工具 / 受限执行","filePath":"backend/execution/metric_scope.py:7-43","functionName":"scoped_query","explanation":"由 execute_query 在 validate_sql 后调用。输入是归一 SQL 和任务确认的 valid_status，返回带绑定参数占位符的执行 SQL；状态值不会直接拼接成 SQL 字面量。它按作用域识别真实订单/明细表，订单包状态过滤，明细以 EXISTS 匹配同数据集有效订单，不会直接替换字符串误伤同名 CTE。例：用户确认 cancelled 而模型 WHERE status='delivered'，直接报冲突要求修正；模型没写状态时仍强制限定。RLS 管数据集权限，当前函数管有效状态口径，不能用其中之一冒充另一个。","code":"def scoped_query(query: str, valid_status: str) -> str:\n    \"\"\"找到查询中实际引用的订单和明细表，将它们改为只包含有效订单的子查询，并绑定状态参数。\"\"\"\n    tree = sqlglot.parse_one(query, read='postgres')\n    sources = []\n    # 根据 SQL 作用域区分真实表和同名 CTE。不能直接替换字符串，否则可能误改别名或子查询。\n    for scope in traverse_scope(tree):\n        for _, (_, source) in scope.selected_sources.items():\n            if isinstance(source, exp.Table) and source.name in ('orders', 'order_items'):\n                sources.append(source)\n    # 模型指定的状态与当前口径冲突时直接报错，让模型修正，而不是悄悄返回空结果。\n    for comparison in tree.find_all(exp.EQ):\n        left, right = comparison.this, comparison.expression\n        if isinstance(right, exp.Column):\n            left, right = right, left\n        if isinstance(left, exp.Column) and left.name == 'status' and isinstance(right, exp.Literal) and right.is_string:\n            if right.this != valid_status and sources:\n                raise ValueError(f'订单状态与已确认口径冲突：当前有效状态为 {valid_status}，请移除冲突条件；执行器自动限定有效订单。')\n    for source in sources:\n        alias = source.args.get('alias') or exp.TableAlias(this=source.this.copy())\n        if source.name == 'orders':\n            template = 'SELECT * FROM public.orders WHERE status=:analysis_valid_status'\n        else:\n            # 明细表没有状态列，所以用 EXISTS 查询其订单是否有效，同时匹配数据集 ID，避免关联到其他数据集。\n            template = '''SELECT scoped_items.* FROM public.order_items AS scoped_items\n                WHERE EXISTS (SELECT 1 FROM public.orders AS scoped_orders\n                WHERE scoped_orders.dataset_id=scoped_items.dataset_id\n                  AND scoped_orders.order_id=scoped_items.order_id\n                  AND scoped_orders.status=:analysis_valid_status)'''\n        filtered = sqlglot.parse_one(template, read='postgres')\n        # sqlglot 默认生成 psycopg 格式的占位符，但 SQLAlchemy text 使用冒号参数，因此在这里转换格式。\n        for placeholder in list(filtered.find_all(exp.Placeholder)):\n            placeholder.replace(exp.Var(this=':analysis_valid_status'))\n        source.replace(exp.Subquery(this=filtered, alias=alias.copy()))\n    for column in tree.find_all(exp.Column):\n        if column.db == 'public':\n            column.set('db', None)\n    return tree.sql(dialect='postgres')","language":"python","lineAnnotations":[{"line":1,"annotation":"定义 scoped_query；普通函数在当前线程完成本步骤；类型标注表达接口约定，不会自动做业务验证。"},{"line":2,"annotation":"函数职责约定：找到查询中实际引用的订单和明细表，将它们改为只包含有效订单的子查询，并绑定状态参数。；下面以实际语句核对这个约定。"},{"line":3,"annotation":"按 PostgreSQL 方言解析已经通过许可检查的 SQL。"},{"line":4,"annotation":"保存待改写的真实表节点，稍后统一替换。"},{"line":5,"annotation":"作者在这里强调的顺序或边界：根据 SQL 作用域区分真实表和同名 CTE。不能直接替换字符串，否则可能误改别名或子查询。"},{"line":6,"annotation":"遍历 SQL 作用域，避免把同名 CTE 也当成基础表替换。"},{"line":7,"annotation":"selected_sources 给出作用域中实际绑定的来源节点。"},{"line":8,"annotation":"只改 orders/order_items 的真实 Table，产品和客户不附加订单状态。"},{"line":9,"annotation":"记录真实来源，以便后续替换且不边遍历边破坏作用域结果。"},{"line":10,"annotation":"作者在这里强调的顺序或边界：模型指定的状态与当前口径冲突时直接报错，让模型修正，而不是悄悄返回空结果。"},{"line":11,"annotation":"遍历等号比较，识别显式状态条件冲突。"},{"line":12,"annotation":"读取左右表达式，兼容 status='x' 与 'x'=status。"},{"line":13,"annotation":"右边为列时交换，让后面的识别逻辑始终按列在左判断。"},{"line":14,"annotation":"交换后能统一处理模型两种等价写法。"},{"line":15,"annotation":"仅识别 status 列与字符串字面值的相等比较，其他表达式仍由外层有效状态过滤限制。"},{"line":16,"annotation":"若存在真实订单来源且状态字面值与任务口径不同
