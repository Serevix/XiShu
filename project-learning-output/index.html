，就拒绝。"},{"line":17,"annotation":"明确报告已确认状态；不悄悄将冲突查询改成空结果误导用户。"},{"line":18,"annotation":"逐个实际基础表生成受限子查询。"},{"line":19,"annotation":"保留原表别名；没有别名则以表名作为别名，避免原列引用失效。"},{"line":20,"annotation":"针对 orders 采用直接状态过滤模板。"},{"line":21,"annotation":"模板只包含受控参数名，状态实际由 SQLAlchemy 参数绑定。"},{"line":22,"annotation":"明细表没有 status，因此需要另一种过滤表达式。"},{"line":23,"annotation":"作者在这里强调的顺序或边界：明细表没有状态列，所以用 EXISTS 查询其订单是否有效，同时匹配数据集 ID，避免关联到其他数据集。"},{"line":24,"annotation":"明细模板返回原明细列，避免改变用户 SELECT 的字段结构。"},{"line":25,"annotation":"用 EXISTS 检查是否有对应有效订单，不把明细重复展开。"},{"line":26,"annotation":"先匹配 dataset_id，不能碰巧跨数据集关联到相同订单 ID。"},{"line":27,"annotation":"再匹配 order_id，确认确实是该明细所属订单。"},{"line":28,"annotation":"最后以绑定参数限定有效状态，实现没有状态字段的明细口径过滤。"},{"line":29,"annotation":"把受控模板也解析成语法树，随后替换真实表节点。"},{"line":30,"annotation":"作者在这里强调的顺序或边界：sqlglot 默认生成 psycopg 格式的占位符，但 SQLAlchemy text 使用冒号参数，因此在这里转换格式。"},{"line":31,"annotation":"枚举模板里的占位符，统一框架输出格式。"},{"line":32,"annotation":"SQLAlchemy text 采用 :analysis_valid_status，转换 sqlglot 的默认占位符表示。"},{"line":33,"annotation":"用保留别名的 Subquery 替换真实表，外层计算结构不需要人工重写。"},{"line":34,"annotation":"遍历列引用，处理原 SQL 写了 public.orders.column 的情况。"},{"line":35,"annotation":"仅删除 public 数据库限定，而不是删除列的表别名。"},{"line":36,"annotation":"清除 db 后原列能正确引用新子查询的别名。"},{"line":37,"annotation":"返回最终 SQL；参数值仍由执行器单独传入。"}],"keyPoint":"把已确认订单口径变成执行约束，不能仅依靠提示词让模型记得过滤。"},{"layer":"Agent / 工具 / 受限执行","filePath":"backend/execution/sql_executor.py:11-39","functionName":"execute_query","explanation":"SQL 工具与标准指标最终共同调用这里，输入 task_id/dataset_id 来自服务器状态，query 来自模型或固定指标模板，valid_status 来自已确认口径。返回 write_table 的元数据供业务层登记，函数同时产生 JSON/CSV 文件；它本身不把文件登记进任务产物列表。NullPool 每次执行用独立只读账号连接，事务内 set_config 指定 RLS 数据集和 statement_timeout，最后 dispose 清理引擎。例：上限 N 时读取 N+1 行，发现超出就报错，不能交付“看起来完整”的前 N 行。但用户 SQL 自己写 LIMIT 30 仍合法，执行器无法判断用户业务是否要求全部类别。","code":"async def execute_query(task_id: str, dataset_id: str, query: str, valid_status: str | None = None) -> dict:\n    \"\"\"在只读事务中指定数据集和查询超时，执行查询并检查返回行数，成功后保存表格结果。\"\"\"\n    settings = get_settings()\n    # 先检查 SQL 语法树，再添加订单状态限制，最后通过只读账号和行级权限查询允许的数据。\n    normalized = validate_sql(query)\n    effective = scoped_query(normalized, valid_status) if valid_status is not None else normalized\n    parameters = {'analysis_valid_status': valid_status} if valid_status is not None else {}\n    reader_engine = create_async_engine(settings.sql_reader_url, poolclass=NullPool)\n    try:\n        async with reader_engine.begin() as connection:\n            await connection.execute(text('SET TRANSACTION READ ONLY'))\n            # 数据库行级权限从 app.dataset_id 读取本次数据集。true 让这个配置只在当前事务中生效。\n            await connection.execute(text(\"SELECT set_config('app.dataset_id', :id, true)\"), {'id': dataset_id})\n            await connection.execute(text(\"SELECT set_config('statement_timeout', :timeout, true)\"), {'timeout': str(settings.sql_timeout_ms)})\n            # 内部 SQL 完成统计，外层 LIMIT 只限制输出数量。结果超过上限时会报错，不会直接交付截断后的表格。\n            cursor = await connection.execute(text(f'SELECT * FROM ({effective}) AS bounded_result LIMIT {settings.max_sql_rows + 1}'), parameters)\n            columns = list(cursor.keys())\n            if len(columns) > 40 or any(len(column) > 80 for column in columns):\n                raise ValueError('结果列数量或列名长度超出限制，请减少字段或使用简短别名')\n            if len(set(columns)) != len(columns):\n                raise ValueError('结果列名重复，请为查询列指定唯一别名')\n            rows = [dict(row) for row in cursor.mappings()]\n            # 比上限多读一行，用来判断是否超出限制。超出就报错，避免把缺行的表格当作完整结果交付。\n            if len(rows) > settings.max_sql_rows:\n                raise ValueError('结果行数超出限制，请在 SQL 中聚合或明确限定范围')\n        return write_table(task_id, 'SQL 查询结果', columns, rows, sql=normalized, effective_sql=effective,\n                           dataset_id=dataset_id, metric_scope={'valid_status': valid_status, 'enforced': valid_status is not None})\n    finally:\n        await reader_engine.dispose()","language":"python","lineAnnotations":[{"line":1,"annotation":"定义 execute_query；async 表示调用后获得协程，调用者需 await 才能取得本步骤结果。"},{"line":2,"annotation":"函数职责约定：在只读事务中指定数据集和查询超时，执行查询并检查返回行数，成功后保存表格结果。；下面以实际语句核对这个约定。"},{"line":3,"annotation":"读取 SQL 只读连接地址、超时和结果行数限制。"},{"line":4,"annotation":"作者在这里强调的顺序或边界：先检查 SQL 语法树，再添加订单状态限制，最后通过只读账号和行级权限查询允许的数据。"},{"line":5,"annotation":"先检查 SQL AST；危险结构在建立数据库访问前就被拒绝。"},{"line":6,"annotation":"再施加有效状态约束，只有明确传 valid_status 时才标记已执行口径过滤。"},{"line":7,"annotation":"状态值以参数字典传输，不拼接到执行 SQL。"},{"line":8,"annotation":"为独立只读角色创建 NullPool 引擎，每次查询不复用池中连接。"},{"line":9,"annotation":"保证查询失败或写文件失败后仍关闭引擎。"},{"line":10,"annotation":"begin 提供事务上下文；正常退出提交，只读事务没有业务写入，异常则回滚。"},{"line":11,"annotation":"数据库事务声明只读，增加权限层保护，不能让通过过滤的漏洞变成写入。"},{"line":12,"annotation":"作者在这里强调的顺序或边界：数据库行级权限从 app.dataset_id 读取本次数据集。true 让这个配置只在当前事务中生效。"},{"line":13,"annotation":"set_config 的 true 表示设置只在当前事务生效，避免下一任务继承数据范围。"},{"line":14,"annotation":"同样设置事务内语句超时，限制长查询占用数据库。"},{"line":15,"annotation":"作者在这里强调的顺序或边界：内部 SQL 完成统计，外层 LIMIT 只限制输出数量。结果超过上限时会报错，不会直接交付截断后的表格。"},{"line":16,"annotation":"把 SQL 包成子查询并读 N+1 行；N 来自服务器整数配置，不由模型提供。"},{"line":17,"annotation":"从 cursor 取真实返回列名，后续文件按这份结构写出。"},{"line":18,"annotation":"限制最多 40 列及列名长度，避免异常宽表拖垮模型反馈和页面。"},{"line":19,"annotation":"提示模型减少字段或简短别名，不能静默删列。"},{"line":20,"annotation":"重名列转换字典会覆盖值，因此必须在转行字典前检测。"},{"line":21,"annotation":"要求显式唯一别名，避免明细/订单联表同名列丢失。"},{"line":22,"annotation":"mappings 给出按列名取值的行，再复制成可序列化字典列表。"},{"line":23,"annotation":"作者在这里强调的顺序或边界：比上限多读一行，用来判断是否超出限制。超出就报错，避免把缺行的表格当作完整结果交付。"},{"line":24,"annotation":"多读出的第 N+1 行作为溢出证据。"},{"line":25,"annotation":"结果超限明确要求聚合或限定范围，不把前 N 行冒充全部。"},{"line":26,"annotation":"保存完整结果与规范 SQL、实际有效 SQL，便于排查模型原意和程序改写。"},{"line":27,"annotation":"记录数据集及口径来源，报告核验可检查该结果是否真正执行状态限制。"},{"line":28,"annotation":"即使执行异常，也进入连接资源清理。"},{"line":29,"annotation":"释放独立引擎资源；不能依赖进程退出或垃圾回收才关闭连接。"}],"keyPoint":"只读账号与事务内 RLS 限定真实数据权限，N+1 只证明执行结果未被外层静默截断。"}]}},{"type":"text","text":"**例子与边界**：用户选择delivered，模型写SUM(i.price)但没过滤状态，执行器仍限制有效订单；模型写WHERE status='cancelled'会报口径冲突。模型若写SUM(price)*2，AST和RLS都可能允许，结果仍错；安全查询不是正确业务查询。外层N+1防止返回被系统悄悄截断，但模型自己LIMIT 30并不能由此自动判为“完整业务结果”。\n\n**合理替代**：数据库专门视图可以封装有效状态，但状态每任务可变时需参数化设计；SQL模板覆盖固定报表更稳但灵活性下降；只应用层WHERE最简单，遗漏一次就可能泄露，因而仍需数据库RLS兜底。当前每次建NullPool引擎增加连接成本，未来可评估安全池化，前提是事务级上下文不串任务。"}]},{"title":"用三条手算数据理解金额、运费、客单价与复购","anchor":"execution-standard-metrics","groupTitle":"受限执行与固定口径：让模型能分析，也不能越界","blocks":[{"type":"text","text":"**背景知识：统计粒度**指“一行代表什么”。商品项一行代表一件或一项订单明细，订单一行代表一次购买，客户一行代表一个身份记录。混着求COUNT/SUM容易重复计算。先把明细汇总到订单粒度，再做总计/月度，是当前销售工具的核心。\n\n**手算案例**：有效订单A有两条明细：商品100/200、运费10/20；有效订单B没有明细。正确订单数2，商品金额300，总运费30，含运费330，商品客单价300/2=150。若INNER JOIN漏B，则订单数1、客单价300；若每订单取MAX运费则20、含运费320；若COUNT明细当订单数则2但碰巧对了，增加第三明细就暴露错误。这是为什么测试必须构造多商品和无明细订单，而非只挑每单一件的样例。\n\n**月份案例**：10月商品300，11月0且有有效空明细订单，11月差值-300、增长-100%；首月增长NULL，因为没有基准。若10月0、11月100，增长NULL，不能写“增长0%”。若中间月份完全没有订单，当前SQL不会补零月；LAG比较上一条存在月份，报告要避免把它无条件叫连续自然月环比。这是当前实现边界，改进可加入日历表或generate_series并调整允许函数与测试。\n\n**复购案例**：订单关联客户C1、C2，但两者unique_id都为U，则独立客户1、两单客户1、复购率100%。缺失unique_id订单单列unidentified_orders，不把NULL当一个购买多次客户。区间内至少两单是一种复购定义，不是首购cohort在未来回访的留存分析。"},{"type":"callchain","callchain":{"endpoint":"execute_business → sales_metrics / customer_repeat_metrics → execute_query → 完整表文件","steps":[{"layer":"Agent / 工具 / 受限执行","filePath":"backend/tools/sales_metrics.py:6-48","functionName":"sales_metrics","explanation":"由 execute_business 的 sales_metrics 分支调用，模型只决定日期、total/month 分组及可选绘图需求，不能重定义金额与订单粒度。函数构建固定 SQL 并走同一受限执行器，返回表格元数据加 metric_id、分组和日期范围，供报告要求校验识别。先逐订单 LEFT JOIN 汇总明细，再汇总订单，是为了保留无明细的有效订单并避免多商品订单被算多次。例：A 有商品100、200和运费10、20；B 无明细，两单总额300、运费30、含运费330、客单150。月增长用 LAG 比较上一条存在的月，不自动补没有订单的月份；首月/零分母为 NULL。","code":"async def sales_metrics(task_id: str, dataset_id: str, valid_status: str,\n                         start_date: str | None = None, end_date: str | None = None,\n                         group_by: str = 'total') -> dict:\n    \"\"\"先逐订单汇总商品项，再统计订单量与金额；开始包含、结束不包含，无明细订单金额为零。\"\"\"\n    start = date.fromisoformat(start_date) if start_date else None\n    end = date.fromisoformat(end_date) if end_date else None\n    if start and end and start >= end:\n        raise ValueError('销售时间范围必须开始早于结束')\n    if group_by not in ('total', 'month'):\n        raise ValueError('销售指标分组只支持 total 或 month')\n    filters = []\n    if start:\n        filters.append(f\"o.purchase_time >= '{start.isoformat()}'\")\n    if end:\n        filters.append(f\"o.purchase_time \u003c '{end.isoformat()}'\")\n    where = ' WHERE ' + ' AND '.join(filters) if filters else ''\n    # 先按订单聚合，避免一个订单有多项商品时重复计算订单数；运费必须逐商品项求和。\n    prefix = \"TO_CHAR(purchase_time,'YYYY-MM') AS month, \" if group_by == 'month' else ''\n    suffix = \" GROUP BY TO_CHAR(purchase_time,'YYYY-MM') ORDER BY month\" if group_by == 'month' else ''\n    query = '''WITH order_totals AS (\n        SELECT o.order_id, o.purchase_time,\n               COALESCE(SUM(i.price),0) AS amount,\n               COALESCE(SUM(i.freight_value),0) AS freight\n        FROM orders o LEFT JOIN order_items i\n          ON i.dataset_id=o.dataset_id AND i.order_id=o.order_id''' + where + '''\n        GROUP BY o.order_id,o.purchase_time\n    ) SELECT ''' + prefix + '''COUNT(*) AS order_count,\n        COALESCE(SUM(amount),0) AS item_amount,\n        COALESCE(SUM(freight),0) AS freight_amount,\n        COALESCE(SUM(amount+freight),0) AS total_amount,\n        ROUND(SUM(amount)/NULLIF(COUNT(*),0),2) AS aov\n        FROM order_totals''' + suffix\n    if group_by == 'month':\n        # 保存常见月度差值和百分比，避免报告口算或额外请求补算；统一保留两位小数。\n        query = '''WITH monthly AS (''' + query + ''') SELECT *,\n            item_amount-LAG(item_amount) OVER (ORDER BY month) AS amount_diff,\n            order_count-LAG(order_count) OVER (ORDER BY month) AS order_diff,\n            ROUND(100.0*(item_amount-LAG(item_amount) OVER (ORDER BY month))/NULLIF(LAG(item_amount) OVER (ORDER BY month),0),2) AS amount_growth,\n            ROUND(100.0*(order_count-LAG(order_count) OVER (ORDER BY month))/NULLIF(LAG(order_count) OVER (ORDER BY month),0),2) AS order_growth\n            FROM monthly ORDER BY month'''\n    result = await execute_query(task_id, dataset_id, query, valid_status)\n    return {**result, 'metric_id': 'sales_summary', 'group_by': group_by,\n            'date_range': {'start_inclusive': start_date, 'end_exclusive': end_date}}","language":"python","lineAnnotations":[{"line":1,"annotation":"定义 sales_metrics；async 表示调用后获得协程，调用者需 await 才能取得本步骤结果。"},{"line":2,"annotation":"start_date/end_date 可缺省，不自行根据历史偏好推断本次日期范围。"},{"line":3,"annotation":"group_by 默认 total，月度分组才增加 month 与差值增长列。"},{"line":4,"annotation":"函数职责约定：先逐订单汇总商品项，再统计订单量与金额；开始包含、结束不包含，无明细订单金额为零。；下面以实际语句核对这个约定。"},{"line":5,"annotation":"用 ISO 日期解析并验证输入，随后只把规范日期写入固定 SQL。"},{"line":6,"annotation":"同样解析结束日期；排他上界便于相邻区间拼接不重复。"},{"line":7,"annotation":"同时有起止时，必须严格开始早于结束。"},{"line":8,"annotation":"非法范围明确失败，避免空结果被误解释成没有销售。"},{"line":9,"annotation":"即使不是通过模型工具入口调用，也重新限制分组可选值。"},{"line":10,"annotation":"非 total/month 分组不执行；其他维度分析应使用受限 SQL 工具。"},{"line":11,"annotation":"收集实际提供的时间过滤条件。"},{"line":12,"annotation":"只有提供开始日期才追加下界，避免悄悄替用户选时间。"},{"line":13,"annotation":"purchase_time >= 保留开始日全部订单。"},{"line":14,"annotation":"只有提供结束日期才追加上界。"},{"line":15,"annotation":"purchase_time \u003c 排除结束日，避免月底时间精度问题。"},{"line":16,"annotation":"将受控条件组合成 WHERE；没有日期时分析数据集全部时间。"},{"line":17,"annotation":"作者在这里强调的顺序或边界：先按订单聚合，避免一个订单有多项商品时重复计算订单数；运费必须逐商品项求和。"},{"line":18,"annotation":"月度模式增加规范 YYYY-MM 列；总计模式不增加无关维度。"},{"line":19,"annotation":"月度模式按规范月份分组并排序，为 LAG 的时间顺序提供基础。"},{"line":20,"annotation":"定义 order_totals CTE，先把数据粒度收敛为一行一个订单。"},{"line":21,"annotation":"选择订单 ID 与购买时间，时间粒度来自订单而非商品明细。"},{"line":22,"annotation":"商品金额累加每一项；COALESCE 保留无明细订单金额零。"},{"line":23,"annotation":"运费也逐项 SUM，不能用 MAX 去掉每项真实运费。"},{"line":24,"annotation":"LEFT JOIN 保留没有明细的有效订单，内连接会漏算订单量。"},{"line":25,"annotation":"联表同时匹配 dataset_id/order_id；追加规范日期过滤。"},{"line":26,"annotation":"按订单及购买时间聚合，确保 CTE 里每个订单只有一行。"},{"line":27,"annotation":"外层 COUNT(*) 数订单行，不会因多商品重复计数。"},{"line":28,"annotation":"订单金额再求和得到商品总额。"},{"line":29,"annotation":"订单运费再求和得到总运费。"},{"line":30,"annotation":"同一粒度上金额加运费后汇总，得到含运费总额。"},{"line":31,"annotation":"客单价是商品金额/订单数，NULLIF 防止零订单除零并 ROUND 两位。"},{"line":32,"annotation":"关闭 CTE 汇总查询并追加月度分组排序后缀。"},{"line":33,"annotation":"只有月度模式才增加跨月派生指标。"},{"line":34,"annotation":"作者在这里强调的顺序或边界：保存常见月度差值和百分比，避免报告口算或额外请求补算；统一保留两位小数。"},{"line":35,"annotation":"把月度结果再包 monthly CTE，派生计算重用真实月度数字。"},{"line":36,"annotation":"当前金额减上一结果月金额，首条 LAG 为 NULL。"},{"line":37,"annotation":"同样计算订单量差值，不让报告模型口算。"},{"line":38,"annotation":"金额增长为差额/上一月金额×100，零分母无定义，统一两位小数。"},{"line":39,"annotation":"订单增长按同样规则计算；100.0 与执行器 NUMERIC 转换避免整数除法。"},{"line":40,"annotation":"最终按 month 排列，图表和报告顺序与窗口计算一致。"},{"line":41,"annotation":"统一执行器继续施加只读账号、RLS 和有效订单状态过滤。"},{"line":42,"annotation":"为返回的真实表格打 sales_summary 标签，报告可识别固定口径产物。"},{"line":43,"annotation":"附带日期上下界语义用于追溯；模型反馈中的元数据不是替代实际文件。"}],"keyPoint":"固定常用指标的业务粒度，模型保留分析选择能力，程序承担高频数值定义。"},{"layer":"Agent / 工具 / 受限执行","filePath":"backend/tools/customer_metrics.py:12-41","functionName":"customer_repeat_metrics","explanation":"由业务工具分支调用，返回固定客户粒度复购表，最终核验对复购问题要求存在 metric_id='customer_repeat'。Olist 的 customer_id 是订单关联记录，customer_unique_id 才用于合并同一人在多个订单的行为；直接按 customer_id 统计会低估复购。例：两个 customer_id 共享唯一客户 U 且各买一单，正确独立客户数1、复购客户数1、复购率100%，不是两个不复购客户。缺失 unique_id 的订单单独计数，不合成一个虚假的“缺失客户”。这定义的是指定时间范围内至少两单，不等同于 cohort 留存率。","code":"async def customer_repeat_metrics(task_id: str, dataset_id: str, valid_status: str,\n                                  start_date: str | None = None, end_date: str | None = None) -> dict:\n    \"\"\"按独立客户标识合并有效订单，统计至少购买两单的客户及其占比。开始日包含，结束日不包含。\"\"\"\n    start = date.fromisoformat(start_date) if start_date else None\n    end = date.fromisoformat(end_date) if end_date else None\n    if start and end and start >= end:\n        raise ValueError('复购时间范围应为开始日期早于结束日期，结束日期不包含在内')\n    filters = []\n    if start:\n        filters.append(f\"o.purchase_time >= '{start.isoformat()}'\")\n    if end:\n        filters.append(f\"o.purchase_time \u003c '{end.isoformat()}'\")\n    where = ' WHERE ' + ' AND '.join(filters) if filters else ''\n    # Olist 的 customer_id 用于订单关联，customer_unique_id 才能识别同一人在不同订单中的购买行为。\n    # 先按独立客户统计订单数，再计算至少两单客户的比例。缺少独立标识的订单单独统计，不猜测其客户归属。\n    query = '''WITH valid_customer_orders AS (\n        SELECT c.customer_unique_id, o.order_id\n        FROM orders o JOIN customers c ON c.dataset_id=o.dataset_id AND c.customer_id=o.customer_id''' + where + '''\n    ), customer_counts AS (\n        SELECT customer_unique_id, COUNT(DISTINCT order_id) AS n\n        FROM valid_customer_orders WHERE customer_unique_id IS NOT NULL GROUP BY customer_unique_id\n    ) SELECT COUNT(*) AS unique_customers,\n        COUNT(CASE WHEN n>=2 THEN 1 END) AS repeat_customers,\n        ROUND(100.0 * COUNT(CASE WHEN n>=2 THEN 1 END) / NULLIF(COUNT(*),0),2) AS repeat_rate,\n        (SELECT COUNT(DISTINCT order_id) FROM valid_customer_orders WHERE customer_unique_id IS NULL) AS unidentified_orders\n        FROM customer_counts'''\n    # 固定指标查询也经过统一执行器，仍须遵守只读权限、数据集范围和有效订单状态限制。\n    result = await execute_query(task_id, dataset_id, query, valid_status)\n    return {**result, 'metric_id': 'customer_repeat', 'customer_identity': 'customer_unique_id',\n            'date_range': {'start_inclusive': start_date, 'end_exclusive': end_date}}","language":"python","lineAnnotations":[{"line":1,"annotation":"定义 customer_repeat_metrics；async 表示调用后获得协程，调用者需 await 才能取得本步骤结果。"},{"line":2,"annotation":"日期可缺省；结束日期采用不包含语义，与销售指标一致。"},{"line":3,"annotation":"函数职责约定：按独立客户标识合并有效订单，统计至少购买两单的客户及其占比。开始日包含，结束日不包含。；下面以实际语句核对这个约定。"},{"line":4,"annotation":"解析 ISO 开始日期，禁止将任意模型字符串拼入 SQL。"},{"line":5,"annotation":"解析结束日期，合法后才能构造过滤。"},{"line":6,"annotation":"开始日期不得等于或晚于结束日期。"},{"line":7,"annotation":"非法范围显式反馈，避免把范围错误报告为零复购。"},{"line":8,"annotation":"初始化日期过滤列表。"},{"line":9,"annotation":"有开始日期才加下界。"},{"line":10,"annotation":"下界包含当天，按订单购买时间计算。"},{"line":11,"annotation":"有结束日期才加上界。"},{"line":12,"annotation":"上界排他，不依赖当天最后一毫秒。"},{"line":13,"annotation":"拼接经过日期解析的固定过滤条件。"},{"line":14,"annotation":"作者在这里强调的顺序或边界：Olist 的 customer_id 用于订单关联，customer_unique_id 才能识别同一人在不同订单中的购买行为。"},{"line":15,"annotation":"作者在这里强调的顺序或边界：先按独立客户统计订单数，再计算至少两单客户的比例。缺少独立标识的订单单独统计，不猜测其客户归属。"},{"line":16,"annotation":"第一层 CTE 构造有效客户订单关系。"},{"line":17,"annotation":"同时保留唯一客户 ID 与订单 ID，后续去重在这个基础上进行。"},{"line":18,"annotation":"订单与客户必须同时按 dataset_id/customer_id 关联。"},{"line":19,"annotation":"第二层 CTE 将同一 unique_id 的订单汇合。"},{"line":20,"annotation":"COUNT DISTINCT 防重复订单记录引起虚假复购次数。"},{"line":21,"annotation":"缺失身份的订单不并成一名客户，否则会人为制造高复购。"},{"line":22,"annotation":"最终 COUNT(*) 统计可识别的独立客户分母。"},{"line":23,"annotation":"条件计数统计 n>=2 的客户，复购是客户数量而非复购订单数量。"},{"line":24,"annotation":"乘100后除独立客户数，零分母返回 NULL，ROUND 两位小数。"},{"line":25,"annotation":"单独统计无法识别客户的去重订单数，报告可透明说明数据缺口。"},{"line":26,"annotation":"从 customer_counts 汇总，结果为一行指标。"},{"line":27,"annotation":"作者在这里强调的顺序或边界：固定指标查询也经过统一执行器，仍须遵守只读权限、数据集范围和有效订单状态限制。"},{"line":28,"annotation":"固定 SQL 仍走统一权限与口径执行器，专用工具不获得更高数据库权限。"},{"line":29,"annotation":"返回 metric_id 及身份定义，让后续校验知道没有混淆 customer_id。"},{"line":30,"annotation":"返回原日期边界，便于说明本次复购时间范围。"}],"keyPoint":"复购先定义“谁是同一个客户”，再定义分母与时间范围。"}]}},{"type":"text","text":"**为什么固定工具仍是Agent**：模型仍选择分析目标、日期、分组、是否追加SQL/Python/图表以及是否需要澄清；只是稳定高频公式不交给每次生成。这类似财务系统提供标准计算服务，减少重复口径错误。收益是可独立手算验证、减少修复轮次；代价是要维护定义，新增业务口径必须显式版本管理，不能假设一个aov适合所有公司。\n\n**证据**：tests/integration/test_framework_tools.py::test_sales_metrics_item_freight_and_orders_without_items直接创建100/200、10/20与无明细订单，预期值手算，不用同一SQL生成“标准答案”。tests/integration/test_metric_accuracy.py及独立评测oracle补充客户口径与合成数据验证；教程不把这些测试存在等同于本次已执行通过。"}]},{"title":"Python代码为什么要先筛查，再放进Docker","anchor":"execution-python-sandbox","groupTitle":"受限执行与固定口径：让模型能分析，也不能越界","blocks":[{"type":"text","text":"**需求与对照方案**：用户需要SQL不方便表达的表格计算，模型可生成Python；最简单是在API进程exec(code)。一旦访问文件、网络、内省或无限循环，就会影响账号密钥、业务数据和Web服务。只删import不是安全沙箱，pandas/NumPy本身也有大量能力；只靠容器也无法省略资源和挂载边界。\n\n**当前多层顺序**：先AST拒绝导入/动态执行/私有属性等明确危险写法，确认存在result赋值；read_table核对当前任务输入；把唯一CSV及代码写入独立目录；docker参数列表启动无网络、只读根、非root、drop capabilities/no-new-privileges、pids/CPU/内存/临时目录限制；只读/input、仅/output可写；45秒等待，结果最多2MiB，最后强制清理。镜像Dockerfile使用USER 10001:10001与python -I，避免继承主机Python用户环境。\n\n**容器内实际工作**：sandbox/runner.py读固定路径CSV，预置df/pd/np/math/Decimal与有限builtins，再exec(compile(...))，最后把result转DataFrame并to_json。这里exec是服务器受控runner执行已筛查代码，不是允许模型在其代码里调用任意exec。无网络与只读挂载限制实际能力，AST只是额外过滤。"},{"type":"callchain","callchain":{"endpoint":"run_python → analyze_table → execute_python → validate_python → docker runner → write_table","steps":[{"layer":"Agent / 工具 / 受限执行","filePath":"backend/execution/policy.py:52-68","functionName":"validate_python","explanation":"由 execute_python 在创建容器之前调用，输入为模型生成代码，返回 None 表示这一层未发现禁止模式。AST 检查禁止导入、函数类定义、动态执行入口和私有属性，要求最终赋值 result；它并非数学证明安全的沙箱。例：result=df.copy() 可以通过，import os 或 df.__class__ 不行；代码中的数据相关异常仍可能在运行时出现。由于 pandas/NumPy 暴露面较大，真正执行必须继续依靠无网络、只读根目录、独立输入挂载和资源限制。","code":"def validate_python(code: str) -> None:\n    \"\"\"检查代码语法、名称和属性，拒绝危险操作。通过这项检查后，代码仍须放在受限容器中执行。\"\"\"\n    if len(code) > 12000:\n        raise ValueError('Python 代码超长')\n    tree = ast.parse(code)\n    # 语法检查只能拒绝部分危险写法，不能代替隔离环境。执行时仍要限制容器的网络、文件访问和资源使用。\n    banned_names = {'open', 'exec', 'eval', 'compile', 'getattr', 'setattr', '__import__', 'globals', 'locals', 'input', 'print'}\n    banned_attrs = {'system', 'popen', 'read_pickle', 'read_sql', 'read_csv', 'read_excel', 'to_pickle', 'save', 'load', 'eval'}\n    for node in ast.walk(tree):\n        if isinstance(node, (ast.Import, ast.ImportFrom, ast.With, ast.AsyncWith, ast.FunctionDef, ast.ClassDef)):\n            raise ValueError('使用预置的 df/pd/np/Decimal，不允许导入或定义函数和类')\n        if isinstance(node, ast.Name) and (node.id in banned_names or node.id.startswith('_')):\n            raise ValueError('代码包含受限名称')\n        if isinstance(node, ast.Attribute) and (node.attr.startswith('_') or node.attr in banned_attrs):\n            raise ValueError('代码包含受限属性')\n    if not any(isinstance(node, ast.Name) and node.id == 'result' and isinstance(node.ctx, ast.Store) for node in ast.walk(tree)):\n        raise ValueError('请将最终结果赋值给 result')","language":"python","lineAnnotations":[{"line":1,"annotation":"定义 validate_python；普通函数在当前线程完成本步骤；类型标注表达接口约定，不会自动做业务验证。"},{"line":2,"annotation":"函数职责约定：检查代码语法、名称和属性，拒绝危险操作。通过这项检查后，代码仍须放在受限容器中执行。；下面以实际语句核对这个约定。"},{"line":3,"annotation":"限制生成代码长度，减少解析资源与不必要的复杂程序。"},{"line":4,"annotation":"超长拒绝，不截断后猜测剩余程序。"},{"line":5,"annotation":"Python 原生 ast.parse 解析源码；SyntaxError 会由上层转换成可修复反馈。"},{"line":6,"annotation":"作者在这里强调的顺序或边界：语法检查只能拒绝部分危险写法，不能代替隔离环境。执行时仍要限制容器的网络、文件访问和资源使用。"},{"line":7,"annotation":"禁止文件打开、动态执行、反射与环境访问等高风险全局名称。"},{"line":8,"annotation":"额外禁止常见库读写、反序列化与系统操作属性；名单不是完整权限模型。"},{"line":9,"annotation":"遍历语法树全体节点，检查写在循环或条件中的危险调用。"},{"line":10,"annotation":"拒绝导入、上下文管理、自定义函数和类，要求使用预置分析对象。"},{"line":11,"annotation":"反馈允许对象约定，让模型改成 df/pd/np/Decimal 的直接计算。"},{"line":12,"annotation":"拒绝显式危险名称和以下划线开头的内部名称。"},{"line":13,"annotation":"不允许通过变量名访问被禁能力。"},{"line":14,"annotation":"检查属性访问，拦截 __class__ 等内部属性和显式禁止属性。"},{"line":15,"annotation":"告诉上层该代码用了受限属性，不直接执行试试看。"},{"line":16,"annotation":"确认至少存在对 result 名称的赋值；它不证明运行时一定走到该分支。"},{"line":17,"annotation":"缺少 result 则提前纠正模型，避免容器结束后没有可序列化结果。"}],"keyPoint":"Python AST 过滤是前置减风险层，容器隔离才限制实际执行环境。"},{"layer":"Agent / 工具 / 受限执行","filePath":"backend/execution/sandbox.py:11-43","functionName":"execute_python","explanation":"由 run_python→analyze_table 调用。输入表必须属于当前任务，模型代码通过 AST 筛查后写到本次独立目录；容器只挂该 CSV 与代码为只读，输出目录可写，不挂项目和全部结果目录。函数异步等待线程执行 docker CLI，读取 result.json 后再写新的表格产物，包含源表 ID 与代码用于追溯。例：result=df.copy(); result['share']=... 可产生新表，旧表不被修改。取消 asyncio 等待不等于杀线程/容器，因此 finally 尝试 docker rm -f；这个清理本身可能失败或超时，不能声称绝对不会遗留容器。","code":"async def execute_python(task_id: str, artifact_id: str, code: str) -> dict:\n    \"\"\"只向容器提供本次分析所需的输入和输出目录。执行超时或被取消时，尝试强制删除容器。\"\"\"\n    validate_python(code)\n    read_table(artifact_id, task_id)\n    root = get_settings().storage / 'sandbox-runs' / new_id()\n    inputs, outputs = root / 'input', root / 'output'\n    inputs.mkdir(parents=True)\n    outputs.mkdir()\n    # 只复制已经确认属于当前任务的输入 CSV，不把整个结果目录挂载到容器中。\n    (inputs / 'data.csv').write_bytes((artifact_dir(artifact_id) / 'download.csv').read_bytes())\n    (inputs / 'code.py').write_text(code, encoding='utf-8')\n    container = 'analytics-' + new_id()\n    # 容器禁用网络，根目录只读，并限制内存、CPU 和进程数。只有本次输出目录允许写入。\n    # docker 命令通过参数列表执行，不经过 shell。模型代码写入输入文件，不参与命令拼接。\n    command = ['docker', 'run', '--rm', '--name', container, '--network', 'none', '--read-only',\n               '--cap-drop=ALL', '--security-opt=no-new-privileges', '--pids-limit=64',\n               '--memory=512m', '--cpus=1', '--tmpfs', '/tmp:rw,noexec,nosuid,size=32m',\n               '--mount', f'type=bind,source={inputs.resolve()},target=/input,readonly',\n               '--mount', f'type=bind,source={outputs.resolve()},target=/output', get_settings().sandbox_image]\n    try:\n        completed = await asyncio.to_thread(subprocess.run, command, capture_output=True, timeout=45)\n        if completed.returncode:\n            raise ValueError('Python 沙箱执行失败：' + completed.stderr.decode('utf-8', errors='replace')[-1200:])\n        output = outputs / 'result.json'\n        if not output.is_file() or output.stat().st_size > 2 * 1024 * 1024:\n            raise ValueError('沙箱结果缺失或过大')\n        body = json.loads(output.read_text(encoding='utf-8'))\n        return write_table(task_id, 'Python 分析结果', body['columns'], body['rows'], python=code, source_id=artifact_id)\n    except subprocess.TimeoutExpired:\n        raise ValueError('Python 执行超过时限') from None\n    finally:\n        # 取消 asyncio 等待不一定能结束线程中的子进程，所以无论成功、失败还是取消，都尝试删除本次容器。\n        await asyncio.to_thread(subprocess.run, ['docker', 'rm', '-f', container], capture_output=True, timeout=10)","language":"python","lineAnnotations":[{"line":1,"annotation":"定义 execute_python；async 表示调用后获得协程，调用者需 await 才能取得本步骤结果。"},{"line":2,"annotation":"函数职责约定：只向容器提供本次分析所需的输入和输出目录。执行超时或被取消时，尝试强制删除容器。；下面以实际语句核对这个约定。"},{"line":3,"annotation":"在任何文件复制和容器启动前检查生成代码。"},{"line":4,"annotation":"验证表格类型与 task_id 归属，不能仅有合法 UUID 就读取。"},{"line":5,"annotation":"给每次执行生成独立 sandbox-runs 目录，避免不同任务交换输出。"},{"line":6,"annotation":"分成输入/输出目录，实现只读与可写挂载边界。"},{"line":7,"annotation":"创建输入及父目录；目录名来自服务器 UUID。"},{"line":8,"annotation":"创建本次输出目录，避免共享多个执行结果。"},{"line":9,"annotation":"作者在这里强调的顺序或边界：只复制已经确认属于当前任务的输入 CSV，不把整个结果目录挂载到容器中。"},{"line":10,"annotation":"只复制经归属检查的 CSV，而不是将整个 artifacts 目录暴露给容器。"},{"line":11,"annotation":"把代码写成文件，不拼进 shell 参数，降低命令注入风险。"},{"line":12,"annotation":"为容器生成唯一名称，finally 能准确清理这一实例。"},{"line":13,"annotation":"作者在这里强调的顺序或边界：容器禁用网络，根目录只读，并限制内存、CPU 和进程数。只有本次输出目录允许写入。"},{"line":14,"annotation":"作者在这里强调的顺序或边界：docker 命令通过参数列表执行，不经过 shell。模型代码写入输入文件，不参与命令拼接。"},{"line":15,"annotation":"docker run 使用参数列表；--rm 自动清理，禁网络且根文件系统只读。"},{"line":16,"annotation":"丢弃 Linux capabilities、禁止提权、最多64进程，限制潜在越权与 fork 资源消耗。"},{"line":17,"annotation":"限内存512MB和1CPU，临时目录32MB且 noexec/nosuid；不是整个主机资源配额。"},{"line":18,"annotation":"仅把本次 inputs 挂载到 /input 且 readonly。"},{"line":19,"annotation":"仅本次 outputs 可写，镜像由服务器配置指定，模型不能选择任意镜像。"},{"line":20,"annotation":"将启动与等待纳入统一成功/超时/清理边界。"},{"line":21,"annotation":"阻塞 subprocess.run 放进线程避免卡事件循环，最长45秒；模型代码不是 shell 字符串。"},{"line":22,"annotation":"Docker 或分析进程返回非零时不能读取结果冒充成功。"},{"line":23,"annotation":"反馈 stderr 尾部以定位代码错误，并限制长度避免大日志进入上下文。"},{"line":24,"annotation":"仅从固定 /output/result.json 对应的主机路径读取，不接受模型自选输出路径。"},{"line":25,"annotation":"校验结果存在且不超过2MiB，防止无限大结果占用内存。"},{"line":26,"annotation":"缺失或超大则明确失败，不能交付半份结果。"},{"line":27,"annotation":"解析完整 JSON；格式异常由上层转换为工具错误。"},{"line":28,"annotation":"生成新的授权表格文件，保存 python 代码和 source_id 以便追溯。"},{"line":29,"annotation":"捕获线程中 subprocess.run 抛出的时限异常。"},{"line":30,"annotation":"转成统一业务提示，避免泄露完整启动命令或环境信息。"},{"line":31,"annotation":"无论返回成功、抛错或协程取消，都进入容器清理。"},{"line":32,"annotation":"作者在这里强调的顺序或边界：取消 asyncio 等待不一定能结束线程中的子进程，所以无论成功、失败还是取消，都尝试删除本次容器。"},{"line":33,"annotation":"额外强制删除指定名称容器，最多等10秒；线程取消不会自动停止其子进程。"}],"keyPoint":"隔离输入范围、网络、权限和资源，并在成功/失败/取消三条路径都清理容器。"}]}},{"type":"text","text":"**精度与空值边界**：SQL Decimal在主机存JSON时转字符串保精度，但Python输入经过CSV与pd.read_csv自动类型推断，可能成为float；不能说全链路Decimal精确。runner注释说非有限值会报错，实际Pandas to_json可能先将NaN/Infinity转换为null，使外层allow_nan=False看不到原始非有限值。应视为注释与实现边界差异，改进可在to_json前逐列显式检查；本教程不修改业务代码。\n\n**取消与清理**：await asyncio.to_thread只是避免阻塞事件循环，不是创建可强杀的Python线程。取消父协程不等于结束docker进程，因此finally docker rm -f。清理如果超时/异常，仍可能遗留容器或掩盖前一异常，部署应有超时清理监控；这属于可改进风险，不应从finally存在就宣称清理100%成功。\n\n**替代方案**：仅允许预定义Pandas操作更易审计但表达力下降；独立执行服务/微虚拟机隔离更强但运维成本上升；当前容器适合原型与受控任务，但生产暴露还需威胁建模、依赖更新与逃逸风险管理。"}]},{"title":"面试：把“多层安全”拆成可验证的具体责任","anchor":"execution-interview","groupTitle":"受限执行与固定口径：让模型能分析，也不能越界","blocks":[{"type":"text","text":"**30秒概括**：常用销售和复购用固定业务粒度工具，自定义SQL仍经过AST白名单、有效状态改写、独立只读角色、只读事务和数据集RLS。Python只读当前任务CSV，经AST后放受限Docker执行，结果统一保存并追溯来源。\n\n**2分钟讲解**：先分准确性与安全。安全上，ToolRuntime不让模型决定dataset，SQL AST限制语句/对象/函数，RLS约束真实行，事务级set_config避免串任务，只读角色与事务限制写入。有效状态是另一个业务口径，执行器对真实表强制改写，不能只靠prompt。准确性上，订单先LEFT JOIN明细聚合，再汇总，保留无明细订单并逐项累加运费；复购按unique_id而非customer_id。Python执行再增加环境隔离与资源限制。它们可降低特定错误与越权风险，但任意SQL含义仍需要独立评测，AST和RLS无法证明“金额乘2”业务正确。\n\n**追问1：只读账号还需要AST吗？** 答：需要，AST限制对象/函数/多语句与资源异常输入；只读不等于不能读系统信息或运行昂贵查询。两层职责不同。\n\n**追问2：RLS是不是自动按登录用户生效？** 答：这里按服务器提供的dataset_id设置事务上下文，策略读取该配置；前提是API和任务已检查资源归属，读角色不能绕过RLS。不能让模型设置这个值。\n\n**追问3：为什么不把所有指标都让模型SQL算？** 答：高频稳定定义最容易做独立验证，固定工具减少运费/客单/客户身份口径漂移，自定义SQL保留灵活分析。专用工具仍走同一权限执行器。\n\n**自测与答案**：①两商品运费10、20应SUM还是MAX？SUM=30，明细各自有运费。②无明细订单客单分母含不含？当前实现含，金额零，这是明确口径而非唯一行业定义。③200行图表来源证明用户全部类别吗？不能，SQL可能先LIMIT。④AST过滤是否完全安全？不是，库能力广且名单不完备，必须实际隔离。"}]}]},{"id":"report-integrity","title":"11 从真实结果到最终报告：为什么成功执行还不够","sections":[{"title":"交付契约：用户要的列、图和计算方式必须真实存在","anchor":"report-foundation","groupTitle":"从真实结果到最终报告：为什么成功执行还不够","blocks":[{"type":"text","text":"**本章问题**：查询成功后，能否立即标记分析完成？**前置知识**：产物是一个可追溯文件及其元数据；preview只是最多20行预览，artifact_ref是当前任务表的短引用。**位置**：工具已产生结果，模型准备finish。**应能回答**：最终交付如何选择、核验和生成，以及核验不能证明什么。\n\n假设用户要求“最终表包含month、item_amount、amount_growth，用Python再计算，并画折线图”。模型查到金额就写一段说明，即使金额完全正确，也缺列、缺Python、缺图。当前交付不只验证工具有没有抛错，而是将自然语言中可明确识别的要求转成检查门槛。requested_columns从明确列名表达提取，python_requested区分否定要求，chart_requested/chart_forbidden区分要图与全面禁图；这些是规则识别，不是通用自然语言形式证明。\n\n**需求推导**：用户要可下载的完整结果，而模型可能把preview当全表、把中间表一起交付或过早finish。最简单对照是“每执行完工具就展示所有产物并宣布成功”，会有重复表、半完成计算与不完整图。当前采用明确result_refs选择最终集合、来源文件核验与程序生成报告，中间产物保留但可标记非最终。\n\n**替代与代价**：固定报表schema可以更强地定义契约，但限制自由提问；LLM做需求评分覆盖更宽但引入另一模型不确定性与成本。当前规则识别可测且快，却可能漏掉复杂中文表述。收益是已知需求类型有强门槛，边界是未识别需求仍需人工/评测。"}]},{"title":"完整文件与预览：一次写入后，多处读取同一事实","anchor":"report-file-boundary","groupTitle":"从真实结果到最终报告：为什么成功执行还不够","blocks":[{"type":"text","text":"**数据流**：SQL/Python生成完整rows→write_table保存content.json+meta.json+download.csv→业务层登记元数据→模型只收到preview和引用→draw_chart/verify_report_inputs/build_report都read_table读完整文件。JSON保留Decimal字符串，CSV可供下载，元数据记录来源SQL/Python、总行数及有限预览。\n\n**为什么分开**：把千行完整表传模型既贵又可能超过窗口，而让模型重新写表会抄错或丢尾部。文件作为统一事实源，模型只决定下一动作与受核验说明。前端下载接口还要按用户和已登记任务检查授权；此处read_table的task_id是内部第二道归属限制，不是整个用户认证。\n\n**一致性边界**：write_artifact先写content.tmp再replace，防读取半份内容；meta和CSV是随后分开写，工具登记又在数据库事务里，不能把它叫跨文件/数据库原子提交。若磁盘满在CSV写出时失败，可能留下JSON目录却没任务登记；恢复或清理机制需有孤儿文件策略。这个实际风险应与“数据库行锁原子更新任务状态”区分。"},{"type":"callchain","callchain":{"endpoint":"execute_query / execute_python → write_table → read_table → 图表 / 核验 / 报告","steps":[{"layer":"Agent / 工具 / 受限执行","filePath":"backend/core/storage.py:50-65","functionName":"write_table","explanation":"execute_query 与 execute_python 都通过这里产生统一表格文件。输入是全部列与全部行，输出元数据带 preview 前20行；真实JSON与下载CSV保留所有结果，报告/图表/核验都会读真实文件。Decimal 由 json_value 转精确字符串，CSV 的潜在公式文本由 csv_safe 转义。例：66行结果返回row_count=66而preview只有20，不意味着只存了20；-990.00这种合法负数不应被公式防护破坏。注意JSON、meta、CSV与数据库登记不是跨资源原子事务，磁盘失败可能遗留未登记或缺CSV的目录。","code":"def write_table(task_id: str, label: str, columns: list[str], rows: list[dict], **metadata) -> dict:\n    \"\"\"把完整结果保存为 JSON，同时生成可下载的 UTF-8 CSV，并返回结果信息和有限行预览。\"\"\"\n    rows = json_value(rows)\n    body = {'columns': columns, 'rows': rows}\n    # preview 仅用于页面和模型预览，完整结果另存为 JSON 和 CSV。报告构建和校验会读取完整文件。\n    info = write_artifact(task_id, 'table', label,\n                          json.dumps(body, ensure_ascii=False).encode(), 'json',\n                          columns=columns, row_count=len(rows), preview=rows[:20], **metadata)\n    stream = io.StringIO(newline='')\n    writer = csv.DictWriter(stream, fieldnames=columns)\n    writer.writeheader()\n    for row in rows:\n        safe = {key: csv_safe(value) for key, value in row.items()}\n        writer.writerow(safe)\n    (artifact_dir(info['id']) / 'download.csv').write_bytes(stream.getvalue().encode('utf-8-sig'))\n    return info","language":"python","lineAnnotations":[{"line":1,"annotation":"定义 write_table；普通函数在当前线程完成本步骤；类型标注表达接口约定，不会自动做业务验证。"},{"line":2,"annotation":"函数职责约定：把完整结果保存为 JSON，同时生成可下载的 UTF-8 CSV，并返回结果信息和有限行预览。；下面以实际语句核对这个约定。"},{"line":3,"annotation":"递归将Decimal/日期转JSON可写值；金额使用字符串避免二进制浮点改值。"},{"line":4,"annotation":"明确完整表结构，rows不是预览切片。"},{"line":5,"annotation":"作者在这里强调的顺序或边界：preview 仅用于页面和模型预览，完整结果另存为 JSON 和 CSV。报告构建和校验会读取完整文件。"},{"line":6,"annotation":"调用通用文件写入器，创建新的UUID结果目录。"},{"line":7,"annotation":"将完整body编码为JSON内容，ensure_ascii=False保持中文。"},{"line":8,"annotation":"在元数据保留列、真实总行数与最多20行preview，另附SQL/Python来源。"},{"line":9,"annotation":"用内存文本流生成CSV，newline=''交给csv模块处理行结束。"},{"line":10,"annotation":"DictWriter按明确columns排序字段，避免字典顺序意外变化。"},{"line":11,"annotation":"CSV第一行写列名，方便Excel/Pandas再读取。"},{"line":12,"annotation":"遍历全部结果行，不以preview长度为上限。"},{"line":13,"annotation":"每个单元格应用公式文本转义，避免Excel打开时把字符串当公式。"},{"line":14,"annotation":"写出这一完整CSV行，Decimal字符串依然保留小数文本。"},{"line":15,"annotation":"用UTF8 BOM写下载CSV，兼容Windows Excel中文；与JSON文件是分步写入。"},{"line":16,"annotation":"返回表元数据，调用者还需在任务记录中登记才能成为可交付产物。"}],"keyPoint":"预览、完整结果、下载文件职责分开，不能用preview代替最终数据。"},{"layer":"Agent / 工具 / 受限执行","filePath":"backend/core/storage.py:90-95","functionName":"read_table","explanation":"由图表、Python、报告及核验共同调用。read_artifact 先规范UUID、防路径逃逸并核对meta里的task_id，本函数再确认类型后解析JSON完整内容。例：模型拿别的任务UUID作为run_python输入时，即使文件真实存在也会因为任务归属不符被拒绝。返回字典被调用者读取，不涉及修改原表；文件缺失或JSON损坏不是“空表”，应沿异常排查磁盘与登记流程。","code":"def read_table(artifact_id: str, task_id: str) -> dict:\n    \"\"\"读取当前任务的表格文件。文件属于其他任务或不是表格时，拒绝读取。\"\"\"\n    info, path = read_artifact(artifact_id, task_id)\n    if info['kind'] != 'table':\n        raise ValueError('需要表格产物 ID')\n    return json.loads(path.read_text(encoding='utf-8'))","language":"python","lineAnnotations":[{"line":1,"annotation":"定义 read_table；普通函数在当前线程完成本步骤；类型标注表达接口约定，不会自动做业务验证。"},{"line":2,"annotation":"函数职责约定：读取当前任务的表格文件。文件属于其他任务或不是表格时，拒绝读取。；下面以实际语句核对这个约定。"},{"line":3,"annotation":"read_artifact校验UUID与任务归属并返回受控路径，不能直接接受模型文件路径。"},{"line":4,"annotation":"即使归属正确，也必须是table而非PNG或Markdown。"},{"line":5,"annotation":"类型错误明确反馈，不能把图片字节当JSON解析。"},{"line":6,"annotation":"读取完整UTF8 JSON并返回columns/rows，调用者拿到的不是preview。"}],"keyPoint":"合法UUID只保证路径形状，task_id检查才限制任务归属。"}]}},{"type":"text","text":"**小例子**：row_count=66、preview长度20、content.json rows长度66。若最终报告只遍历preview，就会漏46行；当前build_report遍历body.rows，tests/unit/test_accuracy_guards.py实际断言末尾customer-65仍在报告。\n\n**CSV防护**：=HYPERLINK(...)文本加前缀避免Excel执行，合法-990.00仍保留数值文本。这个防护是导出体验与风险控制，不是数据库SQL注入校验，不能把两种问题混在一起。"}]},{"title":"图表完整性：来源66行就必须真正画66行","anchor":"report-chart-completeness","groupTitle":"从真实结果到最终报告：为什么成功执行还不够","blocks":[{"type":"text","text":"**问题与推导**：为了图好看自动取前30行，若用户要求全部客户，就把视觉简化变成了业务遗漏。当前绘图读完整来源表，200行以内全画；超过200行明确要求聚合或分组；重复维度要求先聚合；超过16类别的柱图改横向并增加高度，不自动TopN。\n\n**共享状态为何加锁**：Matplotlib.pyplot有进程级状态，多个to_thread并发绘图可能互相影响，所以create_chart用threading.Lock包住draw_chart；它只串行同一进程绘图，不阻止其他独立SQL并发。多个Worker各有锁，不是全机全局图锁。\n\n**来源追溯**：PNG元数据记录source_id、source_row_count、plotted_row_count、truncated=False；最后核验再读真实source表长度，三项都必须一致。测试不只信这些自报数字，还patch真实Axes.barh记录传入66条值，防止函数谎报画完。收益是避免已知漏尾类别错误，代价是高图与渲染文件更大，且依赖字体和本机图形库配置。"},{"type":"callchain","callchain":{"endpoint":"create_chart → 进程内锁 → draw_chart → PNG元数据 → verify_report_inputs","steps":[{"layer":"Agent / 工具 / 受限执行","filePath":"backend/tools/chart.py:22-72","functionName":"draw_chart","explanation":"create_chart 用进程内 threading.Lock 包住本函数，业务节点用 asyncio.to_thread 调用，避免 Matplotlib 全局状态在同进程多线程中互相干扰。输入 x/y 是真实来源表列，输出 PNG 文件元数据包含 source_id、来源与绘制行数；完整表从文件读取，而不是只画 preview。例：66个客户时横向柱图确实绘制66条；201行或重复维度报错，让模型明确聚合而非偷偷截成30行。这里 float 只用于可视化，金额权威值仍是结果文件；完整覆盖证明的是来源表，不证明模型 SQL 没先遗漏业务类别。","code":"def draw_chart(task_id: str, artifact_id: str, x: str, y: str, title: str, kind: str = 'bar', currency: str | None = None) -> dict:\n    \"\"\"绘制当前任务表格的全部行，并记录来源、行数和方向。数据过多或字段不适合绘图时，明确报错。\"\"\"\n    if kind not in ('bar', 'line'):\n        raise ValueError('仅支持 bar 或 line')\n    body = read_table(artifact_id, task_id)\n    if x not in body['columns'] or y not in body['columns'] or not body['rows']:\n        raise ValueError('图表列不存在或结果为空')\n    rows = body['rows']\n    # 单图数据超过上限时要求用户聚合或分组，不偷偷截取部分行。需要 Top N 时应先查询对应范围。\n    if len(rows) > 200:\n        raise ValueError(f'完整图表包含 {len(rows)} 行，超出单图可读上限 200；请明确聚合或分组后分别绘图，不会自动截取。')\n    labels = [str(row[x]) for row in rows]\n    if len(set(labels)) != len(labels):\n        raise ValueError('图表横轴维度存在重复值，请先按该维度聚合或分别查询各系列')\n    numbers = [float(row[y]) for row in rows]\n    if not all(__import__('math').isfinite(value) for value in numbers):\n        raise ValueError('图表存在非有限数值')\n    chinese_font = Path('C:/Windows/Fonts/msyh.ttc')\n    font = font_manager.FontProperties(fname=str(chinese_font)) if chinese_font.exists() else None\n    horizontal = kind == 'bar' and len(rows) > 16\n    # 类别多时使用横向条形图，并按类别数增加图的高度，让后面的类别和标签也能显示。\n    size = (12, max(5, len(rows) * .25 + 1)) if horizontal else (max(9, min(20, len(rows) * .3)), 4.5)\n    fig, axis = plt.subplots(figsize=size, layout='constrained')\n    try:\n        if horizontal:\n            axis.barh(range(len(rows)), numbers, color='#176f64')\n            axis.set_yticks(range(len(rows)), labels=[textwrap.fill(label, 35) for label in labels], fontproperties=font, fontsize=8)\n            axis.invert_yaxis()\n        elif kind == 'bar':\n            axis.bar(labels, numbers, color='#176f64')\n        else:\n            axis.plot(labels, numbers, color='#176f64', marker='o')\n        axis.set_title(title[:120], fontproperties=font)\n        units = f'{y} ({currency})' if currency and any(word in y.lower() for word in ('amount', 'sales', 'price', 'aov')) else y\n        if horizontal:\n            axis.set_xlabel(units, fontproperties=font)\n        else:\n            axis.set_ylabel(units, fontproperties=font)\n            axis.tick_params(axis='x', rotation=25)\n            if font:\n                for label in axis.get_xticklabels():\n                    label.set_fontproperties(font)\n        axis.spines[['top', 'right']].set_visible(False)\n        stream = io.BytesIO()\n        fig.savefig(stream, format='png', dpi=140)\n        return write_artifact(task_id, 'chart', title, stream.getvalue(), 'png', source_id=artifact_id, x=x, y=y,\n                              source_row_count=len(rows), plotted_row_count=len(rows), truncated=False,\n                              chart_kind=kind, orientation='horizontal' if horizontal else 'vertical')\n    finally:\n        # 每次绘图后都关闭 figure，避免长期运行的 Worker 不断累积图对象、占用内存。\n        plt.close(fig)","language":"python","lineAnnotations":[{"line":1,"annotation":"定义 draw_chart；普通函数在当前线程完成本步骤；类型标注表达接口约定，不会自动做业务验证。"},{"line":2,"annotation":"函数职责约定：绘制当前任务表格的全部行，并记录来源、行数和方向。数据过多或字段不适合绘图时，明确报错。；下面以实际语句核对这个约定。"},{"line":3,"annotation":"限定两种预制图类型，不运行模型生成的任意绘图程序。"},{"line":4,"annotation":"不支持的 kind 明确失败，让模型修复参数。"},{"line":5,"annotation":"从本任务授权结果文件读完整表，而非反馈预览。"},{"line":6,"annotation":"校验轴列存在且至少有一行，不生成看似成功的空图。"},{"line":7,"annotation":"返回可修复字段/空结果错误。"},{"line":8,"annotation":"使用完整 rows，后续所有类别都从这里产生。"},{"line":9,"annotation":"作者在这里强调的顺序或边界：单图数据超过上限时要求用户聚合或分组，不偷偷截取部分行。需要 Top N 时应先查询对应范围。"},{"line":10,"annotation":"单图最多200行，目标是可读性与资源控制，不是允许偷偷截断。"},{"line":11,"annotation":"超限告知真实行数并要求聚合或分组，保留业务范围由用户/查询明确决定。"},{"line":12,"annotation":"横轴标签转字符串，适配月份与类别等显示维度。"},{"line":13,"annotation":"重复标签说明尚未聚合或混了系列，不能让图形覆盖同名类别。"},{"line":14,"annotation":"要求先聚合/分系列，拒绝产生歧义图。"},{"line":15,"annotation":"只在绘图阶段转 float；JSON 中的精确金额字符串不被改写。"},{"line":16,"annotation":"检查 NaN/Infinity，避免坐标轴与图形输出失真。"},{"line":17,"annotation":"非有限值直接反馈，不画成零或缺行。"},{"line":18,"annotation":"使用 Windows 微软雅黑固定路径，当前适配带平台依赖。"},{"line":19,"annotation":"字体存在才加载，否则退默认字体；部署 Linux 可能出现中文缺字。"},{"line":20,"annotation":"多于16类别的柱图改横向，提高标签阅读体验；折线仍按原顺序。"},{"line":21,"annotation":"作者在这里强调的顺序或边界：类别多时使用横向条形图，并按类别数增加图的高度，让后面的类别和标签也能显示。"},{"line":22,"annotation":"横向高度随类别增长，纵向宽度设上下限以控制可读性。"},{"line":23,"annotation":"创建独立 figure/axis 并使用受约束布局减少标签被裁切。"},{"line":24,"annotation":"figure 创建后进入 finally 关闭边界，保存失败也不泄漏图对象。"},{"line":25,"annotation":"类别多的柱图采用横向分支。"},{"line":26,"annotation":"每条来源数据对应一个条形位置，不切片前N行。"},{"line":27,"annotation":"为所有 y 位置设置完整标签，长标签35字符换行并缩小字体。"},{"line":28,"annotation":"翻转 y 轴保留来源表从上到下顺序。"},{"line":29,"annotation":"类别少的柱图采用纵向分支。"},{"line":30,"annotation":"直接使用全部标签和值绘柱图。"},{"line":31,"annotation":"剩余合法图类型是 line。"},{"line":32,"annotation":"折线连接来源表顺序并显示点；时间排序需由查询保证。"},{"line":33,"annotation":"标题最多120字符，防止超长标题撑坏布局。"},{"line":34,"annotation":"仅金额相关列在坐标轴加币种标签，不做汇率转换。"},{"line":35,"annotation":"横向图的数值轴是 x 轴。"},{"line":36,"annotation":"将金额单位设置到横向数值轴。"},{"line":37,"annotation":"纵向图与折线的数值轴为 y 轴。"},{"line":38,"annotation":"设置纵向数值轴名称与可能的币种。"},{"line":39,"annotation":"横轴标签旋转25度减轻重叠。"},{"line":40,"annotation":"只有已加载中文字体时再统一设置标签字体。"},{"line":41,"annotation":"遍历所有横轴标签，避免只标题中文正常而类别乱码。"},{"line":42,"annotation":"对每一个标签应用相同字体属性。"},{"line":43,"annotation":"隐去上右边框，让图形更清楚，属于展示样式而非业务计算。"},{"line":44,"annotation":"PNG 先写到内存字节流，不给模型选择系统路径。"},{"line":45,"annotation":"固定PNG与140dpi输出，让下载文件格式可预测。"},{"line":46,"annotation":"写入受控产物目录并记录真实来源表与轴字段。"},{"line":47,"annotation":"来源行数和绘制行数都使用完整 rows，明确 truncated=False 供交付核验。"},{"line":48,"annotation":"保存图形类型与方向，前端及审计可知道实际展示形态。"},{"line":49,"annotation":"确保图对象生命周期结束，不依赖成功返回才清理。"},{"line":50,"annotation":"作者在这里强调的顺序或边界：每次绘图后都关闭 figure，避免长期运行的 Worker 不断累积图对象、占用内存。"},{"line":51,"annotation":"关闭本次 figure，避免 Worker 运行久后积累 Matplotlib 对象。"}],"keyPoint":"图表覆盖完整来源表；可读性不够时明确拒绝，不能静默丢后面的类别。"}]}},{"type":"text","text":"**不能夸大的范围**：若SQL本身只查Top30，图完整画30行，来源覆盖校验仍通过。要证明用户业务范围完整，需要检查查询语义与评测，不能用plotted_row_count==source_row_count替代。单系列限制也意味着重复x、多系列对比当前需拆查询或增强工具，不能说已有任意复杂可视化能力。\n\n**个性化路径观察**：execute_business显式覆盖render_chart.kind与execute_sql联合chart_kind，但sales_metrics联合绘图没有同样分支；实际是否由模型传正确kind需链路测试。教程标记为实现差异和待验证体验风险，不凭这一处代码宣布所有偏好都失效。"}]},{"title":"finish先选择，再检查要求、数字与来源","anchor":"report-selection-verification","groupTitle":"从真实结果到最终报告：为什么成功执行还不够","blocks":[{"type":"text","text":"**按顺序理解**：①校验finish参数形状；②用result_refs选最终表图，自动补图来源；③检查用户要图/禁图、列名同表、Python和复购专用产物；④打开完整文件核对行列、执行状态来源；⑤检查标题/notes数字依据与图表覆盖；⑥成功才让图进入finalize。错误通常作为finish对应ToolMessage给模型修正，已算好的结果不必丢弃。\n\n**为什么不先生成再校验**：模型若过早finish，先写报告会制造用户可误认成功的文件；当前把生成报告放在校验之后，减少无效交付。最终状态仍是Worker发布，report_ready仅说明文件生成，还不是任务成功的同义词。\n\n**数字核验的具体能力**：allowed来自真实结果全表、明确日期、真实行数和复购阈值；-21.04可写“下降21.04%”，未算出的99.9不行。它检查集合成员关系，不检查哪个数字来自哪列；如果行里一个数量100，模型错称“金额100”，可能仍通过。因此“数字有计算依据”比“回答绝对正确”更准确。"},{"type":"callchain","callchain":{"endpoint":"finish → verify → select_report_artifacts → verify_report_inputs → verified或返回修正","steps":[{"layer":"Agent / 工具 / 受限执行","filePath":"backend/reporting/verification.py:11-36","functionName":"select_report_artifacts","explanation":"由 verify 在任何数字核验前调用，输入当前任务全部 artifacts 与 finish.result_refs，输出本次最终候选结果。None 兼容旧行为选全部；显式空列表、重复、未知或非表图引用拒绝，图表还自动带上真实来源表。例：table_1 是中间汇总，table_2 是最终算完比例的表，只选择 table_2 可避免重复交付；只选 chart_A 时仍把其来源表纳入验证。这个函数不删除文件，不保证所选表就是用户真正想要的统计口径，后面还有要求检查。","code":"def select_report_artifacts(artifacts: list[dict], references: list[str] | None) -> list[dict]:\n    \"\"\"从当前任务产物选取最终结果，未知引用拒绝；图表的真实来源表自动纳入交付校验。\"\"\"\n    if references is None:\n        return artifacts\n    if not references or len(references) != len(set(references)):\n        raise ValueError('最终结果引用不能为空或重复')\n    by_reference = {}\n    for item in artifacts:\n        by_reference[item['id']] = item\n        if item.get('artifact_ref'):\n            by_reference[item['artifact_ref']] = item\n    selected = []\n    for reference in references:\n        item = by_reference.get(reference)\n        if item is None or item['kind'] not in ('table','chart'):\n            raise ValueError('最终结果引用不属于本任务的表格或图表：' + reference)\n        if item['id'] not in {row['id'] for row in selected}:\n            selected.append(item)\n    for chart in list(selected):\n        if chart['kind'] == 'chart':\n            source = by_reference.get(chart.get('source_id'))\n            if source is None or source['kind'] != 'table':\n                raise ValueError('图表缺少当前任务中的来源表')\n            if source['id'] not in {row['id'] for row in selected}:\n                selected.append(source)\n    return selected","language":"python","lineAnnotations":[{"line":1,"annotation":"定义 select_report_artifacts；普通函数在当前线程完成本步骤；类型标注表达接口约定，不会自动做业务验证。"},{"line":2,"annotation":"函数职责约定：从当前任务产物选取最终结果，未知引用拒绝；图表的真实来源表自动纳入交付校验。；下面以实际语句核对这个约定。"},{"line":3,"annotation":"None 表示旧协议未指定最终集合，需要兼容全部结果。"},{"line":4,"annotation":"返回原列表；这可能包含中间产物，是兼容行为而非最佳显式选择。"},{"line":5,"annotation":"显式空集合或重复引用都代表无效选择，不静默猜测。"},{"line":6,"annotation":"提示模型修正最终 result_refs。"},{"line":7,"annotation":"建立 UUID 与 table_N 的统一查询索引。"},{"line":8,"annotation":"遍历全部当前任务产物，范围不向别的任务扩展。"},{"line":9,"annotation":"真实 ID 始终可以被索引。"},{"line":10,"annotation":"只有实际已登记短引用才加入索引。"},{"line":11,"annotation":"将短引用指向同一产物，支持模型更可靠引用。"},{"line":12,"annotation":"初始化最终候选，保持模型选择顺序。"},{"line":13,"annotation":"按每个显式引用查找。"},{"line":14,"annotation":"不存在时得到 None，后续拒绝未知引用。"},{"line":15,"annotation":"只允许当前任务 table/chart，不接受报告、自定义路径或其他类型。"},{"line":16,"annotation":"报错包括无效引用，帮助模型选真实返回值。"},{"line":17,"annotation":"同一文件通过UUID/别名重复指向时也只加入一次。"},{"line":18,"annotation":"将合法候选加入最终列表。"},{"line":19,"annotation":"遍历副本，因为可能向 selected 追加图表来源表。"},{"line":20,"annotation":"只有图表需要进一步追溯来源表。"},{"line":21,"annotation":"从同一索引解析 source_id，不能从任意文件系统取来源。"},{"line":22,"annotation":"来源缺失或不是表格，图表不可验证。"},{"line":23,"annotation":"拒绝没有当前任务来源依据的图表。"},{"line":24,"annotation":"尚未选中的真实来源表会自动补齐。"},{"line":25,"annotation":"把来源表纳入数字、文件和覆盖校验，防止只交一张无依据图片。"},{"line":26,"annotation":"返回最终候选集合；后续 verify 才决定是否真正允许生成报告。"}],"keyPoint":"最终交付选择与执行痕迹保留分开，减少中间结果污染报告。"},{"layer":"Agent / 工具 / 受限执行","filePath":"backend/reporting/verification.py:58-110","functionName":"verify_report_inputs","explanation":"由 verify 调用；返回 None 表示本函数没有发现问题，异常由图反馈给模型修正。它逐个打开完整结果文件核对行列及状态执行来源，再从真实数值与明确日期构成 allowed 集，检查标题/说明是否引入未计算数字，最后检查图表覆盖。例：结果有 -21.04 时可写下降21.04%，但不能凭模型口算新增未保存的10.5%；自定义 SQL 若语义算错却得到100，此函数仍可能允许把100误称另一个指标。它是有限的一致性与依据检查，不是自然语言语义证明器；full rows 核验也可能增加 I/O，需按结果规模控制。","code":"def verify_report_inputs(task_id: str, artifacts: list[dict], notes: list[str], title: str = '',\n                         question: str = '', expected_status: str | None = None) -> None:\n    \"\"\"核对结果文件、报告数字、订单状态和图表行数。这些检查不能保证所有业务解释都正确。\"\"\"\n    tables = [item for item in artifacts if item['kind'] == 'table']\n    if not tables or not any(item['row_count'] and any(any(value is not None for value in row.values()) for row in item['preview']) for item in tables):\n        raise ValueError('没有有效计算结果，不能生成完成报告')\n    if sum(map(len, notes)) > 3000 or len(title) > 120:\n        raise ValueError('报告标题限 120 字，说明总长度限 3000 字，请压缩对应字段')\n    allowed = known_dates(question)\n    # 报告数字应来自实际结果文件或明确日期，用户问题中的其他数字不能自动作为统计依据。\n    for item in tables:\n        body = read_table(item['id'], task_id)\n        if len(body['rows']) != item['row_count'] or body['columns'] != item['columns']:\n            raise ValueError('结果文件与产物记录不一致')\n        scope = item.get('metric_scope', {})\n        if expected_status and item.get('sql') and (not scope.get('enforced') or scope.get('valid_status') != expected_status):\n            raise ValueError('SQL 产物缺少当前有效订单状态的执行约束，请重新查询')\n        allowed.update(known_dates(item.get('sql', '')))\n        allowed.add(Decimal(len(body['rows'])))\n        if item.get('metric_id') == 'customer_repeat':\n            allowed.add(Decimal(2))\n        for row in body['rows']:\n            for value in row.values():\n                if value is None or isinstance(value, bool):\n                    continue\n                try:\n                    number = Decimal(str(value))\n                    if number.is_finite():\n                        allowed.update((number, number.quantize(Decimal('.01'))))\n                        if number \u003c 0:\n                            allowed.update((-number, (-number).quantize(Decimal('.01'))))\n                except InvalidOperation:\n                    allowed.update(known_dates(str(value)))\n    for field, text in [('title', title), *[(f'notes[{index}]', note) for index, note in enumerate(notes)]]:\n        if expected_status:\n            state_name = re.escape(expected_status)\n            excluded = re.search(r'(?:排除|不包含|不含|剔除|未包含|exclude\\w*|without)\\s*[（(]?\\s*' + state_name, text, re.IGNORECASE)\n            excluded = excluded or re.search(state_name + r'\\s*[）)]?\\s*(?:已排除|不计入|未计入)', text, re.IGNORECASE)\n            if excluded:\n                raise ValueError(f'{field} 的状态说明与实际查询冲突：实际只包含 {expected_status}，不能称排除该状态；请按指标口径重写。')\n            if expected_status != 'delivered' and any(word in text for word in ('已交付', '已送达')):\n                raise ValueError(f'{field} 错称已交付订单；实际有效状态为 {expected_status}，请使用已确认状态描述。')\n        # 数字出现在结果表中，并不代表报告对它的解释一定正确，业务含义仍需独立评测和检查。\n        unsupported = numbers(text) - allowed\n        if unsupported:\n            values = ', '.join(str(value) for value in sorted(unsupported))\n            raise ValueError(f'{field} 含无依据数字 {values}；先用 SQL/Python 实际计算并保存这些数字，或删去该说明；不能口算后直接写入。')\n    for chart in (item for item in artifacts if item['kind'] == 'chart'):\n        # 比较来源表行数与实际绘制行数，避免来源表完整但图表遗漏后面的类别。\n        source = read_table(chart['source_id'], task_id)\n        count = len(source['rows'])\n        if chart.get('source_row_count') != count or chart.get('plotted_row_count') != count or chart.get('truncated') is not False:\n            raise ValueError('图表没有完整覆盖来源表格，请重新生成完整图表，不能声称已展示全部结果')","language":"python","lineAnnotations":[{"line":1,"annotation":"定义 verify_report_inputs；普通函数在当前线程完成本步骤；类型标注表达接口约定，不会自动做业务验证。"},{"line":2,"annotation":"question 提供明确日期依据，expected_status 来自确认口径，不由报告文字自己决定。"},{"line":3,"annotation":"函数职责约定：核对结果文件、报告数字、订单状态和图表行数。这些检查不能保证所有业务解释都正确。；下面以实际语句核对这个约定。"},{"line":4,"annotation":"只把表格产物作为数值依据，图表不能凭图片内容提供新数字。"},{"line":5,"annotation":"至少一张表有行且预览中存在非空值；全空结果不能被包装成已完成分析。"},{"line":6,"annotation":"缺少有效结果时拒绝结束，让模型重新查询或澄清。"},{"line":7,"annotation":"限说明总长度和标题长度，防止内容无限扩张。"},{"line":8,"annotation":"超长要求缩减，不能静默剪掉可能有用的解释。"},{"line":9,"annotation":"初始允许数字仅来自问题明确日期，不把用户任意猜测金额当事实。"},{"line":10,"annotation":"作者在这里强调的顺序或边界：报告数字应来自实际结果文件或明确日期，用户问题中的其他数字不能自动作为统计依据。"},{"line":11,"annotation":"遍历所有最终候选表格，而不只检查第一张。"},{"line":12,"annotation":"read_table 再次检查 task_id 归属，读取完整真实 JSON。"},{"line":13,"annotation":"比对完整文件行数与列结构，防止记录与文件不一致。"},{"line":14,"annotation":"不一致明确失败，不能只相信产物元数据。"},{"line":15,"annotation":"读取工具记录的执行口径说明。"},{"line":16,"annotation":"SQL产物必须标记执行器强制了正确状态；仅提示词声称过滤不够。"},{"line":17,"annotation":"来源缺少状态约束时要求重新查询。"},{"line":18,"annotation":"SQL中的明确日期也可作为报告日期依据。"},{"line":19,"annotation":"结果行数本身是实际可验证数字，可写入报告。"},{"line":20,"annotation":"专用复购工具允许说明“至少两单”的定义数值。"},{"line":21,"annotation":"将复购定义阈值2加入允许集合，不推广到任意未计算统计量。"},{"line":22,"annotation":"遍历完整表的全部行，不能仅从前20行找依据。"},{"line":23,"annotation":"遍历一行所有字段，将真实数值汇入依据集。"},{"line":24,"annotation":"None是缺失，bool是逻辑值，不当金额或数量数字。"},{"line":25,"annotation":"跳过这些非数值依据。"},{"line":26,"annotation":"尝试把其他值解析为 Decimal，保持数字比较精度。"},{"line":27,"annotation":"用字符串中转，兼容JSON精确金额字符串。"},{"line":28,"annotation":"只接受有限数值，NaN/Infinity 不能成为报告事实。"},{"line":29,"annotation":"同时允许原值与两位小数显示，兼容常见报告格式。"},{"line":30,"annotation":"负数变化量可用其绝对值表达“下降多少”。"},{"line":31,"annotation":"加入相反数及两位形式，支持-21.04对应下降21.04%。"},{"line":32,"annotation":"无法解析为数值的字符串进入日期提取路径。"},{"line":33,"annotation":"文本型月份仍可给日期依据，普通文本不自动变成数字事实。"},{"line":34,"annotation":"为每段标题和说明建立字段名，让报错能定位 notes[0]。"},{"line":35,"annotation":"只有外部指定有效状态时才核对状态叙述。"},{"line":36,"annotation":"re.escape 防止状态文本里的正则符号改变检查逻辑。"},{"line":37,"annotation":"识别“排除某状态”等说法，与实际仅包含该状态相冲突。"},{"line":38,"annotation":"同时识别“该状态已排除/不计入”的反向语序。"},{"line":39,"annotation":"找到这种叙述就不能因数字正确而通过。"},{"line":40,"annotation":"报错明确实际包含状态，要求改正确说明。"},{"line":41,"annotation":"当有效状态不是 delivered 时，不允许称“已交付/已送达”。"},{"line":42,"annotation":"防止选择 cancelled 却沿用已送达模板说明。"},{"line":43,"annotation":"作者在这里强调的顺序或边界：数字出现在结果表中，并不代表报告对它的解释一定正确，业务含义仍需独立评测和检查。"},{"line":44,"annotation":"提取该文本数字并减去允许集合，剩下就是缺计算依据的数字。"},{"line":45,"annotation":"有任何无依据数字就进入修复路径。"},{"line":46,"annotation":"排序并展示缺失数字，帮助模型补算或删去未经验证说明。"},{"line":47,"annotation":"强制先用工具计算保存派生数字，而不是让模型心算后直接写。"},{"line":48,"annotation":"对每张最终图表独立验证来源覆盖。"},{"line":49,"annotation":"作者在这里强调的顺序或边界：比较来源表行数与实际绘制行数，避免来源表完整但图表遗漏后面的类别。"},{"line":50,"annotation":"读取来源表完整 rows，不以chart自己声明的来源行数为唯一依据。"},{"line":51,"annotation":"实际文件长度是本次图表覆盖的基准。"},{"line":52,"annotation":"三项都要一致：来源行数、实际绘制行数、明确不截断。"},{"line":53,"annotation":"任一不一致就拒绝交付图表，并要求完整重新生成。"}],"keyPoint":"有来源是必要条件，数字恰好在表里不是语义正确的充分条件。"},{"layer":"Agent / 工具 / 受限执行","filePath":"backend/agent/nodes/verification.py:10-51","functionName":"verify","explanation":"图在模型单独 finish 后调用本节点。输入包括 finish 参数、原问题和补充要求、所有已生成产物；成功返回 verified=True 与 report_artifacts，条件边进入 finalize，失败通常把错误作为 finish 对应工具反馈返回 context。它不只看数字，还强制图表正负要求、所有指定列位于同一结果表、用户明确 Python、复购专用指标存在。例：用户要求month、growth，模型只有month不能删 notes 就算完成；连续三次仅说明数字错误可降级为实际表图报告，但仍再次验证文件与图表完整性。故障需区分执行失败、缺要求、说明无依据以及不可降级错误。","code":"async def verify(state: dict) -> dict:\n    \"\"\"检查 finish 参数、用户要求和实际结果。检查通过才允许生成报告，失败则提供具体错误。\"\"\"\n    try:\n        args = state['action']['arguments']\n        validate_arguments('finish', args)\n        artifacts = select_report_artifacts(state['artifacts'], args.get('result_refs'))\n        question = state['question'] + '\\n' + state.get('clarification_answer', '')\n        columns = requested_columns(question)\n        if chart_forbidden(question) and any(item['kind'] == 'chart' for item in artifacts):\n            raise ValueError('用户明确不要图表，最终结果不能选择图表；请只选择符合要求的表格')\n        if chart_requested(question) and not any(item['kind'] == 'chart' for item in artifacts):\n            raise ValueError('用户要求图表，但尚未生成图表；请对真实结果表绘图后再完成')\n        # finish 只是模型提出结束分析。程序仍要确认所需列、Python 计算和专用指标已经实际生成。\n        if columns and not any(columns \u003c= set(item.get('columns', [])) for item in artifacts if item['kind'] == 'table'):\n            raise ValueError('尚未完成用户要求的全部结果列：' + ', '.join(sorted(columns)) + '；请实际计算并放入同一结果表，不能仅删去说明后结束。')\n        if python_requested(question) and not any(item.get('python') for item in artifacts):\n            raise ValueError('用户明确要求 Python 计算，不能用 SQL 替代后直接结束；请对已返回的 artifact_ref 调用 run_python 并保存结果。')\n        if customer_repeat_requested(question) and not any(item.get('metric_id') == 'customer_repeat' for item in artifacts):\n            raise ValueError('复购报告缺少权威客户粒度计算；请调用 customer_repeat_metrics，它会先按 customer_unique_id 合并全部订单')\n        verify_report_inputs(state['task_id'], artifacts, args['notes'], args['title'],\n                             question, state['metrics']['valid_status'])\n        # verified 决定后续流程是否进入报告生成节点。只有程序检查通过，才允许生成报告。\n        await emit_event(state['task_id'], 'verified', {'message': '结果文件与报告依据检查通过'})\n        return {'action': {**state['action'], 'verified': True}, 'report_artifacts': artifacts}\n    except ValueError as error:\n        # 把能够修正的检查错误作为工具反馈交给模型，保留已有结果，让模型补算或修改说明。\n        await emit_event(state['task_id'], 'verification_error', {'message': str(error)})\n        failures = state.get('verification_failures', 0) + 1\n        if failures >= 3:\n            if re.match(r'^(?:title|notes\\[\\d+\\]) 含无依据数字 ', str(error)):\n                # 只有说明中的数字缺少依据时才可改为仅交付计算结果。缺列、缺工具、范围错误或图表不完整仍会失败。\n                safe_args = {'title': '数据分析结果报告', 'notes': [\n                    '模型说明连续未通过数值依据核验。本报告仅交付工具实际计算结果与图表。']}\n                verify_report_inputs(state['task_id'], artifacts, safe_args['notes'], safe_args['title'],\n                                     question, state['metrics']['valid_status'])\n                await emit_event(state['task_id'], 'report_fallback', {'message': safe_args['notes'][0], 'reason': str(error)})\n                return {'action': {**state['action'], 'arguments': safe_args, 'verified': True},\n                        'verification_failures': failures, 'report_warning': safe_args['notes'][0], 'report_artifacts': artifacts}\n            raise ValueError('报告依据校验连续修正三次仍失败：' + str(error)) from None\n        return {'action': {**state['action'], 'verified': False},\n                'verification_failures': failures,\n                'messages': feedback_messages(state, {'error': str(error)})}","language":"python","lineAnnotations":[{"line":1,"annotation":"定义 verify；async 表示调用后获得协程，调用者需 await 才能取得本步骤结果。"},{"line":2,"annotation":"函数职责约定：检查 finish 参数、用户要求和实际结果。检查通过才允许生成报告，失败则提供具体错误。；下面以实际语句核对这个约定。"},{"line":3,"annotation":"将可修复的 ValueError 统一转为模型反馈，但未知系统异常不在这里伪装成可修复问题。"},{"line":4,"annotation":"从当前 finish 动作读取标题、说明和最终引用。"},{"line":5,"annotation":"复用标准工具 Pydantic schema，控制动作不手写另一份类型校验。"},{"line":6,"annotation":"先选择候选交付结果，图表来源表也会被自动纳入。"},{"line":7,"annotation":"原问题与用户澄清合并；最新补充要求必须影响交付检查。"},{"line":8,"annotation":"提取用户明确列名，不自己猜测用户未指定的字段。"},{"line":9,"annotation":"如果明确不要所有图表，最终候选不得包含已有图表。"},{"line":10,"annotation":"已生成的图也需要从 result_refs 移除；不能用旧偏好覆盖新禁图要求。"},{"line":11,"annotation":"用户明确要图时，至少必须存在真实图表产物。"},{"line":12,"annotation":"缺图反馈具体补救步骤：用真实表生成后再 finish。"},{"line":13,"annotation":"作者在这里强调的顺序或边界：finish 只是模型提出结束分析。程序仍要确认所需列、Python 计算和专用指标已经实际生成。"},{"line":14,"annotation":"指定列必须在同一张最终表中完整出现，不能散在几张中间表里冒充完整结果。"},{"line":15,"annotation":"说明缺哪些列，不能靠删文字绕过用户要求。"},{"line":16,"annotation":"用户明确要求 Python 时，最终产物必须包含真实 Python 来源。"},{"line":17,"annotation":"即使 SQL 数字正确也不能冒充完成了用户指定的 Python 执行。"},{"line":18,"annotation":"复购问题必须出现专用客户粒度工具产物。"},{"line":19,"annotation":"提示先按 unique_id 合并订单，避免模型自写customer_id口径结果混入。"},{"line":20,"annotation":"进入完整文件、数值和图表来源核验。"},{"line":21,"annotation":"传入真实用户要求和有效状态，核验不能只靠模型自己写的标题。"},{"line":22,"annotation":"作者在这里强调的顺序或边界：verified 决定后续流程是否进入报告生成节点。只有程序检查通过，才允许生成报告。"},{"line":23,"annotation":"通过检查才写 verified 事件，页面可理解为何进入报告阶段。"},{"line":24,"annotation":"返回 verified 标志与候选集合，外层条件边才允许 finalize。"},{"line":25,"annotation":"仅将可预期校验失败当作可修复错误。"},{"line":26,"annotation":"作者在这里强调的顺序或边界：把能够修正的检查错误作为工具反馈交给模型，保留已有结果，让模型补算或修改说明。"},{"line":27,"annotation":"持久记录错误，便于前端展示及事后排查。"},{"line":28,"annotation":"失败次数跨图循环累计，防止模型反复相同finish无限修复。"},{"line":29,"annotation":"达到第三次失败启动终止/限定降级决策。"},{"line":30,"annotation":"只有报错明确属于title或notes无依据数字才允许降级。"},{"line":31,"annotation":"作者在这里强调的顺序或边界：只有说明中的数字缺少依据时才可改为仅交付计算结果。缺列、缺工具、范围错误或图表不完整仍会失败。"},{"line":32,"annotation":"构造不含新数字的中性报告标题与说明。"},{"line":33,"annotation":"告知说明核验未过，最终只交付工具实际结果，保留透明度。"},{"line":34,"annotation":"降级后再次完整核验，不因删了错误说明就忽略坏图或坏文件。"},{"line":35,"annotation":"保持同一原问题和有效状态要求，降级不更改用户业务范围。"},{"line":36,"annotation":"记录 fallback 事件和原原因，让用户知道解释被降级。"},{"line":37,"annotation":"返回安全参数、verified=True，进入报告文件构建。"},{"line":38,"annotation":"保存失败次数和明显警告，报告候选保持真实结果。"},{"line":39,"annotation":"三次仍缺列/缺图/错口径等不可降级错误则让任务失败。"},{"line":40,"annotation":"未到上限时设置 verified=False，路由回context继续修正。"},{"line":41,"annotation":"写回失败计数，下一次finish不会重新从0开始。"},{"line":42,"annotation":"把错误按原call_id配对成工具消息，模型才知道刚才finish为何没完成。"}],"keyPoint":"完成请求必须满足用户交付契约；有限降级只允许去掉不可靠说明，不能删掉用户要求。"}]}},{"type":"text","text":"**有限降级案例**：第三次仍只有notes含999无依据，已有表图完整，可以改中性说明“仅交付工具结果”，再次verify_report_inputs，再生成报告。若缺growth列、没用用户要求的Python或图少行，不能靠删notes降级。这是把已完成的可信结果交出去、同时公开解释质量不足，不是把未完成任务伪装成功。\n\n**源码边界**：verify_report_inputs初步有效性检查读元数据preview，随后确实打开完整文件；缺失/损坏文件会异常。数字来源不是列级映射、复杂自然语言要求是正则识别，状态叙述也只覆盖若干表达方式。改进可提供声明式需求对象、列级指标语义与独立答案oracle，但要评估成本。"}]},{"title":"贯穿案例的终点：程序把权威表写成报告","anchor":"report-build-case","groupTitle":"从真实结果到最终报告：为什么成功执行还不够","blocks":[{"type":"text","text":"**完整月度案例**：用户问题含10月至11月、月度销售与折线图，模型调用sales_metrics(group_by='month',chart_x='month',chart_y='item_amount',chart_title='月度销售',chart_kind='line')。execute_business先统计登记table_N，再顺序画真实结果PNG，返回表引用和chart.id。模型收到后单独finish选择这两个引用，verify通过后finalize用选中集合调用build_report。程序从全表写出月度指标、空值显示“无定义/缺失”，加入确认口径和来源代码，再登记report文件和选择角色。Worker随后保存对话与成功完成事件。\n\n**每步数据去向**：业务明细在PostgreSQL；模型消息和动作在checkpoint；表/图/报告内容在受控文件目录；任务artifacts/events在任务记录；模型只看有限反馈。不要说Milvus保存销售数字，也不要说Redis保存唯一任务事实，二者在这条计算链不承担权威统计存储。\n\n**用户看到失败时**：SQL错误→具体工具错误与后续模型修复；缺图→verification_error再补图；连续不可修复→任务failed；取消→cancelled且最终发布有保护；浏览器断线→SSE补读已保存步骤，任务仍后台运行。源码图与报告部分只承担其中若干职责，取消最终状态、SSE游标和恢复锁在Worker/仓储章节继续学习。"},{"type":"callchain","callchain":{"endpoint":"verify成功 → finalize → build_report → register_artifact / mark_report_selection → Worker最终提交","steps":[{"layer":"Agent / 工具 / 受限执行","filePath":"backend/agent/nodes/finalization.py:7-17","functionName":"finalize","explanation":"由verify通过后的图条件边调用，输入report_artifacts是最终已选结果，不必包含所有中间产物。它在线程构建报告，再登记报告并标记哪些表图属于最终交付，发report_ready后把report元信息返回给Worker。这个函数不发布succeeded，Worker后面还有对话保存和原子最终状态操作；取消竞争仍由登记与状态仓储保护。例：table_1是中间表、table_2为最终表，selected只含table_2时报告不重抄table_1，但中间文件保留追溯。","code":"async def finalize(state: dict) -> dict:\n    \"\"\"确认任务没有取消后生成报告，登记报告文件并返回其信息。\"\"\"\n    await check_cancelled(state['task_id'])\n    # 报告构建是同步操作，因此放到线程中执行，让异步事件循环仍能处理其他等待。\n    selected = state.get('report_artifacts', state['artifacts'])\n    report = await asyncio.to_thread(build_report, {**state, 'artifacts': selected})\n    await register_artifact(state['task_id'], report)\n    await mark_report_selection(state['task_id'], {item['id'] for item in selected})\n    await emit_event(state['task_id'], 'report_ready', {'artifact_id': report['id']})\n    # report_ready 表示报告文件已经生成。Worker 还要保存会话原文，再一起提交成功状态和完成事件。\n    return {'report': report}","language":"python","lineAnnotations":[{"line":1,"annotation":"定义 finalize；async 表示调用后获得协程，调用者需 await 才能取得本步骤结果。"},{"line":2,"annotation":"函数职责约定：确认任务没有取消后生成报告，登记报告文件并返回其信息。；下面以实际语句核对这个约定。"},{"line":3,"annotation":"构建报告前检查取消，避免已取消任务开始新的生成阶段。"},{"line":4,"annotation":"作者在这里强调的顺序或边界：报告构建是同步操作，因此放到线程中执行，让异步事件循环仍能处理其他等待。"},{"line":5,"annotation":"优先读取核验选中的report_artifacts；旧状态无该字段则兼容artifacts。"},{"line":6,"annotation":"同步Markdown与文件写入放线程，传入选中集合的状态副本，不改父状态全部产物。"},{"line":7,"annotation":"报告文件产生后登记到当前任务，登记层继续检查取消。"},{"line":8,"annotation":"将选中表图ID标为最终交付，其余中间产物仍保留。"},{"line":9,"annotation":"report_ready仅表示可用文件引用已登记，SSE可展示报告生成步骤。"},{"line":10,"annotation":"作者在这里强调的顺序或边界：report_ready 表示报告文件已经生成。Worker 还要保存会话原文，再一起提交成功状态和完成事件。"},{"line":11,"annotation":"将报告元数据返回图；Worker接着保存会话与最终成功状态/事件。"}],"keyPoint":"文件就绪与任务最终成功分开；报告只消费已核验的最终集合。"},{"layer":"Agent / 工具 / 受限执行","filePath":"backend/reporting/builder.py:10-38","functionName":"build_report","explanation":"由 finalize 在工作线程调用，输入 state 中 artifacts 已替换为通过验证的最终集合。它把问题、口径、已核验 notes 与完整表格文件构造成 Markdown，不让模型重新抄写数字。输出是报告文件元数据，由 finalize 登记、标记交付选择并发 report_ready；真正 succeeded 仍由 Worker 随后提交。例：66行表只有20行preview，报告仍逐行写全66行，因此不会漏掉第65号客户。风格 concise 只减少说明条数，不裁剪计算表；报告大小和 Markdown 渲染成本仍需面对结果规模约束。","code":"def build_report(state: dict) -> dict:\n    \"\"\"根据问题、统计口径和实际结果生成报告，并附上表格、图表来源及计算代码。\"\"\"\n    args = state['action']['arguments']\n    style = state.get('personalization', {}).get('report_style')\n    notes = args['notes'][:3] if style == 'concise' else args['notes']\n    lines = ['# ' + args['title'][:120], '', '## 任务', state['question'], '',\n             '## 运行模式', '规则演示（未调用聊天模型）' if state['mode'] == 'demo' else '模型自主工具调用', '',\n             '## 指标口径', f\"币种：{state['metrics']['currency']}；有效订单状态：{state['metrics']['valid_status']}。\",\n             '按购买时间筛选；商品金额不含运费；订单量去重；数据为所选数据集的固定快照。', '',\n             '## 分析说明', *['- ' + note for note in notes], '']\n    if style:\n        lines += ['说明风格：' + ('简洁；完整计算依据仍保留。' if style == 'concise' else '详细；包含计算方法与依据。'), '']\n    if state.get('clarification_answer'):\n        lines += ['## 用户补充要求', state['clarification_answer'], '']\n    for index, artifact in enumerate(state['artifacts'], 1):\n        if artifact['kind'] != 'table':\n            continue\n        body = read_table(artifact['id'], state['task_id'])\n        # 从已保存文件读取全部结果行，不用模型重写表格，也不把有限的 preview 误当完整结果。\n        lines += [f\"## 结果 {index}：{artifact['label']}\", f\"来源 ID：{artifact['id']}；总行数：{artifact['row_count']}。\", '']\n        lines.append('| ' + ' | '.join(map(escape_cell, body['columns'])) + ' |')\n        lines.append('| ' + ' | '.join('---' for _ in body['columns']) + ' |')\n        lines += ['| ' + ' | '.join(escape_cell(row.get(column)) for column in body['columns']) + ' |' for row in body['rows']]\n        if artifact.get('metric_scope', {}).get('enforced'):\n            lines += ['', f\"执行约束：仅包含状态 {artifact['metric_scope']['valid_status']} 的订单及其商品明细。\"]\n        lines += ['', '```sql' if artifact.get('sql') else '```python', artifact.get('sql') or artifact.get('python', ''), '```', '']\n    lines += ['## 图表来源']\n    lines += [f\"- {item['label']}：图表 {item['id']}，来源表格 {item['source_id']}；来源 {item['source_row_count']} 行，完整绘制 {item['plotted_row_count']} 行。\" for item in state['artifacts'] if item['kind'] == 'chart']\n    return write_artifact(state['task_id'], 'report', args['title'], '\\n'.join(lines).encode('utf-8'), 'md')","language":"python","lineAnnotations":[{"line":1,"annotation":"定义 build_report；普通函数在当前线程完成本步骤；类型标注表达接口约定，不会自动做业务验证。"},{"line":2,"annotation":"函数职责约定：根据问题、统计口径和实际结果生成报告，并附上表格、图表来源及计算代码。；下面以实际语句核对这个约定。"},{"line":3,"annotation":"使用已通过核验或降级后的finish参数。"},{"line":4,"annotation":"读取服务端解析后的报告风格偏好。"},{"line":5,"annotation":"concise最多显示前三条说明；完整表数据不随简洁风格裁剪。"},{"line":6,"annotation":"开始报告，写标题和本次原始问题，使结果可追溯到需求。"},{"line":7,"annotation":"明示演示或真实模型模式，规则演示不能包装成模型自主能力。"},{"line":8,"annotation":"写确认币种与有效状态，币种是标签不是汇率换算。"},{"line":9,"annotation":"固定说明购买时间、商品金额不含运费及数据快照范围。"},{"line":10,"annotation":"把核验过的每条notes转为Markdown列表，不再请求模型重写。"},{"line":11,"annotation":"存在风格时记录这种展示选择。"},{"line":12,"annotation":"简洁也明确保留计算依据；详细模式并不会额外捏造分析结论。"},{"line":13,"annotation":"用户存在澄清答案时，报告还应保留补充需求。"},{"line":14,"annotation":"写入补充内容，方便理解为何执行方案改变。"},{"line":15,"annotation":"遍历已选最终产物，不是遍历任务全部文件夹。"},{"line":16,"annotation":"当前段只写表格，图表在最后的来源段记录。"},{"line":17,"annotation":"跳过chart等非table，防止按表结构读取PNG。"},{"line":18,"annotation":"read_table读取真实完整文件并再次限制task_id。"},{"line":19,"annotation":"作者在这里强调的顺序或边界：从已保存文件读取全部结果行，不用模型重写表格，也不把有限的 preview 误当完整结果。"},{"line":20,"annotation":"写来源UUID与完整行数，便于从报告追踪到结果文件。"},{"line":21,"annotation":"所有列名经escape_cell转义，竖线不能破坏Markdown结构。"},{"line":22,"annotation":"按列数生成Markdown分隔行。"},{"line":23,"annotation":"对完整rows逐行按columns顺序输出，缺失显示交给escape_cell处理。"},{"line":24,"annotation":"如果执行器确实强制状态范围，报告才能声称有该执行约束。"},{"line":25,"annotation":"写执行口径供审计，避免只凭模型声明过滤。"},{"line":26,"annotation":"附SQL或Python计算来源代码；报告不执行这些代码。"},{"line":27,"annotation":"为图片附来源章节，当前Markdown本身记录来源，不在此嵌入任意外部图片URL。"},{"line":28,"annotation":"列出每张图对应的表与完整覆盖行数，保持产物关系可追溯。"},{"line":29,"annotation":"将全部Markdown编码UTF8写入受控目录，返回元信息供上层登记。"}],"keyPoint":"让程序搬运权威结果，模型负责受限解释；有限预览不能成为最终报告数据源。"}]}},{"type":"text","text":"**一个必须会说的取舍**：完整报告由程序生成有利于表格数值一致与审计，但模板表达力有限，复杂图表叙事、原因分析和业务建议并非自动可信；没有成本、退款或营销数据就不能推断利润与因果。简洁偏好只减少notes，不损失完整表格依据。"}]},{"title":"面试：如何诚实解释准确性和项目价值","anchor":"report-interview","groupTitle":"从真实结果到最终报告：为什么成功执行还不够","blocks":[{"type":"text","text":"**30秒概括**：工具成功只是中间状态。模型finish后系统选择最终结果，检查用户列、Python、图表与复购要求，再核对完整文件、数字来源和图表覆盖；报告由程序从真实结果生成，不能让模型重抄大表。\n\n**2分钟讲解**：用户可能要求多个交付条件，模型往往金额查到就想结束，所以finish进verify。result_refs排除中间表，图表来源表自动加入。要求检查确保所需列在同一表，明确要Python不能只交SQL，复购必须有固定unique_id口径产物。文件检查核对完整行列和状态执行来源，数字检查禁止没实际计算的派生数字，图表检查来源与实际绘制行数一致。失败给模型精确反馈，三次仅说明数字不可靠时可保留真实表图并公开降级；缺要求不能降级。程序最后生成完整Markdown，最终成功由Worker发布。这个设计改善可追溯交付，但语义正确性仍需独立数据集评测。\n\n**追问1：数字校验通过就能说准确率100%吗？** 答：不能，它只做依据集合与一致性检查，数字可能被错解释。需要独立oracle验证口径与用户需求完成度，定向复测也不能代表全量泛化。\n\n**追问2：如果表66行preview20行，报告到底几行？** 答：build_report读content.json全部66行，图表也读全表；preview仅模型/页面快速展示。\n\n**追问3：为什么保留中间表但不全部展示？** 答：中间表有追溯和错误修复价值，最终结果选择能减少重复和困惑；mark_report_selection区分final/intermediate，并不删除底层文件。\n\n**自测与答案**：①用户明确不要图，已有图怎么办？不选择旧图，verify会拒绝选入。②数字999没依据但缺图，三次后能降级吗？不能，只有说明错误可降级，图仍必须完整。③图行数全覆盖能证明SQL没漏品类吗？不能，需要业务范围检查/评测。④report_ready等于succeeded吗？不是，Worker还要保存会话并发布最终状态。\n\n**商业价值与局限的表达**：项目把自然语言需求变成可追溯表、图和报告，支持后台执行和交付门槛，能够演示完整数据分析闭环。仍需根据实际部署补充规模压测、故障演练、资源清理与更广评测证据，不能因为功能齐就宣称已生产高可用。"}]}]},{"id":"task-context","title":"12 任务内上下文：先保证能发，再保留可推理的信息","sections":[{"title":"背景知识：模型窗口不是聊天记录仓库","anchor":"cm-context-foundations","groupTitle":"任务内上下文：先保证能发，再保留可推理的信息","blocks":[{"type":"text","text":"本章解决的问题：一项电商分析可能反复查询、计算、画图，工具消息越来越长，怎样在模型窗口内继续推理，又不破坏工具协议？前置知识只要求了解列表、字典和函数；异步、摘要游标及工具配对会在下面解释。它位于每轮模型决策之前，由 graph 的 context 节点触发。学完应能回答：为什么不直接删除历史，为什么摘要失败不能推进游标，为什么不能单纯保留最后 N 条消息。\n\n**背景知识。** 大模型每次调用通常只看到本次请求携带的消息，并不会因为前面聊过就天然拥有你服务器保存的所有内容。模型窗口是输入、工具说明、输出等内容共同使用的空间，不是只计算用户输入文字。数据库里的历史可以很长，真正发给模型的输入必须另行挑选；两者分开，才能同时支持回看、恢复和有限窗口。\n\n**三个经常混淆的对象：** `state.messages` 是本任务完整工具对话；`state.request_messages` 是本轮真正发送的受限视图；`ConversationMessage` 是跨任务保存的用户问题和完整报告。单次任务工具历史会进入 checkpoint，跨任务摘要在会话表，两种进度不是同一个 cursor。`message_summary` 概括本任务旧工具消息，`Conversation.summary` 概括以前任务的交流，不能互相冒充。\n\n**主线案例。** 用户要求“比较 2017 年 10、11 月销售额并画趋势图”。模型先调用销售指标工具，可能又计算环比或补图；每次返回结果都追加到完整消息。图在下一轮决策前调用 `manage_context → prepare_context`，它判断输入是否接近预算；需要时只总结尚未处理的旧消息，再用摘要、真实结果引用与近期工具链继续。这不会直接查询金额，统计仍由 SQL/指标工具执行。\n\n**读图定位。** `build_graph → manage_context → prepare_context → summarize（必要时） → model_action`。下列源码解释中，“事实”指当前文件可以确认的行为；“设计推断”是由问题和实现推导出的原因；“建议”是尚未实现的改进，不要混入简历现有能力。"}]},{"title":"从窗口倒推输入预算，而不是等接口拒绝","anchor":"cm-context-budget","groupTitle":"任务内上下文：先保证能发，再保留可推理的信息","blocks":[{"type":"text","text":"**1. 业务需求。** 销售分析要连续调用工具，最后还要给模型留下生成报告或 finish 参数的空间。不能因为历史刚好塞满输入就宣称“窗口没超”。\n\n**2. 最直接的对照实现。** 每轮把全部消息发送，接口说超长后再删一半。这是便于理解的对照方案，不代表项目曾经这样写过。\n\n**3. 失效场景。** 即使历史文本长度小于窗口，工具 JSON schema、系统说明和最大输出也占空间；临时删一半还可能切断工具调用配对，导致请求格式错误。\n\n**4. 当前方案（事实）。** `prepare_context` 采用 `总窗口 - model_max_tokens - estimate_tokens(tools) - 500` 作为输入预算，并在其乘 `context_summary_trigger` 后提前触发摘要。源码默认触发比例 .65，近期消息 6，摘要最大输出 700；这些是配置类默认，不代表本机实际运行值。预算低到负数或系统+问题超出时会明确报错。\n\n**5. 设计推导（推断）。** 输出无法事后“补窗口”，所以先预留；工具 schema 随工具数量变化，所以纳入同一计算；摘要也耗时间，所以只在触发线之后执行，避免每次都请求一次摘要。\n\n**6. 可选方案。** 已知模型支持时可使用对应 tokenizer 精确计数；多供应商时可维护分模型计数器并保留余量。另一选择是对工具结果使用更小结构化返回，但那会把摘要问题前移到工具接口，需要确认不会丢掉模型必要信息。\n\n**7. 收益和代价。** 规则简单、与任意 JSON 内容兼容，且不额外依赖 tokenizer 包；代价是中文/英文/代码比例会影响估算误差，可能过早摘要，实际服务的隐藏消息格式也可能带来低估风险。\n\n**8. 保证边界。** 源码注释称“保守估计”，这是工程意图，不能理解为数学保证绝不超窗。实际 tokenize 和供应商包装可能不同；界面展示的估算不能当准确计费。示例“金额”估算 67，不代表接口一定计 67 tokens。\n\n**9. 面试表达与追问。** “我先扣工具说明、最大输出和格式余量，再管理历史输入；使用可解释的 UTF-8 字节估算，因此仍需根据真实模型验证窗口配置。”追问为什么不直接用字符数：中文、代码等编码和分词不同。追问为什么不是精确 tokenizer：多兼容供应商场景要维护模型适配，当前简化换取易维护，但不能掩盖误差。追问超窗怎么办：先检查模型实际窗口配置、schema 体积、摘要和当前问题，不静默截断用户条件。"},{"type":"callchain","callchain":{"endpoint":"每轮决策前：prepare_context → estimate_tokens(messages/tools)","steps":[{"layer":"上下文预算基础","filePath":"backend/context/summary.py:7-10","functionName":"estimate_tokens()","explanation":"调用者包括任务输入整理和摘要请求自身的长度检查。输入可以是字符串，也可以是消息列表或工具 schema；输出一个估算整数，交给上层与模型窗口比较。本函数不访问网络，也不修改输入，作用是把多种输入变为同一种可比较长度。例：字符串“金额”是 6 个 UTF-8 字节，返回 (6+1)//2+64=67；这个值不是模型实际收取的 token。","code":"def estimate_tokens(value) -> int:\n    \"\"\"根据 UTF-8 字节数估算文本和消息格式占用的 token 数。这只是保守估计，不是精确分词结果。\"\"\"\n    text = value if isinstance(value, str) else json.dumps(value, ensure_ascii=False)\n    return (len(text.encode('utf-8')) + 1) // 2 + 64","language":"python","lineAnnotations":[{"line":1,"annotation":"定义一个同步纯函数；输入不限于文本，因为工具说明和消息结构也要占预算。"},{"line":2,"annotation":"函数文档字符串给出作者记录的职责边界：根据 UTF-8 字节数估算文本和消息格式占用的 token 数。这只是保守估计，不是精确分词结果。"},{"line":3,"annotation":"字符串直接使用；其他对象先序列化为 JSON，ensure_ascii=False 保留中文字符，随后按实际 UTF-8 字节计长。"},{"line":4,"annotation":"向上取半字节长度并加 64 的固定格式余量；整除 // 使结果为整数，结果只作为工程估计，不能拿来宣称精确计费。"}],"keyPoint":"这是可解释的保守字节估算，不是实际模型 tokenizer。"}]}}]},{"title":"先讲工具协议，再看为什么切分不能随便切","anchor":"cm-context-projection","groupTitle":"任务内上下文：先保证能发，再保留可推理的信息","blocks":[{"type":"text","text":"**1. 业务需求。** 模型发起一个工具调用后，后续 tool 消息必须携带相同 `tool_call_id`，模型才知道结果对应哪项调用。一轮模型可发多个调用，所以“最近 6 条”可能落在同一批工具结果中间。\n\n**2. 简单对照。** 直接 `messages[-6:]`，再在开头写一段摘要。列表切片能运行，不等于这组消息满足工具协议。\n\n**3. 失效例子。** 完整历史是 `system → user → assistant(calls A,B) → tool(A) → tool(B) → assistant`。从 `tool(A)` 开始截取时，结果失去调用者；某些模型接口会直接拒绝，其他接口也可能误解。\n\n**4. 当前方案（事实）。** `safe_cut` 初始按近期数量计算 cut，若落在 tool 结果上就前移到 assistant 调用。进一步超预算时，`prepare_context` 又会将切点向后跨过 tool 结果，成组移除。`compressed_request` 保留系统约束、当前完整问题、澄清、摘要与产物摘要，再拼近期消息。\n\n**5. 设计推导（推断）。** 工具调用和工具结果是一种协议单元，裁剪必须围绕单元，而不能仅考虑消息条数。保留真实产物 ID 则是为了摘要后仍能引用 table_1 的实际文件，而不是模型凭文字记忆编造新 ID。\n\n**6. 替代方案。** 可把每轮 AI+tools 存成显式消息组，再按组裁剪；这会简化边界判断，但需要修改状态结构与框架消息适配。也可以保留所有调用 ID 而压缩工具正文，需要确认信息足够支撑下一次决策。\n\n**7. 收益和代价。** 当前结构与现有消息列表兼容、实现短；代价是依赖上游消息按协议组织，它不验证每一组是否已完整收到所有 tool 结果，不是损坏历史修复器。\n\n**8. 边界。** `task_digest` 对每个表保留少量预览（前 2 条）及 id、列、行数、指标口径、图表来源等字段，它是引用目录，不是完整表格。全量数据仍在结果文件，必要时工具重新读取。摘要提示把旧数值标为历史，但提示词不是完整防注入机制；事实核验还依赖工具与交付校验。\n\n**9. 面试表达。** “我压缩的是模型请求投影，原始对话不删；裁剪考虑 assistant/tool 配对，同时保留当前问题和真实产物引用。”追问保留近期是否严格 6 条：不严格，可能为配对前移增加。追问当前问题为何重加：用户条件不能因历史缩减而消失。追问摘要能否代替数据文件：不能，摘要会丢细节，也不能做本次数字证据。\n\n**语法补充。** 切片 `messages[cut:]` 不会从原列表删元素；`[*root,*tail]` 建新列表；`dict.get(key,default)` 不存在时使用默认；列表推导一次描述“筛选并构造”。这些语法共同让“只改变视图”能落到实际代码，而非口头承诺。"},{"type":"callchain","callchain":{"endpoint":"prepare_context → safe_cut → compressed_request → task_digest","steps":[{"layer":"工具协议边界","filePath":"backend/context/manager.py:7-15","functionName":"safe_cut()","explanation":"prepare_context 在决定摘要哪些旧消息时调用它。输入是完整消息列表和希望保留的近期消息数量，返回列表切分下标 cut；messages[:cut] 是较旧部分，messages[cut:] 是近期部分。例：system、user、assistant(tool_calls)、tool、tool、assistant，recent=3 最初 cut=3 落在 tool 上，会回退到 2，因此保留整组 assistant 与工具结果。它只保证基于当前消息排列的切分边界，不是任意损坏消息序列的通用协议修复器。","code":"def safe_cut(messages: list[dict], recent: int) -> int:\n    \"\"\"确定历史消息的切分位置。保留下来的工具结果必须同时保留对应的模型调用消息。\"\"\"\n    if len(messages) \u003c= 1:\n        return len(messages)\n    cut = max(1, len(messages) - recent)\n    # 近期消息不能从 tool 结果开始，需要向前保留对应的 assistant 调用，否则模型请求会缺少配对信息。\n    while cut > 1 and messages[cut].get('role') == 'tool':\n        cut -= 1\n    return cut","language":"python","lineAnnotations":[{"line":1,"annotation":"定义切分函数，返回的是列表位置，不是数据库消息 sequence。"},{"line":2,"annotation":"函数文档字符串给出作者记录的职责边界：确定历史消息的切分位置。保留下来的工具结果必须同时保留对应的模型调用消息。"},{"line":3,"annotation":"空列表或只有一条消息时单独处理，防止后面用 messages[cut] 发生越界。"},{"line":4,"annotation":"没有足够历史可压缩时返回列表长度，表示尾部可以为空。"},{"line":5,"annotation":"按“总数减近期数”得到理想切点，并至少保留索引 0 作为系统根消息的位置。"},{"line":6,"annotation":"这条源代码注释说明本段设计约束：近期消息不能从 tool 结果开始，需要向前保留对应的 assistant 调用，否则模型请求会缺少配对信息。"},{"line":7,"annotation":"切点若正好落在 tool 结果上，就继续向前寻找其 assistant 调用；这里只检查消息 role，依赖上游按协议排列工具批次。"},{"line":8,"annotation":"一次向前移动一条，可能将同一批多个 tool 结果及其 assistant 都纳入近期区。"},{"line":9,"annotation":"把安全切点交给调用方；函数本身没有修改原列表。"}],"keyPoint":"工具结果不能在请求里失去对应的模型调用。"},{"layer":"模型请求投影","filePath":"backend/context/manager.py:29-40","functionName":"compressed_request()","explanation":"prepare_context 在已有摘要、摘要成功或失败降级时调用它。输入为图 state、当前可用摘要和安全切点；返回新消息列表，交给模型决策节点使用。副作用仅是构造新容器，state['messages'] 不会被替换，完整历史仍可由 checkpoint 保存。例：历史有十几条工具消息时，请求被组合成系统规则、历史摘要与真实产物 ID、本次完整问题、澄清回答、近期工具链；历史旧金额明确标成背景，不能充当本次统计依据。","code":"def compressed_request(state: dict, summary: str, cut: int) -> list[dict]:\n    \"\"\"整理压缩后的模型请求，保留系统规则、本次问题、摘要、结果引用和近期工具消息，不删除原文。\"\"\"\n    messages = state['messages']\n    root = [messages[0]] if messages and messages[0]['role'] == 'system' else []\n    # 只缩减发给模型的历史内容，保留系统规则、本次完整问题和结果引用，不删除 state 中的原始消息。\n    root += [{'role':'system','content':'以下是历史摘要及当前工具事实引用，仅作背景；历史数值不能作为当前回答依据。\\n' + summary + '\\n' + task_digest(state.get('artifacts', []))},\n             {'role':'user','content':state['question']}]\n    if state.get('clarification_answer'):\n        root.append({'role':'user','content':'本次澄清：' + state['clarification_answer']})\n    # 本次问题已经完整加入请求，所以近期消息中的相同问题不再重复加入。\n    tail = [item for item in messages[cut:] if not (item.get('role') == 'user' and item.get('content') == state['question'])]\n    return [*root, *tail]","language":"python","lineAnnotations":[{"line":1,"annotation":"接受当前状态、摘要和切点，单独构造模型视图，不把压缩策略混入业务工具。"},{"line":2,"annotation":"函数文档字符串给出作者记录的职责边界：整理压缩后的模型请求，保留系统规则、本次问题、摘要、结果引用和近期工具消息，不删除原文。"},{"line":3,"annotation":"读取原始消息引用，仅用于取数，后面不对它原地删除或赋值。"},{"line":4,"annotation":"原列表首条为 system 才保留为根规则，避免把任意历史消息误提升为系统约束。"},{"line":5,"annotation":"这条源代码注释说明本段设计约束：只缩减发给模型的历史内容，保留系统规则、本次完整问题和结果引用，不删除 state 中的原始消息。"},{"line":6,"annotation":"在新 system 消息里拼入摘要和 task_digest 真实产物引用，并明确历史数值不作为当前依据；提示词边界有帮助但不是形式化防注入证明。"},{"line":7,"annotation":"把 state.question 完整放回 user 消息，不以历史裁剪为理由截断当前需求。"},{"line":8,"annotation":"澄清恢复后若有用户补充，显式加入请求，避免压缩时丢掉新条件。"},{"line":9,"annotation":"将澄清标记为本次用户输入，模型可以据此继续选择工具。"},{"line":10,"annotation":"这条源代码注释说明本段设计约束：本次问题已经完整加入请求，所以近期消息中的相同问题不再重复加入。"},{"line":11,"annotation":"只从 cut 之后选近期消息，并去掉内容完全相同的当前问题，避免一份问题重复占据窗口。"},{"line":12,"annotation":"使用列表展开合并根部和近期部分，返回新的列表而不替换完整历史。"}],"keyPoint":"压缩的是模型视图，完整历史与当前问题仍保留。"}]}}]},{"title":"增量摘要：成功进度与临时裁剪必须分开","anchor":"cm-context-prepare","groupTitle":"任务内上下文：先保证能发，再保留可推理的信息","blocks":[{"type":"text","text":"**1. 需求。** 任务执行越久，旧消息越多；希望只总结新增旧材料，同时在摘要服务暂时超时时尽量继续分析。\n\n**2. 对照实现。** 每次全部总结，或先把 cursor 更新到末尾再发摘要请求。前者重复耗费，后者失败会永久跳过尚未总结的消息。\n\n**3. 失效场景。** 历史 20 条、cursor=5、安全 cut=12。若先标 cursor=12 后请求超时，下一次从 12 开始，5..11 的材料既没进摘要又被当成处理完。\n\n**4. 当前事实。** 仅对 `messages[cursor:cut]` 生成摘要；合法返回后才在状态增量里写新摘要与 cut。失败时不返回新 cursor，记录 summary_error，并暂用旧摘要+较少近期消息构造请求。原 messages 仍在，所以后续可以再处理 5..11。\n\n**5. 推导。** cursor 描述“已确认处理成功”，不应描述“曾尝试处理”；临时请求切点只解决眼前能否发送，不能混成持久成功进度。这是很多后台消费、分页处理也能使用的思路。\n\n**6. 替代方案。** 可以同步失败就终止任务，语义更保守但可用性较差；也可用结构化确定性压缩先抽 ID/字段，再让模型只改写少量文字，需补足更多格式维护与校验。\n\n**7. 收益代价。** 增量减少重复输入；摘要失败不会破坏原始历史。代价是失败降级时，本轮部分尚未总结旧消息可能暂不可见，模型理解质量可能下降；摘要本身会遗漏或误归纳，不能承诺无损。\n\n**8. 保证边界。** 任务内“持久化”取决于图状态执行与 checkpoint 提交，不是 summarize 自己直接提交。request_messages 是一轮视图，messages 完整历史由状态继续保留。重新摘要的重试由后续 context 节点触发，没有专门指数退避摘要重试器。\n\n**9. 面试稿。** “我把处理成功游标和本轮临时裁剪边界分开；摘要失败不推进成功游标，历史保留，下轮可重试，但本轮可能减少背景，属于明确的可用性与完整性取舍。”追问旧摘要已有时怎么处理：基于旧摘要和未处理区间累计。追问摘要失败能否保证回答同样准确：不能。追问当前问题超预算怎么处理：报错并保留原问题，而非静默截断。\n\n**实际调用链。** `graph context → manage_context → prepare_context → summarize / compressed_request → 返回图状态增量 → decide 读取 request_messages`。`manage_context` 只有发现游标前移才写 `context_summarized`；有 summary_error 写 `context_fallback`。事件帮助排查，但不是把摘要原文当统计证据。"},{"type":"callchain","callchain":{"endpoint":"LangGraph context 节点：manage_context → prepare_context","steps":[{"layer":"任务内上下文管理","filePath":"backend/context/manager.py:43-78","functionName":"prepare_context()","explanation":"每次 context 图节点执行时由 manage_context 调用；tools 来自当前真实工具 schema，state 来自当前图状态。返回的是状态增量：request_messages 必有，摘要成功才含新的 message_summary 与 summary_cursor，失败只添加 summary_error。模型节点读取 request_messages，LangGraph 将状态增量持久化；函数不会删完整 messages。例：窗口 6000、输出 1000、工具估算 700、余量 500，则输入预算 3800，触发线为 2470；历史过线时才尝试摘要。若仍无法放入完整问题，则明确 ValueError，而非静默裁掉条件。","code":"async def prepare_context(state: dict, tools: list[dict]) -> dict:\n    \"\"\"请求接近长度上限时总结旧消息。只有摘要成功才更新进度；失败时保留旧进度并使用较少的历史内容。\"\"\"\n    settings = get_settings()\n    if state['mode'] != 'llm':\n        return {'request_messages': state['messages']}\n    # 先为工具说明、最大输出长度和消息格式留出空间，余下的长度才用于输入消息。\n    budget = settings.model_context_tokens - settings.model_max_tokens - estimate_tokens(tools) - 500\n    messages = state['messages']\n    previous = state.get('message_summary', '')\n    cursor = state.get('summary_cursor', 1)\n    request = compressed_request(state, previous, cursor) if previous else messages\n    if estimate_tokens(request) \u003c= budget * settings.context_summary_trigger:\n        return {'request_messages': request}\n    # 这里总结单次分析中的工具消息。conversations.py 另外负责总结跨分析任务的会话历史。\n    cut = safe_cut(messages, settings.context_recent_messages)\n    update = {}\n    if cut > cursor:\n        try:\n            summary, usage = await summarize(previous, messages[cursor:cut])\n            # 只有摘要调用成功才返回新的摘要和进度，避免把处理失败的消息标记为已经总结。\n            update = {'message_summary':summary, 'summary_cursor':cut, 'summary_error': None,\n                      'summary_usage': {key:state.get('summary_usage', {}).get(key,0) + usage.get(key,0) for key in usage}}\n            request = compressed_request(state, summary, cut)\n        except Exception as error:\n            # 摘要失败时使用旧摘要、近期消息和结果引用控制本轮长度，不更新保存的摘要进度，后续还可以重试。\n            update['summary_error'] = '摘要暂不可用：' + type(error).__name__\n            request = compressed_request(state, previous, cut)\n    # 请求仍然过长时继续减少近期消息，但始终一起保留或移除工具调用及其结果。\n    while estimate_tokens(request) > budget and cut \u003c len(messages) - 1:\n        cut += 1\n        while cut \u003c len(messages) and messages[cut].get('role') == 'tool':\n            cut += 1\n        request = compressed_request(state, update.get('message_summary', previous), cut)\n    if estimate_tokens(request) > budget:\n        raise ValueError('系统约束、工具事实与本次问题超过预算；未截断当前问题，请提高窗口或缩小分析范围')\n    return {**update, 'request_messages': request}","language":"python","lineAnnotations":[{"line":1,"annotation":"异步整理一轮决策的输入，摘要可能调用远程模型，因此需要 await。"},{"line":2,"annotation":"函数文档字符串给出作者记录的职责边界：请求接近长度上限时总结旧消息。只有摘要成功才更新进度；失败时保留旧进度并使用较少的历史内容。"},{"line":3,"annotation":"取已构造的 Settings，实际值来自应用配置；教程只解释源码默认，不读取真实环境文件。"},{"line":4,"annotation":"演示模式不请求大模型，跳过摘要调用，避免演示也产生外部费用。"},{"line":5,"annotation":"直接把原消息作为请求视图返回，不声称演示模式验证了真实窗口兼容性。"},{"line":6,"annotation":"这条源代码注释说明本段设计约束：先为工具说明、最大输出长度和消息格式留出空间，余下的长度才用于输入消息。"},{"line":7,"annotation":"从总窗口扣掉最大生成长度、完整工具说明估算及 500 余量；输入不能独占整个窗口。"},{"line":8,"annotation":"保留完整消息引用，后面所有裁剪仅体现在 request 变量。"},{"line":9,"annotation":"取旧摘要，没有则用空串，允许第一次调用从原历史开始。"},{"line":10,"annotation":"取已摘要列表位置，默认从 1 开始，通常跳过索引 0 的系统消息。"},{"line":11,"annotation":"已有摘要时用摘要+近期原文重建请求；没有摘要时先按全量请求判断是否需要压缩。"},{"line":12,"annotation":"以预算乘触发比例作为提前压缩线，不必等到接口实际拒绝才处理。"},{"line":13,"annotation":"当前输入足够小时直接返回，不为每轮工具动作额外付出摘要延迟。"},{"line":14,"annotation":"这条源代码注释说明本段设计约束：这里总结单次分析中的工具消息。conversations.py 另外负责总结跨分析任务的会话历史。"},{"line":15,"annotation":"计算避开 tool 孤立结果的切点，保证近期消息结构有效。"},{"line":16,"annotation":"先创建空状态增量，后续只有真正成功的字段才写入它。"},{"line":17,"annotation":"只有安全切点超过已处理游标，才有新的旧消息值得总结。"},{"line":18,"annotation":"把摘要失败限制在这一小段，允许后续走输入缩减降级。"},{"line":19,"annotation":"仅把 cursor 到 cut 的未处理消息发给摘要器，并把旧摘要作为累计背景。"},{"line":20,"annotation":"这条源代码注释说明本段设计约束：只有摘要调用成功才返回新的摘要和进度，避免把处理失败的消息标记为已经总结。"},{"line":21,"annotation":"摘要合法返回后才准备提交新摘要、新切点，并清空上一轮摘要错误。"},{"line":22,"annotation":"按响应 usage 的各键累加先前摘要成本；并非把摘要成本误认为业务查询成本。"},{"line":23,"annotation":"本轮立即使用新摘要和 cut 之后的近期消息重新构造请求。"},{"line":24,"annotation":"捕获摘要网络、格式或预算异常，不把摘要可用性直接等同业务任务成败。"},{"line":25,"annotation":"这条源代码注释说明本段设计约束：摘要失败时使用旧摘要、近期消息和结果引用控制本轮长度，不更新保存的摘要进度，后续还可以重试。"},{"line":26,"annotation":"状态只记录可读的异常类型，不写请求头、密钥或完整外部错误响
